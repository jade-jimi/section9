<!doctype html>
<!-- REQ-20260826-039 반려 재현 하니스 (same-origin 보조 페이지):
     "범례를 눌러도 화면이 바뀌지 않는다"를 실제 클릭으로 재현한다.
     헤드리스 스크린샷은 클릭을 만들 수 없으므로 iframe + 실제 좌표 hit-test
     + 실제 MouseEvent 로 확인한다. ?t=<type> 으로 누를 범례를 고른다. 진단 후 삭제. -->
<html><head><meta charset="utf-8"><title>verify gempty click</title>
<style>
 html,body{margin:0;background:#111;color:#eee;font:13px/1.55 ui-monospace,monospace}
 #out{padding:8px 14px;white-space:pre-wrap;font-size:14px}
 .ok{color:#55c07a} .bad{color:#e06c5d} .hi{color:#d9b13b}
 iframe{border:0;width:1400px;height:700px;background:#000}
</style>
</head><body>
<div id="out">초기화…</div>
<iframe id="f" src="/#graph"></iframe>
<script>
const CLICK_TYPE = new URLSearchParams(location.search).get("t") || "knowledge";
const out = document.getElementById("out");
const lines = [];
const say = (s, cls) => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
                          out.innerHTML = lines.join("\n"); };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const desc = el => {
  if (!el) return "(null)";
  const d = Object.entries(el.dataset || {}).map(([k, v]) => `data-${k}=${v}`).join(" ");
  return esc(`<${el.tagName.toLowerCase()}`
       + `${el.className ? " ." + String(el.className).split(" ").join(".") : ""}`
       + `${d ? " " + d : ""}>`);
};
// 반려 캡처와 같은 조합: 헤더 type=question + 범례에서 question/knowledge/session off
try{ localStorage.setItem("s9gtypes", JSON.stringify(["request"])); }catch(e){}
try{ localStorage.setItem("s9mine", "0"); }catch(e){}

const f = document.getElementById("f");
const wait = (doc, fn, ms=12000) => new Promise((res, rej) => {
  const t0 = Date.now();
  const t = setInterval(() => {
    let v = null;
    try{ v = fn(doc); }catch(e){}
    if (v){ clearInterval(t); res(v); }
    else if (Date.now() - t0 > ms){ clearInterval(t); rej(new Error("timeout")); }
  }, 200);
});
// 캔버스가 실제로 무엇을 그렸는가 — 배경과 다른 픽셀 수
function inkPixels(doc){
  const c = doc.querySelector("#gcanvas");
  if (!c) return -1;
  try{
    const g = c.getContext("2d");
    const d = g.getImageData(0, 0, c.width, c.height).data;
    const r0 = d[0], g0 = d[1], b0 = d[2];
    let n = 0;
    for (let i = 0; i < d.length; i += 4)
      if (Math.abs(d[i]-r0) + Math.abs(d[i+1]-g0) + Math.abs(d[i+2]-b0) > 24) n++;
    return n;
  }catch(e){ return -2; }
}

f.addEventListener("load", async () => {
  const win = f.contentWindow, doc = f.contentDocument;
  const errs = [];
  win.addEventListener("error", e => errs.push(String(e.message)));
  win.addEventListener("unhandledrejection", e => errs.push("reject: " + e.reason));

  try{
    await wait(doc, d => d.querySelector('.legend [data-gtype="question"]'));
    const ft = doc.querySelector("#f-type");
    ft.value = "question";
    ft.dispatchEvent(new win.Event("input", {bubbles: true}));
    await wait(doc, d => d.querySelector(".gempty"));
    await new Promise(s => setTimeout(s, 1200));

    const snap = () => ({
      ack: (doc.querySelector(".geack")?.textContent || "(인정 줄 없음)").trim(),
      want: [...doc.querySelectorAll(".legend .gtype.want")]
        .map(e => e.dataset.gtype).join(",") || "(지목 없음)",
      msg: (doc.querySelector(".gemsg")?.textContent || "(안내 없음)").trim(),
      note: (doc.querySelector(".genote")?.textContent || "").trim(),
      fix: (doc.querySelector("[data-gfix]")?.textContent || "(버튼 없음)").trim(),
      legend: [...doc.querySelectorAll(".legend [data-gtype]")]
        .map(e => e.dataset.gtype + (e.classList.contains("off") ? "=off" : "=ON")).join(" "),
      ink: inkPixels(doc),
      empty: !!doc.querySelector(".gempty"),
    });
    const before = snap();
    say(`대상: 범례 <b>${esc(CLICK_TYPE.toUpperCase())}</b> 클릭 (반려 캡처 상태에서)`, "hi");
    say(`\n[전] 범례      ${esc(before.legend)}`);
    say(`[전] 지목      ${esc(before.want)}`);
    say(`[전] 인정      ${esc(before.ack)}`);
    say(`[전] 안내      ${esc(before.msg)}`);
    say(`[전] 버튼      ${esc(before.fix)}`);
    say(`[전] 캔버스 잉크 픽셀 ${before.ink}`);

    const gt = doc.querySelector(`.legend [data-gtype="${CLICK_TYPE}"]`);
    const r = gt.getBoundingClientRect();
    const cx = Math.round(r.left + r.width / 2), cy = Math.round(r.top + r.height / 2);
    const top = doc.elementFromPoint(cx, cy);
    const covered = !(top === gt || gt.contains(top) || top?.closest?.("[data-gtype]"));
    say(`\n[hit] 좌표(${cx},${cy}) 최상위 요소 = ${desc(top)}`);
    say(covered ? "[hit] 덮여 있다 — 클릭이 범례에 닿지 않는다"
                : "[hit] 덮이지 않았다 — 클릭이 범례에 닿는다", covered ? "bad" : "ok");

    const mk = t => new win.MouseEvent(t, {bubbles: true, cancelable: true, view: win,
                                          clientX: cx, clientY: cy, button: 0});
    top.dispatchEvent(mk("mousedown")); top.dispatchEvent(mk("mouseup")); top.dispatchEvent(mk("click"));
    await new Promise(s => setTimeout(s, 1500));
    const after = snap();
    say(`\n[후] 범례      ${esc(after.legend)}`);
    say(`[후] 지목      ${esc(after.want)}`);
    say(`[후] 인정      ${esc(after.ack)}`);
    say(`[후] 안내      ${esc(after.msg)}`);
    say(`[후] 버튼      ${esc(after.fix)}`);
    say(`[후] 캔버스 잉크 픽셀 ${after.ink}`);

    // 회귀 계약: 범례를 눌렀는데 사용자가 보는 것이 하나도 안 바뀌면 실패다.
    // 켠 종류가 결과를 못 바꿔도 화면은 "눌린 건 맞다"를 돌려줘야 한다.
    const same = before.msg === after.msg && before.fix === after.fix
              && before.ack === after.ack && before.want === after.want
              && before.empty === after.empty && Math.abs(before.ink - after.ink) < 40;
    say(`\n>>> 사용자가 보는 변화: ${same ? "없음 — 글자도 그림도 그대로다 (회귀)" : "있음"}`,
        same ? "bad" : "ok");
    say(`>>> 내부 상태(s9gtypes)는 바뀌었나: ${localStorage.getItem("s9gtypes")}`, "hi");

    // [D] 조건이 바뀌면 직전 클릭에 대한 인정은 무효다 — 남아 있으면 거짓말이다.
    const q = doc.querySelector("#q");
    q.value = "zzzz";
    q.dispatchEvent(new win.Event("input", {bubbles: true}));
    await new Promise(s2 => setTimeout(s2, 1200));
    const d = snap();
    say(`\n[D] 검색어를 넣어 조건을 바꾼 뒤`);
    say(`    안내 = ${esc(d.msg)}`);
    say(`    인정 = ${esc(d.ack)}`);
    const kept = d.ack !== "(인정 줄 없음)";
    say(kept ? "    → 인정 줄이 남았다 (거짓말)" : "    → 인정 줄이 걷혔다",
        kept ? "bad" : "ok");
    say(`>>> JS 오류 ${errs.length}건` + (errs.length ? ": " + esc(errs.join(" | ")) : ""),
        errs.length ? "bad" : "ok");
  }catch(e){
    say("\n하니스 실패: " + esc(e && e.message) + "\n" + esc(e && e.stack), "bad");
  }
});
</script>
</body></html>
