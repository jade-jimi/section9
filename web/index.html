<!doctype html>
<html lang="ko" data-theme="system" data-skin="ledger" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section9</title>
<style>
:root{
  --bg:#fafaf8; --panel:#ffffff; --border:#d8d8d3; --hairline:#e9e9e5;
  --text:#141518; --muted:#5c6470; --faint:#9096a0;
  --accent:#141518; --accent-soft:#f0f0ec; --accent-line:#141518;
  --r:0;
  --c-draft:#868c96; --c-open:#1d4ed8; --c-inprogress:#b45309; --c-blocked:#b91c1c;
  --c-review:#6d28d9; --c-done:#047857; --c-cancelled:#868c96; --c-published:#0f766e;
  --t-request:#1d4ed8; --t-knowledge:#0f766e; --t-session:#92400e; --t-question:#9d174d;
  --t-article:#6b21a8;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
/* 테마: system(OS 추종) / paper(라이트 고정=기본 토큰) / carbon(다크 고정) / phosphor(CRT) */
@media (prefers-color-scheme: dark){
  :root[data-theme="system"]{
    --bg:#111214; --panel:#17181b; --border:#33353a; --hairline:#232529;
    --text:#e8e8e4; --muted:#9aa0aa; --faint:#5f646d;
    --accent:#e8e8e4; --accent-soft:#222327; --accent-line:#e8e8e4;
    --c-open:#5b8def; --c-inprogress:#d99537; --c-blocked:#e05d5d;
    --c-review:#a582e8; --c-done:#3fa583; --c-published:#3d9d96;
    --t-request:#5b8def; --t-knowledge:#3d9d96; --t-session:#c08a4e; --t-question:#e07a9f;
    --t-article:#b18cf0;
  }
}
:root[data-theme="carbon"]{
  --bg:#111214; --panel:#17181b; --border:#33353a; --hairline:#232529;
  --text:#e8e8e4; --muted:#9aa0aa; --faint:#5f646d;
  --accent:#e8e8e4; --accent-soft:#222327; --accent-line:#e8e8e4;
  --c-open:#5b8def; --c-inprogress:#d99537; --c-blocked:#e05d5d;
  --c-review:#a582e8; --c-done:#3fa583; --c-published:#3d9d96;
  --t-request:#5b8def; --t-knowledge:#3d9d96; --t-session:#c08a4e; --t-question:#e07a9f;
    --t-article:#b18cf0;
}
:root[data-theme="phosphor"]{
  --bg:#0a0e0a; --panel:#0d120d; --border:#2b3a2b; --hairline:#1a231a;
  --text:#b9e2b2; --muted:#79a674; --faint:#4b6f49;
  --accent:#b9e2b2; --accent-soft:#131b13; --accent-line:#b9e2b2;
  --c-draft:#5f7f5c; --c-open:#5b9bd5; --c-inprogress:#d9b13b; --c-blocked:#e06c5d;
  --c-review:#b78ee0; --c-done:#55c07a; --c-cancelled:#5f7f5c; --c-published:#46b39a;
  --t-request:#5b9bd5; --t-knowledge:#46b39a; --t-session:#c9a35a; --t-question:#d98cb0;
  --t-article:#bda0ef;
}
*{box-sizing:border-box}
::selection{background:var(--text);color:var(--bg)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--border)}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}
*::-webkit-scrollbar-track{background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:1px solid var(--text);outline-offset:1px}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;-webkit-font-smoothing:antialiased}

/* ------- header: 2행 구조 — 1행 브랜드/탭, 2행 툴바(필터 좌 · 환경설정 우) ------- */
header{background:var(--bg);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10}
.hrow1{display:flex;align-items:baseline;gap:26px;padding:14px 22px 0}
.brand{font-size:15px;font-weight:700;letter-spacing:.02em;padding-bottom:12px}
.brand .dot{display:inline-block;width:8px;height:8px;background:var(--text);margin-right:8px}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:4px 12px 13px;cursor:pointer;
  font-size:13px;color:var(--muted);font-family:inherit;letter-spacing:.01em;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.daily-tabs{min-width:0;overflow-x:auto;scrollbar-width:none}
.daily-tabs::-webkit-scrollbar{display:none}
.daily-tabs .talk-chief{color:var(--c-review);font-weight:650}
.advanced-nav{position:relative;margin-left:auto;padding-bottom:8px;flex:none}
.advanced-toggle{border:0;background:none;color:var(--faint);padding:5px 3px;cursor:pointer;
  font:10px/1.2 var(--mono);letter-spacing:.04em}
.advanced-toggle:hover,.advanced-toggle.active{color:var(--text)}
.advanced-menu{position:absolute;right:0;top:31px;z-index:45;min-width:190px;padding:7px;
  border:1px solid var(--border);background:var(--panel);box-shadow:0 16px 42px color-mix(in srgb,#000 22%,transparent)}
.advanced-menu[hidden]{display:none}
.advanced-menu button{display:flex;width:100%;justify-content:space-between;border:0;background:none;
  color:var(--muted);padding:7px 9px;text-align:left;cursor:pointer;font-size:11.5px}
.advanced-menu button:hover,.advanced-menu button.active{color:var(--text);background:var(--accent-soft)}
.advanced-menu .advanced-cap{padding:5px 9px 7px;color:var(--faint);font:9px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--hairline);margin-bottom:3px}
.hrow2{display:flex;gap:14px;align-items:center;justify-content:space-between;
  flex-wrap:wrap;padding:8px 22px;border-top:1px solid var(--hairline)}
.fgroup,.pgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* whoami 라벨 — 서버 파생 신원 표시 전용 (선택 UI 아님, REQ-20260824-027) */
.who{font-family:var(--mono);font-size:10px;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
.who b{color:var(--text);font-weight:600}
.who.warn{color:var(--c-blocked);white-space:normal}
.who.warn code{font-family:var(--mono);border:1px solid var(--hairline);padding:0 3px}
.who .as{color:var(--c-review)}

/* ── 서버 코드 낡음 알림 (REQ-20260826-011-62x6) ─────────────────────────────
   구동 중인 serve 는 기동 시점의 bin/s9 를 물고 있고, 화면(web/index.html)은
   디스크에서 매번 읽힌다 — 그래서 "UI 는 바뀌었는데 동작만 안 된다"가 된다.
   낡았을 때만 나타나는 헤더 3행이다: stale=false 면 자리표시자도 남기지 않는다
   (항상 보이는 경고는 정작 진짜일 때 안 읽힌다).
   터미널 뷰의 "stale" 은 **세션 무응답**이라는 다른 사실이라, 여기서는 문구도
   식별자도 oldcode 로 분리했다.
   색면·세로 띠 없이 마크(▲)와 글자색만으로 신호를 준다. */
.hrow3{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 11px;
  padding:7px 22px;border-top:1px solid var(--hairline)}
.hrow3[hidden]{display:none}
.oc-mark{color:var(--c-inprogress);font-size:11px;line-height:1}
.oc-t{font-size:12.5px;font-weight:600;color:var(--c-inprogress);letter-spacing:-.01em}
.oc-d{font-size:12px;color:var(--muted)}
.oc-d code{font-family:var(--mono);font-size:11px;color:var(--text)}
.oc-act{margin-left:auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.oc-cmd{font-family:var(--mono);font-size:11px;letter-spacing:.02em;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:4px 9px;cursor:pointer}
.oc-cmd::before{content:"⧉ ";color:var(--faint)}
.oc-cmd:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.oc-cmd:hover::before{color:var(--bg)}
/* 복사 피드백은 자리를 미리 잡아 둔다 — 글자가 늘며 줄이 밀리면 그 자체가 결함 */
.oc-copied{display:inline-block;min-width:3.6em;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;color:var(--c-done)}
.oc-note{font-size:12px;color:var(--muted)}
.oc-fold{border:0;background:none;cursor:pointer;font-family:var(--mono);
  font-size:11px;letter-spacing:.04em;color:var(--muted);padding:3px 2px}
.oc-fold:hover{color:var(--text);text-decoration:underline}
.oc-cmd:focus-visible,.oc-fold:focus-visible{
  outline:2px solid var(--text);outline-offset:1px}

/* ── 서버 자동 복구 기록 (REQ-20260826-018-62x6) ───────────────────────────
   감시자는 죽은 서버를 되살릴 때마다 사유·직전 출력·연속 실패 횟수·되살리기까지의
   대기를 남기는데, 지금까지 그걸 보려면 파일을 열어야 했다. 대시보드가 왜 죽었나는
   대시보드 안에서 답해야 하는 질문이다.
   자리는 코드 낡음 알림과 같은 헤더 3행이다 — 둘 다 이 서버 자신에 대한 사실이고,
   한 자리에 모아야 사용자가 볼 곳을 하나만 기억한다. 어휘는 갈랐다: 사람이 하는
   일은 재기동(위 알림), 감시자가 하는 일은 자동 복구(여기).
   평소엔 흔적을 남기지 않고 사건이 잠잠해지면 스스로 걷힌다. 색면도 띠도 없이
   마크(↻/▲)와 글자색만으로 신호를 준다. */
.gw-mark{font-size:11px;line-height:1}
.gw-t{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.gw-d{font-size:12px;color:var(--muted)}
.gw-d code,.gw-det code{font-family:var(--mono);font-size:11px;
  letter-spacing:.04em;color:var(--text)}
.gw-act{margin-left:auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
/* 한국어가 들어가는 컨트롤에는 자간을 벌리지 않는다 — 모노·자간은 시각·포트
   번호 같은 라틴/숫자 메타데이터의 어휘다. 문장에 쓰면 글자가 흩어져 보인다. */
.gw-link{border:0;background:none;cursor:pointer;font:inherit;
  font-size:11.5px;color:var(--muted);padding:3px 2px}
.gw-link:hover{color:var(--text);text-decoration:underline}
.gw-cmd{font-family:var(--mono);font-size:11px;letter-spacing:.02em;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:4px 9px;cursor:pointer}
.gw-cmd::before{content:"⧉ ";color:var(--faint)}
.gw-cmd:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.gw-cmd:hover::before{color:var(--bg)}
/* 복사 피드백은 자리를 미리 잡아 둔다 — 글자가 늘며 줄이 밀리면 그 자체가 결함 */
.gw-copied{display:inline-block;min-width:3.6em;font-family:var(--mono);
  font-size:10px;letter-spacing:.04em;color:var(--c-done)}
.gw-cmd:focus-visible,.gw-link:focus-visible{
  outline:2px solid var(--text);outline-offset:1px}
/* 기록은 헤더 안에서 열린다 — 다른 자리로 보내면 방금 읽은 알림과의 연결이
   끊긴다. 대신 높이를 묶어 화면을 삼키지 않게 하고 자체 스크롤을 준다. */
.gwlog{border-top:1px solid var(--hairline);padding:9px 22px 12px;
  max-height:min(44vh,320px);overflow:auto}
.gwlog[hidden]{display:none}
.gw-h{display:flex;align-items:baseline;gap:8px;font-size:11.5px;
  color:var(--faint);padding-bottom:6px;border-bottom:1px solid var(--hairline)}
.gw-h b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;font-weight:400}
.gw-h .gw-link{margin-left:auto}
.gw-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 0;
  border-bottom:1px solid var(--hairline);font-size:12px}
.gw-ts{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--faint);flex:none}
.gw-ev{font-weight:600;min-width:5.2em;flex:none}
.gw-ev.bad{color:var(--c-blocked)}
.gw-ev.ok{color:var(--c-done)}
.gw-ev.on{color:var(--c-open)}
.gw-det{color:var(--muted)}
.gw-row .gw-link{margin-left:auto}
.gw-out{margin:0 0 8px;padding:7px 10px;border:1px solid var(--hairline);
  font-family:var(--mono);font-size:10.5px;line-height:1.55;color:var(--muted);
  white-space:pre-wrap;word-break:break-all}
.gw-none{padding:10px 0;font-size:12px;color:var(--muted)}
/* 서버 상태 칩 (REQ-20260827-017-62x6) — 헤더 줄은 사람의 손을 요구하는 사실에만
   준다. 자동 복구가 **성공**한 것은 이미 끝난 일이라 읽고 나서 할 일이 없는데,
   그것에 전용 행을 주면 자주 복구되는 서버일수록 헤더가 상시 한 줄 눌린다.
   그런 사실과 접어 둔 경고는 이미 있는 브랜드 행(hrow1)의 칩으로 내려온다 —
   새 행을 만들지 않고 탭 높이에 묻히므로 헤더 높이 증가가 0이다.
   :empty 가 핵심이다. 빈 칩을 남기면 flex gap 만큼 자리가 남고, 무엇보다
   상시 자리표시자는 곧 배경이 되어 진짜 사고 때도 안 읽힌다(018 이 세운 규칙). */
.svchip{display:flex;align-items:baseline;gap:12px;min-width:0;
  margin-left:auto;padding-bottom:12px}
.svchip:empty{display:none}
.svchip button{border:0;background:none;cursor:pointer;font:inherit;font-size:11.5px;
  color:var(--muted);padding:3px 2px;white-space:nowrap;max-width:34ch;
  overflow:hidden;text-overflow:ellipsis}
.svchip button:hover{color:var(--text);text-decoration:underline}
.svchip button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.svchip .sv-m{font-size:11px;line-height:1}          /* 마크: 색 없이도 읽히게 */
.svchip .sv-ok .sv-m{color:var(--c-done)}
.svchip .sv-warn{color:var(--c-inprogress)}
.svchip .sv-warn .sv-m{color:var(--c-inprogress)}
.svchip .sv-bad{color:var(--c-blocked)}
.svchip .sv-bad .sv-m{color:var(--c-blocked)}

.pdiv{width:1px;height:18px;background:var(--border);margin:0 4px}
.gear{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-size:14px;line-height:1;padding:4px 9px;cursor:pointer}
.gear:hover{background:var(--text);color:var(--bg)}
.settings{position:fixed;inset:0;z-index:50}
.settings-panel{position:absolute;top:92px;right:22px;width:290px;
  background:var(--panel);border:1px solid var(--text);padding:14px 16px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.settings-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:600;font-family:var(--mono);
  display:flex;justify-content:space-between;align-items:baseline}
.settings-h span{font-size:11px;color:var(--text);text-transform:none;letter-spacing:0}
.settings-panel label{display:flex;flex-direction:column;gap:4px;font-size:11px;
  color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.settings-panel select{border:1px solid var(--border);padding:6px 9px;font-size:12.5px;
  background:var(--panel);color:var(--text);font-family:inherit;text-transform:none;letter-spacing:0}
.settings-note{font-size:11px;color:var(--faint);margin:2px 0 0;line-height:1.5}
/* 프로젝트 정보 패널 — 계기판/장부 스타일(둥근모서리·pill 금지) */
.proj-info{border:1px solid var(--text);background:var(--panel);margin:0 0 14px;
  padding:12px 14px;display:grid;gap:10px}
.proj-info[hidden]{display:none}  /* display:grid가 UA [hidden] 규칙을 덮어써 빈 박스가 남던 버그 수정 */
.proj-info .pi-head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--hairline);padding-bottom:8px;gap:12px;flex-wrap:wrap}
.proj-info .pi-title{font-size:14px;font-weight:600}
.proj-info .pi-slug{font-family:var(--mono);font-size:11px;color:var(--faint)}
.proj-info .pi-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.proj-info .pi-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;
  font-size:12px;align-items:baseline}
.proj-info .pi-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint)}
.proj-info .pi-v{color:var(--text)}
.proj-info table{border-collapse:collapse;width:100%;font-size:12px}
.proj-info th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);font-weight:600;
  border-bottom:1px solid var(--hairline);padding:3px 10px 5px 0}
.proj-info td{padding:4px 10px 4px 0;border-bottom:1px solid var(--hairline)}
.proj-info .m-role{font-family:var(--mono);font-size:11px;color:var(--muted)}
.proj-info .m-exp{color:var(--c-blocked);font-family:var(--mono);font-size:10.5px}
.proj-info .m-act{color:var(--c-done);font-family:var(--mono);font-size:10.5px}
.hrow2 input[type="text"],.hrow2 select{border:1px solid var(--border);
  padding:5px 9px;font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
.hrow2 input[type="text"]{width:190px;font-family:var(--mono)}
/* 그 화면에 축이 없는 필터는 감춘다 — skin override가 select에 display를 걸어도
   지도록 명시(REQ-20260826-006). Board에는 타입 축이 없다. */
.hrow2 select[hidden]{display:none}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  cursor:pointer;user-select:none}
.chk input{accent-color:var(--text)}
.chk:has(input:disabled){opacity:.45;cursor:not-allowed}

/* MY PROJECTS 레저 스트립 — '내 것만' 토글 ON일 때 #proj-info 자리 위에 표시
   (DOC-20260823-006 권고안 B). 배지·pill·라운드·그림자 금지 — 선과 타이포만. */
/* 헤더 계정·사용량 칩 (REQ-20260824-043) — 60s 폴, 색은 임계 신호만 */
.usagechip{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  white-space:nowrap;letter-spacing:.02em}
/* 클로드 계정(사용량)과 하네스 신원을 두 줄로 분리 — 가독 (2026-08-24 채팅 요청) */
.pgroup.idcol{flex-direction:column;align-items:flex-end;gap:2px}
.usagechip .warn{color:var(--c-inprogress);font-weight:600}
.usagechip .crit{color:var(--c-blocked);font-weight:600}
.mystrip{border:1px solid var(--border);background:var(--panel);margin:0 0 14px}
.mystrip[hidden]{display:none}
.mystrip .ms-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--hairline);font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mystrip .ms-row{display:flex;width:100%;align-items:baseline;gap:10px;flex-wrap:wrap;
  border:0;border-bottom:1px solid var(--hairline);background:none;text-align:left;
  cursor:pointer;font-family:inherit;color:var(--text);padding:9px 14px}
.mystrip .ms-row:hover{background:var(--accent-soft)}
.mystrip .ms-row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--text)}
.mystrip .ms-row:focus-visible{outline:1px solid var(--text);outline-offset:-1px}
.mystrip .ms-t{font-size:13px;font-weight:600}
.mystrip .ms-slug{font-family:var(--mono);font-size:11px;color:var(--faint)}
.mystrip .ms-role{font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-left:auto}
.mystrip .ms-until{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mystrip .ms-until.soon{color:var(--c-inprogress)}  /* until ≤14일 임박 — 색은 보조 신호 */
.mystrip .ms-note{padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.mystrip .more{padding-left:14px}
.proj-info .m-me{font-family:var(--mono);font-size:10px;color:var(--muted)}
.proj-info .m-me-name{font-weight:600}
/* 멤버 관리(manage 권한 me) — 인라인 편집 컨트롤: 플랫, 모노, 헤어라인 */
.proj-info select,.proj-info input{border:1px solid var(--hairline);background:var(--panel);
  color:var(--text);font-family:var(--mono);font-size:11px;padding:2px 4px;border-radius:0}
.proj-info select:focus,.proj-info input:focus{outline:none;border-color:var(--text)}
.proj-info input[type="date"]{width:118px}
.proj-info .pi-x{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:10.5px;padding:2px 8px;cursor:pointer;letter-spacing:.03em}
.proj-info .pi-x:hover:not(:disabled){background:var(--text);color:var(--bg);border-color:var(--text)}
.proj-info .pi-x:disabled{color:var(--faint);cursor:not-allowed}
.proj-info .pi-addrow td{border-bottom:0;border-top:1px solid var(--border);padding-top:6px}
.proj-info .pi-err{font-family:var(--mono);font-size:10.5px;color:var(--c-blocked);margin-top:6px}

main{padding:18px 22px}
.count{color:var(--muted);font-size:11px;margin:0 0 14px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.06em}
/* Board는 이 줄을 비운다 (REQ-20260825-085) — 빈 문단이 유령 여백을 남기지 않게 접는다 */
.count:empty{display:none}
.more{display:block;width:100%;border:0;background:none;color:var(--faint);
  padding:7px 0;cursor:pointer;font-size:11.5px;font-family:var(--mono);text-align:left}
.more:hover{color:var(--text);text-decoration:underline}
.more::before{content:"+ "}

/* ------- stats: 텍스트 계기줄 ------- */
.stats{display:flex;gap:0;flex-wrap:wrap;margin:0 0 18px;border:1px solid var(--border);
  background:var(--panel)}
.stat{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-size:11px;
  color:var(--muted);cursor:pointer;font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.05em;border-right:1px solid var(--hairline)}
.stat b{color:var(--text);font-size:15px;font-weight:600}
.stat .cdot{width:7px;height:7px;background:var(--sc)}
.stat:hover{background:var(--accent-soft)}
.stat.on{box-shadow:inset 0 -2px 0 var(--text);color:var(--text)}

/* ------- board: hairline 레저 ------- */
.board{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-bottom:10px;
  border:1px solid var(--border);background:var(--panel)}
/* 컬럼은 252px를 최소로 두고 남는 폭을 나눠 갖는다 — knowledge/session 컬럼을
   걷어낸 뒤(REQ-20260825-084) 고정폭이 오른쪽에 죽은 여백을 남겼다. 컬럼 수가
   늘어 최소폭 합이 화면을 넘으면 .board의 overflow-x가 그대로 가로 스크롤. */
.col{flex:1 1 252px;min-width:210px;width:auto;border-right:1px solid var(--hairline);
  padding:0 0 10px}
.col:last-child{border-right:0}
.col h2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:0;
  padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:600;
  color:var(--muted);border-bottom:1px solid var(--hairline);font-family:var(--mono)}
.col h2 .cdot{width:7px;height:7px;background:var(--sc)}
.col h2 .n{margin-left:auto;font-weight:400;color:var(--faint)}
.cards{display:flex;flex-direction:column;min-height:20px}
.card{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--hairline);position:relative}
.card:hover{background:var(--accent-soft)}
/* ------- 문서 집기 (REQ-20260827-064) -------
   카드를 눌러 "이 문서에 이어 말한다"를 집어 둔다. 손잡이는 **얹었을 때만**
   나온다 — 카드 90장에 상시로 버튼이 붙으면 제목보다 버튼이 먼저 읽힌다.
   카드 자체가 문서를 여는 버튼이라 손잡이는 그 위에 얹히고, 클릭이 카드로
   흘러가지 않게 위임 핸들러에서 먼저 잡는다. */
.card .pickdoc{position:absolute;top:6px;right:8px;z-index:2;display:none;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 7px;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  cursor:pointer}
.card:hover .pickdoc,.card:focus-within .pickdoc{display:block}
.card .pickdoc:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.card .pickdoc:focus-visible{display:block;outline:1px solid var(--text);outline-offset:2px}
/* 집힌 카드는 얹지 않아도 보인다 — 어디를 집었는지 목록에서 잃지 않는다 */
.card.picked{box-shadow:inset 0 0 0 1px var(--text)}
.card.picked .pickdoc{display:block;background:var(--text);color:var(--bg);
  border-color:var(--text)}
.card .id{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em}
/* 우선순위 표기 (REQ-20260827-029 재작업 — REQ-20260826-005의 계약은 유지).
   지켜야 하는 것: 기본값 50도 반드시 그린다. 값이 기본과 다를 때만 찍었더니
   전 문서가 50이라 화면 어디에도 아무 값이 없었고 "숨겨져 있는 건가"로
   반려됐다. 시끄러움보다 부재가 나쁘다.
   고친 것: 그 '늘 그리기'가 이번엔 반대쪽으로 넘어갔다 — 카드 306장이 전부
   메타 줄 첫 칸에 `▃ 50`을 달았고, 마크는 두부(■)로 떨어졌으며, 숫자 50은
   처음 보는 사람에게 아무 뜻이 없었다.
   (1) 글자 — 숫자와 마크를 등급 낱말 하나로 접었다. 색을 못 보는 조건에서
       등급을 가르는 채널이 마크 높이에서 낱말로 옮겨왔다('긴급'≠'보통').
       정확한 값은 문서 뷰어의 .pnum(`50/99`)과 title 툴팁에만 남는다.
   (2) 자리 — 카드 메타 줄의 첫 칸을 담당자에게 내주고 그 뒤로 물러났다.
       목록은 이미 이 값으로 정렬돼 있어 순위는 자리로 읽힌다 — 첫 칸의
       숫자 열이 없어도 비교가 죽지 않는다.
   (3) 계조 — 대부분인 기본 등급은 이웃 메타(크기·태그)와 같은 층에 서고,
       눈이 먼저 가야 하는 high/urgent만 상태 잉크로 올라온다.
   배경 칠·세로 띠·pill 없음. 크기는 부모(메타 줄 11px / Docs 행 10px)를
   그대로 물려받아 어느 skin·density에서도 이웃 칩과 같은 리듬에 선다. */
/* 자간은 0이다 — 등급 이름이 한글 두 글자라, Latin 대문자에 쓰던 트래킹을
   그대로 주면 '긴급'이 '긴 급' 두 낱말로 끊겨 보인다(첫 캡처에서 잡았다). */
.prio{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-weight:500;letter-spacing:0;color:var(--muted)}
.prio .pname{font-weight:inherit}
.prio .pnum{font-style:normal;font-weight:400;color:var(--faint);letter-spacing:0}
/* 낮음도 흐림(--faint)으로 지우지 않는다 — 10~11px에서 대비 3:1을 못 넘긴다.
   조용함은 색을 빼서가 아니라 무게(400)로 만든다. */
.prio[data-tier="low"]{font-weight:400}
/* 여기서부터가 이 기능의 전부 — 눈이 먼저 가야 하는 두 등급만 잉크색을 쓴다 */
.prio[data-tier="high"]{color:var(--c-inprogress);font-weight:700}
.prio[data-tier="urgent"]{color:var(--c-blocked);font-weight:700}
/* Docs 목록 행은 flex 컨테이너가 아닌 텍스트 줄 — ID 뒤 간격을 직접 준다 */
.doclist .row .id .prio{margin-left:7px;display:inline-flex}
/* 문서 뷰어: 등급 낱말이 척도를 여는 손잡이다. 점선 밑줄은 이 화면에서 이미
   doclink가 쓰는 "여기 더 있다"는 약속이고, 열리는 것도 doclink와 같은
   hovercard다 — 새 어휘를 만들지 않았다. 늘 떠 있던 설명문은 그 카드로 옮겼다. */
.prio.pfull{cursor:help}
.prio.pfull .pname{border-bottom:1px dotted currentColor}
.prio.pfull:focus-visible{outline:2px solid var(--text);outline-offset:3px}
/* 척도 카드의 4등급 줄: 지금 등급만 잉크로 서고 나머지는 물러난다 */
.hovercard .pscale{margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.hovercard .pscale b{color:var(--text)}
.hovercard code{font-family:var(--mono);font-size:11px}
/* 미답 질문 안내 등 메타 행의 곁말 */
.prio-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:7px}
.card .t{margin:3px 0 6px;font-weight:600;line-height:1.45;font-size:13.5px;letter-spacing:-.01em;
  padding-right:56px}
.card .m{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);
  font-family:var(--mono);align-items:baseline}
.elapsed{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;
  color:var(--sc,var(--muted));white-space:nowrap}
.elapsed::before{content:"⏱ "}
.urow{padding:7px 0;border-bottom:1px solid var(--hairline);cursor:pointer;font-size:13px}
.urow:hover{background:var(--accent-soft)}
.urow .st{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase}
.badge{color:var(--text);font-family:var(--mono);font-size:11px}
.badge::before{content:"@"}
.size{color:var(--faint)}
.tag{color:var(--faint)}
.col .more{padding-left:14px}

/* ------- docs ------- */
.docs{display:flex;gap:0;align-items:flex-start;border:1px solid var(--border);background:var(--panel)}
/* 목록 높이 = 판이 시작되는 지점부터 화면 바닥까지(--docsh, renderDocs가 실측).
   150px 고정값은 헤더 높이가 다른 skin/density에서 판을 화면 밖으로 밀어냈다. */
.doclist{width:330px;flex:none;border-right:1px solid var(--border);
  max-height:var(--docsh,calc(100vh - 150px));overflow-y:auto}
/* 타입 진입점 (REQ-20260825-084) — Board의 knowledge/session 컬럼을 없앤 자리를
   Docs가 받는다. 목록 맨 위 붙박이 줄: 타입 이름 + 건수, 누르면 그 타입만.
   계기판 언어 그대로 — 배경 pill 없음, mono 소문자 대문자화, 활성은 잉크 밑줄. */
.typebar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;
  gap:0;min-height:30px;box-sizing:border-box;background:var(--panel);padding:0 6px;
  border-bottom:1px solid var(--border)}
/* 건수는 이 줄의 존재 이유다 — 좁아지면 잘라내지 말고 줄을 접는다. 폭이 모자랄
   때 ellipsis로 "REQUEST 2…"가 되어 숫자가 통째로 사라졌다 (REQ-20260825-084 검증). */
.typebar .tb{border:0;background:none;color:var(--muted);cursor:pointer;
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;
  padding:7px 6px;line-height:1;border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;flex:none}
.typebar .tb:hover{color:var(--text)}
.typebar .tb.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.typebar .tb b{margin-left:4px;color:var(--faint);font-weight:600;
  font-variant-numeric:tabular-nums}
.typebar .tb.on b{color:var(--text)}
/* 질문만 두 번째 숫자를 갖는다 — 답 없이 남은 장수(REQ-20260826-019). 총량은
   회색으로 물러나 있는데 이 숫자는 타입색 잉크로 서서, 훑는 눈에 걸린다.
   면(배경)이 아니라 글자색과 무게로만 세운다. */
.typebar .tb .unans{margin-left:5px;font-style:normal;font-weight:700;
  color:var(--t-question);font-variant-numeric:tabular-nums}
/* 그룹 헤더는 목록 맨 위에 붙는다. **문턱은 0이 기본이다** — sticky는 문턱보다
   위에 있는 상자를 아래로 밀어내면서 자리는 비워 두지 않으므로, 위에 아무것도
   없는 목록에서 양수 문턱을 주면 머리가 내려앉아 첫 항목의 제목 줄을 제 배경으로
   덮는다 (REQ-20260827-041 — Settings 첫 항목 `디스플레이`가 스킨 10종에서
   19~24px 가려졌다. Stream 빈 상태 줄도 같은 자리였다). */
.doclist .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding:13px 14px 6px;font-weight:600;position:sticky;top:0;background:var(--panel);
  font-family:var(--mono);border-bottom:1px solid var(--hairline)}
/* 타입바가 **실제로 앞에 있을 때만** 그 아래로 내려 붙는다 — 두 sticky가 겹치면
   머리가 타입바 뒤에 숨는다. 조건을 선택자에 적어 두면 이 위젯을 타입바 없이
   재사용하는 자리(Settings·Stream)가 JS가 --tbh를 채워 주기를 기다리지 않고도
   스스로 옳게 선다. --tbh는 renderDocs가 렌더 직후 실측해 넣는다(줄이 접히면
   높이가 달라진다). */
.doclist .typebar ~ .grp{top:var(--tbh,30px)}
.doclist .row{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--hairline)}
.doclist .row:hover{background:var(--accent-soft)}
.doclist .row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--text)}
/* 점선 = 여기를 누르세요 / 실선 = 지금 여기 있습니다 (REQ-20260827-007 어휘).
   행은 아래 테두리로 맞닿아 있으므로 링을 안쪽으로 물려 이웃 행을 덮지 않게 한다. */
.doclist .row:focus-visible,.backlinks .bl:focus-visible{
  outline:1px solid var(--text);outline-offset:-1px}
.doclist .row .id{font-family:var(--mono);font-size:10px;color:var(--faint)}
.doclist .row .st{float:right;font-size:10px;color:var(--sc,var(--muted));
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.doclist .row>div:nth-child(3){font-size:13px;margin-top:1px}
.viewer{flex:1;padding:24px 34px;min-height:300px;
  max-height:var(--docsh,calc(100vh - 150px));overflow-y:auto}
.viewer .empty{color:var(--faint);font-family:var(--mono);font-size:12px}
.viewer h1{letter-spacing:-.015em;font-size:21px}
/* review/blocked 판단 근거 callout — 본문 최하단 History에 묻히는 전이 사유(확인
   포인트/대기 사유)를 뷰어 상단으로 끌어올린다 (REQ-20260825-006 반려 재작업).
   계기판 언어: 라운드 0·그림자 0, 1px 보더 + mono 캡션. */
.gate{border:1px solid var(--border);margin:14px 0 0;padding:10px 12px;background:var(--panel)}
.gate-k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.gate-k .cdot{width:7px;height:7px;flex:none}
.gate-k .path{margin-left:auto}
/* 배경 한 줄 (DOC-20260826-015): 판단 요구보다 "무엇에 대한 건인가"가 먼저다.
   요약은 메타 표 안(callout 아래)에 있었고, 거기까지 내려가야 한다면 판정
   화면은 이미 실패다. .gate 와 같은 계기판 언어 — 라운드·그림자 없이 하단
   헤어라인 하나로 배경과 판단 요구를 가른다. 잉크는 --muted 로 본문(--text)
   보다 한 단 낮춰, 가장 큰 소리가 확인 포인트 쪽에 남게 한다. */
.gate-w{font-size:12px;line-height:1.5;color:var(--muted);
  margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.gate-wk{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);margin-right:8px}
.gate-b{font-size:12.5px;line-height:1.55}
/* 확인 포인트 갈래 (gateNote). 원문은 손대지 않고 번호 앞에서만 끊는다 —
   8px 은 갈래 사이 간격(≈27px 베이스라인)이 갈래 안 줄간(≈19px)과 확실히
   구분되는 최소값이다. 불릿·번호 치환 없음: 원문의 ①/(1) 이 그대로 마커다. */
.gate-p{margin-top:8px}
.gate-p:first-child{margin-top:0}
.gate-h{margin-top:8px;border-top:1px solid var(--hairline);padding-top:6px}
.gate-h summary{cursor:pointer;font-family:var(--mono);font-size:10px;
  color:var(--faint);text-transform:uppercase;letter-spacing:.05em;list-style:none}
.gate-h summary::before{content:"▸ "}
.gate-h[open] summary::before{content:"▾ "}
.gate-r{margin:7px 0 0;font-size:12px;line-height:1.5}
.gate-r .path{display:block;margin-bottom:2px}
/* ── 문서 본문 표 (REQ-20260827-008) ───────────────────────────────────────
   표를 읽는 규칙은 터미널 뷰와 같은 함수(mdTable) 하나에 있지만, **스타일은
   나눠야 한다**: 터미널은 테마와 무관하게 늘 어두운 자체 팔레트(--cc-*)로
   그리고, 문서 본문은 tone 을 따라가는 문서 토큰으로 그린다. 문서 뷰어에서
   --cc-* 를 빌려 쓰면 그 토큰이 없어 어두운 fallback 으로 떨어지고, 밝은
   tone 에서 글자가 배경에 묻힌다.
   계기판 언어 그대로: 얼룩말 색면 없이 헤어라인으로만 나누고, 숫자는 자릿수를
   세로로 맞춘다. 넓은 표는 본문을 밀지 않고 자기 안에서 가로로 스크롤한다. */
.mdtblw{display:block;max-width:100%;overflow-x:auto;margin:12px 0}
.mdtbl{border-collapse:collapse;font-size:12.5px;line-height:1.6;
  font-variant-numeric:tabular-nums;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mdtbl th,.mdtbl td{padding:5px 16px;vertical-align:top;text-align:left;
  word-break:break-word;border-left:1px solid var(--hairline)}
.mdtbl th:first-child,.mdtbl td:first-child{padding-left:0;border-left:0}
.mdtbl th:last-child,.mdtbl td:last-child{padding-right:0}
.mdtbl th{font-weight:600;color:var(--text);border-bottom:1px solid var(--border)}
.mdtbl td{color:var(--text)}
.mdtbl tbody tr + tr td{border-top:1px solid var(--hairline)}
.mdtbl code{font-family:var(--mono);font-size:11.5px}

/* 문서 뷰 첨부 (REQ-20260825-023) — 계기판 언어: 라운드 0, 1px 보더 */
.attimg{max-width:min(100%,760px);display:block;margin:8px 0;border:1px solid var(--border)}
.attlink{display:inline-block;text-decoration:none}
.attfile{font-family:var(--mono);font-size:12px;color:var(--text);
  border:1px solid var(--border);padding:2px 8px;text-decoration:none;
  display:inline-block;margin:4px 0}
.attfile:hover{background:var(--text);color:var(--bg)}
/* 첨부 본문 발췌 (REQ-20260827-005) — 계기판 언어 그대로: 라운드 0, 그림자 0,
   구획은 얇은 보더 하나. 좌측 세로 띠·색면 하이라이트 없음. 위계는 크기와
   글자색으로만 만들고, 찾던 문구는 배경이 아니라 잉크 굵기로 짚는다. */
.attext{border:1px solid var(--border);padding:8px 11px 9px;margin:6px 0 13px}
.atthd{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint);display:flex;gap:11px;flex-wrap:wrap;
  align-items:baseline;margin-bottom:7px}
/* 파일 이름은 데이터지 라벨이 아니다 — 대문자로 눌러 쓰면 실제 이름과 달라진다 */
.atthd .attn{color:var(--muted);text-transform:none}
.atthd .atthit{color:var(--text)}
.attx{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--muted);
  white-space:pre-wrap;word-break:break-word}
.attx b{color:var(--text);font-weight:700}
.attx.open{max-height:min(52vh,420px);overflow:auto;padding-right:6px}
.attx.open:focus-visible{outline:1px solid var(--text);outline-offset:2px}
.attcut{margin-top:10px;color:var(--faint);font-size:10.5px;line-height:1.6}
.attmore{margin-top:8px;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.attmore:hover{color:var(--text);text-decoration:underline}
.attchip{font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--hairline);padding:1px 6px}
.metatbl{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:12.5px;
  border-top:1px solid var(--border)}
.metatbl td{border-bottom:1px solid var(--hairline);padding:7px 10px 7px 0;vertical-align:top}
.metatbl td:first-child{color:var(--faint);width:150px;white-space:nowrap;
  font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);
  padding-top:9px}
.md h2{border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:30px;
  font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.md h3{font-size:13px;color:var(--muted);margin-top:20px;font-family:var(--mono)}
.md pre{background:var(--accent-soft);border-left:2px solid var(--border);
  padding:11px 14px;overflow-x:auto;font-size:12px}
.md code{background:var(--accent-soft);padding:1px 5px;font-family:var(--mono);font-size:12px}
.md pre code{background:none;padding:0}
.md a{color:var(--text)}
.md li{margin:3px 0}
a.doclink{color:var(--text);cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px;font-family:var(--mono);font-size:.92em}
.path{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.snip{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  padding:2px 0 2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snip b{color:var(--text);font-weight:700;background:var(--accent-soft)}
/* 이 줄이 첨부에서 왔다는 표시 — 줄 번호가 문서 본문의 줄로 읽히지 않게 */
.snipf{color:var(--faint);margin-right:6px}
.reqstream summary{cursor:pointer;font-weight:600;font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);padding:14px 0 8px;margin-top:28px;list-style:none;
  text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.reqstream summary::before{content:"▸ ";color:var(--faint)}
.reqstream[open] summary::before{content:"▾ "}
.reqstream .term{max-height:440px;margin-top:8px}

/* ------- audit: 레저 테이블 ------- */
.audit{border:1px solid var(--border);background:var(--panel)}
.audit .cap{padding:10px 16px;border-bottom:1px solid var(--border);font-size:11.5px;
  color:var(--muted)}
.audit .tblwrap{overflow-x:auto}
.audit table{width:100%;border-collapse:collapse;font-size:12.5px}
.audit th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--border);
  white-space:nowrap;font-family:var(--mono);font-weight:600}
.audit td{padding:7px 14px;border-bottom:1px solid var(--hairline);vertical-align:top}
.audit tr:hover td{background:var(--accent-soft)}
.audit td.ts{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;
  white-space:nowrap;color:var(--kc);font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.06em}
.kind::before{content:"";width:6px;height:6px;background:var(--kc);display:inline-block}
.audit .more{padding:10px 14px}

/* ------- backlinks ------- */
.backlinks{border-top:1px solid var(--border);margin-top:28px;padding-top:14px}
.backlinks h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px;font-weight:600;font-family:var(--mono)}
.backlinks .bl{padding:6px 0;cursor:pointer;font-size:13px;border-bottom:1px solid var(--hairline)}
.backlinks .bl:hover{background:var(--accent-soft)}
.backlinks .bl .id{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:10px}

/* ------- stream 터미널 ------- */
.streamwrap{display:flex;gap:0;align-items:flex-start;border:1px solid var(--border);
  background:var(--panel)}
.streamwrap .doclist{border-right:1px solid var(--border)}
.term{flex:1;background:#101418;color:#cfd8e3;padding:16px 20px;
  max-height:calc(100vh - 150px);overflow-y:auto;
  font-family:var(--mono),"Segoe UI Emoji","Noto Color Emoji";
  font-size:12px;line-height:1.55}
.term .ev{margin:11px 0;white-space:pre-wrap;word-break:break-word}
.term .ev.agent{opacity:.7;padding-left:12px;border-left:1px solid #3a4655}
.term .hd{font-weight:600}
.term details summary{cursor:pointer;list-style:none}
.term details summary::before{content:"▸ "}
.term details[open] summary::before{content:"▾ "}
.term .meta{color:#5c6878;font-size:11px}
.term mark.reqhl{background:#d97706;color:#101418;padding:0 2px;border-radius:0}
/* 화면이 실제 시각으로 고쳐 그린 도장 (REQ-20260827-010) — 고쳤다는 사실을
   감추지 않되 읽는 흐름을 끊지도 않는다: 색면 없이 점선 밑줄 하나. */
.term .stampfix{border-bottom:1px dotted #5c6878;cursor:help}

/* ------- terminal 탭 (REQ-20260824-037) — Claude Code CLI 재현.
   .term처럼 테마 무관 상시 다크 + CC 팔레트. 라운드/그림자 0 (터미널이므로 당연). ------- */
.ccterm{--cc-bg:#1b1c1e;--cc-text:#e8e8e4;--cc-dim:#8a8f98;--cc-faint:#5c626c;
  --cc-green:#4ec97a;--cc-cyan:#56c8d8;--cc-yellow:#e5c07b;--cc-red:#e06c75;
  --cc-border:#3a3d44;--cc-hair:rgba(255,255,255,.07);
  background:var(--cc-bg);color:var(--cc-text);border:1px solid var(--border);
  display:flex;flex-direction:column;height:calc(100vh - 168px);
  font-family:var(--mono),"Segoe UI Emoji","Noto Color Emoji";font-size:12.5px;
  line-height:1.7;font-variant-ligatures:none;letter-spacing:0}
.ccterm .ccwake{background:none;border:1px solid var(--cc-green);color:var(--cc-green);
  padding:3px 12px;font:inherit;font-size:12px;cursor:pointer;margin:2px 0}
.ccterm .ccwake:hover:not(:disabled){background:var(--cc-green);color:var(--cc-bg)}
.ccterm .ccwake:disabled{opacity:.6;cursor:default}
.ccterm .ccatt{color:var(--cc-cyan);background:rgba(86,200,216,.12);padding:0 5px}
/* 터미널 안에 떠야 하는 것들(손잡이 등)의 기준면 */
.ccterm{position:relative}
/* ------- 바닥으로 내려가는 손잡이 (REQ-20260827-061) -------
   위로 올려 읽는 동안 새 출력이 오면 화면은 조용히 멎은 것처럼 보인다 —
   자동 따라가기가 꺼져 있기 때문이다(그건 옳다: 읽던 줄이 끌려가면 안 된다).
   그래서 **꺼졌다는 사실**과 **그 사이 몇 줄이 쌓였는지**를 말해 주는 손잡이가
   필요하다. 로컬 Claude Code 터미널이 쓰는 그 손잡이를 그대로 옮긴다.

   판 위에 떠야 하므로 스크롤 판과 형제로 두고 감싸개(.ccoutwrap)를 기준으로
   앉힌다. 늘 떠 있으면 곧 안 읽히므로 **바닥에서 떨어졌을 때만** 나온다.
   색은 터미널 자신의 팔레트(--cc-*)뿐이라 10스킨을 따로 볼 것이 없다 —
   터미널은 tone 무관 상시 다크다. */
.ccoutwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ccout{flex:1;overflow-y:auto;padding:16px 20px}
.ccjump{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;
  font:inherit;font-size:11.5px;padding:4px 12px;
  background:var(--cc-bg);border:1px solid var(--cc-border);color:var(--cc-dim)}
.ccjump[hidden]{display:none}
.ccjump .jk{color:var(--cc-faint);font-size:10px;letter-spacing:.04em}
.ccjump:hover{color:var(--cc-text);border-color:var(--cc-dim)}
/* 안 읽은 것이 있으면 무게를 올린다 — 인버스는 이 터미널이 이미 쓰는 강조다
   (터미널이 이미 쓰는 잉크 반전). 두 상태를 색상이 아니라 **무게**로 가른다. */
.ccjump.unread{background:var(--cc-text);border-color:var(--cc-text);color:var(--cc-bg)}
.ccjump.unread .jk{color:var(--cc-bg);opacity:.62}
.ccjump.unread:hover{opacity:.88;color:var(--cc-bg)}
.ccjump:focus-visible{outline:1px solid var(--cc-text);outline-offset:2px}
.ccout .ln{display:flex;gap:9px;margin:0 0 13px}
.ccout .ln .g{flex:none;width:14px;text-align:left;user-select:none}
.ccout .ln .b{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.ccout .ln.sub{margin:-9px 0 13px;color:var(--cc-dim)}   /* ⎿ 연속줄 — 앞 줄에 붙는다 */
.ccout .ln.sub .g{color:var(--cc-faint)}
.ccout .ln.ccdim{color:var(--cc-dim)}
.ccstatus .ccagrow{cursor:pointer}
.ccstatus .ccagrow.sel{background:rgba(78,201,122,.08)}
.ccstatus .ccagrow.sel b{color:var(--cc-green)}
.ccstatus .ccmain.dim{opacity:.5}
.ccstatus .ccagrow:hover{background:rgba(255,255,255,.04)}
/* 근사(추정) 행 — 클릭 대상이 아님을 커서·명도로 먼저 말한다 (REQ-20260825-083) */
.ccstatus .agapx{opacity:.6;cursor:default}
/* 열 수 있는 행임을 포인터가 올라간 순간 글자로 확인시킨다 — 평소엔 조용히 */
.ccstatus .ccagrow:hover .r::after{content:" · 열기";color:var(--cc-green)}
.ccstatus .ccmain{cursor:pointer}
.ccstatus .ccrc{text-decoration:underline;cursor:help}
.ccout .ln.pending{opacity:.55}
.ccterm .ccprompt{color:var(--cc-text)}
/* 선택 하이라이트 (REQ-20260825-003): 전역 ::selection은 tone 잉크색 배경이라
   라이트 tone에서 항상-다크 터미널 배경과 구분 불가 — 터미널 인버스 비디오로 재정의 */
.ccterm::selection,.ccterm ::selection{background:var(--cc-text);color:var(--cc-bg)}
.term::selection,.term ::selection{background:#cfd8e3;color:#101418}
.ccterm .cccode{background:rgba(255,255,255,.09);padding:0 4px;color:var(--cc-cyan)}
.ccterm .ccblk{display:block;background:rgba(255,255,255,.06);border-left:2px solid var(--cc-border);
  padding:6px 10px;margin:5px 0;white-space:pre-wrap;color:var(--cc-cyan)}
.ccterm .ccval{color:var(--cc-cyan)}

/* ------- 터미널 블록 마크다운 (REQ-20260826-029) — 표·헤딩.
   ccterm 과 stream .term 둘 다 tone 무관 상시 다크라 팔레트는 --cc-* 하나로
   충분하다. 다만 .term 에는 그 토큰이 정의돼 있지 않으므로 fallback 을 반드시
   붙인다(안 붙이면 문서 안 스트림에서 선이 통째로 사라진다). 구분은 색면이
   아니라 헤어라인·굵기·정렬로 — 얼룩말 배경 줄무늬 금지. ------- */
.cctblw{display:block;max-width:100%;overflow-x:auto;margin:9px 0}
.cctbl{border-collapse:collapse;white-space:normal;font-size:.96em;
  font-variant-numeric:tabular-nums;
  border-top:1px solid var(--cc-border,#3a4655);
  border-bottom:1px solid var(--cc-border,#3a4655)}
.cctbl th,.cctbl td{padding:4px 15px;vertical-align:top;text-align:left;
  white-space:normal;word-break:break-word;
  border-left:1px solid var(--cc-hair,rgba(255,255,255,.07))}
.cctbl th:first-child,.cctbl td:first-child{padding-left:0;border-left:0}
.cctbl th:last-child,.cctbl td:last-child{padding-right:0}
.cctbl th{font-weight:600;color:var(--cc-text,#e8e8e4);
  border-bottom:1px solid var(--cc-dim,#5c6878)}
.cctbl td{color:var(--cc-text,#cfd8e3)}
.cctbl tbody tr + tr td{border-top:1px solid var(--cc-hair,rgba(255,255,255,.07))}
.cch{font-weight:700;color:var(--cc-text,#e8e8e4);white-space:normal;
  margin:17px 0 7px;letter-spacing:-.004em}
.cch1{font-size:1.2em}
.cch2{font-size:1.1em}
.cch3{font-size:1.02em}
.cch4,.cch5,.cch6{font-size:1em;font-weight:600}
.cch:first-child{margin-top:0}

.ccterm details summary{cursor:pointer;list-style:none;display:inline}
.ccterm details summary::-webkit-details-marker{display:none}
.ccterm details summary::after{content:" [+]";color:var(--cc-faint)}
.ccterm details[open] summary::after{content:" [\2212]"}
.ccterm details .full{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.ccerr{border-top:1px solid var(--cc-border);color:var(--cc-red);
  padding:7px 20px;font-size:12px}
.ccinputrow{display:flex;gap:9px;align-items:flex-start;
  border-top:1px solid var(--cc-border);padding:11px 20px}
.ccinputrow .ccp{flex:none;color:var(--cc-text)}
.ccinputrow textarea{flex:1;border:0;background:none;color:var(--cc-text);
  font:inherit;line-height:1.7;padding:0;margin:0;resize:none;outline:none;
  overflow:hidden;display:block}
.ccinputrow textarea::placeholder{color:var(--cc-faint)}
.ccinputrow textarea:disabled{opacity:.5}
/* 붙여넣기 접힘 안내 (REQ-20260827-040) — 프롬프트 뒤 글자 자리에 맞춘 한 줄.
   색면·띠 없이 dim 글자만. 36px = 좌패딩 20 + ❯ 한 칸 + gap 9. */
.ccpaste{padding:2px 20px 0 36px;color:var(--cc-dim);font-size:11.5px}
.ccstatus{padding:4px 20px 12px;font-size:12px;line-height:1.85}
.ccstatus .ccs1{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.ccstatus .ccmode{font-weight:600;color:var(--cc-yellow)}
.ccstatus .ccok{color:var(--cc-green)}
.ccstatus .ccwarn{color:var(--cc-red)}
.ccstatus .cccyan{color:var(--cc-cyan)}
.ccstatus .ccs1 .r{color:var(--cc-dim);text-decoration:underline;text-underline-offset:3px}
/* 수신 연결 상태 (REQ-20260825-032) — 단절/폴백을 상태줄에 가시화 */
.ccstatus .ccconn{font-weight:600}
.ccstatus .ccconn.ccdim{color:var(--cc-dim);font-weight:400}
.ccstatus .ccconn.ccwarn{animation:ccconnblink 1.4s step-end infinite}
@keyframes ccconnblink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.ccstatus .ccconn.ccwarn{animation:none}}
.ccstatus .ag{display:flex;gap:9px}
.ccstatus .ag .g{flex:none;width:14px}
.ccstatus .ag .r{margin-left:auto;color:var(--cc-dim)}
.ccstatus .ag.sub{color:var(--cc-dim)}
[data-density="compact"] .ccterm{font-size:11.5px;line-height:1.55}
/* REQ-040: 팔레트·첨부 칩·웨이팅 스피너·에이전트 dim — 라운드/그림자 0 유지 */
.ccpal{border-top:1px solid var(--cc-border);max-height:230px;overflow-y:auto;padding:5px 0}
.ccpal .pi{display:flex;gap:14px;padding:2px 20px;cursor:pointer;align-items:baseline}
.ccpal .pi .pn{flex:none;min-width:180px;color:var(--cc-text)}
.ccpal .pi .pd{color:var(--cc-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ccpal .pi.sel{background:rgba(255,255,255,.1)}
.ccpal .pi.cli .pn{color:var(--cc-faint)}
.ccpal .pcli{color:var(--cc-faint)}
.ccatt{display:flex;gap:8px;flex-wrap:wrap;padding:7px 20px 0;border-top:1px solid var(--cc-border)}
.ccatt .chip{border:1px solid var(--cc-border);padding:1px 8px;color:var(--cc-dim);font-size:11.5px}
.ccatt .chip .up{color:var(--cc-yellow)}
.ccatt .chip button{background:none;border:0;color:var(--cc-red);cursor:pointer;font:inherit;padding:0 0 0 6px}
.cctarget{display:flex;gap:8px;align-items:center;padding:7px 20px 0;
  font-size:11.5px;color:var(--cc-dim)}
.cctarget .arw{color:var(--cc-green)}
.cctarget b{color:var(--cc-green)}
.cctarget .aid{color:var(--cc-faint)}
/* 문서 지목 (REQ-20260827-064) — 에이전트 지목과 **같은 자리, 같은 어휘**다.
   둘은 양립하지 않으므로(메시지는 에이전트에게 가거나 문서 노트로 들어간다)
   한 번에 하나만 선다. 문서 쪽은 초록이 아니라 청록으로 갈라 둔다 — 같은 줄에
   두 종류가 번갈아 서므로 무엇이 서 있는지 색으로도 구분된다. */
.cctarget.doc b{color:var(--cc-cyan)}
.cctarget.doc .arw{color:var(--cc-cyan)}
.cctarget .dtl{color:var(--cc-text);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* 이미 끝난 요청 — 이어 말한 내용은 노트로 남지만 그 요청이 다시 열리지는
   않는다. 색만으로 말하지 않고 낱말을 함께 적는다. */
.cctarget .dend{color:var(--cc-yellow)}
/* 아티클 모드 표시 — 문서 지목과 같은 줄, 다른 잉크 */
.cctarget.art b{color:var(--cc-yellow)}
.cctarget.art .arw{color:var(--cc-yellow)}
.cctarget button{background:none;border:0;color:var(--cc-red);cursor:pointer;
  font:inherit;padding:0 0 0 6px}
.ccstatus .agtgt{margin-left:8px;background:none;border:0;color:var(--cc-faint);
  cursor:pointer;font:inherit;padding:0 3px}
.ccstatus .agtgt:hover,.ccstatus .agtgt.on{color:var(--cc-green)}
.ccclip{flex:none;background:none;border:0;color:var(--cc-dim);cursor:pointer;font:inherit;line-height:1.7;padding:0 2px}
.ccclip:hover{color:var(--cc-text)}
/* 새 아티클로 쓰기 (REQ-20260827-073) — 첨부(📎) 옆의 같은 크기 손잡이.
   켜져 있으면 잉크 반전으로 "지금 다른 것을 쓰는 중"임을 말한다(터미널이 이미
   쓰는 강조). 문서 집기와는 양립하지 않는다 — 있는 문서에 붙이는 것과 새 글을
   시작하는 것은 같은 메시지로 둘 다일 수 없다. */
.ccart{flex:none;background:none;border:0;color:var(--cc-dim);cursor:pointer;font:inherit;line-height:1.7;padding:0 4px}
.ccart:hover{color:var(--cc-text)}
.ccart[aria-pressed="true"]{background:var(--cc-text);color:var(--cc-bg)}
.ccterm.dragover{outline:1px dashed var(--cc-cyan);outline-offset:-5px}
.ccwaitline{padding:0 0 13px;color:var(--cc-dim)}
/* ------- 컨텍스트 압축 중 (REQ-20260827-065) -------
   압축이 도는 동안 세션은 한동안 아무 말도 하지 않는다. 로컬 터미널을 보는
   사람은 압축 표시를 보고 기다리지만, 대시보드만 보는 사람에게 그 침묵은
   **고장과 구분되지 않는다**. 그래서 침묵이 생기는 바로 그 자리(출력 판 끝)에
   기다림의 어휘를 그대로 세운다 — 스피너 + 하는 일 + 경과. 새 어휘가 아니라
   응답 대기 줄(.ccwaitline)과 같은 손이다.

   `live` 와 겹쳐 보이지 않게 한다: 압축 중에도 세션은 **살아 있다**. 그래서
   live 를 덮어쓰지 않고 그 옆에 따로 선다 — 초록 live 는 그대로 두고, 압축은
   노랑(기다림)이다. 색으로만 가르지 않도록 낱말도 함께 적는다. */
.cccompact{color:var(--cc-yellow);display:flex;gap:9px;align-items:baseline}
/* display 를 손으로 정했으므로 hidden 도 손으로 되살린다 — 안 그러면 브라우저
   기본 [hidden]{display:none} 을 덮어써 빈 줄이 늘 자리를 먹는다. */
.cccompact[hidden]{display:none}
.cccompact .cce{color:var(--cc-faint)}
.ccstatus .cccmpk{color:var(--cc-yellow)}
.ccstatus .cccmpk[hidden]{display:none}
/* 스피너 — CC v2.1.243 실측 이식 v5 (REQ-20260825-017/-027, DOC-20260825-001).
   메인 스피너(Po)는 6프레임 배열을 쓴다: 비-ghostty 터미널용 ["·","✢","*","✶","✻","✽"]
   — CC 스스로 ✳(U+2733) 대신 ASCII *를 쓴다(이모지 오염 회피, REQ-017과 같은 이유).
   인덱스 = round(5·(1-cos(2πt/2000))/2): 2초에 한 번 숨쉬는 펄스 —
   · 와 ✽ 양끝에서 각 ~0.4s 머물고 중간을 부드럽게 지난다(코사인 이징).
   키프레임 오프셋 = 그 곡선의 프레임 전환 시점. 색은 claude 주황. */
/* 글리프 폭 고정 (REQ-20260825-057): ·/✢/*/✶/✻/✽ 는 폭이 제각각이라 프레임이
   바뀔 때마다 뒤 텍스트가 좌우로 흔들렸다. 고정폭 인라인 박스에 중앙 정렬하고
   이모지 폰트 폴백을 끊어(mono 강제 + 텍스트 표현) 렌더 폭을 일정하게 만든다. */
.ccspin{display:inline-block;width:1.25ch;text-align:center;flex:none;
  font-family:var(--mono);font-variant-emoji:text}
.ccspin::before{content:"✻";display:inline-block;color:rgb(215,119,87);
  transform-origin:50% 50%;animation:ccglyph 2s steps(1,end) infinite}
/* 프레임 = 글리프 교체 → 스케일 펄스로 전환 (REQ-20260825-058): 별 글리프들이
   서로 다른 폰트에서 와(브라우저 폰트 폴백) 크기·중심이 달라 프레임마다
   덜컹였다. 한 글리프(✻)를 CC와 같은 6단 코사인 타이밍으로 키웠다 줄여
   "피고 지는" 인상은 유지하되 렌더 지터를 없앤다. 폭은 .ccspin이 고정. */
@keyframes ccglyph{0%{transform:scale(.30);opacity:.55}10.2%{transform:scale(.46);opacity:.7}18.5%{transform:scale(.62);opacity:.82}25%{transform:scale(.78);opacity:.9}31.6%{transform:scale(.90);opacity:.96}39.8%{transform:scale(1);opacity:1}60.2%{transform:scale(.90);opacity:.96}68.5%{transform:scale(.78);opacity:.9}75%{transform:scale(.62);opacity:.82}81.6%{transform:scale(.46);opacity:.7}89.8%{transform:scale(.30);opacity:.55}100%{transform:scale(.30);opacity:.55}}
/* 웨이팅 텍스트 shimmer — CC 실측: 80ms에 1글자씩 이동(사이클=글자수+20≈30스텝),
   claude 주황 볼드 위 살짝 밝은 주황(claudeShimmer rgb(245,149,117))의 좁은 하이라이트.
   steps(30)으로 글자 단위 이산 이동을 재현 — 연속 질주 띠 아님. */
.ccwv{font-weight:700;background:linear-gradient(90deg,rgb(215,119,87) 44%,rgb(245,149,117) 50%,rgb(215,119,87) 56%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;animation:ccshimmer 2.4s steps(30,end) infinite}
@keyframes ccshimmer{0%{background-position:110% 0}100%{background-position:-110% 0}}
@media (prefers-reduced-motion: reduce){.ccspin::before{animation:none}
  .ccwv{animation:none;background:none;-webkit-text-fill-color:currentColor;color:rgb(215,119,87)}}
.ccout .ln.ccagent{color:var(--cc-dim);opacity:.75;margin-left:14px}
.ccout .ln.ccagent .g{color:var(--cc-faint)}
.ccout .b .full .ln{margin:0 0 6px}

/* ------- graph ------- */
.graphwrap{border:1px solid var(--border);background:var(--panel);position:relative}
.graphwrap canvas{display:block;width:100%;cursor:grab}
.graphwrap canvas.grabbing{cursor:grabbing}
.ghint{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:var(--faint);
  font-family:var(--mono);background:var(--panel);border:1px solid var(--hairline);padding:3px 9px}
/* ------- 전체 보기 손잡이 (REQ-20260827-083) -------
   터미널의 "맨 아래로"와 같은 손이다: 되돌릴 방법이 없어 갇힌 상태에서만 나오고,
   돌아오면 사라진다. 늘 떠 있는 안내는 곧 안 읽힌다.
   판 아래 가운데 — 조작 안내(.ghint)는 오른쪽 구석이라 서로 겹치지 않는다. */
.gfit{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:4;
  font:inherit;font-size:11.5px;padding:4px 13px;cursor:pointer;white-space:nowrap;
  background:var(--panel);border:1px solid var(--text);color:var(--text)}
.gfit[hidden]{display:none}
.gfit:hover{background:var(--text);color:var(--bg)}
.gfit:focus-visible{outline:1px solid var(--text);outline-offset:3px}
.legend{display:flex;gap:18px;padding:10px 16px;border-bottom:1px solid var(--border);
  font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px}
.gmode{border:1px solid var(--border);background:none;color:var(--muted);
  font-family:var(--mono);font-size:10px;padding:2px 9px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.05em}
.gmode.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* 범례 종류 토글 (REQ-20260827-007): 마우스 없이도 닿아야 해서 진짜 <button>
   이다. 보이는 것은 그대로 범례 글자여야 하므로 버튼의 기본 옷(회색 판·보더·
   자기 글꼴·패딩)을 벗긴다. 패딩만 조금 돌려주고 같은 크기의 음수 마진으로
   되갚아, 손가락이 닿는 면은 넓어지되 범례의 간격 리듬(gap 18px)은 그대로다. */
.gtype{cursor:pointer;user-select:none;background:none;border:0;
  font:inherit;color:inherit;padding:3px 4px;margin:-3px -4px}
/* 선행 대기 엣지 범례 — 획 자체를 보여준다(색 칩이 아니라). 잉크색 = 캔버스의 획과 같은 색 */
.gedge{display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.gedge svg{flex:none}
.gtype.off{opacity:.35;text-decoration:line-through}
/* 빈 화면 안내가 "이걸 켜라"고 지목한 항목 (REQ-20260826-039 재작업).
   취소선과 흐림은 그대로 둔다 — 꺼져 있다는 사실을 지우면 안 된다. 그 위에
   잉크 점선 아웃라인만 얹어 "여기"를 짚는다. 색면이 아니라 점선인 것은 드래그
   허용 컬럼(.col.dropok)과 같은 어휘라서다. 취소선 그어진 항목이 여럿일 때
   어느 것인지 짚지 않아 사용자가 엉뚱한 것을 누른 것이 반려 사유였다. */
.gtype.want{opacity:.9;outline:1px dashed var(--text);outline-offset:4px}
/* 포커스 링 — 전역 규칙과 같은 잉크 실선. 바로 위 .want 의 점선 아웃라인이
   특이도로 맞서므로(같으면 나중 것이 이긴다) 여기서 명시적으로 되살린다.
   짚기는 점선, 포커스는 실선 — 두 신호가 획으로 구분된다. */
.gtype:focus-visible{outline:1px solid var(--text);outline-offset:2px}
.gtype.want:focus-visible{outline:1px solid var(--text);outline-offset:4px}
/* 빈 화면이 지목한 헤더 조건 (REQ-20260827-054) — 범례 지목과 같은 잉크 점선.
   색면·띠 없음. 컨트롤 자신의 보더는 그대로 두고 바깥에 점선만 얹는다. */
.fgroup .want{outline:1px dashed var(--text);outline-offset:3px}
.gedge.none{opacity:.4}
.gedge .gecount{font-family:var(--mono);color:var(--muted)}

/* ------- 그래프 빈 화면 안내 (REQ-20260826-039) -------
   캔버스가 비는 건 대개 렌더 실패가 아니라 조건의 교집합이 0인 것이다. 화면이
   그걸 말하지 않으면 사용자는 위 필터와 범례 두 곳을 스스로 대조해야 한다.
   판(배경 색면)을 깔지 않는다 — 빈 캔버스가 이미 여백이고, 여기에 색면을 얹으면
   "또 하나의 창"이 된다. 위계는 크기·굵기·색 글자로만. 색은 꺼진 종류의 타입색을
   글자에 입혀 위 범례 칩과 눈으로 이어 준다. */
.gempty{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:52px 24px 46px;
  text-align:center;pointer-events:none}
/* 한국어 문장에는 자간을 벌리지 않는다 — 모노·대문자·letter-spacing 은 id·시각·
   카운트 같은 라틴/숫자 메타데이터의 어휘다. 문장에 쓰면 글자가 흩어져 보인다. */
.gempty .gemsg{max-width:44ch;font-size:14px;line-height:1.75;color:var(--text);
  word-break:keep-all;text-wrap:balance;margin:0}
.gempty .gemsg b{font-weight:700}
.gempty .geack,.gempty .genote{max-width:46ch;font-size:11.5px;line-height:1.65;
  color:var(--muted);word-break:keep-all;text-wrap:balance;margin:0}
.gempty .geack code,.gempty .genote code{font-family:var(--mono);font-size:11px;
  letter-spacing:.04em;color:var(--text)}
/* 주 문장 안의 조건 값 — 헤더 컨트롤에 찍힌 그 글자다. 본문보다 한 급 작은
   모노로 두어 문장의 흐름을 끊지 않으면서 "옮겨 적을 값"임을 보인다. */
.gempty .gemsg code{font-family:var(--mono);font-size:12.5px;
  letter-spacing:.02em;color:var(--text)}
.gefix{pointer-events:auto;background:none;border:1px solid var(--text);
  color:var(--text);font:inherit;font-size:12px;padding:6px 16px;cursor:pointer;
  border-radius:var(--r)}
.gefix:hover,.gefix:focus-visible{background:var(--text);color:var(--bg)}


/* ------- 선행 대기 현황판 (REQ-20260826-009) -------
   그래프는 구조를 보여주고, 현황판은 "지금 무엇이 무엇 때문에 멈췄나"를 답한다.
   300개 노드에서 엣지 하나를 눈으로 찾는 건 현실적이지 않다 — 같은 사실을
   캔버스 옆에서 글로 한 번 더 말한다.

   2차 반려("하단에 있으니 그래프 화면이 너무 좁다") 반영: 캔버스 아래가 아니라
   **오른쪽 레일**이다. 세로는 화면에서 가장 귀한 축이고 그래프는 세로를 다 쓴다 —
   현황판이 그 아래에 서면 두 표현이 같은 세로를 두고 다툰다. 옆에 세우면 캔버스는
   높이를 온전히 돌려받고, 현황판은 남아 도는 가로를 쓴다.
   그래서 4열 표를 버리고 세로로 쌓는 목록으로 다시 짰다 — 폭 300px대에 4열을
   밀어 넣으면 가로 스크롤이 생기고, 가로 스크롤은 "안 보이는 열"이라 없는 것과 같다. */
.gsplit{display:grid;grid-template-columns:minmax(0,1fr) clamp(292px,25vw,348px);
  gap:14px;align-items:start}
/* 300px 폭에서 한국어는 아무 데서나 끊긴다("그려진 / 다.") — 어절 단위로 끊고,
   한 덩어리가 폭을 넘을 때만(긴 id 등) 강제로 자른다 */
.depsum{border:1px solid var(--border);background:var(--panel);padding:13px 15px 12px;
  display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 218px);
  word-break:keep-all;overflow-wrap:break-word}

/* 빈 상태는 폭을 양보한다 — 판(panel)이 아니라 여백 주석(margin note)이 된다.
   막힌 요청이 0건이면 이 레일에는 훑을 목록이 없다. 그런데도 스캔용 폭(348px)과
   판의 무게(보더·배경·그림자)를 그대로 쥐면, 사용자에게는 "빈 창이 그래프를
   밀어냈다"로 읽힌다 — 2차 반려의 원문이 그 '창'이다. 없을 때 두 가지를 내준다:
   ① 폭: 목록을 훑을 폭이 아니라 문장 한 단 폭(≈220px). 캔버스가 그만큼 넓어진다.
   ② 무게: 보더·배경·그림자를 버려 장부 여백에 적은 주석이 된다.
   문구는 그대로 둔다 — 빈 상태는 자기 이유를 말해야 하고(DOC-20260826-009),
   줄이는 것은 자리와 무게지 설명이 아니다. */
.gsplit.empty{grid-template-columns:minmax(0,1fr) clamp(196px,16vw,236px)}
/* 클래스 3개(0,3,0) — [data-skin] .depsum(0,2,0) 의 판 스타일을 스킨마다 끄지 않고 덮는다 */
.gsplit .depsum.empty{border:0;background:none;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  padding:11px 2px 0 4px;max-height:none}
/* 레일을 세울 가로가 없으면 아래로 접힌다 — 그때는 높이를 제한해 캔버스를 지킨다.
   (base .depsum 뒤에 와야 max-height 가 덮인다) */
@media (max-width:1180px){
  .gsplit{grid-template-columns:minmax(0,1fr)}
  .depsum{max-height:44vh}
}
/* 여백 주석은 220px 뿐이라 노트북 폭에서도 캔버스를 크게 해치지 않는다 — 목록이
   있는 레일(1180px)보다 늦게, 900px 아래에서만 아래로 내려온다.
   (.gsplit.empty 는 위 미디어의 .gsplit 보다 특이도가 높아 그대로 남는다) */
@media (max-width:900px){
  .gsplit.empty{grid-template-columns:minmax(0,1fr)}
}
.dshead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.dscount{color:var(--text);font-weight:600}
.dsscope{color:var(--faint)}
.dslead{display:block;margin-top:9px;font-size:12px;color:var(--muted);line-height:1.6}
/* 문장 전체를 경고색으로 칠하면 레일에서 제목보다 크게 외친다 — 잉크는 숫자에만
   얹고 이름은 본문 잉크로 둔다 (색은 글자에, 그것도 겨눈 한 단어에) */
.dslead b{color:var(--text);font-weight:600}
.dslead b.n{color:var(--c-blocked)}
/* 표의 열 이름이 하던 일 — 목록의 두 층이 무엇인지 한 번만 가르친다 */
.dslegend{margin-top:9px;padding-bottom:7px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
.dslegend i{font-style:normal;color:var(--muted)}
/* 스크롤되는 영역은 키보드로도 닿아야 한다 — 목록이 길면 마우스 휠 없이는
   갇힌다(WCAG 2.1.1). tabindex 로 포커스를 받고 화살표 키로 스크롤된다 */
.dsbody{flex:1;min-height:0;overflow:auto;font-size:12px}
.dsbody:focus-visible{outline:1px solid var(--text);outline-offset:-1px}
.dsitem{padding:9px 0;border-bottom:1px solid var(--hairline)}
.dsitem:last-child{border-bottom:0}
.dsreq{line-height:1.5;color:var(--text)}
/* 후행 → 선행은 들여쓰기와 화살표로 — 캔버스의 화살촉과 같은 방향 기호다 */
.dsblk{position:relative;margin-top:6px;padding-left:15px;line-height:1.5;color:var(--text)}
.dsblk::before{content:"↳";position:absolute;left:1px;color:var(--faint)}
.dsitem .cdot{display:inline-block;width:7px;height:7px;margin-right:6px}
.dsitem .ti{color:var(--muted)}
.dsmeta{display:block;margin-top:2px;white-space:normal}
.dsmeta .st{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.dsmeta .num{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:7px}
.dshold{font-family:var(--mono);font-size:10px;color:var(--c-blocked);letter-spacing:.04em;
  margin-left:7px;white-space:nowrap}
.dsempty{margin:10px 0 2px;font-size:12px;color:var(--muted);line-height:1.75}
/* 레일 폭에서 인라인이면 앞 문장의 마지막 글자와 뒤엉켜 끊긴다 — 제 줄을 준다 */
.dsempty code{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;
  color:var(--text);border:1px solid var(--hairline);padding:3px 7px;
  /* 220px 여백 주석 폭에서 한 줄로는 안 들어간다 — 브라우저가 <선행> 한가운데를
     끊게 두지 말고, 플래그 앞에서 우리가 끊는다(줄바꿈은 본문에 있다) */
  white-space:pre-wrap}
.dsnote{margin-top:10px;padding-top:9px;border-top:1px solid var(--hairline);
  font-size:11px;color:var(--muted);line-height:1.6}
.depsum .more{margin-top:10px;align-self:flex-start}

/* Board 상단 병목 한 줄 — 카드가 말할 수 없는 것(한 선행이 여럿을 붙잡음)만 말한다 */
.bneck{margin:-8px 0 18px;font-size:12.5px;color:var(--muted);line-height:1.9}
.bneck .bcap{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--c-blocked)}
.bneck b{color:var(--text);font-weight:600}
.bgo{border:0;background:none;color:var(--muted);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.05em;cursor:pointer;padding:0;margin-left:12px;text-decoration:underline;
  text-underline-offset:3px;text-decoration-style:dotted}
.bgo:hover{color:var(--text)}

/* ------- 상태 전이 액션 (판정 버튼 / 드래그) ------- */
.tdd{font-family:var(--mono);font-size:10px;color:var(--c-inprogress);border:1px solid currentColor;
  padding:0 4px;border-radius:2px}
.tdd.full{color:var(--c-done)}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.livedot.on{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:livepulse 1.6s infinite}
.livedot.off{background:var(--faint)}
/* 간접 신호: 세션은 활동 중이나 이 REQ의 직접 증거 없음 — 비점멸 hollow (REQ-20260823-080) */
.livedot.sess{background:transparent;border:1.5px solid #16a34a}
/* 무인 작업자 기동 중(스폰 후 클레임 전) — 앰버 점멸 (REQ-20260824-008) */
.livedot.spawn{background:#d97706;box-shadow:0 0 0 0 rgba(217,119,6,.6);animation:livepulse 1.6s infinite}
/* 정지등 (REQ-20260825-089): 죽은 워커·멈춘 에이전트. 점멸하지 않는 것이
   핵심이다 — 점멸은 "지금 움직인다"는 뜻이고, 이건 그 반대다. 실패는 사각(정지
   신호의 관습), 정지는 같은 사각의 속 빈 형태로 한 단계 낮춘다. */
.livedot.dot-stopped{border-radius:1px;background:var(--c-blocked);animation:none}
.livedot.dot-stopped.mild{background:transparent;border:1.5px solid var(--c-inprogress)}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 5px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.card:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.col .colempty{padding:14px;color:var(--faint);font-size:11.5px;line-height:1.5}
/* 판정 블록 (REQ-20260825-071): 색면·띠 없이 "무엇을 판정하는가"를 드러낸다 —
   캡션 + 잉크 위계 + 헤어라인. 확인 포인트와 버튼을 한 덩어리로 묶어
   판정 단위가 눈에 잡히게 한다. */
.rvpt{margin-top:7px;font-size:11px;color:var(--muted);line-height:1.5}
/* 캡션은 "무엇을 판정하는가"의 라벨이다 — faint(2.9:1)로는 전 스킨에서 읽히지
   않았다(REQ-20260825-081 점검). 상태 잉크로 올린다: 색은 글자에만, 면 금지. */
.rvcap{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--c-review);font-weight:700;margin-bottom:3px}
.card[data-status="blocked"] .rvcap{color:var(--c-blocked)}
/* 선행 대기 한 줄 (REQ-20260826-009). 상태와 독립된 축이라 blocked 카드가 아닐
   때도 뜬다 — 그래서 캡션을 blocked 잉크로 두어 "이건 상태가 아니라 제약"임을
   말한다. 색은 글자에만, 면·띠 없음. 카드는 한 줄로 잘라 밀도를 지킨다. */
.rvpt.dep{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvpt.dep .rvcap{color:var(--c-blocked)}
/* 판정 카드의 배경 한 줄 (DOC-20260826-015). 확인 포인트 "위에" 무엇에 대한
   건인지 먼저 놓는다 — 순서가 곧 읽는 순서다. 판정 카드에만 붙인다: 모든
   카드에 요약을 깔면 보드가 문장 벽이 된다.
   캡션 잉크는 --muted. 이 블록에서 가장 큰 소리는 '확인 요청'(--c-review)
   하나여야 하니 상태색을 두 번 쓰지 않고, faint(2.9:1)는 캡션 잉크로 이미
   한 번 반려된 값이라 쓰지 않는다(REQ-20260825-081). --muted 는 종이톤
   배경에서 6:1대 — 조용하되 읽힌다. */
.rvpt.what .rvcap{color:var(--muted)}
/* 긴 요약이 컬럼 리듬을 무너뜨리지 않게 2줄에서 자른다 — 카드는 "무슨 건인가"만
   집어주면 되고, 전문은 문서 뷰어의 확인 요청 callout 이 편다. */
.rvpt.what .wtx{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.depmore{color:var(--faint)}
/* 문서 뷰: 카드가 자른 나머지를 전부 펴고, 각 선행으로 건너뛸 수 있게 한다 */
.depcap{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--c-blocked);font-weight:700;margin-bottom:5px}
.depitem{line-height:1.75}
.depitem .cdot{display:inline-block;width:7px;height:7px;margin-right:7px}
/* 담당자 이니셜 링(.av)은 calm 전용 마크다. @이름 표기를 쓰는 스킨에서는
   "@Ssjpark1"처럼 이름에 붙어 오타로 읽힌다 — 기본은 숨기고, 담당자 식별은
   그 스킨의 기존 수단(@마크·이름 pill)이 그대로 맡는다. */
.av{display:none}
.judge{margin-top:9px;padding-top:9px;border-top:1px solid var(--hairline)}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:10.5px;padding:3px 10px;cursor:pointer;letter-spacing:.03em}
.acts button:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.card[draggable="true"]{cursor:grab}
.col.dropok{outline:2px dashed var(--text);outline-offset:-2px;background:var(--accent-soft)}

/* ============ skin: soft — 사이드바 앱 셸 + 라운드 카드 (구조부터 다른 언어) ============ */
[data-skin="soft"] header{position:fixed;left:0;top:0;bottom:0;width:232px;
  display:flex;flex-direction:column;border-right:1px solid var(--border);
  border-bottom:0;background:var(--panel);overflow-y:auto}
[data-skin="soft"] main{margin-left:232px}
[data-skin="soft"] .hrow1{flex-direction:column;align-items:stretch;gap:16px;
  padding:18px 14px 10px}
[data-skin="soft"] .brand{padding-bottom:0;font-size:16px}
[data-skin="soft"] .tabs{flex-direction:column;gap:3px}
[data-skin="soft"] .tabs button{text-align:left;border-bottom:0;border-radius:8px;
  padding:8px 12px;margin:0;font-size:13.5px}
[data-skin="soft"] .tabs button:hover{background:var(--accent-soft)}
[data-skin="soft"] .tabs button.active{background:var(--accent-soft);color:var(--text)}
[data-skin="soft"] .hrow2{flex-direction:column;align-items:stretch;gap:10px;
  padding:12px 14px;border-top:1px solid var(--hairline)}
[data-skin="soft"] .fgroup,[data-skin="soft"] .pgroup{flex-direction:column;
  align-items:stretch;gap:7px}
[data-skin="soft"] .pgroup{border-top:1px solid var(--hairline);padding-top:12px}
/* 사이드바 셸에서는 알림이 필터 아래로 밀려 스크롤 밖에 숨는다 — 탭 바로
   아래(필터 위)로 끌어올린다. 알림은 접히기 전까지 눈에 닿아야 한다. */
[data-skin="soft"] .hrow1{order:0}
[data-skin="soft"] .hrow3{order:1;flex-direction:column;align-items:flex-start;
  gap:7px;padding:12px 14px}
[data-skin="soft"] .hrow2{order:2}
[data-skin="soft"] .oc-act{margin-left:0}
[data-skin="soft"] .oc-copied{min-width:0}
[data-skin="soft"] .pdiv{display:none}
[data-skin="soft"] .pgroup{flex-direction:row;justify-content:space-between}
[data-skin="soft"] .settings-panel{top:auto;bottom:14px;left:14px;right:auto;width:204px}
[data-skin="soft"] .hrow2 input[type="text"],[data-skin="soft"] .hrow2 select{
  width:100%;border-radius:8px}
[data-skin="soft"] .viewer{max-height:none}
[data-skin="soft"] .stats{border:0;background:none;gap:8px}
[data-skin="soft"] .stat{border:1px solid var(--border);border-radius:9px;background:var(--panel)}
[data-skin="soft"] .stat.on{box-shadow:none;border-color:var(--text)}
[data-skin="soft"] .board{border:0;background:none;gap:14px}
[data-skin="soft"] .col{background:var(--accent-soft);border-right:0;border-radius:12px;padding:6px}
[data-skin="soft"] .col h2{border-bottom:0}
[data-skin="soft"] .cards{gap:8px;padding:2px}
/* 좌측 컬러 띠는 사용자 반려로 확정된 금지 패턴 — 제거한다. 띠가 하던 일
   (이 카드의 상태를 즉시 안다)은 컬럼 헤더의 상태 점·이름이 이미 하고 있고,
   포인터를 올렸을 때는 테두리가 상태색으로 물들어 되짚어준다(면 아님·윤곽). */
[data-skin="soft"] .card{background:var(--panel);border-radius:10px;border-bottom:0;
  border:1px solid transparent;
  box-shadow:0 1px 3px rgba(16,24,40,.09);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
[data-skin="soft"] .card:hover{background:var(--panel);transform:translateY(-1px);
  border-color:color-mix(in srgb,var(--sc,var(--border)) 45%,transparent);
  box-shadow:0 4px 10px rgba(16,24,40,.13)}
@media (prefers-reduced-motion: reduce){
  [data-skin="soft"] .card{transition:border-color .12s ease}
  [data-skin="soft"] .card:hover{transform:none}
}
/* 사이드바 셸: 신원·사용량 줄이 nowrap이라 232px 밖으로 밀려 잘리고 가로
   스크롤바가 생겼다 — 좌측 정렬 + 줄바꿈으로 폭 안에 앉힌다. */
[data-skin="soft"] .pgroup.idcol{align-items:flex-start}
[data-skin="soft"] .who,[data-skin="soft"] .usagechip{white-space:normal;
  word-break:break-word;line-height:1.55}
[data-skin="soft"] header{overflow-x:hidden}
[data-skin="soft"] .ccterm{border-radius:10px}
[data-skin="soft"] .badge{background:var(--accent-soft);border-radius:5px;padding:1px 7px}
[data-skin="soft"] .badge::before{content:""}
[data-skin="soft"] .docs,[data-skin="soft"] .audit,[data-skin="soft"] .graphwrap,[data-skin="soft"] .depsum,
[data-skin="soft"] .streamwrap{border-radius:12px;overflow:hidden}
[data-skin="soft"] .term{border-radius:10px}
[data-skin="soft"] .hovercard{border-radius:10px;border-color:var(--border);
  box-shadow:0 4px 14px rgba(0,0,0,.16)}
[data-skin="soft"] .kind{background:color-mix(in srgb,var(--kc) 12%,transparent);
  border-radius:5px;padding:1px 8px}
[data-skin="soft"] .kind::before{content:none}
[data-skin="soft"] .more{border:1px dashed var(--border);border-radius:8px;text-align:center}
[data-skin="soft"] .more::before{content:""}
[data-skin="soft"] .doclist .row.sel{box-shadow:inset 3px 0 0 var(--text)}

/* ============ skin: terminal — 브루탈리스트 모노 디자인 언어 ============ */
[data-skin="terminal"] body,[data-skin="terminal"] .card .t,
[data-skin="terminal"] .viewer h1,[data-skin="terminal"] .tabs button,
[data-skin="terminal"] .doclist .row>div:nth-child(3),
[data-skin="terminal"] .hovercard .ht,[data-skin="terminal"] .backlinks .bl{
  font-family:var(--mono);letter-spacing:0}
[data-skin="terminal"] body{font-size:12.5px}
[data-skin="terminal"] header{border-bottom:2px solid var(--text)}
[data-skin="terminal"] .tabs button{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
[data-skin="terminal"] .tabs button.active{background:var(--text);color:var(--bg);
  border-bottom-color:transparent}
[data-skin="terminal"] .viewer h1{font-size:17px}
[data-skin="terminal"] .viewer h1::before{content:"> "}
[data-skin="terminal"] .card:hover,[data-skin="terminal"] .doclist .row:hover{
  background:var(--text)}
[data-skin="terminal"] .card:hover *,[data-skin="terminal"] .doclist .row:hover *{
  color:var(--bg) !important}
[data-skin="terminal"] .typebar .tb.on{background:var(--text);color:var(--bg);
  border-bottom-color:transparent}
/* 선택 상태는 배경이 잉크로 반전된다 — 그 위에서 타입색 잉크는 대비를 잃는다.
   미답은 색을 잃어도 '미답'이라는 글자가 뜻을 그대로 나른다(색 없이도 구분되는
   것이 원칙이다) — 가독성을 택한다. 색 강조는 비선택 상태에서 일한다. */
[data-skin="terminal"] .typebar .tb.on b,
[data-skin="terminal"] .typebar .tb.on .unans{color:var(--bg)}
[data-skin="terminal"] .doclist .row.sel{background:var(--text);box-shadow:none}
[data-skin="terminal"] .doclist .row.sel *{color:var(--bg) !important}
/* 반전된 행 위에서는 링도 반전한다 — 잉크 배경에 잉크 링은 없는 것과 같다.
   뜻("실선 = 지금 여기")은 그대로 두고 색만 뒤집는다 (REQ-20260827-013,
   실브라우저 캡처로 발견). 열린 행이 곧 포커스 행인 순간이 기본값이라
   그냥 두면 터미널 스킨에서는 키보드가 어디 있는지 보이지 않는다. */
[data-skin="terminal"] .doclist .row.sel:focus-visible,
[data-skin="terminal"] .doclist .row:hover:focus-visible{outline-color:var(--bg)}
[data-skin="terminal"] .stat.on{background:var(--text);color:var(--bg);box-shadow:none}
[data-skin="terminal"] .stat.on b{color:var(--bg)}
[data-skin="terminal"] .brand .dot{width:9px;height:14px;animation:s9blink 1.1s steps(1) infinite}
@keyframes s9blink{50%{opacity:0}}

/* ============ skin: glass — frosted 레이어 + 앰비언트 컬러 필드 (2026-08-23 사용자 번복으로 부활)
   ledger의 정반대 언어: 반투명 패널 + backdrop blur, 은은한 그라데이션 배경, 라운드/부드러운 그림자.
   색은 tone 토큰(color-mix)에서만 파생 — 4개 tone 어디서든 성립. ============ */
[data-skin="glass"]{
  --gl-panel:color-mix(in srgb, var(--panel) 62%, transparent);
  --gl-card:color-mix(in srgb, var(--panel) 52%, transparent);
  --gl-solid:color-mix(in srgb, var(--panel) 90%, transparent);
  --gl-line:color-mix(in srgb, var(--text) 16%, transparent);
  --gl-hairline:color-mix(in srgb, var(--text) 9%, transparent);
  --gl-tint:color-mix(in srgb, var(--text) 9%, transparent);
  --gl-shadow:0 14px 38px -16px color-mix(in srgb, var(--text) 35%, transparent);
}
[data-skin="glass"] body{
  background:
    radial-gradient(62% 50% at 10% -4%, color-mix(in srgb, var(--c-open) 44%, transparent), transparent 72%),
    radial-gradient(54% 46% at 92% 4%,  color-mix(in srgb, var(--c-review) 38%, transparent), transparent 72%),
    radial-gradient(50% 42% at 80% 92%, color-mix(in srgb, var(--c-inprogress) 26%, transparent), transparent 74%),
    radial-gradient(64% 54% at 18% 104%, color-mix(in srgb, var(--c-done) 34%, transparent), transparent 74%),
    var(--bg);
  background-attachment:fixed;
}
[data-skin="glass"] header{
  background:color-mix(in srgb, var(--bg) 52%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--gl-line)}
[data-skin="glass"] .tabs{gap:6px}
[data-skin="glass"] .tabs button{border-bottom:0;border-radius:999px;
  padding:6px 14px;margin:0 0 8px}
[data-skin="glass"] .tabs button:hover{background:color-mix(in srgb, var(--text) 6%, transparent)}
[data-skin="glass"] .tabs button.active{background:var(--gl-tint);color:var(--text)}
[data-skin="glass"] .hrow2,[data-skin="glass"] .hrow3{border-top-color:var(--gl-hairline)}
/* 패널 = 떠 있는 유리판: 반투명 + blur + 라운드 + 부드러운 그림자 */
[data-skin="glass"] .stats,[data-skin="glass"] .board,[data-skin="glass"] .docs,
[data-skin="glass"] .audit,[data-skin="glass"] .graphwrap,[data-skin="glass"] .depsum,[data-skin="glass"] .streamwrap,
[data-skin="glass"] .proj-info,[data-skin="glass"] .mystrip{
  background:var(--gl-panel);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--gl-line);border-radius:14px;box-shadow:var(--gl-shadow)}
[data-skin="glass"] .docs,[data-skin="glass"] .audit,[data-skin="glass"] .graphwrap,[data-skin="glass"] .depsum,
[data-skin="glass"] .streamwrap{overflow:hidden}
[data-skin="glass"] .stats{overflow:hidden}
[data-skin="glass"] .stat{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .stat:hover{background:var(--gl-tint)}
[data-skin="glass"] .stat.on{background:var(--gl-tint);box-shadow:none}
/* Board: 레저 행 대신 유리 칩 카드 */
[data-skin="glass"] .col{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .col h2{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .cards{gap:8px;padding:8px}
[data-skin="glass"] .card{background:var(--gl-card);border:1px solid var(--gl-hairline);
  border-radius:11px;box-shadow:0 4px 16px -10px color-mix(in srgb, var(--text) 30%, transparent)}
[data-skin="glass"] .card:hover{background:var(--gl-solid)}
[data-skin="glass"] .col .more{padding-left:22px}
[data-skin="glass"] .doclist{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .doclist .grp{background:var(--gl-solid);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .typebar{background:var(--gl-solid);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom-color:var(--gl-line)}
[data-skin="glass"] .doclist .row{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .doclist .row:hover,[data-skin="glass"] .doclist .row.sel,
[data-skin="glass"] .card:hover,[data-skin="glass"] .urow:hover,
[data-skin="glass"] .mystrip .ms-row:hover,[data-skin="glass"] .mystrip .ms-row.sel,
[data-skin="glass"] .backlinks .bl:hover{background:var(--gl-tint)}
[data-skin="glass"] .audit tr:hover td{background:var(--gl-tint)}
[data-skin="glass"] .audit td,[data-skin="glass"] .metatbl td{border-bottom-color:var(--gl-hairline)}
/* 컨트롤: 라운드 + 반투명 */
[data-skin="glass"] .hrow2 input[type="text"],[data-skin="glass"] .hrow2 select,
[data-skin="glass"] .settings-panel select,[data-skin="glass"] .uf,
[data-skin="glass"] .uform input,[data-skin="glass"] .uform select,
[data-skin="glass"] .uform button,[data-skin="glass"] .gear,
[data-skin="glass"] .acts button,[data-skin="glass"] .gmode,
[data-skin="glass"] .pi-x{border-radius:9px;
  background:var(--gl-card);border-color:var(--gl-line)}
[data-skin="glass"] .gmode.on,[data-skin="glass"] .gear:hover,
[data-skin="glass"] .acts button:hover,[data-skin="glass"] .uform button:hover{
  background:var(--text);color:var(--bg);border-color:transparent}
[data-skin="glass"] .settings-panel{background:var(--gl-panel);
  -webkit-backdrop-filter:blur(20px) saturate(1.25);
  backdrop-filter:blur(20px) saturate(1.25);
  border-radius:14px;border-color:var(--gl-line);box-shadow:var(--gl-shadow)}
[data-skin="glass"] .hovercard{background:var(--gl-solid);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:12px;border-color:var(--gl-line);box-shadow:var(--gl-shadow)}
[data-skin="glass"] .proj-info{border-color:var(--gl-line)}
[data-skin="glass"] .term{background:rgba(13,17,22,.92)}
[data-skin="glass"] .ccterm{border-radius:14px;border-color:var(--gl-line)}
[data-skin="glass"] .ghint{background:var(--gl-solid);border-color:var(--gl-hairline);
  border-radius:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
[data-skin="glass"] .legend{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .md pre{border-radius:8px;border-left-color:var(--gl-line)}
[data-skin="glass"] .kind{background:color-mix(in srgb, var(--kc) 13%, transparent);
  border-radius:6px;padding:1px 8px}
[data-skin="glass"] .kind::before{content:none}
[data-skin="glass"] .more{border-radius:8px}
[data-skin="glass"] .more:hover{background:var(--gl-tint);text-decoration:none;
  color:var(--text)}

/* ============ skin: field — 강한 컬러 필드 + 플랫 패널 ============
   glass의 안개를 훨씬 밀어붙인 선명한 앰비언트 그라운드 — 그 위에 불투명·플랫한
   패널이 또렷이 앉는다. 블러·그림자·반투명 없음: 채색 지면 vs 백색 판의 대비가 언어.
   축: 배경 분위기(강) + 깊이(플랫으로 반전) + 셸(여백·컬럼 분리).
   필드는 tone의 상태색·--bg에서만 파생(color-mix) — 4 tone 성립. 토큰 재정의 없음. */
[data-skin="field"]{
  --fd-line:color-mix(in srgb, var(--text) 24%, transparent);
  --fd-hair:color-mix(in srgb, var(--text) 10%, transparent);
  --fd-field:
    radial-gradient(58% 66% at 6% 0%,  color-mix(in srgb, var(--c-open) 68%, transparent), transparent 76%),
    radial-gradient(52% 60% at 98% 2%, color-mix(in srgb, var(--c-review) 62%, transparent), transparent 74%),
    radial-gradient(48% 56% at 92% 100%, color-mix(in srgb, var(--c-inprogress) 55%, transparent), transparent 76%),
    radial-gradient(58% 62% at 2% 100%, color-mix(in srgb, var(--c-done) 60%, transparent), transparent 76%),
    linear-gradient(155deg, color-mix(in srgb, var(--c-open) 34%, var(--bg)) 0%,
      color-mix(in srgb, var(--c-review) 30%, var(--bg)) 48%,
      color-mix(in srgb, var(--c-done) 26%, var(--bg)) 100%);
}
[data-skin="field"] body{background:var(--fd-field);background-attachment:fixed}
/* 헤더도 같은 fixed 필드 — 지면과 이음새 없이 이어진다 (블러 없이 sticky 성립) */
[data-skin="field"] header{background:var(--fd-field);background-attachment:fixed;
  border-bottom:1px solid var(--fd-line)}
[data-skin="field"] main{padding:26px clamp(22px, 4vw, 64px)}
[data-skin="field"] .count{color:var(--text)}
/* 탭 잉크는 투명도를 섞지 않는다 — 채도 높은 지면 위에서 76%로 흐리면 라이트
   tone 좌측(가장 짙은 필드)에서 3.8:1까지 떨어졌다 (REQ-20260825-081 실측).
   전량 --text로 올려 최소 4.5:1을 확보하고, 활성/비활성 위계는 투명도가 아니라
   굵기와 "지면 위로 올라온 백색 칩"이 만든다. */
[data-skin="field"] .tabs button{color:var(--text);font-weight:500}
[data-skin="field"] .tabs button:hover{color:var(--text);text-decoration:underline;
  text-underline-offset:4px}
/* 활성 탭 = 지면 위 백색 판이 헤더까지 올라온 칩 */
[data-skin="field"] .tabs button.active{background:var(--panel);color:var(--text);
  font-weight:700;text-decoration:none;border-bottom-color:transparent}
[data-skin="field"] .hrow2{background:var(--panel);border-top:0;
  border-bottom:1px solid var(--fd-line)}
[data-skin="field"] .hrow2 input[type="text"],[data-skin="field"] .hrow2 select{
  border-color:var(--fd-line)}
/* 알림 줄도 hrow2와 같은 백색 판 위에 둔다 — 고채도 필드 위 앰버는 대비가 무너진다 */
[data-skin="field"] .hrow3{background:var(--panel);border-top:1px solid var(--fd-line);
  border-bottom:1px solid var(--fd-line)}
[data-skin="field"] .chk{color:var(--muted)}
[data-skin="field"] .pdiv{background:var(--fd-line)}
[data-skin="field"] .stats,[data-skin="field"] .docs,[data-skin="field"] .audit,
[data-skin="field"] .graphwrap,[data-skin="field"] .depsum,[data-skin="field"] .streamwrap,
[data-skin="field"] .proj-info,[data-skin="field"] .mystrip{border-color:var(--fd-line)}
/* Board: 패널 상자를 버리고 컬럼 자체가 지면 위 백색 판 — 판 사이로 필드가 흐른다 */
[data-skin="field"] .board{background:transparent;border:0;gap:16px;padding-bottom:4px}
[data-skin="field"] .col,[data-skin="field"] .col:last-child{
  background:var(--panel);border:1px solid var(--fd-line)}
[data-skin="field"] .ghint{border-color:var(--fd-hair)}

/* ============ skin: cobalt — 컬러 헤더 밴드 셸 ============
   상단을 짙은 코발트 밴드(브랜드·탭 백색 잉크)로 바꾼 클래식 프로 SaaS 셸.
   축: 셸 구조(밴드 2단) + 배경(밴드 색) + 모양(라운드 10px 카드 그리드).
   밴드색은 --c-open을 black으로 눌러 파생 — 어느 tone에서도 백색 잉크 대비 성립. */
[data-skin="cobalt"]{
  --cb-band:color-mix(in srgb, var(--c-open) 66%, black);
  --cb-band2:color-mix(in srgb, var(--c-open) 52%, black);
  --cb-ink:#ffffff;
  --cb-ink-dim:rgba(255,255,255,.72);
  --cb-edge:rgba(255,255,255,.16);
}
[data-skin="cobalt"] header{background:var(--cb-band);border-bottom:0}
[data-skin="cobalt"] .hrow1{padding:16px 24px 0}
[data-skin="cobalt"] .brand{color:var(--cb-ink);font-size:16px}
[data-skin="cobalt"] .brand .dot{background:var(--cb-ink)}
[data-skin="cobalt"] .tabs button{color:var(--cb-ink-dim);border-bottom-width:3px;
  padding:6px 13px 13px}
[data-skin="cobalt"] .tabs button:hover{color:var(--cb-ink)}
[data-skin="cobalt"] .tabs button.active{color:var(--cb-ink);border-bottom-color:var(--cb-ink)}
[data-skin="cobalt"] header button:focus-visible{outline-color:var(--cb-ink)}
[data-skin="cobalt"] .hrow2{background:var(--cb-band2);border-top:1px solid var(--cb-edge)}
[data-skin="cobalt"] .hrow2 input[type="text"],[data-skin="cobalt"] .hrow2 select{
  border-color:transparent;border-radius:7px}
