<!doctype html>
<html lang="ko" data-theme="system" data-skin="ledger" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section9</title>
<style>
:root{
  --bg:#fafaf8; --panel:#ffffff; --border:#d8d8d3; --hairline:#e9e9e5;
  --text:#141518; --muted:#5c6470; --faint:#9096a0;
  --accent:#141518; --accent-soft:#f0f0ec; --accent-line:#141518;
  --r:0;
  --c-draft:#868c96; --c-open:#1d4ed8; --c-inprogress:#b45309; --c-blocked:#b91c1c;
  --c-review:#6d28d9; --c-done:#047857; --c-cancelled:#868c96; --c-published:#0f766e;
  --t-request:#1d4ed8; --t-knowledge:#0f766e; --t-session:#92400e;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
/* 테마: system(OS 추종) / paper(라이트 고정=기본 토큰) / carbon(다크 고정) / phosphor(CRT) */
@media (prefers-color-scheme: dark){
  :root[data-theme="system"]{
    --bg:#111214; --panel:#17181b; --border:#33353a; --hairline:#232529;
    --text:#e8e8e4; --muted:#9aa0aa; --faint:#5f646d;
    --accent:#e8e8e4; --accent-soft:#222327; --accent-line:#e8e8e4;
    --c-open:#5b8def; --c-inprogress:#d99537; --c-blocked:#e05d5d;
    --c-review:#a582e8; --c-done:#3fa583; --c-published:#3d9d96;
    --t-request:#5b8def; --t-knowledge:#3d9d96; --t-session:#c08a4e;
  }
}
:root[data-theme="carbon"]{
  --bg:#111214; --panel:#17181b; --border:#33353a; --hairline:#232529;
  --text:#e8e8e4; --muted:#9aa0aa; --faint:#5f646d;
  --accent:#e8e8e4; --accent-soft:#222327; --accent-line:#e8e8e4;
  --c-open:#5b8def; --c-inprogress:#d99537; --c-blocked:#e05d5d;
  --c-review:#a582e8; --c-done:#3fa583; --c-published:#3d9d96;
  --t-request:#5b8def; --t-knowledge:#3d9d96; --t-session:#c08a4e;
}
:root[data-theme="phosphor"]{
  --bg:#0a0e0a; --panel:#0d120d; --border:#2b3a2b; --hairline:#1a231a;
  --text:#b9e2b2; --muted:#79a674; --faint:#4b6f49;
  --accent:#b9e2b2; --accent-soft:#131b13; --accent-line:#b9e2b2;
  --c-draft:#5f7f5c; --c-open:#5b9bd5; --c-inprogress:#d9b13b; --c-blocked:#e06c5d;
  --c-review:#b78ee0; --c-done:#55c07a; --c-cancelled:#5f7f5c; --c-published:#46b39a;
  --t-request:#5b9bd5; --t-knowledge:#46b39a; --t-session:#c9a35a;
}
*{box-sizing:border-box}
::selection{background:var(--text);color:var(--bg)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--border)}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}
*::-webkit-scrollbar-track{background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:1px solid var(--text);outline-offset:1px}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;-webkit-font-smoothing:antialiased}

/* ------- header: 2행 구조 — 1행 브랜드/탭, 2행 툴바(필터 좌 · 환경설정 우) ------- */
header{background:var(--bg);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10}
.hrow1{display:flex;align-items:baseline;gap:26px;padding:14px 22px 0}
.brand{font-size:15px;font-weight:700;letter-spacing:.02em;padding-bottom:12px}
.brand .dot{display:inline-block;width:8px;height:8px;background:var(--text);margin-right:8px}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:4px 12px 13px;cursor:pointer;
  font-size:13px;color:var(--muted);font-family:inherit;letter-spacing:.01em;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.hrow2{display:flex;gap:14px;align-items:center;justify-content:space-between;
  flex-wrap:wrap;padding:8px 22px;border-top:1px solid var(--hairline)}
.fgroup,.pgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* whoami 라벨 — 서버 파생 신원 표시 전용 (선택 UI 아님, REQ-20260824-027) */
.who{font-family:var(--mono);font-size:10px;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
.who b{color:var(--text);font-weight:600}
.who.warn{color:var(--c-blocked);white-space:normal}
.who.warn code{font-family:var(--mono);border:1px solid var(--hairline);padding:0 3px}
.who .as{color:var(--c-review)}
.pdiv{width:1px;height:18px;background:var(--border);margin:0 4px}
.gear{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-size:14px;line-height:1;padding:4px 9px;cursor:pointer}
.gear:hover{background:var(--text);color:var(--bg)}
.settings{position:fixed;inset:0;z-index:50}
.settings-panel{position:absolute;top:92px;right:22px;width:290px;
  background:var(--panel);border:1px solid var(--text);padding:14px 16px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.settings-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:600;font-family:var(--mono);
  display:flex;justify-content:space-between;align-items:baseline}
.settings-h span{font-size:11px;color:var(--text);text-transform:none;letter-spacing:0}
.settings-panel label{display:flex;flex-direction:column;gap:4px;font-size:11px;
  color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.settings-panel select{border:1px solid var(--border);padding:6px 9px;font-size:12.5px;
  background:var(--panel);color:var(--text);font-family:inherit;text-transform:none;letter-spacing:0}
.settings-note{font-size:11px;color:var(--faint);margin:2px 0 0;line-height:1.5}
/* 프로젝트 정보 패널 — 계기판/장부 스타일(둥근모서리·pill 금지) */
.proj-info{border:1px solid var(--text);background:var(--panel);margin:0 0 14px;
  padding:12px 14px;display:grid;gap:10px}
.proj-info[hidden]{display:none}  /* display:grid가 UA [hidden] 규칙을 덮어써 빈 박스가 남던 버그 수정 */
.proj-info .pi-head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--hairline);padding-bottom:8px;gap:12px;flex-wrap:wrap}
.proj-info .pi-title{font-size:14px;font-weight:600}
.proj-info .pi-slug{font-family:var(--mono);font-size:11px;color:var(--faint)}
.proj-info .pi-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.proj-info .pi-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;
  font-size:12px;align-items:baseline}
.proj-info .pi-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint)}
.proj-info .pi-v{color:var(--text)}
.proj-info table{border-collapse:collapse;width:100%;font-size:12px}
.proj-info th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);font-weight:600;
  border-bottom:1px solid var(--hairline);padding:3px 10px 5px 0}
.proj-info td{padding:4px 10px 4px 0;border-bottom:1px solid var(--hairline)}
.proj-info .m-role{font-family:var(--mono);font-size:11px;color:var(--muted)}
.proj-info .m-exp{color:var(--c-blocked);font-family:var(--mono);font-size:10.5px}
.proj-info .m-act{color:var(--c-done);font-family:var(--mono);font-size:10.5px}
.hrow2 input[type="text"],.hrow2 select{border:1px solid var(--border);
  padding:5px 9px;font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
.hrow2 input[type="text"]{width:190px;font-family:var(--mono)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  cursor:pointer;user-select:none}
.chk input{accent-color:var(--text)}
.chk:has(input:disabled){opacity:.45;cursor:not-allowed}

/* MY PROJECTS 레저 스트립 — '내 것만' 토글 ON일 때 #proj-info 자리 위에 표시
   (DOC-20260823-006 권고안 B). 배지·pill·라운드·그림자 금지 — 선과 타이포만. */
/* 헤더 계정·사용량 칩 (REQ-20260824-043) — 60s 폴, 색은 임계 신호만 */
.usagechip{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  white-space:nowrap;letter-spacing:.02em}
/* 클로드 계정(사용량)과 하네스 신원을 두 줄로 분리 — 가독 (2026-08-24 채팅 요청) */
.pgroup.idcol{flex-direction:column;align-items:flex-end;gap:2px}
.usagechip .warn{color:var(--c-inprogress);font-weight:600}
.usagechip .crit{color:var(--c-blocked);font-weight:600}
.mystrip{border:1px solid var(--border);background:var(--panel);margin:0 0 14px}
.mystrip[hidden]{display:none}
.mystrip .ms-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 14px;border-bottom:1px solid var(--hairline);font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mystrip .ms-row{display:flex;width:100%;align-items:baseline;gap:10px;flex-wrap:wrap;
  border:0;border-bottom:1px solid var(--hairline);background:none;text-align:left;
  cursor:pointer;font-family:inherit;color:var(--text);padding:9px 14px}
.mystrip .ms-row:hover{background:var(--accent-soft)}
.mystrip .ms-row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--text)}
.mystrip .ms-row:focus-visible{outline:1px solid var(--text);outline-offset:-1px}
.mystrip .ms-t{font-size:13px;font-weight:600}
.mystrip .ms-slug{font-family:var(--mono);font-size:11px;color:var(--faint)}
.mystrip .ms-role{font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-left:auto}
.mystrip .ms-until{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mystrip .ms-until.soon{color:var(--c-inprogress)}  /* until ≤14일 임박 — 색은 보조 신호 */
.mystrip .ms-note{padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.mystrip .more{padding-left:14px}
.proj-info .m-me{font-family:var(--mono);font-size:10px;color:var(--muted)}
.proj-info .m-me-name{font-weight:600}
/* 멤버 관리(manage 권한 me) — 인라인 편집 컨트롤: 플랫, 모노, 헤어라인 */
.proj-info select,.proj-info input{border:1px solid var(--hairline);background:var(--panel);
  color:var(--text);font-family:var(--mono);font-size:11px;padding:2px 4px;border-radius:0}
.proj-info select:focus,.proj-info input:focus{outline:none;border-color:var(--text)}
.proj-info input[type="date"]{width:118px}
.proj-info .pi-x{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:10.5px;padding:2px 8px;cursor:pointer;letter-spacing:.03em}
.proj-info .pi-x:hover:not(:disabled){background:var(--text);color:var(--bg);border-color:var(--text)}
.proj-info .pi-x:disabled{color:var(--faint);cursor:not-allowed}
.proj-info .pi-addrow td{border-bottom:0;border-top:1px solid var(--border);padding-top:6px}
.proj-info .pi-err{font-family:var(--mono);font-size:10.5px;color:var(--c-blocked);margin-top:6px}

main{padding:18px 22px}
.count{color:var(--faint);font-size:11px;margin:0 0 14px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.06em}
.more{display:block;width:100%;border:0;background:none;color:var(--faint);
  padding:7px 0;cursor:pointer;font-size:11.5px;font-family:var(--mono);text-align:left}
.more:hover{color:var(--text);text-decoration:underline}
.more::before{content:"+ "}

/* ------- stats: 텍스트 계기줄 ------- */
.stats{display:flex;gap:0;flex-wrap:wrap;margin:0 0 18px;border:1px solid var(--border);
  background:var(--panel)}
.stat{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-size:11px;
  color:var(--muted);cursor:pointer;font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.05em;border-right:1px solid var(--hairline)}
.stat b{color:var(--text);font-size:15px;font-weight:600}
.stat .cdot{width:7px;height:7px;background:var(--sc)}
.stat:hover{background:var(--accent-soft)}
.stat.on{box-shadow:inset 0 -2px 0 var(--text);color:var(--text)}

/* ------- board: hairline 레저 ------- */
.board{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-bottom:10px;
  border:1px solid var(--border);background:var(--panel)}
.col{min-width:252px;width:252px;flex:none;border-right:1px solid var(--hairline);
  padding:0 0 10px}
.col:last-child{border-right:0}
.col h2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:0;
  padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:600;
  color:var(--muted);border-bottom:1px solid var(--hairline);font-family:var(--mono)}
.col h2 .cdot{width:7px;height:7px;background:var(--sc)}
.col h2 .n{margin-left:auto;font-weight:400;color:var(--faint)}
.cards{display:flex;flex-direction:column;min-height:20px}
.card{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--hairline);position:relative}
.card:hover{background:var(--accent-soft)}
.card .id{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em}
.card .t{margin:3px 0 6px;font-weight:600;line-height:1.45;font-size:13.5px;letter-spacing:-.01em;
  padding-right:56px}
.card .m{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);
  font-family:var(--mono);align-items:baseline}
.elapsed{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;
  color:var(--sc,var(--muted));white-space:nowrap}
.elapsed::before{content:"⏱ "}
.urow{padding:7px 0;border-bottom:1px solid var(--hairline);cursor:pointer;font-size:13px}
.urow:hover{background:var(--accent-soft)}
.urow .st{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase}
.badge{color:var(--text);font-family:var(--mono);font-size:11px}
.badge::before{content:"@"}
.size{color:var(--faint)}
.tag{color:var(--faint)}
.col .more{padding-left:14px}

/* ------- docs ------- */
.docs{display:flex;gap:0;align-items:flex-start;border:1px solid var(--border);background:var(--panel)}
.doclist{width:330px;flex:none;border-right:1px solid var(--border);
  max-height:calc(100vh - 150px);overflow-y:auto}
.doclist .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding:13px 14px 6px;font-weight:600;position:sticky;top:0;background:var(--panel);
  font-family:var(--mono);border-bottom:1px solid var(--hairline)}
.doclist .row{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--hairline)}
.doclist .row:hover{background:var(--accent-soft)}
.doclist .row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--text)}
.doclist .row .id{font-family:var(--mono);font-size:10px;color:var(--faint)}
.doclist .row .st{float:right;font-size:10px;color:var(--sc,var(--muted));
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.doclist .row>div:nth-child(3){font-size:13px;margin-top:1px}
.viewer{flex:1;padding:24px 34px;min-height:300px;max-height:calc(100vh - 150px);overflow-y:auto}
.viewer .empty{color:var(--faint);font-family:var(--mono);font-size:12px}
.viewer h1{letter-spacing:-.015em;font-size:21px}
.metatbl{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:12.5px;
  border-top:1px solid var(--border)}
.metatbl td{border-bottom:1px solid var(--hairline);padding:7px 10px 7px 0;vertical-align:top}
.metatbl td:first-child{color:var(--faint);width:150px;white-space:nowrap;
  font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);
  padding-top:9px}
.md h2{border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:30px;
  font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.md h3{font-size:13px;color:var(--muted);margin-top:20px;font-family:var(--mono)}
.md pre{background:var(--accent-soft);border-left:2px solid var(--border);
  padding:11px 14px;overflow-x:auto;font-size:12px}
.md code{background:var(--accent-soft);padding:1px 5px;font-family:var(--mono);font-size:12px}
.md pre code{background:none;padding:0}
.md a{color:var(--text)}
.md li{margin:3px 0}
a.doclink{color:var(--text);cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px;font-family:var(--mono);font-size:.92em}
.path{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.snip{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  padding:2px 0 2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snip b{color:var(--text);font-weight:700;background:var(--accent-soft)}
.reqstream summary{cursor:pointer;font-weight:600;font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);padding:14px 0 8px;margin-top:28px;list-style:none;
  text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.reqstream summary::before{content:"▸ ";color:var(--faint)}
.reqstream[open] summary::before{content:"▾ "}
.reqstream .term{max-height:440px;margin-top:8px}

/* ------- audit: 레저 테이블 ------- */
.audit{border:1px solid var(--border);background:var(--panel)}
.audit .cap{padding:10px 16px;border-bottom:1px solid var(--border);font-size:11.5px;
  color:var(--muted)}
.audit .tblwrap{overflow-x:auto}
.audit table{width:100%;border-collapse:collapse;font-size:12.5px}
.audit th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--border);
  white-space:nowrap;font-family:var(--mono);font-weight:600}
.audit td{padding:7px 14px;border-bottom:1px solid var(--hairline);vertical-align:top}
.audit tr:hover td{background:var(--accent-soft)}
.audit td.ts{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;
  white-space:nowrap;color:var(--kc);font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.06em}
.kind::before{content:"";width:6px;height:6px;background:var(--kc);display:inline-block}
.audit .more{padding:10px 14px}

/* ------- backlinks ------- */
.backlinks{border-top:1px solid var(--border);margin-top:28px;padding-top:14px}
.backlinks h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px;font-weight:600;font-family:var(--mono)}
.backlinks .bl{padding:6px 0;cursor:pointer;font-size:13px;border-bottom:1px solid var(--hairline)}
.backlinks .bl:hover{background:var(--accent-soft)}
.backlinks .bl .id{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:10px}

/* ------- stream 터미널 ------- */
.streamwrap{display:flex;gap:0;align-items:flex-start;border:1px solid var(--border);
  background:var(--panel)}
.streamwrap .doclist{border-right:1px solid var(--border)}
.term{flex:1;background:#101418;color:#cfd8e3;padding:16px 20px;
  max-height:calc(100vh - 150px);overflow-y:auto;
  font-family:var(--mono);font-size:12px;line-height:1.55}
.term .ev{margin:11px 0;white-space:pre-wrap;word-break:break-word}
.term .ev.agent{opacity:.7;padding-left:12px;border-left:1px solid #3a4655}
.term .hd{font-weight:600}
.term details summary{cursor:pointer;list-style:none}
.term details summary::before{content:"▸ "}
.term details[open] summary::before{content:"▾ "}
.term .meta{color:#5c6878;font-size:11px}
.term mark.reqhl{background:#d97706;color:#101418;padding:0 2px;border-radius:0}

/* ------- terminal 탭 (REQ-20260824-037) — Claude Code CLI 재현.
   .term처럼 테마 무관 상시 다크 + CC 팔레트. 라운드/그림자 0 (터미널이므로 당연). ------- */
.ccterm{--cc-bg:#1b1c1e;--cc-text:#e8e8e4;--cc-dim:#8a8f98;--cc-faint:#5c626c;
  --cc-green:#4ec97a;--cc-cyan:#56c8d8;--cc-yellow:#e5c07b;--cc-red:#e06c75;
  --cc-border:#3a3d44;
  background:var(--cc-bg);color:var(--cc-text);border:1px solid var(--border);
  display:flex;flex-direction:column;height:calc(100vh - 168px);
  font-family:var(--mono);font-size:12.5px;line-height:1.7;
  font-variant-ligatures:none;letter-spacing:0}
.ccout{flex:1;overflow-y:auto;padding:16px 20px}
.ccout .ln{display:flex;gap:9px;margin:0 0 13px}
.ccout .ln .g{flex:none;width:14px;text-align:left;user-select:none}
.ccout .ln .b{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.ccout .ln.sub{margin:-9px 0 13px;color:var(--cc-dim)}   /* ⎿ 연속줄 — 앞 줄에 붙는다 */
.ccout .ln.sub .g{color:var(--cc-faint)}
.ccout .ln.ccdim{color:var(--cc-dim)}
.ccstatus .ccagrow{cursor:pointer}
.ccstatus .ccagrow.sel{background:rgba(78,201,122,.08)}
.ccstatus .ccagrow.sel b{color:var(--cc-green)}
.ccstatus .ccmain.dim{opacity:.5}
.ccstatus .ccagrow:hover{background:rgba(255,255,255,.04)}
.ccstatus .ccmain{cursor:pointer}
.ccstatus .ccrc{text-decoration:underline;cursor:help}
.ccout .ln.pending{opacity:.55}
.ccterm .ccprompt{color:var(--cc-text)}
.ccterm .cccode{background:rgba(255,255,255,.09);padding:0 4px}
.ccterm details summary{cursor:pointer;list-style:none;display:inline}
.ccterm details summary::-webkit-details-marker{display:none}
.ccterm details summary::after{content:" [+]";color:var(--cc-faint)}
.ccterm details[open] summary::after{content:" [\2212]"}
.ccterm details .full{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.ccerr{border-top:1px solid var(--cc-border);color:var(--cc-red);
  padding:7px 20px;font-size:12px}
.ccinputrow{display:flex;gap:9px;align-items:flex-start;
  border-top:1px solid var(--cc-border);padding:11px 20px}
.ccinputrow .ccp{flex:none;color:var(--cc-text)}
.ccinputrow textarea{flex:1;border:0;background:none;color:var(--cc-text);
  font:inherit;line-height:1.7;padding:0;margin:0;resize:none;outline:none;
  overflow:hidden;display:block}
.ccinputrow textarea::placeholder{color:var(--cc-faint)}
.ccinputrow textarea:disabled{opacity:.5}
.ccstatus{padding:4px 20px 12px;font-size:12px;line-height:1.85}
.ccstatus .ccs1{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.ccstatus .ccmode{font-weight:600;color:var(--cc-yellow)}
.ccstatus .ccok{color:var(--cc-green)}
.ccstatus .ccwarn{color:var(--cc-red)}
.ccstatus .cccyan{color:var(--cc-cyan)}
.ccstatus .ccs1 .r{color:var(--cc-dim);text-decoration:underline;text-underline-offset:3px}
.ccstatus .ag{display:flex;gap:9px}
.ccstatus .ag .g{flex:none;width:14px}
.ccstatus .ag .r{margin-left:auto;color:var(--cc-dim)}
.ccstatus .ag.sub{color:var(--cc-dim)}
[data-density="compact"] .ccterm{font-size:11.5px;line-height:1.55}
/* REQ-040: 팔레트·첨부 칩·웨이팅 스피너·에이전트 dim — 라운드/그림자 0 유지 */
.ccpal{border-top:1px solid var(--cc-border);max-height:230px;overflow-y:auto;padding:5px 0}
.ccpal .pi{display:flex;gap:14px;padding:2px 20px;cursor:pointer;align-items:baseline}
.ccpal .pi .pn{flex:none;min-width:180px;color:var(--cc-text)}
.ccpal .pi .pd{color:var(--cc-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ccpal .pi.sel{background:rgba(255,255,255,.1)}
.ccpal .pi.cli .pn{color:var(--cc-faint)}
.ccpal .pcli{color:var(--cc-faint)}
.ccatt{display:flex;gap:8px;flex-wrap:wrap;padding:7px 20px 0;border-top:1px solid var(--cc-border)}
.ccatt .chip{border:1px solid var(--cc-border);padding:1px 8px;color:var(--cc-dim);font-size:11.5px}
.ccatt .chip .up{color:var(--cc-yellow)}
.ccatt .chip button{background:none;border:0;color:var(--cc-red);cursor:pointer;font:inherit;padding:0 0 0 6px}
.ccclip{flex:none;background:none;border:0;color:var(--cc-dim);cursor:pointer;font:inherit;line-height:1.7;padding:0 2px}
.ccclip:hover{color:var(--cc-text)}
.ccterm.dragover{outline:1px dashed var(--cc-cyan);outline-offset:-5px}
.ccwaitline{padding:0 0 13px;color:var(--cc-dim)}
.ccspin::before{content:"✻";color:var(--cc-yellow);animation:ccglyph 1s steps(1,end) infinite}
@keyframes ccglyph{0%{content:"✻"}33%{content:"✳"}66%{content:"✶"}100%{content:"✻"}}
@media (prefers-reduced-motion: reduce){.ccspin::before{animation:none}}
.ccout .ln.ccagent{color:var(--cc-dim);opacity:.75;margin-left:14px}
.ccout .ln.ccagent .g{color:var(--cc-faint)}
.ccout .b .full .ln{margin:0 0 6px}

/* ------- graph ------- */
.graphwrap{border:1px solid var(--border);background:var(--panel);position:relative}
.graphwrap canvas{display:block;width:100%;cursor:grab}
.graphwrap canvas.grabbing{cursor:grabbing}
.ghint{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:var(--faint);
  font-family:var(--mono);background:var(--panel);border:1px solid var(--hairline);padding:3px 9px}
.legend{display:flex;gap:18px;padding:10px 16px;border-bottom:1px solid var(--border);
  font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px}
.gmode{border:1px solid var(--border);background:none;color:var(--muted);
  font-family:var(--mono);font-size:10px;padding:2px 9px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.05em}
.gmode.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.gtype{cursor:pointer;user-select:none}
.gtype.off{opacity:.35;text-decoration:line-through}

/* ------- 상태 전이 액션 (판정 버튼 / 드래그) ------- */
.tdd{font-family:var(--mono);font-size:10px;color:var(--c-inprogress);border:1px solid currentColor;
  padding:0 4px;border-radius:2px}
.tdd.full{color:var(--c-done)}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.livedot.on{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:livepulse 1.6s infinite}
.livedot.off{background:var(--faint)}
/* 간접 신호: 세션은 활동 중이나 이 REQ의 직접 증거 없음 — 비점멸 hollow (REQ-20260823-080) */
.livedot.sess{background:transparent;border:1.5px solid #16a34a}
/* 무인 작업자 기동 중(스폰 후 클레임 전) — 앰버 점멸 (REQ-20260824-008) */
.livedot.spawn{background:#d97706;box-shadow:0 0 0 0 rgba(217,119,6,.6);animation:livepulse 1.6s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 5px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.rvpt{margin-top:7px;font-size:11px;color:var(--c-review);line-height:1.4;
  border-left:2px solid var(--c-review);padding-left:7px}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:10.5px;padding:3px 10px;cursor:pointer;letter-spacing:.03em}
.acts button:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.card[draggable="true"]{cursor:grab}
.col.dropok{outline:2px dashed var(--text);outline-offset:-2px;background:var(--accent-soft)}

/* ============ skin: soft — 사이드바 앱 셸 + 라운드 카드 (구조부터 다른 언어) ============ */
[data-skin="soft"] header{position:fixed;left:0;top:0;bottom:0;width:232px;
  display:flex;flex-direction:column;border-right:1px solid var(--border);
  border-bottom:0;background:var(--panel);overflow-y:auto}
[data-skin="soft"] main{margin-left:232px}
[data-skin="soft"] .hrow1{flex-direction:column;align-items:stretch;gap:16px;
  padding:18px 14px 10px}
[data-skin="soft"] .brand{padding-bottom:0;font-size:16px}
[data-skin="soft"] .tabs{flex-direction:column;gap:3px}
[data-skin="soft"] .tabs button{text-align:left;border-bottom:0;border-radius:8px;
  padding:8px 12px;margin:0;font-size:13.5px}
[data-skin="soft"] .tabs button:hover{background:var(--accent-soft)}
[data-skin="soft"] .tabs button.active{background:var(--accent-soft);color:var(--text)}
[data-skin="soft"] .hrow2{flex-direction:column;align-items:stretch;gap:10px;
  padding:12px 14px;border-top:1px solid var(--hairline)}
[data-skin="soft"] .fgroup,[data-skin="soft"] .pgroup{flex-direction:column;
  align-items:stretch;gap:7px}
[data-skin="soft"] .pgroup{border-top:1px solid var(--hairline);padding-top:12px}
[data-skin="soft"] .pdiv{display:none}
[data-skin="soft"] .pgroup{flex-direction:row;justify-content:space-between}
[data-skin="soft"] .settings-panel{top:auto;bottom:14px;left:14px;right:auto;width:204px}
[data-skin="soft"] .hrow2 input[type="text"],[data-skin="soft"] .hrow2 select{
  width:100%;border-radius:8px}
[data-skin="soft"] .viewer{max-height:none}
[data-skin="soft"] .stats{border:0;background:none;gap:8px}
[data-skin="soft"] .stat{border:1px solid var(--border);border-radius:9px;background:var(--panel)}
[data-skin="soft"] .stat.on{box-shadow:none;border-color:var(--text)}
[data-skin="soft"] .board{border:0;background:none;gap:14px}
[data-skin="soft"] .col{background:var(--accent-soft);border-right:0;border-radius:12px;padding:6px}
[data-skin="soft"] .col h2{border-bottom:0}
[data-skin="soft"] .cards{gap:8px;padding:2px}
[data-skin="soft"] .card{background:var(--panel);border-radius:10px;border-bottom:0;
  box-shadow:0 1px 3px rgba(16,24,40,.09);border-left:3px solid var(--sc,var(--border));
  transition:transform .1s,box-shadow .1s}
[data-skin="soft"] .card:hover{background:var(--panel);transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(16,24,40,.13)}
[data-skin="soft"] .badge{background:var(--accent-soft);border-radius:5px;padding:1px 7px}
[data-skin="soft"] .badge::before{content:""}
[data-skin="soft"] .docs,[data-skin="soft"] .audit,[data-skin="soft"] .graphwrap,
[data-skin="soft"] .streamwrap{border-radius:12px;overflow:hidden}
[data-skin="soft"] .term{border-radius:10px}
[data-skin="soft"] .hovercard{border-radius:10px;border-color:var(--border);
  box-shadow:0 4px 14px rgba(0,0,0,.16)}
[data-skin="soft"] .kind{background:color-mix(in srgb,var(--kc) 12%,transparent);
  border-radius:5px;padding:1px 8px}
[data-skin="soft"] .kind::before{content:none}
[data-skin="soft"] .more{border:1px dashed var(--border);border-radius:8px;text-align:center}
[data-skin="soft"] .more::before{content:""}
[data-skin="soft"] .doclist .row.sel{box-shadow:inset 3px 0 0 var(--text)}

/* ============ skin: terminal — 브루탈리스트 모노 디자인 언어 ============ */
[data-skin="terminal"] body,[data-skin="terminal"] .card .t,
[data-skin="terminal"] .viewer h1,[data-skin="terminal"] .tabs button,
[data-skin="terminal"] .doclist .row>div:nth-child(3),
[data-skin="terminal"] .hovercard .ht,[data-skin="terminal"] .backlinks .bl{
  font-family:var(--mono);letter-spacing:0}
[data-skin="terminal"] body{font-size:12.5px}
[data-skin="terminal"] header{border-bottom:2px solid var(--text)}
[data-skin="terminal"] .tabs button{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
[data-skin="terminal"] .tabs button.active{background:var(--text);color:var(--bg);
  border-bottom-color:transparent}
[data-skin="terminal"] .viewer h1{font-size:17px}
[data-skin="terminal"] .viewer h1::before{content:"> "}
[data-skin="terminal"] .card:hover,[data-skin="terminal"] .doclist .row:hover{
  background:var(--text)}
[data-skin="terminal"] .card:hover *,[data-skin="terminal"] .doclist .row:hover *{
  color:var(--bg) !important}
[data-skin="terminal"] .doclist .row.sel{background:var(--text);box-shadow:none}
[data-skin="terminal"] .doclist .row.sel *{color:var(--bg) !important}
[data-skin="terminal"] .stat.on{background:var(--text);color:var(--bg);box-shadow:none}
[data-skin="terminal"] .stat.on b{color:var(--bg)}
[data-skin="terminal"] .brand .dot{width:9px;height:14px;animation:s9blink 1.1s steps(1) infinite}
@keyframes s9blink{50%{opacity:0}}

/* ============ skin: glass — frosted 레이어 + 앰비언트 컬러 필드 (2026-08-23 사용자 번복으로 부활)
   ledger의 정반대 언어: 반투명 패널 + backdrop blur, 은은한 그라데이션 배경, 라운드/부드러운 그림자.
   색은 tone 토큰(color-mix)에서만 파생 — 4개 tone 어디서든 성립. ============ */
[data-skin="glass"]{
  --gl-panel:color-mix(in srgb, var(--panel) 62%, transparent);
  --gl-card:color-mix(in srgb, var(--panel) 52%, transparent);
  --gl-solid:color-mix(in srgb, var(--panel) 90%, transparent);
  --gl-line:color-mix(in srgb, var(--text) 16%, transparent);
  --gl-hairline:color-mix(in srgb, var(--text) 9%, transparent);
  --gl-tint:color-mix(in srgb, var(--text) 9%, transparent);
  --gl-shadow:0 14px 38px -16px color-mix(in srgb, var(--text) 35%, transparent);
}
[data-skin="glass"] body{
  background:
    radial-gradient(58% 44% at 12% 0%,  color-mix(in srgb, var(--c-open) 26%, transparent), transparent 70%),
    radial-gradient(50% 42% at 90% 10%, color-mix(in srgb, var(--c-review) 22%, transparent), transparent 70%),
    radial-gradient(46% 38% at 78% 88%, color-mix(in srgb, var(--c-inprogress) 15%, transparent), transparent 72%),
    radial-gradient(60% 50% at 22% 100%, color-mix(in srgb, var(--c-done) 20%, transparent), transparent 72%),
    var(--bg);
  background-attachment:fixed;
}
[data-skin="glass"] header{
  background:color-mix(in srgb, var(--bg) 52%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--gl-line)}
[data-skin="glass"] .tabs{gap:6px}
[data-skin="glass"] .tabs button{border-bottom:0;border-radius:999px;
  padding:6px 14px;margin:0 0 8px}
[data-skin="glass"] .tabs button:hover{background:color-mix(in srgb, var(--text) 6%, transparent)}
[data-skin="glass"] .tabs button.active{background:var(--gl-tint);color:var(--text)}
[data-skin="glass"] .hrow2{border-top-color:var(--gl-hairline)}
/* 패널 = 떠 있는 유리판: 반투명 + blur + 라운드 + 부드러운 그림자 */
[data-skin="glass"] .stats,[data-skin="glass"] .board,[data-skin="glass"] .docs,
[data-skin="glass"] .audit,[data-skin="glass"] .graphwrap,[data-skin="glass"] .streamwrap,
[data-skin="glass"] .proj-info,[data-skin="glass"] .mystrip{
  background:var(--gl-panel);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--gl-line);border-radius:14px;box-shadow:var(--gl-shadow)}
[data-skin="glass"] .docs,[data-skin="glass"] .audit,[data-skin="glass"] .graphwrap,
[data-skin="glass"] .streamwrap{overflow:hidden}
[data-skin="glass"] .stats{overflow:hidden}
[data-skin="glass"] .stat{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .stat:hover{background:var(--gl-tint)}
[data-skin="glass"] .stat.on{background:var(--gl-tint);box-shadow:none}
/* Board: 레저 행 대신 유리 칩 카드 */
[data-skin="glass"] .col{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .col h2{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .cards{gap:8px;padding:8px}
[data-skin="glass"] .card{background:var(--gl-card);border:1px solid var(--gl-hairline);
  border-radius:11px;box-shadow:0 4px 16px -10px color-mix(in srgb, var(--text) 30%, transparent)}
[data-skin="glass"] .card:hover{background:var(--gl-solid)}
[data-skin="glass"] .col .more{padding-left:22px}
[data-skin="glass"] .doclist{border-right-color:var(--gl-hairline)}
[data-skin="glass"] .doclist .grp{background:var(--gl-solid);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .doclist .row{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .doclist .row:hover,[data-skin="glass"] .doclist .row.sel,
[data-skin="glass"] .card:hover,[data-skin="glass"] .urow:hover,
[data-skin="glass"] .mystrip .ms-row:hover,[data-skin="glass"] .mystrip .ms-row.sel,
[data-skin="glass"] .backlinks .bl:hover{background:var(--gl-tint)}
[data-skin="glass"] .audit tr:hover td{background:var(--gl-tint)}
[data-skin="glass"] .audit td,[data-skin="glass"] .metatbl td{border-bottom-color:var(--gl-hairline)}
/* 컨트롤: 라운드 + 반투명 */
[data-skin="glass"] .hrow2 input[type="text"],[data-skin="glass"] .hrow2 select,
[data-skin="glass"] .settings-panel select,[data-skin="glass"] .uf,
[data-skin="glass"] .uform input,[data-skin="glass"] .uform select,
[data-skin="glass"] .uform button,[data-skin="glass"] .gear,
[data-skin="glass"] .acts button,[data-skin="glass"] .gmode,
[data-skin="glass"] .pi-x{border-radius:9px;
  background:var(--gl-card);border-color:var(--gl-line)}
[data-skin="glass"] .gmode.on,[data-skin="glass"] .gear:hover,
[data-skin="glass"] .acts button:hover,[data-skin="glass"] .uform button:hover{
  background:var(--text);color:var(--bg);border-color:transparent}
[data-skin="glass"] .settings-panel{background:var(--gl-panel);
  -webkit-backdrop-filter:blur(20px) saturate(1.25);
  backdrop-filter:blur(20px) saturate(1.25);
  border-radius:14px;border-color:var(--gl-line);box-shadow:var(--gl-shadow)}
[data-skin="glass"] .hovercard{background:var(--gl-solid);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:12px;border-color:var(--gl-line);box-shadow:var(--gl-shadow)}
[data-skin="glass"] .proj-info{border-color:var(--gl-line)}
[data-skin="glass"] .term{background:rgba(13,17,22,.92)}
[data-skin="glass"] .ghint{background:var(--gl-solid);border-color:var(--gl-hairline);
  border-radius:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
[data-skin="glass"] .legend{border-bottom-color:var(--gl-hairline)}
[data-skin="glass"] .md pre{border-radius:8px;border-left-color:var(--gl-line)}
[data-skin="glass"] .kind{background:color-mix(in srgb, var(--kc) 13%, transparent);
  border-radius:6px;padding:1px 8px}
[data-skin="glass"] .kind::before{content:none}
[data-skin="glass"] .more{border-radius:8px}
[data-skin="glass"] .more:hover{background:var(--gl-tint);text-decoration:none;
  color:var(--text)}

/* ============ skin: field — 강한 컬러 필드 + 플랫 패널 ============
   glass의 안개를 훨씬 밀어붙인 선명한 앰비언트 그라운드 — 그 위에 불투명·플랫한
   패널이 또렷이 앉는다. 블러·그림자·반투명 없음: 채색 지면 vs 백색 판의 대비가 언어.
   축: 배경 분위기(강) + 깊이(플랫으로 반전) + 셸(여백·컬럼 분리).
   필드는 tone의 상태색·--bg에서만 파생(color-mix) — 4 tone 성립. 토큰 재정의 없음. */
[data-skin="field"]{
  --fd-line:color-mix(in srgb, var(--text) 24%, transparent);
  --fd-hair:color-mix(in srgb, var(--text) 10%, transparent);
  --fd-field:
    radial-gradient(58% 66% at 6% 0%,  color-mix(in srgb, var(--c-open) 68%, transparent), transparent 76%),
    radial-gradient(52% 60% at 98% 2%, color-mix(in srgb, var(--c-review) 62%, transparent), transparent 74%),
    radial-gradient(48% 56% at 92% 100%, color-mix(in srgb, var(--c-inprogress) 55%, transparent), transparent 76%),
    radial-gradient(58% 62% at 2% 100%, color-mix(in srgb, var(--c-done) 60%, transparent), transparent 76%),
    linear-gradient(155deg, color-mix(in srgb, var(--c-open) 34%, var(--bg)) 0%,
      color-mix(in srgb, var(--c-review) 30%, var(--bg)) 48%,
      color-mix(in srgb, var(--c-done) 26%, var(--bg)) 100%);
}
[data-skin="field"] body{background:var(--fd-field);background-attachment:fixed}
/* 헤더도 같은 fixed 필드 — 지면과 이음새 없이 이어진다 (블러 없이 sticky 성립) */
[data-skin="field"] header{background:var(--fd-field);background-attachment:fixed;
  border-bottom:1px solid var(--fd-line)}
[data-skin="field"] main{padding:26px clamp(22px, 4vw, 64px)}
[data-skin="field"] .count{color:var(--text)}
[data-skin="field"] .tabs button{color:color-mix(in srgb, var(--text) 76%, transparent)}
[data-skin="field"] .tabs button:hover{color:var(--text)}
/* 활성 탭 = 지면 위 백색 판이 헤더까지 올라온 칩 */
[data-skin="field"] .tabs button.active{background:var(--panel);color:var(--text);
  border-bottom-color:transparent}
[data-skin="field"] .hrow2{border-top-color:var(--fd-hair)}
[data-skin="field"] .hrow2 input[type="text"],[data-skin="field"] .hrow2 select{
  border-color:var(--fd-line)}
[data-skin="field"] .chk{color:var(--text)}
[data-skin="field"] .pdiv{background:var(--fd-line)}
[data-skin="field"] .stats,[data-skin="field"] .docs,[data-skin="field"] .audit,
[data-skin="field"] .graphwrap,[data-skin="field"] .streamwrap,
[data-skin="field"] .proj-info,[data-skin="field"] .mystrip{border-color:var(--fd-line)}
/* Board: 패널 상자를 버리고 컬럼 자체가 지면 위 백색 판 — 판 사이로 필드가 흐른다 */
[data-skin="field"] .board{background:transparent;border:0;gap:16px;padding-bottom:4px}
[data-skin="field"] .col,[data-skin="field"] .col:last-child{
  background:var(--panel);border:1px solid var(--fd-line)}
[data-skin="field"] .ghint{border-color:var(--fd-hair)}

/* ============ skin: cobalt — 컬러 헤더 밴드 셸 ============
   상단을 짙은 코발트 밴드(브랜드·탭 백색 잉크)로 바꾼 클래식 프로 SaaS 셸.
   축: 셸 구조(밴드 2단) + 배경(밴드 색) + 모양(라운드 10px 카드 그리드).
   밴드색은 --c-open을 black으로 눌러 파생 — 어느 tone에서도 백색 잉크 대비 성립. */
[data-skin="cobalt"]{
  --cb-band:color-mix(in srgb, var(--c-open) 66%, black);
  --cb-band2:color-mix(in srgb, var(--c-open) 52%, black);
  --cb-ink:#ffffff;
  --cb-ink-dim:rgba(255,255,255,.72);
  --cb-edge:rgba(255,255,255,.16);
}
[data-skin="cobalt"] header{background:var(--cb-band);border-bottom:0}
[data-skin="cobalt"] .hrow1{padding:16px 24px 0}
[data-skin="cobalt"] .brand{color:var(--cb-ink);font-size:16px}
[data-skin="cobalt"] .brand .dot{background:var(--cb-ink)}
[data-skin="cobalt"] .tabs button{color:var(--cb-ink-dim);border-bottom-width:3px;
  padding:6px 13px 13px}
[data-skin="cobalt"] .tabs button:hover{color:var(--cb-ink)}
[data-skin="cobalt"] .tabs button.active{color:var(--cb-ink);border-bottom-color:var(--cb-ink)}
[data-skin="cobalt"] header button:focus-visible{outline-color:var(--cb-ink)}
[data-skin="cobalt"] .hrow2{background:var(--cb-band2);border-top:1px solid var(--cb-edge)}
[data-skin="cobalt"] .hrow2 input[type="text"],[data-skin="cobalt"] .hrow2 select{
  border-color:transparent;border-radius:7px}
[data-skin="cobalt"] .hrow2 .chk{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .hrow2 .chk input{accent-color:var(--cb-ink)}
[data-skin="cobalt"] .pdiv{background:var(--cb-edge)}
[data-skin="cobalt"] .gear{background:transparent;border-color:var(--cb-edge);
  color:var(--cb-ink);border-radius:7px}
[data-skin="cobalt"] .gear:hover{background:var(--cb-ink);color:var(--cb-band)}
[data-skin="cobalt"] .settings-panel{top:118px;border-radius:12px}
/* 콘텐츠: 라운드 카드 그리드 — 밴드 아래는 밝고 정돈된 작업면 */
[data-skin="cobalt"] .stats,[data-skin="cobalt"] .docs,[data-skin="cobalt"] .audit,
[data-skin="cobalt"] .graphwrap,[data-skin="cobalt"] .streamwrap,
[data-skin="cobalt"] .proj-info,[data-skin="cobalt"] .mystrip{border-radius:12px}
[data-skin="cobalt"] .docs,[data-skin="cobalt"] .audit,[data-skin="cobalt"] .graphwrap,
[data-skin="cobalt"] .streamwrap,[data-skin="cobalt"] .stats{overflow:hidden}
[data-skin="cobalt"] .board{background:transparent;border:0;gap:12px}
[data-skin="cobalt"] .col,[data-skin="cobalt"] .col:last-child{background:var(--panel);
  border:1px solid var(--border);border-radius:12px}
/* 액센트 = 밴드색 계열(--c-open): 선택·활성 신호를 일관 코딩 */
[data-skin="cobalt"] .stat.on{box-shadow:inset 0 -2px 0 var(--c-open);color:var(--text)}
[data-skin="cobalt"] .doclist .row.sel,[data-skin="cobalt"] .mystrip .ms-row.sel{
  box-shadow:inset 2px 0 0 var(--c-open)}
[data-skin="cobalt"] .more:hover{color:var(--c-open)}
[data-skin="cobalt"] .acts button,[data-skin="cobalt"] .gmode,[data-skin="cobalt"] .pi-x,
[data-skin="cobalt"] .uform button{border-radius:7px}
[data-skin="cobalt"] .hovercard{border-radius:10px}

/* ============ skin: grid — 풀블리드 고밀도 데이터 그리드 ============
   프레임·여백을 걷어낸 엣지-투-엣지 그리드: 잉크 인버스 헤더 바 + 지브라 행 +
   전폭 컬럼. 축: 셸(풀블리드) + 밀도(고) + 모양(라운드 0·면 채움 헤더).
   서체는 베이스 그대로(sans) — terminal(전면 mono·인버스 hover)과 다른 문법. */
[data-skin="grid"] main{padding:0}
[data-skin="grid"] .count{margin:0;padding:7px 14px;border-bottom:1px solid var(--hairline)}
[data-skin="grid"] .hrow1{padding:10px 14px 0}
[data-skin="grid"] .brand{padding-bottom:9px}
[data-skin="grid"] .tabs button{padding:3px 11px 9px}
[data-skin="grid"] .hrow2{padding:6px 14px}
[data-skin="grid"] .stats,[data-skin="grid"] .board,[data-skin="grid"] .docs,
[data-skin="grid"] .audit,[data-skin="grid"] .graphwrap,[data-skin="grid"] .streamwrap{
  border-left:0;border-right:0;border-top:0}
[data-skin="grid"] .stats{margin:0}
[data-skin="grid"] .stat{flex:1 1 auto}
[data-skin="grid"] .proj-info,[data-skin="grid"] .mystrip{margin:10px 14px}
/* 컬럼: 고정폭을 버리고 화면을 나눠 가진다 — 잉크 헤더 바가 구획의 앵커 */
[data-skin="grid"] .board{padding-bottom:0}
[data-skin="grid"] .col{flex:1 1 0;width:auto;min-width:212px;padding-bottom:0}
[data-skin="grid"] .col h2{background:var(--text);color:var(--bg);border-bottom:0;
  letter-spacing:.12em;padding:8px 12px}
[data-skin="grid"] .col h2 .n{color:color-mix(in srgb, var(--bg) 72%, transparent)}
[data-skin="grid"] .doclist .grp{background:var(--text);color:var(--bg);border-bottom:0}
[data-skin="grid"] .audit th{background:var(--text);color:var(--bg);border-bottom:0}
[data-skin="grid"] .audit .cap{border-bottom-color:var(--hairline)}
/* 지브라 + 조밀 행 */
[data-skin="grid"] .card{padding:7px 12px}
[data-skin="grid"] .card .t{font-size:12.5px;margin:2px 0 4px;padding-right:52px}
[data-skin="grid"] .card:nth-child(even),
[data-skin="grid"] .audit tbody tr:nth-child(even) td,
[data-skin="grid"] .doclist .row:nth-child(even){
  background:color-mix(in srgb, var(--text) 3%, var(--panel))}
[data-skin="grid"] .card:hover,[data-skin="grid"] .doclist .row:hover{
  background:color-mix(in srgb, var(--text) 8%, var(--panel))}
[data-skin="grid"] .audit tr:hover td{
  background:color-mix(in srgb, var(--text) 8%, var(--panel))}
[data-skin="grid"] .doclist .row{padding:6px 12px}
[data-skin="grid"] .doclist{width:300px}
[data-skin="grid"] .viewer{padding:18px 26px}
[data-skin="grid"] .settings-panel{top:84px}

/* ============ skin: cockpit — 다크 전용 관제실 ============
   tone 무관 상시 다크(.term·neon 전례의 자체 토큰 전면 재정의) — 심야 관제 콘솔.
   엘리베이션 레이어(깊은 그림자·상단 미광)와 상태색 코딩 강화(컬럼 캡·스탯 언더라인)가 언어.
   축: 배경(상시 다크 필드) + 깊이(레이어드 엘리베이션) + 색(기능 코딩 강화).
   코스튬 아님 — 같은 계기판을 어두운 관제실 조도에서 본 것. */
:root[data-skin="cockpit"]{
  --bg:#0a0e15; --panel:#10151f; --border:#273246; --hairline:#1b2434;
  --text:#d9e2f2; --muted:#8fa0b8; --faint:#5a6880;
  --accent:#d9e2f2; --accent-soft:#182032; --accent-line:#d9e2f2;
  --c-draft:#6b7689; --c-open:#5c9dff; --c-inprogress:#ffab40; --c-blocked:#ff5d5d;
  --c-review:#b48cff; --c-done:#37d09e; --c-cancelled:#6b7689; --c-published:#2fc3b4;
  --t-request:#5c9dff; --t-knowledge:#2fc3b4; --t-session:#d19a4f;
  --ck-up:#141b2a;           /* 한 단 위 레이어 */
  --ck-lift:0 1px 0 rgba(255,255,255,.045) inset, 0 16px 34px -18px rgba(0,0,0,.85);
}
[data-skin="cockpit"] body{
  background:radial-gradient(120% 90% at 50% -10%, #121a2a, var(--bg) 58%) fixed}
[data-skin="cockpit"] header{background:rgba(10,14,21,.92);border-bottom-color:var(--border)}
[data-skin="cockpit"] .brand .dot{border-radius:50%;background:var(--c-done);
  box-shadow:0 0 8px rgba(55,208,158,.7)}   /* 시스템 활성 램프 — 유일한 발광 */
[data-skin="cockpit"] .tabs button.active{border-bottom-color:var(--c-open)}
[data-skin="cockpit"] .stats,[data-skin="cockpit"] .board,[data-skin="cockpit"] .docs,
[data-skin="cockpit"] .audit,[data-skin="cockpit"] .graphwrap,
[data-skin="cockpit"] .streamwrap,[data-skin="cockpit"] .proj-info,
[data-skin="cockpit"] .mystrip{border-radius:10px;box-shadow:var(--ck-lift)}
[data-skin="cockpit"] .docs,[data-skin="cockpit"] .audit,[data-skin="cockpit"] .graphwrap,
[data-skin="cockpit"] .streamwrap,[data-skin="cockpit"] .stats{overflow:hidden}
/* 컬럼 캡 = 상태색 코딩: 상단 2px 인셋 바 + 저농도 틴트 */
[data-skin="cockpit"] .col h2{color:var(--text);
  background:color-mix(in srgb, var(--sc, var(--muted)) 13%, var(--panel));
  box-shadow:inset 0 2px 0 var(--sc, var(--border))}
[data-skin="cockpit"] .cards{gap:8px;padding:8px}
[data-skin="cockpit"] .card{background:var(--ck-up);border:1px solid var(--hairline);
  border-radius:8px;box-shadow:0 6px 14px -10px rgba(0,0,0,.7)}
[data-skin="cockpit"] .card:hover{background:#182236}
[data-skin="cockpit"] .col .more{padding-left:8px}
[data-skin="cockpit"] .stat.on{box-shadow:inset 0 -2px 0 var(--sc, var(--text));
  background:var(--accent-soft);color:var(--text)}
[data-skin="cockpit"] .doclist .grp{background:#0d121c}
[data-skin="cockpit"] .doclist .row.sel{background:var(--accent-soft);
  box-shadow:inset 2px 0 0 var(--sc, var(--text))}
[data-skin="cockpit"] .hrow2 input[type="text"],[data-skin="cockpit"] .hrow2 select,
[data-skin="cockpit"] .settings-panel select,[data-skin="cockpit"] .uform input,
[data-skin="cockpit"] .uform select,[data-skin="cockpit"] .uf{
  background:#0c111b;border-radius:6px}
[data-skin="cockpit"] .gear,[data-skin="cockpit"] .gmode,[data-skin="cockpit"] .acts button,
[data-skin="cockpit"] .uform button,[data-skin="cockpit"] .pi-x{
  background:var(--ck-up);border-radius:6px}
[data-skin="cockpit"] .gear:hover,[data-skin="cockpit"] .acts button:hover,
[data-skin="cockpit"] .uform button:hover,[data-skin="cockpit"] .gmode.on{
  background:var(--text);color:var(--bg)}
[data-skin="cockpit"] .pi-x:hover:not(:disabled){background:var(--text);color:var(--bg)}
[data-skin="cockpit"] .settings-panel{background:var(--panel);border-color:var(--border);
  border-radius:10px;box-shadow:0 22px 48px -18px rgba(0,0,0,.9)}
[data-skin="cockpit"] .hovercard{background:var(--ck-up);border-color:var(--border);
  border-radius:8px;box-shadow:0 14px 30px -14px rgba(0,0,0,.85)}
[data-skin="cockpit"] .md pre{background:#0c111b}
[data-skin="cockpit"] .ghint{background:var(--ck-up);border-color:var(--hairline);
  border-radius:6px}

/* ============ skin: slate — 라이트 SaaS 셸·블루 액센트 ============
   메인스트림 협업 도구의 디자인 언어(상표 요소 없이): 회청(blue-gray) 캔버스 위
   화이트 패널 + 미세 그림자 + 6~8px 라운드, 명확한 블루 프라이머리(활성 탭·선택·버튼),
   컴팩트하고 단정한 밀도의 화이트 제품 네비. 축: 배경(회청 캔버스) + 깊이(카드 그림자) +
   모양(라운드) + 색(블루 액센트). cobalt(짙은 밴드 셸)와 달리 헤더가 밝다.
   전 색상 tone 토큰 color-mix 파생 — 4 tone 성립. 그림자는 남색 저알파 고정(다크에선 침잠). */
[data-skin="slate"]{
  --sl-canvas:color-mix(in srgb, var(--c-open) 9%, color-mix(in srgb, var(--text) 4%, var(--bg)));
  --sl-line:color-mix(in srgb, var(--c-open) 16%, var(--border));
  --sl-blue:var(--c-open);
  --sl-tint:color-mix(in srgb, var(--c-open) 10%, var(--panel));
  --sl-tint2:color-mix(in srgb, var(--c-open) 16%, var(--panel));
  --sl-shadow:0 1px 2px rgba(9,30,66,.14), 0 0 1px rgba(9,30,66,.16);
  --sl-pop:0 8px 20px -6px rgba(9,30,66,.22), 0 0 1px rgba(9,30,66,.2);
}
[data-skin="slate"] body{background:var(--sl-canvas);font-size:13px}
/* 화이트 제품 네비: 패널색 2단 바 + 블루 활성 언더라인 */
[data-skin="slate"] header{background:var(--panel);border-bottom:1px solid var(--sl-line);
  box-shadow:var(--sl-shadow)}
[data-skin="slate"] .hrow1{padding:12px 22px 0}
[data-skin="slate"] .tabs button{padding:4px 12px 12px;border-bottom-width:3px}
[data-skin="slate"] .tabs button:hover{color:var(--sl-blue)}
[data-skin="slate"] .tabs button.active{color:var(--sl-blue);border-bottom-color:var(--sl-blue)}
[data-skin="slate"] .brand .dot{background:var(--sl-blue);border-radius:2px}
[data-skin="slate"] .hrow2{background:var(--panel)}
[data-skin="slate"] .hrow2 input[type="text"],[data-skin="slate"] .hrow2 select,
[data-skin="slate"] .settings-panel select,[data-skin="slate"] .uform input,
[data-skin="slate"] .uform select,[data-skin="slate"] .uf{
  border-radius:4px;border-color:var(--sl-line)}
[data-skin="slate"] .hrow2 input[type="text"]:focus,[data-skin="slate"] .hrow2 select:focus{
  outline:2px solid var(--sl-blue);outline-offset:-1px}
[data-skin="slate"] .chk input{accent-color:var(--sl-blue)}
/* 버튼 = 블루 프라이머리 문법 (베이스 잉크 인버스를 블루로 교체) */
[data-skin="slate"] .gear,[data-skin="slate"] .acts button,[data-skin="slate"] .gmode,
[data-skin="slate"] .uform button,[data-skin="slate"] .pi-x{border-radius:4px}
[data-skin="slate"] .gear:hover,[data-skin="slate"] .acts button:hover,
[data-skin="slate"] .uform button:hover{
  background:var(--sl-blue);color:#fff;border-color:var(--sl-blue)}
[data-skin="slate"] .gmode.on{background:var(--sl-blue);color:#fff;border-color:var(--sl-blue)}
[data-skin="slate"] .pi-x:hover:not(:disabled){background:var(--sl-blue);color:#fff;
  border-color:var(--sl-blue)}
/* 패널 = 화이트 카드: 라운드 8px + 미세 그림자 */
[data-skin="slate"] .stats,[data-skin="slate"] .docs,[data-skin="slate"] .audit,
[data-skin="slate"] .graphwrap,[data-skin="slate"] .streamwrap,
[data-skin="slate"] .proj-info,[data-skin="slate"] .mystrip{
  border-radius:8px;border-color:var(--sl-line);box-shadow:var(--sl-shadow)}
[data-skin="slate"] .docs,[data-skin="slate"] .audit,[data-skin="slate"] .graphwrap,
[data-skin="slate"] .streamwrap,[data-skin="slate"] .stats{overflow:hidden}
/* Board: 컬럼이 각각 화이트 카드로 분리 — 캔버스가 사이로 보인다 */
[data-skin="slate"] .board{background:transparent;border:0;gap:10px}
[data-skin="slate"] .col,[data-skin="slate"] .col:last-child{background:var(--panel);
  border:1px solid var(--sl-line);border-radius:8px;box-shadow:var(--sl-shadow)}
[data-skin="slate"] .card{padding:9px 13px}
[data-skin="slate"] .card .t{font-size:13px}
[data-skin="slate"] .card:hover{background:var(--sl-tint)}
/* 선택·활성 = 블루 코딩 */
[data-skin="slate"] .stat.on{box-shadow:inset 0 -2px 0 var(--sl-blue);color:var(--text)}
[data-skin="slate"] .stat:hover{background:var(--sl-tint)}
[data-skin="slate"] .doclist .row:hover,[data-skin="slate"] .urow:hover,
[data-skin="slate"] .backlinks .bl:hover,[data-skin="slate"] .mystrip .ms-row:hover{
  background:var(--sl-tint)}
[data-skin="slate"] .audit tr:hover td{background:var(--sl-tint)}
[data-skin="slate"] .doclist .row.sel,[data-skin="slate"] .mystrip .ms-row.sel{
  background:var(--sl-tint);box-shadow:inset 2px 0 0 var(--sl-blue)}
[data-skin="slate"] a.doclink{color:var(--sl-blue)}
[data-skin="slate"] .md a{color:var(--sl-blue)}
[data-skin="slate"] .more:hover{color:var(--sl-blue)}
[data-skin="slate"] .settings-panel,[data-skin="slate"] .hovercard{
  border-radius:8px;border-color:var(--sl-line);box-shadow:var(--sl-pop)}
[data-skin="slate"] .col.dropok{outline-color:var(--sl-blue);border-radius:8px}
[data-skin="slate"] .ghint{border-radius:4px}
[data-skin="slate"] header button:focus-visible,[data-skin="slate"] a:focus-visible,
[data-skin="slate"] input:focus-visible,[data-skin="slate"] select:focus-visible{
  outline-color:var(--sl-blue)}

/* ============ skin: cork — 컬러 캔버스 보드 웰 ============
   대중적 칸반 보드의 디자인 언어(상표 요소 없이): 은은한 단색 컬러 캔버스가 지면,
   컬럼 = 라운드 회색 웰(보드가 주인공), 카드 = 화이트 라운드 + 얕은 그림자 + hover
   리프트. 가볍고 친근한 밀도. 축: 배경(컬러 캔버스) + 셸(웰 보드 문법) + 깊이(리프트).
   field(고채도 멀티컬러+플랫 판)와 달리 저채도 단일 계열 + 웰/리프트가 언어.
   캔버스는 --c-open→--c-done 저농도 사선 그라데이션 — 4 tone 성립. */
[data-skin="cork"]{
  --ck-canvas:linear-gradient(160deg,
    color-mix(in srgb, var(--c-open) 46%, var(--bg)) 0%,
    color-mix(in srgb, var(--c-open) 30%, var(--bg)) 55%,
    color-mix(in srgb, var(--c-done) 26%, var(--bg)) 100%);
  --ck-well:color-mix(in srgb, var(--text) 7%, var(--panel));
  --ck-line:color-mix(in srgb, var(--text) 14%, transparent);
  --ck-shadow:0 1px 1px rgba(20,25,35,.16);
  --ck-lift:0 6px 14px -6px rgba(20,25,35,.3);
}
[data-skin="cork"] body{background:var(--ck-canvas);background-attachment:fixed}
/* 헤더 = 캔버스 위 반투명 판 (블러 없음 — glass와 다른 문법) */
[data-skin="cork"] header{background:color-mix(in srgb, var(--panel) 62%, transparent);
  border-bottom:1px solid var(--ck-line)}
[data-skin="cork"] .tabs button{border-bottom:0;border-radius:6px;padding:5px 12px;
  margin:0 0 9px}
[data-skin="cork"] .tabs button:hover{
  background:color-mix(in srgb, var(--panel) 55%, transparent);color:var(--text)}
[data-skin="cork"] .tabs button.active{background:var(--panel);color:var(--text);
  box-shadow:var(--ck-shadow)}
[data-skin="cork"] .hrow2{border-top-color:var(--ck-line)}
[data-skin="cork"] .hrow2 input[type="text"],[data-skin="cork"] .hrow2 select{
  border-radius:6px;border-color:var(--ck-line)}
[data-skin="cork"] .gear,[data-skin="cork"] .gmode,[data-skin="cork"] .acts button,
[data-skin="cork"] .uform button,[data-skin="cork"] .pi-x{border-radius:6px}
[data-skin="cork"] .pdiv{background:var(--ck-line)}
/* Board = 주인공: 프레임 상자를 버리고 웰 컬럼이 캔버스 위에 뜬다 */
[data-skin="cork"] .board{background:transparent;border:0;gap:12px;padding-bottom:6px}
[data-skin="cork"] .col,[data-skin="cork"] .col:last-child{
  background:var(--ck-well);border:0;border-radius:12px;padding:4px 6px 8px}
[data-skin="cork"] .col h2{border-bottom:0;padding:9px 10px 5px}
[data-skin="cork"] .cards{gap:7px;padding:2px 4px}
[data-skin="cork"] .card{background:var(--panel);border-bottom:0;border-radius:8px;
  box-shadow:var(--ck-shadow);padding:9px 12px;
  transition:transform .12s ease, box-shadow .12s ease}
[data-skin="cork"] .card:hover{background:var(--panel);transform:translateY(-2px);
  box-shadow:var(--ck-lift)}
[data-skin="cork"] .col .more{padding-left:10px}
[data-skin="cork"] .col.dropok{outline-color:var(--text);border-radius:12px;
  background:color-mix(in srgb, var(--text) 12%, var(--ck-well))}
/* 다른 탭들도 같은 문법: 캔버스 위 라운드 화이트 판 */
[data-skin="cork"] .stats,[data-skin="cork"] .docs,[data-skin="cork"] .audit,
[data-skin="cork"] .graphwrap,[data-skin="cork"] .streamwrap,
[data-skin="cork"] .proj-info,[data-skin="cork"] .mystrip{
  border:0;border-radius:12px;box-shadow:var(--ck-shadow)}
[data-skin="cork"] .docs,[data-skin="cork"] .audit,[data-skin="cork"] .graphwrap,
[data-skin="cork"] .streamwrap,[data-skin="cork"] .stats{overflow:hidden}
[data-skin="cork"] .settings-panel,[data-skin="cork"] .hovercard{border-radius:10px;
  border-color:var(--ck-line);box-shadow:var(--ck-lift)}
[data-skin="cork"] .ghint{border-radius:6px}
[data-skin="cork"] .md pre{border-radius:8px;border-left:0}
[data-skin="cork"] .md code{border-radius:4px}
[data-skin="cork"] .term{border-radius:10px;margin:8px}

/* ============ density: compact — 초고밀도 (skin과 독립인 밀도 축) ============ */
[data-density="compact"] body{font-size:12px}
[data-density="compact"] main{padding:10px 12px}
[data-density="compact"] .stats .stat{padding:4px 10px}
[data-density="compact"] .stats .stat b{font-size:12.5px}
[data-density="compact"] .col{min-width:198px;width:198px}
[data-density="compact"] .col h2{padding:7px 10px}
[data-density="compact"] .card{padding:5px 10px}
[data-density="compact"] .card .id{font-size:9px}
[data-density="compact"] .card .t{font-size:12px;font-weight:500;margin:1px 0 2px;line-height:1.3}
[data-density="compact"] .card .m{font-size:9.5px;gap:6px}
[data-density="compact"] .doclist .row{padding:4px 10px}
[data-density="compact"] .doclist .row>div:nth-child(3){font-size:12px}
[data-density="compact"] .viewer{padding:14px 20px}
[data-density="compact"] .metatbl td{padding:3px 8px 3px 0;font-size:11.5px}
[data-density="compact"] .audit td{padding:4px 10px;font-size:11.5px}
[data-density="compact"] .term{font-size:11px;line-height:1.45}
[data-density="compact"] .acts button{padding:1px 7px;font-size:9.5px}

/* ------- users 탭 ------- */
.uform{display:flex;flex-direction:column;gap:6px;padding:10px 14px 14px}
.uform input,.uform select,.uf{border:1px solid var(--border);padding:5px 9px;
  font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
.uf{width:min(300px,100%)}
.uform button{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:6px;cursor:pointer;letter-spacing:.03em}
.uform button:hover{background:var(--text);color:var(--bg)}
.cfg-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin:26px 0 4px;font-weight:600;font-family:var(--mono);
  border-top:1px solid var(--border);padding-top:14px}
/* 프로필 확장 (REQ-20260824-055 E7) — 미기재 신호는 앰버, 실패는 인라인 mono (팝업 금지) */
.pbadge{font-family:var(--mono);font-size:11px;color:var(--c-inprogress);margin-left:5px}
.reqhint{font-family:var(--mono);font-size:10px;color:var(--c-inprogress);
  text-transform:uppercase;letter-spacing:.05em;margin-left:8px;white-space:nowrap}
.ferr{font-family:var(--mono);font-size:11px;color:var(--c-blocked);align-self:center;
  margin-left:4px}
.emrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.emrow .em-rm{border:1px solid var(--border);background:var(--panel);color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:4px 8px;cursor:pointer;line-height:1.2}
.emrow .em-rm:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.em-add{border:0;background:none;color:var(--faint);padding:2px 0;cursor:pointer;
  font-size:11px;font-family:var(--mono);text-align:left}
.em-add:hover{color:var(--text);text-decoration:underline}

/* ------- hovercard ------- */
.hovercard{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--text);
  padding:11px 14px;max-width:340px;font-size:12.5px;pointer-events:none;opacity:0;
  transition:opacity .1s;line-height:1.5}
.hovercard.show{opacity:1}
.hovercard .hid{font-family:var(--mono);font-size:10px;color:var(--faint)}
.hovercard .ht{font-weight:600;margin:3px 0}
.hovercard .hs{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="hrow1">
    <div class="brand"><span class="dot"></span>section9</div>
    <div class="tabs">
      <button data-tab="board" class="active">Board</button>
      <button data-tab="docs">Docs</button>
      <button data-tab="graph">Graph</button>
      <button data-tab="audit">Audit</button>
      <button data-tab="stream">Stream</button>
      <button data-tab="terminal">Terminal</button>
      <button data-tab="settings">Settings<span id="settings-badge" class="pbadge" hidden>⚠</span></button>
    </div>
  </div>
  <div class="hrow2">
    <div class="fgroup">
      <input id="q" type="text" placeholder="search…">
      <label class="chk" title="문서 본문(History 포함)까지 검색 — Docs 탭에서 매치 라인 표시">
        <input type="checkbox" id="q-body"> 본문</label>
      <select id="f-user"><option value="">user: all</option></select>
      <label class="chk" id="mine-wrap">
        <input type="checkbox" id="f-mine"> 내 것만</label>
      <select id="f-project"><option value="">project: all</option></select>
      <select id="f-tag"><option value="">tag: all</option></select>
      <select id="f-type"><option value="">type: all</option>
        <option>request</option><option>knowledge</option><option>session</option><option>project</option></select>
    </div>
    <div class="pgroup idcol">
      <span id="usage-chip" class="usagechip" title="로그인된 클로드 계정과 사용량(세션 5h·주간·모델) — 60초 갱신, 계정 전환 즉시 반영"></span>
      <span id="whoami" class="who" title="서버가 파생한 신원 — 대시보드는 127.0.0.1 전용이라 브라우저 사용자 = 서버 기동 OS 계정. 다른 계정명으로 연결하려면 터미널에서 s9 user attach"></span>
    </div>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div id="my-strip" class="mystrip" hidden></div>
  <div id="proj-info" class="proj-info" hidden></div>
  <div id="view"></div>
</main>

<script>
"use strict";
const STATUSES = ["draft","open","in-progress","blocked","review","done","cancelled"];
const TERMINAL = new Set(["done","cancelled"]);
const SCOLOR = {draft:"var(--c-draft)",open:"var(--c-open)","in-progress":"var(--c-inprogress)",
  blocked:"var(--c-blocked)",review:"var(--c-review)",done:"var(--c-done)",
  cancelled:"var(--c-cancelled)",published:"var(--c-published)"};
const TCOLOR = {request:"var(--t-request)",knowledge:"var(--t-knowledge)",session:"var(--t-session)"};
const TCOLOR_RAW = {request:"#1d4ed8",knowledge:"#0f766e",session:"#92400e"};

const COL_LIMIT = 7, COL_LIMIT_TERMINAL = 3, GRP_LIMIT = 20, AUDIT_PAGE = 50;

let catalog = [], graph = null, auditCache = null, TRANS = {}, projects = [];
let tab = "board", selectedDoc = null, selectedStream = null;
let streamTimer = null, reqStreamTimer = null;  // live follow 폴링 (화면 이탈 시 정리)
// 그래프 타입 표시 집합 — 기본은 request/knowledge (세션 로그 노드 숨김, REQ-20260824-026)
let gtypes = new Set(["request", "knowledge"]);
try{ const s = JSON.parse(localStorage.getItem("s9gtypes") || "null");
     if (Array.isArray(s) && s.length) gtypes = new Set(s); }catch(e){}
let expanded = new Set();      // board 컬럼 / docs 그룹 펼침 상태
let auditLimit = AUDIT_PAGE;

// 최근 갱신 우선 정렬 — Board 컬럼/Docs 목록/검색 결과 공통
const sortRecent = rows => [...rows].sort((a, b) =>
  (b.updated || b.created || "").localeCompare(a.updated || a.created || ""));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkifyIds = escaped => escaped.replace(
  /(^|[^"\w-])((?:REQ|DOC|SES)-\d{8}-\d{3})/g,
  '$1<a class="doclink" data-doc="$2">$2</a>');

// 경과시간 포맷: <60s=Ns, <60m=Mm Ss, <24h=Hh Mm, 그 이상=Dd Hh
function fmtElapsed(sinceIso){
  if (!sinceIso) return "";
  const t = Date.parse(sinceIso);
  if (isNaN(t)) return "";
  let s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 60) return `${m}m ${s % 60}s`;
  if (h < 24) return `${h}h ${m % 60}m`;
  return `${d}d ${h % 24}h`;
}
let elapsedTimer = null;  // 카드 경과시간 1초 갱신 (화면 이탈 시 정리)
function tickElapsed(){
  if (document.hidden) return;
  document.querySelectorAll(".elapsed[data-since]").forEach(el => {
    el.textContent = fmtElapsed(el.dataset.since);
  });
}

function isDarkTheme(){
  // skin이 자체 필드 색을 가질 수 있으므로 tone 추론이 아니라 실제 --bg 휘도로 판정 (스킨 무관 구조 개선 — 유지)
  const v = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = v.match(/^#([0-9a-f]{6})$/i);
  if (m){
    const n = parseInt(m[1], 16);
    return 0.2126*(n>>16&255) + 0.7152*(n>>8&255) + 0.0722*(n&255) < 128;
  }
  const t = document.documentElement.dataset.theme || "system";
  if (t === "carbon" || t === "phosphor") return true;
  if (t === "paper") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}

// 디스플레이 설정 3축: skin(언어) × tone(색) × density(밀도).
// 저장 우선순위: me(등록 사용자)의 user config > localStorage > 기본값.
// → 로그인한 사용자는 어느 머신에서든 자기 설정이 따라온다.
const UI_DIMS = [
  {key:"s9skin", attr:"skin", cfg:"ui_skin", def:"ledger", label:"skin — 디자인 언어",
   opts:[["ledger","ledger — 계기판/장부 (기본)"],["soft","soft — 사이드바 앱 셸"],["terminal","terminal — 모노 브루탈"],["glass","glass — 반투명 레이어"],["field","field — 컬러 필드"],["cobalt","cobalt — 헤더 밴드"],["grid","grid — 고밀도 그리드"],["cockpit","cockpit — 다크 관제실"],["slate","slate — 라이트 SaaS 블루"],["cork","cork — 컬러 보드 웰"]]},
  {key:"s9theme", attr:"theme", cfg:"ui_tone", def:"system", label:"tone — 색",
   opts:[["system","system — OS 추종"],["paper","paper — 라이트 고정"],["carbon","carbon — 다크 고정"],["phosphor","phosphor — CRT 그린"]]},
  {key:"s9density", attr:"density", cfg:"ui_density", def:"normal", label:"density — 밀도",
   opts:[["normal","normal"],["compact","compact"]]},
];

// 개명된 skin의 저장값 구제 (localStorage·user config 공통). 제거된 skin은 아래 opts 검증에서 기본으로 폴백.
const UI_RENAMED = {skin:{atlas:"slate", tray:"cork"}};

// 현재 각 축의 적용값 (me config > localStorage > 기본). documentElement에 반영.
function currentUIValue(d, userCfg){
  let v = d.def;
  try{ if (localStorage.getItem(d.key)) v = localStorage.getItem(d.key); }catch(e){}
  if (userCfg && userCfg[d.cfg]) v = userCfg[d.cfg];
  const ren = UI_RENAMED[d.attr];
  if (ren && ren[v]) v = ren[v];
  if (!d.opts.some(([val]) => val === v)) v = d.def;
  return v;
}
function applyUISettings(userCfg){
  for (const d of UI_DIMS){
    let v = currentUIValue(d, userCfg);
    // ?skin=·?theme=·?density= — 검증(s9 shot)·공유용 일회성 오버라이드. 저장 경로에는 불관여.
    try{
      const ov = new URLSearchParams(location.search).get(d.attr);
      if (ov && d.opts.some(([val]) => val === ov)) v = ov;
    }catch(e){}
    document.documentElement.dataset[d.attr] = v;
  }
}

// 한 축 변경 저장: dataset 즉시 반영(CSS 자동) + localStorage + (등록 계정이면) 계정 config.
// 주의: render()를 호출하지 않는다 — Settings 화면의 select가 파괴되어 변경 불능이 됐던 버그.
async function setUIDim(d, v){
  document.documentElement.dataset[d.attr] = v;
  try{ localStorage.setItem(d.key, v); }catch(e){}
  const me = getMe();  // 개인화는 실제 whoami 계정에 저장 (미리보기와 무관)
  if (me) await postJSON("/api/user/config", {name: me, key: d.cfg, value: v});
}

(function initTheme(){ applyUISettings(null); })();  // 초기 적용 (whoami 로드 전)

/* 신원 = 서버 파생 whoami (REQ-20260824-027) — me 셀렉터·localStorage s9me 폐기.
   대시보드는 127.0.0.1 전용: 브라우저 사용자 = 서버 기동 OS 계정이므로 클라이언트는
   신원을 보내지 않는다 (쓰기 actor·열람 격리 모두 서버가 파생). 유일한 예외는
   admin의 시점 미리보기/대리(asUser) — Settings 사용자 관리에서만 부여, 비저장. */
let asUser = "";
function getMe(){
  const w = window.__whoami || {};
  return w.registered ? w.user : "";
}
const isAdmin = () => (window.__whoami || {}).role === "admin";
// 화면 시점(열람 격리·mine 판정) — admin 미리보기 중엔 그 사용자
const viewMe = () => asUser || getMe();
// 조회 GET 쿼리: admin 미리보기 중에만 as를 붙인다 (그 외 신원 파라미터 없음)
const meQ = () => asUser ? "as=" + encodeURIComponent(asUser) : "";

/* 프로필 미기재 판정 (REQ-20260824-055) — 서버의 세션 시작 촉구와 동일 기준:
   legacy email 단수 필드도 이메일 기재로 인정. 반환 = 빈 필드 라벨 목록. */
function profileMissing(u){
  if (!u) return [];
  const miss = [];
  if (!((u.emails || []).length || u.email)) miss.push("회사 이메일");
  if (!u.github) miss.push("개인 GitHub");
  if (!u.github_org) miss.push("조직 GitHub");
  return miss;
}
// 헤더 Settings 탭의 ⚠ 배지 — __users 갱신 시점(boot·renderSettings)에 호출
function updateProfileBadge(){
  const el = $("#settings-badge");
  if (!el) return;
  const me = getMe();
  const miss = me ? profileMissing((window.__users || []).find(x => x.name === me)) : [];
  el.hidden = !miss.length;
  el.title = miss.length
    ? `프로필 미기재: ${miss.join(" · ")} — Settings > 내 계정에서 입력하세요` : "";
}

function renderWhoami(){
  const el = $("#whoami"), w = window.__whoami || {};
  if (!el || !w.user) return;
  if (!w.registered){
    el.className = "who warn";
    el.innerHTML = `⚠ 미등록 계정 <b>${esc(w.user)}</b> @ ${esc(w.machine || "")} — 터미널에서 <code>s9 user add ${esc(w.user)}</code> 로 등록하세요`;
    return;
  }
  el.className = "who";
  el.innerHTML = `<b>${esc(w.user)}</b> @ ${esc(w.machine || "")} [${esc(w.role || "member")}]`
    + (asUser ? ` <span class="as">→ @${esc(asUser)} 시점</span>` : "");
}

// admin 미리보기(as) 전환 — 서버 가시성 범위가 바뀐다: 캐시 무효화 후 전면 재조회
function onViewerChanged(){
  renderWhoami();
  graph = null; auditCache = null;
  refreshProjects().then(refreshCatalog).then(() => {
    fillProjects();   // mine 집합 재스코핑 (범위 밖 선택은 리셋)
    render();
  });
}

/* '내 것만' 스코프 (DOC-20260823-006) — '나' = 화면 시점(viewMe), 저장 = s9mine.
   mine 판정 = /api/projects members에 user===viewMe && active. 만료·미등록 slug 제외. */
function getMineOnly(){
  try{ return localStorage.getItem("s9mine") === "1"; }catch(e){ return false; }
}
// 미등록 whoami면 저장값(s9mine)은 보존한 채 무시 — '나 없음'엔 mine이 정의 안 됨
const mineActive = () => !!viewMe() && getMineOnly();
const mineProjects = () => {
  const me = viewMe();
  return me ? projects.filter(p => (p.members || []).some(m => m.user === me && m.active)) : [];
};
// 토글 체크박스는 상태(localStorage)의 파생 뷰 — render()마다 동기화
function syncMineToggle(){
  const el = $("#f-mine"), me = viewMe();
  el.disabled = !me;
  el.checked = mineActive();
  $("#mine-wrap").title = me
    ? `@${me}가 active 멤버인 프로젝트의 문서만 표시 (Board·Docs·Graph 공통)`
    : "미등록 계정 — s9 user add 로 등록하면 내 프로젝트만 볼 수 있습니다";
}

async function boot(){
  try{ TRANS = await (await fetch("/api/transitions")).json(); }catch(e){}
  try{
    // 신원은 서버가 파생 — 표시 라벨 1회 + 등록 계정의 저장 설정 적용
    window.__whoami = await (await fetch("/api/whoami")).json();
    refreshUsage();
    setInterval(() => { if (!document.hidden) refreshUsage(); }, 60000);
    renderWhoami();
    let cfg = null;
    try{
      const u = await (await fetch("/api/users")).json();
      window.__users = u.users;
      cfg = ((u.users || []).find(x => x.name === getMe()) || {}).config || null;
    }catch(e){}
    applyUISettings(cfg);
    updateProfileBadge();
  }catch(e){}
  applyRoute(location.hash, false);  // 초기 URL 해시(#docs/REQ-... 등) 반영
  if (!location.hash) history.replaceState(null, "", "#" + tab);  // 초기 진입점 고정(뒤로가기 기준)
  await refreshProjects();
  await refreshCatalog();
  // ?project=slug — 공유 가능한 프로젝트 단위 뷰(보드/그래프가 그 프로젝트로 필터)
  const qp = new URLSearchParams(location.search).get("project");
  if (qp && [...$("#f-project").options].some(o => o.value === qp)) $("#f-project").value = qp;
  render();
  window.addEventListener("focus", () => refreshCatalog(true));
  setInterval(() => refreshCatalog(true), 15000);
  window.addEventListener("popstate", () => applyRoute(location.hash, true));
}

const TABS = ["board","docs","graph","audit","stream","terminal","settings"];

// URL 해시 ↔ 상태. 형태: #<tab> 또는 #docs/REQ-.. 또는 #settings/account
function applyRoute(hash, doRender){
  const parts = (hash || "").replace(/^#/, "").split("/");
  if (parts[0] === "chat") parts[0] = "terminal";  // 구 해시 alias (REQ-037 개명)
  const t = TABS.includes(parts[0]) ? parts[0] : "board";
  tab = t;
  if (t === "docs" && parts[1]) selectedDoc = parts[1];
  if (t === "stream" && parts[1]) selectedStream = parts[1];
  if (t === "settings" && parts[1]) settingsSection = parts[1];
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === t));
  if (doRender) render();
}

// 상태 → 해시 push (뒤로가기가 동작하도록 history에 쌓는다)
function pushRoute(){
  let h = "#" + tab;
  if (tab === "docs" && selectedDoc) h += "/" + selectedDoc;
  else if (tab === "stream" && selectedStream) h += "/" + selectedStream;
  else if (tab === "settings") h += "/" + settingsSection;
  if (location.hash !== h){ history.pushState(null, "", h); }
}

async function refreshProjects(){
  try{
    const d = await (await fetch("/api/projects?" + meQ())).json();
    projects = d.projects || [];
    window.__projects = projects;
  }catch(e){ /* 구버전 서버 등 — 프로젝트 API 없으면 무시 */ }
}

async function refreshCatalog(rerender){
  try{
    const fresh = await (await fetch("/api/catalog?" + meQ())).json();
    const before = JSON.stringify(projects);
    await refreshProjects();  // 프로젝트는 자주 안 바뀌므로 catalog와 함께 갱신
    const changed = JSON.stringify(fresh) !== JSON.stringify(catalog)
                 || JSON.stringify(projects) !== before;
    catalog = fresh;
    if (changed){ fillFilters(); graph = null; }
    // Settings는 폼 입력 중일 수 있다 — 폴링발 재렌더로 DOM(입력값)을 파괴하지
    // 않는다. 탭을 떠날 때 render()가 최신 catalog로 다시 그린다 (REQ-055 E7).
    if (rerender && changed){ auditCache = null; if (tab !== "settings") render(); }
  }catch(e){ /* 서버 재시작 중 등 — 다음 주기에 재시도 */ }
}

function fillFilters(){
  const fill = (sel, vals) => {
    const el = $(sel), cur = el.value;
    while (el.options.length > 1) el.remove(1);
    [...new Set(vals.filter(Boolean))].sort().forEach(v => {
      const o = document.createElement("option"); o.value = o.textContent = v; el.appendChild(o);
    });
    el.value = [...el.options].some(o => o.value === cur) ? cur : "";
  };
  fill("#f-user", catalog.map(r => r.user));
  fill("#f-tag", catalog.flatMap(r => r.tags || []));
  fillProjects();
}

// 프로젝트 드롭다운: 등록된 모든 프로젝트(요청 없어도) + 문서 없는 레거시 slug.
// value=slug, label="title (slug)" — 요청의 project 필드는 slug를 저장하므로 필터가 일치.
// '내 것만' ON이면 옵션을 mine으로 스코핑(첫 옵션 'project: mine(N)', 미등록 slug 숨김),
// 현재 선택이 범위 밖이면 all로 명시 리셋 — 조용한 빈 결과 금지 (DOC-20260823-006).
function fillProjects(){
  const el = $("#f-project"), cur = el.value;
  while (el.options.length > 1) el.remove(1);
  const scoped = mineActive() ? mineProjects() : projects;
  el.options[0].textContent = mineActive() ? `project: mine(${scoped.length})` : "project: all";
  const known = new Set();
  scoped.forEach(p => {
    known.add(p.slug);
    const o = document.createElement("option");
    o.value = p.slug;
    o.textContent = p.title && p.title !== p.slug ? `${p.title} (${p.slug})` : p.slug;
    el.appendChild(o);
  });
  // 프로젝트 문서는 없지만 요청에 적힌 레거시 project 값도 필터 가능하게 포함
  // (mine 스코프에서는 멤버 판정 불가 → 숨김)
  if (!mineActive())
    [...new Set(catalog.map(r => r.project).filter(Boolean))].sort().forEach(slug => {
      if (known.has(slug)) return;
      const o = document.createElement("option");
      o.value = slug; o.textContent = `${slug} ·미등록`;
      el.appendChild(o);
    });
  el.value = [...el.options].some(o => o.value === cur) ? cur : "";
}

// 선택된 프로젝트의 정보 패널(고객/담당자/멤버) — 특정 프로젝트 선택 시 표시.
// '내 것만' ON + mine 1개면 선택 없이도 범위가 단일 확정이므로 병행 표시 (필터는 안 건드림).
function renderProjectInfo(){
  const box = $("#proj-info"), slug = $("#f-project").value, meName = viewMe();
  let p = slug && projects.find(x => x.slug === slug);
  if (!p && mineActive()){
    const mp = mineProjects();
    if (mp.length === 1) p = mp[0];
  }
  if (!p){ box.hidden = true; box.innerHTML = ""; return; }
  const contact = [p.contact_name, p.contact_org, p.contact_email, p.contact_phone]
    .filter(Boolean).map(esc).join(" · ");
  // manage 권한 판정(표시용) — 실제 인가는 서버 do_member_set/rm(project_can) 단일 경로
  const LVL = {viewer:1, contributor:2, maintainer:3, owner:4};
  const isAdmin = ((window.__users || []).find(u => u.name === meName) || {}).role === "admin";
  const myMem = meName && (p.members || []).find(m => m.user === meName && m.active);
  const myLvl = isAdmin ? 4 : (myMem ? (LVL[myMem.role] || 0) : 0);
  const canManage = myLvl >= 3, canOwn = myLvl >= 4;
  const roleSel = (cur, cls) => {
    const roles = (canOwn || cur === "owner")
      ? ["owner","maintainer","contributor","viewer"] : ["maintainer","contributor","viewer"];
    return `<select class="${cls}"${cur === "owner" && !canOwn ? " disabled title='owner 변경은 owner만 가능'" : ""}>${
      roles.map(r => `<option value="${r}"${r === cur ? " selected" : ""}>${r}</option>`).join("")}</select>`;
  };
  const nameCell = m => m.user === meName
    ? `<span class="m-me-name">${esc(m.user)}</span> <span class="m-me">· ME</span>`
    : esc(m.user);
  const rows = (p.members || []).map(m => canManage ? `<tr data-member="${esc(m.user)}">
      <td>${nameCell(m)}</td>
      <td>${roleSel(m.role, "pi-role")}</td>
      <td><input class="pi-pos" value="${esc(m.position || "")}" placeholder="—" size="10"></td>
      <td>${esc(m.since || "")}</td>
      <td><input class="pi-until" type="date" value="${esc(m.until || "")}" title="비우면 무기한"></td>
      <td class="${m.active ? "m-act" : "m-exp"}">${m.active ? "활성" : "만료"}</td>
      <td><button class="pi-x" data-rm="${esc(m.user)}"${m.role === "owner" && !canOwn
        ? " disabled title='owner 제거는 owner만 가능'" : ""}>− 제거</button></td>
    </tr>` : `<tr>
      <td>${nameCell(m)}</td>
      <td class="m-role">${esc(m.role)}</td>
      <td>${m.position ? esc(m.position) : "<span class='pi-k'>—</span>"}</td>
      <td>${esc(m.since || "")}</td>
      <td>${m.until ? esc(m.until) : "<span class='pi-k'>무기한</span>"}</td>
      <td class="${m.active ? "m-act" : "m-exp"}">${m.active ? "활성" : "만료"}</td>
    </tr>`).join("");
  // 추가 행: 아직 멤버가 아닌 등록 사용자만 후보로
  const memberSet = new Set((p.members || []).map(m => m.user));
  const candidates = (window.__users || []).map(u => u.name).filter(n => !memberSet.has(n));
  const addRow = canManage ? `<tr class="pi-addrow">
      <td>${candidates.length
        ? `<select class="pi-newuser">${candidates.map(n => `<option>${esc(n)}</option>`).join("")}</select>`
        : "<span class='pi-k'>추가할 등록 사용자 없음</span>"}</td>
      <td>${candidates.length ? roleSel("contributor", "pi-newrole") : ""}</td>
      <td>${candidates.length ? `<input class="pi-newpos" placeholder="직무(선택)" size="10">` : ""}</td>
      <td></td>
      <td>${candidates.length ? `<input class="pi-newuntil" type="date" title="비우면 무기한">` : ""}</td>
      <td></td>
      <td>${candidates.length ? `<button class="pi-x" data-add="1">+ 추가</button>` : ""}</td>
    </tr>` : "";
  box.hidden = false;
  box.innerHTML = `
    <div class="pi-head">
      <div><span class="pi-title">${esc(p.title || p.slug)}</span>
        <span class="pi-slug">${esc(p.id)} · ${esc(p.slug)}</span></div>
      <span class="pi-status">${esc(p.status)} · 멤버 ${p.member_active}/${p.member_total}</span>
    </div>
    <div class="pi-grid">
      <span class="pi-k">고객</span><span class="pi-v">${esc(p.customer) || "<span class='pi-k'>—</span>"}</span>
      <span class="pi-k">현업 담당자</span><span class="pi-v">${contact || "<span class='pi-k'>—</span>"}</span>
      ${p.summary ? `<span class="pi-k">개요</span><span class="pi-v">${esc(p.summary)}</span>` : ""}
    </div>
    ${rows || addRow ? `<table><thead><tr><th>사용자</th><th>권한</th><th>직무</th><th>참여일</th><th>만료</th><th>상태</th>${
      canManage ? "<th></th>" : ""}</tr></thead>
      <tbody>${rows}${addRow}</tbody></table>` : "<p class='pi-k'>멤버 없음</p>"}
    <div class="pi-err" hidden></div>`;
  if (canManage) wireMemberControls(box, p.slug, meName);
}

// 멤버 관리 컨트롤 배선 — 변경 즉시 POST(서버 단일 인가 경로), 성공 시 전체 갱신
function wireMemberControls(box, slug, meName){
  // render()는 패널을 통째로 다시 그리므로, 오류는 재렌더 후의 .pi-err에 써야 남는다
  const fail = msg => {
    const e2 = document.querySelector("#proj-info .pi-err");
    if (e2){ e2.textContent = "거부: " + msg; e2.hidden = false; }
  };
  const post = async (path, payload) => {
    try{
      const r = await fetch(path, {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user: meName, slug, ...payload})});
      const d = await r.json();
      if (!d.ok){ render(); fail(d.error); return; }  // 컨트롤 원복 후 거부 사유 표시
      await refreshProjects();
      render();  // mine 스코프·스트립·패널 즉시 갱신
    }catch(e){ render(); fail("서버에 연결할 수 없습니다"); }
  };
  box.querySelectorAll("tr[data-member]").forEach(tr => {
    const member = tr.dataset.member;
    tr.querySelector(".pi-role").addEventListener("change",
      e => post("/api/project/member", {member, role: e.target.value}));
    tr.querySelector(".pi-until").addEventListener("change",
      e => post("/api/project/member", {member, until: e.target.value}));
    const pos = tr.querySelector(".pi-pos");
    pos.addEventListener("change",
      e => post("/api/project/member", {member, position: e.target.value}));
    const rm = tr.querySelector("[data-rm]");
