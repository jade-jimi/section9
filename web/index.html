[data-skin="cobalt"] .hrow2 .chk{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .hrow2 .chk input{accent-color:var(--cb-ink)}
/* 밴드 위 텍스트는 전부 밴드 잉크로 — 라이트 tone에서 --text/--muted를 그대로
   쓰면 남색 위 검정이 되어 신원 줄이 사라졌다 (REQ-20260825-081 점검). */
[data-skin="cobalt"] .hrow2 .who{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .hrow2 .who b{color:var(--cb-ink)}
[data-skin="cobalt"] .hrow2 .who .as{color:#d6c8ff}
[data-skin="cobalt"] .hrow2 .who.warn{color:#ffb4b0}
[data-skin="cobalt"] .hrow2 .who.warn code{border-color:var(--cb-edge)}
[data-skin="cobalt"] .hrow2 .usagechip{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .hrow2 .usagechip .warn{color:#ffd27a}
[data-skin="cobalt"] .hrow2 .usagechip .crit{color:#ffb4b0}
[data-skin="cobalt"] .hrow2 .pbadge,[data-skin="cobalt"] .hrow2 .reqhint{color:#ffd27a}
[data-skin="cobalt"] .hrow3{background:var(--cb-band2);border-top:1px solid var(--cb-edge);
  padding:7px 24px}
[data-skin="cobalt"] .oc-mark,[data-skin="cobalt"] .oc-t{color:#ffd27a}
[data-skin="cobalt"] .oc-d,[data-skin="cobalt"] .oc-note{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .oc-d code{color:var(--cb-ink)}
[data-skin="cobalt"] .oc-cmd{background:transparent;border-color:var(--cb-edge);
  color:var(--cb-ink);border-radius:7px}
[data-skin="cobalt"] .oc-cmd::before{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .oc-cmd:hover{background:var(--cb-ink);color:var(--cb-band)}
[data-skin="cobalt"] .oc-cmd:hover::before{color:var(--cb-band)}
[data-skin="cobalt"] .oc-copied{color:#a7f3d0}
[data-skin="cobalt"] .oc-fold,[data-skin="cobalt"] .oc-open{color:var(--cb-ink-dim)}
[data-skin="cobalt"] .oc-fold:hover,[data-skin="cobalt"] .oc-open:hover{color:var(--cb-ink)}
[data-skin="cobalt"] .pdiv{background:var(--cb-edge)}
[data-skin="cobalt"] .gear{background:transparent;border-color:var(--cb-edge);
  color:var(--cb-ink);border-radius:7px}
[data-skin="cobalt"] .gear:hover{background:var(--cb-ink);color:var(--cb-band)}
[data-skin="cobalt"] .settings-panel{top:118px;border-radius:12px}
/* 콘텐츠: 라운드 카드 그리드 — 밴드 아래는 밝고 정돈된 작업면 */
[data-skin="cobalt"] .stats,[data-skin="cobalt"] .docs,[data-skin="cobalt"] .audit,
[data-skin="cobalt"] .graphwrap,[data-skin="cobalt"] .depsum,[data-skin="cobalt"] .streamwrap,
[data-skin="cobalt"] .proj-info,[data-skin="cobalt"] .mystrip{border-radius:12px}
[data-skin="cobalt"] .docs,[data-skin="cobalt"] .audit,[data-skin="cobalt"] .graphwrap,[data-skin="cobalt"] .depsum,
[data-skin="cobalt"] .streamwrap,[data-skin="cobalt"] .stats{overflow:hidden}
[data-skin="cobalt"] .board{background:transparent;border:0;gap:12px}
[data-skin="cobalt"] .col,[data-skin="cobalt"] .col:last-child{background:var(--panel);
  border:1px solid var(--border);border-radius:12px}
/* 액센트 = 밴드색 계열(--c-open): 선택·활성 신호를 일관 코딩 */
[data-skin="cobalt"] .stat.on{box-shadow:inset 0 -2px 0 var(--c-open);color:var(--text)}
[data-skin="cobalt"] .typebar .tb.on{color:var(--c-open);border-bottom-color:var(--c-open)}
[data-skin="cobalt"] .doclist .row.sel,[data-skin="cobalt"] .mystrip .ms-row.sel{
  box-shadow:inset 2px 0 0 var(--c-open)}
[data-skin="cobalt"] .more:hover{color:var(--c-open)}
[data-skin="cobalt"] .acts button,[data-skin="cobalt"] .gmode,[data-skin="cobalt"] .pi-x,
[data-skin="cobalt"] .uform button{border-radius:7px}
[data-skin="cobalt"] .hovercard{border-radius:10px}
[data-skin="cobalt"] .ccterm{border-radius:12px}

/* ============ skin: grid — 풀블리드 고밀도 데이터 그리드 ============
   프레임·여백을 걷어낸 엣지-투-엣지 그리드: 잉크 인버스 헤더 바 + 지브라 행 +
   전폭 컬럼. 축: 셸(풀블리드) + 밀도(고) + 모양(라운드 0·면 채움 헤더).
   서체는 베이스 그대로(sans) — terminal(전면 mono·인버스 hover)과 다른 문법. */
[data-skin="grid"] main{padding:0}
[data-skin="grid"] .count{margin:0;padding:7px 14px;border-bottom:1px solid var(--hairline)}
[data-skin="grid"] .hrow1{padding:10px 14px 0}
[data-skin="grid"] .brand{padding-bottom:9px}
[data-skin="grid"] .tabs button{padding:3px 11px 9px}
[data-skin="grid"] .hrow2{padding:6px 14px}
[data-skin="grid"] .hrow3{padding:5px 14px}
[data-skin="grid"] .stats,[data-skin="grid"] .board,[data-skin="grid"] .docs,
[data-skin="grid"] .audit,[data-skin="grid"] .graphwrap,[data-skin="grid"] .depsum,[data-skin="grid"] .streamwrap{
  border-left:0;border-right:0;border-top:0}
[data-skin="grid"] .stats{margin:0}
[data-skin="grid"] .stat{flex:1 1 auto}
/* 활성 스탯의 기본 신호는 2px 인셋 밑줄인데, grid에서는 바로 아래 잉크 인버스
   컬럼 헤더 바에 붙어 삼켜진다 (REQ-20260825-081 픽셀 실측). 이 스킨의 활성
   문법인 잉크 인버스로 바꾼다 — 컬럼 헤더·그룹 헤더와 같은 규칙. */
[data-skin="grid"] .stat.on{background:var(--text);color:var(--bg);box-shadow:none}
[data-skin="grid"] .stat.on b{color:var(--bg)}
[data-skin="grid"] .proj-info,[data-skin="grid"] .mystrip{margin:10px 14px}
/* 컬럼: 고정폭을 버리고 화면을 나눠 가진다 — 잉크 헤더 바가 구획의 앵커 */
[data-skin="grid"] .board{padding-bottom:0}
[data-skin="grid"] .col{flex:1 1 0;width:auto;min-width:212px;padding-bottom:0}
[data-skin="grid"] .col h2{background:var(--text);color:var(--bg);border-bottom:0;
  letter-spacing:.12em;padding:8px 12px}
[data-skin="grid"] .col h2 .n{color:color-mix(in srgb, var(--bg) 72%, transparent)}
[data-skin="grid"] .doclist .grp{background:var(--text);color:var(--bg);border-bottom:0}
[data-skin="grid"] .typebar{padding:0 12px;border-bottom-color:var(--border)}
[data-skin="grid"] .audit th{background:var(--text);color:var(--bg);border-bottom:0}
[data-skin="grid"] .audit .cap{border-bottom-color:var(--hairline)}
/* 지브라 + 조밀 행 */
[data-skin="grid"] .card{padding:7px 12px}
[data-skin="grid"] .card .t{font-size:12.5px;margin:2px 0 4px;padding-right:52px}
[data-skin="grid"] .card:nth-child(even),
[data-skin="grid"] .audit tbody tr:nth-child(even) td,
[data-skin="grid"] .doclist .row:nth-child(even){

[data-skin="grid"] .card:hover,[data-skin="grid"] .doclist .row:hover{

[data-skin="grid"] .audit tr:hover td{

[data-skin="grid"] .doclist .row{padding:6px 12px}
[data-skin="grid"] .doclist{width:300px}
[data-skin="grid"] .viewer{padding:18px 26px}
[data-skin="grid"] .settings-panel{top:84px}

/* skin: cockpit — 제거됨 (REQ-20260825-079: 다크-온-다크로 판독 불가).
   저장값 cockpit은 opts 검증에서 기본(ledger)으로 폴백된다. */

/* ============ skin: slate — 라이트 SaaS 셸·블루 액센트 ============
   메인스트림 협업 도구의 디자인 언어(상표 요소 없이): 회청(blue-gray) 캔버스 위
   화이트 패널 + 미세 그림자 + 6~8px 라운드, 명확한 블루 프라이머리(활성 탭·선택·버튼),
   컴팩트하고 단정한 밀도의 화이트 제품 네비. 축: 배경(회청 캔버스) + 깊이(카드 그림자) +
   모양(라운드) + 색(블루 액센트). cobalt(짙은 밴드 셸)와 달리 헤더가 밝다.
   전 색상 tone 토큰 color-mix 파생 — 4 tone 성립. 그림자는 남색 저알파 고정(다크에선 침잠). */
[data-skin="slate"]{
  --sl-canvas:color-mix(in srgb, var(--c-open) 9%, color-mix(in srgb, var(--text) 4%, var(--bg)));
  --sl-line:color-mix(in srgb, var(--c-open) 16%, var(--border));
  --sl-blue:var(--c-open);
  --sl-tint:color-mix(in srgb, var(--c-open) 10%, var(--panel));
  --sl-tint2:color-mix(in srgb, var(--c-open) 16%, var(--panel));
  --sl-shadow:0 1px 2px rgba(9,30,66,.14), 0 0 1px rgba(9,30,66,.16);
  --sl-pop:0 8px 20px -6px rgba(9,30,66,.22), 0 0 1px rgba(9,30,66,.2);
}
[data-skin="slate"] body{background:var(--sl-canvas);font-size:13px}
/* 화이트 제품 네비: 패널색 2단 바 + 블루 활성 언더라인 */
[data-skin="slate"] header{background:var(--panel);border-bottom:1px solid var(--sl-line);
  box-shadow:var(--sl-shadow)}
[data-skin="slate"] .hrow1{padding:12px 22px 0}
[data-skin="slate"] .tabs button{padding:4px 12px 12px;border-bottom-width:3px}
[data-skin="slate"] .tabs button:hover{color:var(--sl-blue)}
[data-skin="slate"] .tabs button.active{color:var(--sl-blue);border-bottom-color:var(--sl-blue)}
[data-skin="slate"] .brand .dot{background:var(--sl-blue);border-radius:2px}
[data-skin="slate"] .hrow2{background:var(--panel)}
[data-skin="slate"] .hrow2 input[type="text"],[data-skin="slate"] .hrow2 select,
[data-skin="slate"] .settings-panel select,[data-skin="slate"] .uform input,
[data-skin="slate"] .uform select,[data-skin="slate"] .uf{
  border-radius:4px;border-color:var(--sl-line)}
[data-skin="slate"] .hrow2 input[type="text"]:focus,[data-skin="slate"] .hrow2 select:focus{
  outline:2px solid var(--sl-blue);outline-offset:-1px}
[data-skin="slate"] .chk input{accent-color:var(--sl-blue)}
/* 버튼 = 블루 프라이머리 문법 (베이스 잉크 인버스를 블루로 교체) */
[data-skin="slate"] .gear,[data-skin="slate"] .acts button,[data-skin="slate"] .gmode,
[data-skin="slate"] .uform button,[data-skin="slate"] .pi-x{border-radius:4px}
[data-skin="slate"] .gear:hover,[data-skin="slate"] .acts button:hover,
[data-skin="slate"] .uform button:hover{
  background:var(--sl-blue);color:#fff;border-color:var(--sl-blue)}
[data-skin="slate"] .gmode.on{background:var(--sl-blue);color:#fff;border-color:var(--sl-blue)}
[data-skin="slate"] .pi-x:hover:not(:disabled){background:var(--sl-blue);color:#fff;
  border-color:var(--sl-blue)}
/* 패널 = 화이트 카드: 라운드 8px + 미세 그림자 */
[data-skin="slate"] .stats,[data-skin="slate"] .docs,[data-skin="slate"] .audit,
[data-skin="slate"] .graphwrap,[data-skin="slate"] .depsum,[data-skin="slate"] .streamwrap,
[data-skin="slate"] .proj-info,[data-skin="slate"] .mystrip{
  border-radius:8px;border-color:var(--sl-line);box-shadow:var(--sl-shadow)}
[data-skin="slate"] .docs,[data-skin="slate"] .audit,[data-skin="slate"] .graphwrap,[data-skin="slate"] .depsum,
[data-skin="slate"] .streamwrap,[data-skin="slate"] .stats{overflow:hidden}
/* Board: 컬럼이 각각 화이트 카드로 분리 — 캔버스가 사이로 보인다 */
[data-skin="slate"] .board{background:transparent;border:0;gap:10px}
[data-skin="slate"] .col,[data-skin="slate"] .col:last-child{background:var(--panel);
  border:1px solid var(--sl-line);border-radius:8px;box-shadow:var(--sl-shadow)}
[data-skin="slate"] .card{padding:9px 13px}
[data-skin="slate"] .card .t{font-size:13px}
[data-skin="slate"] .card:hover{background:var(--sl-tint)}
/* 선택·활성 = 블루 코딩 */
[data-skin="slate"] .stat.on{box-shadow:inset 0 -2px 0 var(--sl-blue);color:var(--text)}
[data-skin="slate"] .stat:hover{background:var(--sl-tint)}
[data-skin="slate"] .doclist .row:hover,[data-skin="slate"] .urow:hover,
[data-skin="slate"] .backlinks .bl:hover,[data-skin="slate"] .mystrip .ms-row:hover{
  background:var(--sl-tint)}
[data-skin="slate"] .audit tr:hover td{background:var(--sl-tint)}
[data-skin="slate"] .typebar .tb.on{color:var(--sl-blue);border-bottom-color:var(--sl-blue)}
[data-skin="slate"] .typebar .tb:hover{color:var(--sl-blue)}
[data-skin="slate"] .doclist .row.sel,[data-skin="slate"] .mystrip .ms-row.sel{
  background:var(--sl-tint);box-shadow:inset 2px 0 0 var(--sl-blue)}
[data-skin="slate"] a.doclink{color:var(--sl-blue)}
[data-skin="slate"] .md a{color:var(--sl-blue)}
[data-skin="slate"] .more:hover{color:var(--sl-blue)}
[data-skin="slate"] .settings-panel,[data-skin="slate"] .hovercard{
  border-radius:8px;border-color:var(--sl-line);box-shadow:var(--sl-pop)}
[data-skin="slate"] .col.dropok{outline-color:var(--sl-blue);border-radius:8px}
[data-skin="slate"] .ghint{border-radius:4px}
[data-skin="slate"] .ccterm{border-radius:8px}
[data-skin="slate"] header button:focus-visible,[data-skin="slate"] a:focus-visible,
[data-skin="slate"] input:focus-visible,[data-skin="slate"] select:focus-visible{
  outline-color:var(--sl-blue)}

/* ============ skin: cork — 컬러 캔버스 보드 웰 ============
   대중적 칸반 보드의 디자인 언어(상표 요소 없이): 은은한 단색 컬러 캔버스가 지면,
   컬럼 = 라운드 회색 웰(보드가 주인공), 카드 = 화이트 라운드 + 얕은 그림자 + hover
   리프트. 가볍고 친근한 밀도. 축: 배경(컬러 캔버스) + 셸(웰 보드 문법) + 깊이(리프트).
   field(고채도 멀티컬러+플랫 판)와 달리 저채도 단일 계열 + 웰/리프트가 언어.
   캔버스는 --c-open→--c-done 저농도 사선 그라데이션 — 4 tone 성립. */
[data-skin="cork"]{
  --ck-canvas:linear-gradient(160deg,
    color-mix(in srgb, var(--c-open) 46%, var(--bg)) 0%,
    color-mix(in srgb, var(--c-open) 30%, var(--bg)) 55%,
    color-mix(in srgb, var(--c-done) 26%, var(--bg)) 100%);
  --ck-well:color-mix(in srgb, var(--text) 7%, var(--panel));
  --ck-line:color-mix(in srgb, var(--text) 14%, transparent);
  --ck-shadow:0 1px 1px rgba(20,25,35,.16);
  --ck-lift:0 6px 14px -6px rgba(20,25,35,.3);
}
[data-skin="cork"] body{background:var(--ck-canvas);background-attachment:fixed}
/* 헤더 = 캔버스 위 반투명 판 (블러 없음 — glass와 다른 문법) */
[data-skin="cork"] header{background:color-mix(in srgb, var(--panel) 62%, transparent);
  border-bottom:1px solid var(--ck-line)}
[data-skin="cork"] .tabs button{border-bottom:0;border-radius:6px;padding:5px 12px;
  margin:0 0 9px}
[data-skin="cork"] .tabs button:hover{
  background:color-mix(in srgb, var(--panel) 55%, transparent);color:var(--text)}
[data-skin="cork"] .tabs button.active{background:var(--panel);color:var(--text);
  box-shadow:var(--ck-shadow)}
[data-skin="cork"] .hrow2,[data-skin="cork"] .hrow3{border-top-color:var(--ck-line)}
[data-skin="cork"] .hrow2 input[type="text"],[data-skin="cork"] .hrow2 select{
  border-radius:6px;border-color:var(--ck-line)}
[data-skin="cork"] .gear,[data-skin="cork"] .gmode,[data-skin="cork"] .acts button,
[data-skin="cork"] .uform button,[data-skin="cork"] .pi-x{border-radius:6px}
[data-skin="cork"] .pdiv{background:var(--ck-line)}
/* Board = 주인공: 프레임 상자를 버리고 웰 컬럼이 캔버스 위에 뜬다 */
[data-skin="cork"] .board{background:transparent;border:0;gap:12px;padding-bottom:6px}
[data-skin="cork"] .col,[data-skin="cork"] .col:last-child{
  background:var(--ck-well);border:0;border-radius:12px;padding:4px 6px 8px}
[data-skin="cork"] .col h2{border-bottom:0;padding:9px 10px 5px}
[data-skin="cork"] .cards{gap:7px;padding:2px 4px}
[data-skin="cork"] .card{background:var(--panel);border-bottom:0;border-radius:8px;
  box-shadow:var(--ck-shadow);padding:9px 12px;
  transition:transform .12s ease, box-shadow .12s ease}
[data-skin="cork"] .card:hover{background:var(--panel);transform:translateY(-2px);
  box-shadow:var(--ck-lift)}
[data-skin="cork"] .col .more{padding-left:10px}
[data-skin="cork"] .col.dropok{outline-color:var(--text);border-radius:12px;
  background:color-mix(in srgb, var(--text) 12%, var(--ck-well))}
/* 다른 탭들도 같은 문법: 캔버스 위 라운드 화이트 판 */
[data-skin="cork"] .stats,[data-skin="cork"] .docs,[data-skin="cork"] .audit,
[data-skin="cork"] .graphwrap,[data-skin="cork"] .depsum,[data-skin="cork"] .streamwrap,
[data-skin="cork"] .proj-info,[data-skin="cork"] .mystrip{
  border:0;border-radius:12px;box-shadow:var(--ck-shadow)}
[data-skin="cork"] .docs,[data-skin="cork"] .audit,[data-skin="cork"] .graphwrap,[data-skin="cork"] .depsum,
[data-skin="cork"] .streamwrap,[data-skin="cork"] .stats{overflow:hidden}
[data-skin="cork"] .settings-panel,[data-skin="cork"] .hovercard{border-radius:10px;
  border-color:var(--ck-line);box-shadow:var(--ck-lift)}
[data-skin="cork"] .ghint{border-radius:6px}
[data-skin="cork"] .md pre{border-radius:8px;border-left:0}
[data-skin="cork"] .md code{border-radius:4px}
[data-skin="cork"] .term{border-radius:10px;margin:8px}
[data-skin="cork"] .ccterm{border-radius:12px}

/* ============ density: compact — 초고밀도 (skin과 독립인 밀도 축) ============ */
[data-density="compact"] body{font-size:12px}
[data-density="compact"] main{padding:10px 12px}
[data-density="compact"] .stats .stat{padding:4px 10px}
[data-density="compact"] .stats .stat b{font-size:12.5px}
[data-density="compact"] .col{flex-basis:198px;min-width:176px;width:auto}
[data-density="compact"] .col h2{padding:7px 10px}
[data-density="compact"] .card{padding:5px 10px}
[data-density="compact"] .card .id{font-size:9px}
[data-density="compact"] .card .t{font-size:12px;font-weight:500;margin:1px 0 2px;line-height:1.3}
[data-density="compact"] .card .m{font-size:9.5px;gap:6px}
[data-density="compact"] .doclist .row{padding:4px 10px}
[data-density="compact"] .doclist .row>div:nth-child(3){font-size:12px}
[data-density="compact"] .viewer{padding:14px 20px}
[data-density="compact"] .metatbl td{padding:3px 8px 3px 0;font-size:11.5px}
[data-density="compact"] .audit td{padding:4px 10px;font-size:11.5px}
[data-density="compact"] .term{font-size:11px;line-height:1.45}
[data-density="compact"] .acts button{padding:1px 7px;font-size:9.5px}

/* ------- users 탭 ------- */
.uform{display:flex;flex-direction:column;gap:6px;padding:10px 14px 14px}
.uform input,.uform select,.uf{border:1px solid var(--border);padding:5px 9px;
  font-size:12.5px;background:var(--panel);color:var(--text);font-family:inherit}
.uf{width:min(300px,100%)}
.uform button{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:6px;cursor:pointer;letter-spacing:.03em}
.uform button:hover{background:var(--text);color:var(--bg)}
/* ------- 머신·계정 이력 표 (REQ-20260827-066) -------
   메타데이터의 어휘 그대로다: 모노 · 작은 글자 · 헤어라인 행 구분. 색면도
   세로 띠도 없고, 위계는 잉크의 명도와 굵기로만 만든다. 열 이름은 한 번만
   가르치면 되므로 faint 로 두되 잘려 보이지 않게 대문자 트래킹은 로마자에만
   해당하는 규칙이라 한글 열 이름에는 자간을 벌리지 않는다. */
/* 넘치면 **표만** 가로로 스크롤한다 — 판이 통째로 밀리면 옆의 폼까지 어긋난다 */
.mhwrap{overflow-x:auto;margin:10px 0 24px}
.mhtbl{width:100%;border-collapse:collapse;font-size:12px;
  border-top:1px solid var(--border)}
.mhtbl th{text-align:left;font-weight:400;font-size:10px;color:var(--faint);
  padding:6px 14px 6px 0;border-bottom:1px solid var(--hairline);white-space:nowrap}
.mhtbl td{padding:7px 14px 7px 0;border-bottom:1px solid var(--hairline);
  white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.mhtbl tr td:last-child,.mhtbl tr th:last-child{padding-right:0}
/* 머신 이름이 이 표의 주어다 — 한 급 굵고 잉크로 */
.mhtbl td.mn{color:var(--text);font-weight:600}
/* 경과는 마지막 칸에 붙는 부차 값이다 — 날짜 옆에서 "얼마나 됐나"만 말한다 */
.mhtbl .mel{color:var(--faint);font-size:10px;margin-left:8px}
/* 하루가 넘은 줄 — 색상이 아니라 명도로 뒤로 물린다. 지금 쓰는 머신이 위에서
   먼저 읽히게 하는 것이 이 표의 전부다. */
.mhtbl tr.stale td,.mhtbl tr.stale td.mn{color:var(--faint);font-weight:400}
/* 처음과 마지막이 같은 줄 = 한 번 스쳐간 머신 */
.mhtbl .mone{color:var(--muted)}
.mhtbl tr.stale .mone{color:var(--faint)}
.mhempty{margin:10px 0 24px}
.cfg-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin:26px 0 4px;font-weight:600;font-family:var(--mono);
  border-top:1px solid var(--border);padding-top:14px}
/* 프로필 확장 (REQ-20260824-055 E7) — 미기재 신호는 앰버, 실패는 인라인 mono (팝업 금지) */
.pbadge{font-family:var(--mono);font-size:11px;color:var(--c-inprogress);margin-left:5px}
.reqhint{font-family:var(--mono);font-size:10px;color:var(--c-inprogress);
  text-transform:uppercase;letter-spacing:.05em;margin-left:8px;white-space:nowrap}
.ferr{font-family:var(--mono);font-size:11px;color:var(--c-blocked);align-self:center;
  margin-left:4px}
.emrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.emrow .em-rm{border:1px solid var(--border);background:var(--panel);color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:4px 8px;cursor:pointer;line-height:1.2}
.emrow .em-rm:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.em-add{border:0;background:none;color:var(--faint);padding:2px 0;cursor:pointer;
  font-size:11px;font-family:var(--mono);text-align:left}
.em-add:hover{color:var(--text);text-decoration:underline}

/* ================= tone: mist — 안개 회청 라이트 (REQ-20260825-062 재작업)
   토스/애플 계보의 밝은 화면: 캔버스는 옅은 회청, 면은 순백, 잉크는 남색조
   회흑. 강조는 단일 파랑 하나로 몰아 시선을 분산시키지 않는다. */
:root[data-theme="mist"]{
  --bg:#eef1f6; --panel:#ffffff; --border:#dde3ec; --hairline:#e9edf4;
  --text:#101828; --muted:#5a6474; --faint:#98a2b3; --accent:#2f6bff;
  --c-open:#2f6bff; --c-inprogress:#b25e09; --c-blocked:#d92d20;
  --c-review:#7a5af8; --c-done:#0f9d76; --c-cancelled:#98a2b3;
  --c-draft:#98a2b3; --c-published:#0e7090;
  --t-request:#2f6bff; --t-knowledge:#0e7090; --t-session:#8a5a2b; --t-question:#b42573;
  --t-article:#7c3aed;
  --accent-soft:#e4eaf5; --accent-line:#2f6bff;
}
/* ================= tone: graphite — 그래파이트 다크
   애플 다크 계보: 완전 검정 대신 청색이 도는 흑연, 면은 한 단계 밝은 판,
   강조는 청록 섞인 파랑. 야간 장시간 작업에서 눈이 덜 피로하도록 대비를
   과하게 올리지 않는다(본문 대비 ~9:1). */
:root[data-theme="graphite"]{
  --bg:#15181d; --panel:#1c2028; --border:#2c323d; --hairline:#242932;
  --text:#e6e9ef; --muted:#9aa4b2; --faint:#6b7688; --accent:#5b9dff;
  --c-open:#5b9dff; --c-inprogress:#e0a14a; --c-blocked:#f27171;
  --c-review:#a78bfa; --c-done:#34d3a6; --c-cancelled:#6b7688;
  --c-draft:#6b7688; --c-published:#3fb6c8;
  --t-request:#5b9dff; --t-knowledge:#3fb6c8; --t-session:#e0a14a; --t-question:#f08fb8;
  --accent-soft:#232a35; --accent-line:#5b9dff;
}


/* ================= skin: calm — 여백과 카드 (REQ-20260825-062 재작업)
   애플 HIG·토스류 제품 언어: ① 배경/깊이 반전 — 캔버스는 낮고 카드는 떠 있다
   (보더 대신 얕은 그림자) ② 모양 — 라운드 14px, 선이 아니라 면으로 구획
   ③ 타이포 스케일 — 제목을 키우고 메타를 낮춰 위계를 크게 벌린다
   ④ 셸 — 컬럼이 회색 웰이 아니라 캔버스 위 카드 묶음, 여백이 리듬.
   ledger(선으로 나눈 계기판)와 정반대 축이라 썸네일에서 즉시 구분된다. */
/* --calm-r / --calm-shadow 실값은 아래 재설계 블록이 단일 소유 (토큰 파생) */
[data-skin="calm"]{ --calm-r:14px }
[data-skin="calm"] body{background:var(--bg)}
[data-skin="calm"] header{background:var(--panel);border-bottom:0;
  box-shadow:0 1px 0 var(--hairline);padding:14px 26px 10px}
[data-skin="calm"] .brand{font-size:17px;letter-spacing:-.02em}
[data-skin="calm"] .tabs button{border-bottom:0;border-radius:999px;padding:7px 15px;
  font-size:13px;color:var(--muted)}
[data-skin="calm"] .tabs button:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
[data-skin="calm"] .tabs button.active{background:color-mix(in srgb,var(--accent) 12%,transparent);
  color:var(--accent);font-weight:600}
[data-skin="calm"] main{padding:22px 26px}
[data-skin="calm"] input[type="search"],[data-skin="calm"] select,
[data-skin="calm"] .uf{border-radius:10px;border:1px solid var(--border);
  background:var(--panel);padding:7px 11px}
[data-skin="calm"] .stats{border:0;gap:8px;background:none;margin-bottom:20px}
[data-skin="calm"] .stat{border:0;border-radius:999px;background:var(--panel);
  box-shadow:var(--calm-shadow);padding:9px 16px;font-size:12px}
[data-skin="calm"] .stat.on{background:var(--text);color:var(--bg)}
[data-skin="calm"] .stat.on b{color:var(--bg)}  /* 잉크 필 위 카운트 — 미복원 시 숫자가 안 보인다 */
[data-skin="calm"] .stat.on .cdot{background:var(--bg)}
[data-skin="calm"] .board{gap:14px}
[data-skin="calm"] .col{border-right:0;background:none;min-width:288px;width:288px;padding:0 2px}
[data-skin="calm"] .col h2{font-size:12.5px;letter-spacing:0;text-transform:none;
  font-weight:600;color:var(--text);padding:0 6px 10px;border-bottom:0}
[data-skin="calm"] .col .n{color:var(--faint);font-weight:500}
[data-skin="calm"] .cards{display:flex;flex-direction:column;gap:10px}
[data-skin="calm"] .card{background:var(--panel);border:0;border-radius:var(--calm-r);
  box-shadow:var(--calm-shadow);padding:16px 18px;transition:box-shadow .16s ease,transform .16s ease}
/* hover 실값도 재설계 블록이 단일 소유 — 여기서는 선언하지 않는다 */
[data-skin="calm"] .card .t{font-size:15px;font-weight:650;line-height:1.4;margin:6px 0 10px}
[data-skin="calm"] .card .id{font-size:11px;letter-spacing:.01em}
[data-skin="calm"] .card .m{font-size:11.5px;gap:8px}
[data-skin="calm"] .card .tag,[data-skin="calm"] .card .size,[data-skin="calm"] .card .badge{
  border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--text) 5%,transparent);border:0}
[data-skin="calm"] .card .elapsed{color:var(--faint);font-size:11px}
[data-skin="calm"] .rvpt{border-radius:0;margin-top:10px;border-left:0}
[data-skin="calm"] .acts button{border-radius:999px;border:1px solid var(--border);
  padding:5px 13px;background:var(--panel)}
[data-skin="calm"] .acts button:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
[data-skin="calm"] .viewer,[data-skin="calm"] .doclist{background:var(--panel);
  border-radius:var(--calm-r);box-shadow:var(--calm-shadow);border:0}
[data-skin="calm"] .metatbl{border-top:0}
[data-skin="calm"] .metatbl td{border-bottom:1px solid var(--hairline);padding:10px 12px 10px 0}
[data-skin="calm"] .colempty{border-radius:var(--calm-r);background:var(--panel);
  box-shadow:var(--calm-shadow);text-align:center;padding:22px 16px}
[data-skin="calm"] .more{border-radius:999px;padding:6px 14px}
/* 어두운 톤에서 그림자는 보이지 않는다 — 보더 0 + 그림자만으로는 카드가 판에
   잠긴다(교차 리뷰 지적 4). calm 의 부드러운 언어를 유지하되 헤어라인 한 겹으로
   "여기까지가 카드"를 늘 말하게 한다. */
[data-skin="calm"] .hovercard{border-radius:12px;border:1px solid var(--hairline);
  box-shadow:var(--calm-shadow)}
/* --- calm 보드 재설계 (REQ-20260825-072) — "색은 면이 아니라 잉크로" ------
   제약(사용자 확정): ① 카드 안 틴트 색면 금지 ② 카드 좌측 세로 컬러 띠·규칙선
   금지 ③ 무채색 미니멀 일변도 금지. → 색은 **글자·윤곽·마크**로만 쓰고,
   예쁨은 타이포 위계·여백 리듬·깊이에서 만든다.

   설계 4축
   ① 읽기 순서: 마크업은 [id → 제목 → 메타 → 판정]이지만 카드에서 먼저
      읽혀야 할 것은 제목이다. flex order로 [제목 → 메타 → 판정 → id·경과]로
      재배치한다(마크업 무변경). id·경과는 참조 정보라 푸터로 내린다.
   ② 색의 위치: 컬럼 카운트(큰 상태색 숫자) · 태그 글자(해시 hue) ·
      담당자 이니셜 링(hue) · hover 시 카드 테두리(상태색) · TDD 칩(윤곽).
      면적을 가진 색은 캔버스의 공기(파랑~청록 저알파 그라디언트)뿐이다.
   ③ 깊이: 톤마다 수단이 다르다 — 라이트는 2단 그림자, 다크는 링+면 밝기.
      hover는 2px 부상 + 상태색 테두리(120~180ms ease-out, reduced-motion 존중).
   ④ 리듬: 컬럼 카운트가 보드 상단에 정렬된 눈금을 만들고, 간격은 4/8 배수.

   hue 파생색(--ah 사용자, --th 태그)은 hue만 JS 해시에서 오고 채도/명도는
   톤별 변수(--hu-, --av- 계열)로 분리해 라이트·다크 모두 본문 대비를 지킨다. */
[data-skin="calm"]{
  --calm-r:12px;
  --calm-shadow:
    0 1px 2px color-mix(in srgb,var(--text) 7%,transparent),
    0 8px 18px -8px color-mix(in srgb,var(--text) 24%,transparent);
  /* 참조용 조용한 잉크 — faint(2.4:1)는 본문 대비 미달이라 muted 쪽으로 당긴다 */
  --calm-quiet:color-mix(in srgb,var(--muted) 82%,var(--faint));
  --hu-s:58%; --hu-l:31%;                /* 태그 글자 — 전 hue 4.8:1 이상의 주얼톤 */
  --av-s:54%; --av-l:32%; --av-bl:64%;   /* 이니셜 글자 / 링 */
}
/* 캔버스: 파랑–청록 계열의 아주 옅은 공기. 연보라/연주황 틴트 인상을 피한다 */
[data-skin="calm"] body{
  background:
    radial-gradient(1150px 470px at 6% -12%, color-mix(in srgb,var(--c-open) 12%,transparent) 0, transparent 68%),
    radial-gradient(950px 420px at 97% -8%, color-mix(in srgb,var(--c-published) 10%,transparent) 0, transparent 66%),
    var(--bg);
  background-attachment:fixed;
}

/* ---- 헤더: 활성 탭은 색면 pill이 아니라 잉크 필 (대비 최대·색면 0) ---- */
[data-skin="calm"] .tabs button{font-weight:500}
[data-skin="calm"] .tabs button:hover{
  background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
[data-skin="calm"] .tabs button.active{
  background:var(--text);color:var(--bg);font-weight:600}
[data-skin="calm"] .tabs button.active .pbadge{color:var(--bg)}
[data-skin="calm"] .count{color:var(--faint);margin-bottom:12px}

/* ---- 필터 줄: 보드보다 조용하게. 숫자에만 상태색, 활성만 잉크 필 ---- */
[data-skin="calm"] .stats{gap:6px;margin-bottom:18px}
[data-skin="calm"] .stat{background:none;box-shadow:none;border:1px solid transparent;
  border-right:0;border-radius:999px;padding:6px 13px;font-size:10.5px;gap:7px;
  color:var(--muted);transition:border-color .15s ease,color .15s ease}
[data-skin="calm"] .stat b{color:var(--sc,var(--text));font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[data-skin="calm"] .stat:hover{background:none;border-color:var(--border);color:var(--text)}
[data-skin="calm"] .stat.on{background:var(--text);color:var(--bg);border-color:var(--text)}
[data-skin="calm"] .stat.on b,[data-skin="calm"] .stat.on:hover{color:var(--bg)}
[data-skin="calm"] .stat .cdot{width:6px;height:6px;border-radius:50%}

/* ---- 보드: 컬럼은 캔버스 위 카드 묶음. 넓으면 균등, 좁으면 가로 스크롤 ---- */
/* 보드 자체는 판이 아니라 캔버스다 — base의 흰 패널/보더를 걷어내야 카드가
   "떠 있고" 배경의 옅은 색 공기가 보인다 (calm 깊이 반전의 전제) */
/* 좌우 4px 은 장식이 아니라 **잘림 여유**다 (REQ-20260827-058). `.board` 는
   가로 스크롤 컨테이너라(overflow-x:auto) 스크롤이 생기든 말든 제 패딩 상자에서
   자르고, calm 의 어두운 톤 카드 윤곽은 border 가 아니라 박스 **밖**에 그리는
   `0 0 0 1px` 링이다. 첫 컬럼 카드가 판 끝에 정확히 붙어 있어(측정: 여유 0.00px)
   그 링의 왼쪽 1px 이 통째로 잘렸다 — 위·오른쪽·아래는 자르는 모서리에 닿지
   않아 살아남는다. 사용자가 "왼쪽 테두리만 잘린다"고 본 그림이 이것이다.
   4px 인 이유: 포커스 링이 `outline:2px` + `outline-offset:2px` 라 박스 밖
   4px 을 쓴다. 1px 만 주면 보이는 건 고쳐지고 키보드 표시는 계속 잘린다. */
[data-skin="calm"] .board{gap:16px;padding:0 4px 14px;background:none;border:0}
/* 1440px에서 5개 상태 컬럼이 모두 보이는 폭 — 워크플로 전체가 한 화면에 든다 */
/* 최소폭 262는 5개 컬럼(요청 상태 전부)이 1400px 이하에서 마지막 컬럼을 잘라
   먹는다 (REQ-20260825-081 실측). 여유 폭이 있으면 262로 벌고, 좁아지면 224까지
   양보한 뒤에야 가로 스크롤로 넘긴다. */
[data-skin="calm"] .col{flex:1 1 262px;min-width:224px;max-width:340px;width:auto;padding:0}
/* 컬럼 헤더 = 타이포 앵커: 상태명(잉크) + 오른쪽 끝 큰 상태색 숫자.
   숫자가 컬럼마다 같은 x에 서서 보드 상단에 눈금 리듬을 만든다. */
[data-skin="calm"] .col h2{display:flex;align-items:baseline;gap:8px;margin:0;
  padding:0 3px 11px;border-bottom:0;font-family:inherit;font-size:13px;font-weight:600;
  text-transform:none;letter-spacing:-.005em;color:var(--text)}
[data-skin="calm"] .col h2 .cdot{width:7px;height:7px;border-radius:50%;flex:none;
  align-self:center;background:var(--sc)}
[data-skin="calm"] .col h2 .n{margin-left:auto;background:none;padding:0;border-radius:0;
  color:var(--sc);font-size:19px;font-weight:700;line-height:1;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
[data-skin="calm"] .cards{gap:11px}

/* ---- 카드: 흰 종이. 색은 hover 테두리에만, 면은 끝까지 무채 ---- */
[data-skin="calm"] .card{display:flex;flex-direction:column;padding:14px 16px 13px;
  border-radius:var(--calm-r);border:1px solid color-mix(in srgb,var(--text) 8%,transparent);
  box-shadow:var(--calm-shadow);overflow:hidden;
  transition:box-shadow .18s cubic-bezier(.22,1,.36,1),
             transform .18s cubic-bezier(.22,1,.36,1),border-color .18s ease}
[data-skin="calm"] .card:hover{background:var(--panel);transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--sc) 45%,transparent);
  box-shadow:0 2px 4px color-mix(in srgb,var(--text) 9%,transparent),
             0 14px 28px -12px color-mix(in srgb,var(--text) 28%,transparent)}
[data-skin="calm"] .card:focus-visible{outline:2px solid var(--sc);outline-offset:2px}
/* 읽기 순서 재배치 — 제목이 카드의 첫 줄 */
[data-skin="calm"] .card .t{order:1;margin:0;padding-right:0;font-size:15px;font-weight:600;
  line-height:1.45;letter-spacing:-.014em;color:var(--text)}
[data-skin="calm"] .card .m{order:2;margin-top:9px;gap:9px;row-gap:5px;font-size:11px;
  align-items:center}
[data-skin="calm"] .card .judge,[data-skin="calm"] .card>.rvpt{order:3}
[data-skin="calm"] .card .id{order:4;margin-top:11px;display:flex;align-items:center;gap:2px;
  font-size:10px;color:var(--calm-quiet);letter-spacing:.03em}
[data-skin="calm"] .card .elapsed{position:absolute;right:16px;bottom:12px;top:auto;
  font-size:10px;color:var(--calm-quiet);letter-spacing:.01em}

/* 담당자 = 이니셜 링(면이 아니라 윤곽) + 이름. base의 "@" 접두는 링이 대신한다 */
[data-skin="calm"] .card .badge{display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;padding:0;color:var(--muted);font-size:11px}
[data-skin="calm"] .card .badge::before{content:none}
[data-skin="calm"] .card .av{flex:none;display:inline-flex;align-items:center;
  justify-content:center;width:18px;height:18px;border-radius:50%;background:none;
  border:1.5px solid hsl(var(--ah) var(--av-s) var(--av-bl));
  color:hsl(var(--ah) var(--av-s) var(--av-l));
  font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:0;line-height:1}
/* 태그 = 색 글자. 배경도 테두리도 없이 '#'과 글자색만으로 구분한다 */
[data-skin="calm"] .card .tag{background:none;border:0;padding:0;white-space:nowrap;
  font-size:11px;font-weight:500;color:hsl(var(--th) var(--hu-s) var(--hu-l))}
[data-skin="calm"] .card .tag::before{content:none}
/* 규모(S/M/L)는 담당자 이니셜과 같은 낱글자라 혼동된다 — 중립 윤곽 칩으로 분리 */
[data-skin="calm"] .card .size{background:none;color:var(--calm-quiet);font-size:9.5px;
  letter-spacing:.06em;border-radius:4px;padding:1px 5px;line-height:1.4;
  border:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
[data-skin="calm"] .card .tdd{border-radius:999px;padding:1px 7px;font-size:9.5px}
/* 우선순위 = 등급 낱말과 잉크. calm도 색면·pill은 쓰지 않는다(위 .size 칩과
   달리 윤곽조차 두지 않는다 — 테두리를 주면 눈이 그 상자에 먼저 걸린다).
   low/normal은 참조 잉크(--calm-quiet: id·size와 같은 층)로 물러나고,
   high/urgent만 상태 잉크로 나온다. 이니셜 링·태그 글자와 색이 겹치지 않게
   카드 한 장에 뜨는 강조는 최대 하나로 유지된다. */
[data-skin="calm"] .card .prio{font-size:11px}
[data-skin="calm"] .card .prio[data-tier="low"],
[data-skin="calm"] .card .prio[data-tier="normal"]{color:var(--calm-quiet)}

/* ---- 판정 블록: 캡션은 상태색 글자, 본문은 3줄로 접어 컬럼 리듬을 지킨다.
   접힌 내용은 카드 호버·키보드 포커스에서 전문으로 펼친다 (REQ-071 반려:
   3줄만으로는 리뷰 내용 파악 불가 — 호버 시 클램프 해제 + max-height 확장,
   포인터가 떠나면 3줄 리듬으로 복귀) ---- */
[data-skin="calm"] .judge{margin-top:12px;padding-top:11px;border-top:1px solid var(--hairline)}
[data-skin="calm"] .card>.rvpt{margin-top:12px;padding-top:11px;
  border-top:1px solid var(--hairline)}
[data-skin="calm"] .rvpt{background:none;border:0;padding:0;margin:0;font-size:11.5px;
  line-height:1.6;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  max-height:4.9em;transition:max-height .28s ease}
[data-skin="calm"] .card:hover .rvpt,[data-skin="calm"] .card:focus-within .rvpt{
  -webkit-line-clamp:unset;max-height:60em}
[data-skin="calm"] .rvcap{display:inline;margin:0 6px 0 0;font-size:9.5px;font-weight:700;
  letter-spacing:.08em;color:var(--faint)}
[data-skin="calm"] .judge .rvcap{color:var(--c-review)}
/* 배경 줄은 calm 에서도 조용하다: 상태색은 '확인 요청' 캡션 하나만 쓴다.
   클램프도 calm 의 언어(블록 전체 3줄 + 호버 전개)에 맡기고 베이스의 2줄
   클램프를 푼다 — -webkit-box 안에 -webkit-box 를 겹치지 않기 위해서다. */
[data-skin="calm"] .judge .rvpt.what .rvcap{color:var(--muted)}
/* calm 은 .rvpt 의 margin 을 0 으로 눕히므로 배경 줄과 확인 요청이 한 덩어리
   문장 벽으로 붙는다 — 두 갈래로 읽히게 간격을 돌려준다. */
[data-skin="calm"] .judge .rvpt.what{margin-bottom:10px}
[data-skin="calm"] .rvpt.what .wtx{display:inline;-webkit-line-clamp:unset;overflow:visible}
[data-skin="calm"] .card[data-status="blocked"] .rvcap{color:var(--c-blocked)}
[data-skin="calm"] .acts{gap:7px;margin-top:10px}
[data-skin="calm"] .acts button{border-radius:999px;border:1px solid var(--border);
  background:none;color:var(--muted);font-size:10.5px;padding:5px 12px;
  transition:background .15s ease,color .15s ease,border-color .15s ease}
[data-skin="calm"] .acts button:hover{background:var(--text);color:var(--bg);
  border-color:var(--text)}

/* ---- 빈 컬럼: 카드가 아니라 '놓을 자리' ---- */
[data-skin="calm"] .colempty{background:none;box-shadow:none;text-align:center;
  border:1px dashed color-mix(in srgb,var(--text) 15%,transparent);
  border-radius:var(--calm-r);color:var(--faint);font-size:11.5px;padding:24px 14px}
/* ---- 더 보기: 전폭 블록이 아니라 조용한 pill ---- */
/* .cards가 flex column이라 align-self 없이는 pill이 컬럼 폭으로 늘어난다 */
[data-skin="calm"] .more{display:inline-block;width:auto;align-self:flex-start;
  border:1px solid transparent;border-radius:999px;padding:6px 12px;margin:9px 0 0 2px;
  font-size:11px;color:var(--muted)}
[data-skin="calm"] .col .more{padding-left:12px}
[data-skin="calm"] .more:hover{background:color-mix(in srgb,var(--text) 6%,transparent);
  color:var(--text);border-color:var(--border);text-decoration:none}
/* 가로 스크롤바는 얇게 — 보드가 화면을 덜 잡아먹는다 */
[data-skin="calm"] .board::-webkit-scrollbar{height:9px}
[data-skin="calm"] .board::-webkit-scrollbar-thumb{
  background:color-mix(in srgb,var(--text) 14%,transparent);border-radius:999px}
[data-skin="calm"] .board::-webkit-scrollbar-track{background:none}

/* ---- 다크 톤: 같은 설계를 다른 수단으로 성립시킨다 ----
   면 대비가 낮아 그림자가 안 보이므로 깊이는 링+면 밝기로, hue 색은 명도를
   뒤집어(글자 밝게·링 어둡게) 본문 대비를 유지한다. */
[data-skin="calm"][data-theme="graphite"],
[data-skin="calm"][data-theme="carbon"],
[data-skin="calm"][data-theme="phosphor"]{
  --calm-quiet:color-mix(in srgb,var(--muted) 84%,var(--faint));
  --hu-s:62%; --hu-l:72%;
  --av-s:55%; --av-l:76%; --av-bl:44%;
}
[data-skin="calm"][data-theme="graphite"] body,
[data-skin="calm"][data-theme="carbon"] body,
[data-skin="calm"][data-theme="phosphor"] body{
  background:
    radial-gradient(1150px 470px at 6% -12%, color-mix(in srgb,var(--c-open) 9%,transparent) 0, transparent 68%),
    radial-gradient(950px 420px at 97% -8%, color-mix(in srgb,var(--c-published) 8%,transparent) 0, transparent 66%),
    var(--bg);
  background-attachment:fixed;
}
[data-skin="calm"][data-theme="graphite"] .card,
[data-skin="calm"][data-theme="carbon"] .card,
[data-skin="calm"][data-theme="phosphor"] .card{border-color:var(--border)}
[data-skin="calm"][data-theme="graphite"] .card:hover,
[data-skin="calm"][data-theme="carbon"] .card:hover,
[data-skin="calm"][data-theme="phosphor"] .card:hover{
  border-color:color-mix(in srgb,var(--sc) 55%,transparent)}
@media (prefers-color-scheme: dark){
  :root[data-theme="system"][data-skin="calm"]{
    --calm-quiet:color-mix(in srgb,var(--muted) 84%,var(--faint));
    --hu-s:62%; --hu-l:72%;
    --av-s:55%; --av-l:76%; --av-bl:44%;
  }
  :root[data-theme="system"][data-skin="calm"] .card{border-color:var(--border)}
  :root[data-theme="system"][data-skin="calm"] .card:hover{
    border-color:color-mix(in srgb,var(--sc) 55%,transparent)}
}
/* 움직임은 인과 설명용 — 사용자가 줄이길 원하면 끈다 (s9-design 완성도 기준 5) */
@media (prefers-reduced-motion: reduce){
  [data-skin="calm"] .card{transition:border-color .12s ease}
  [data-skin="calm"] .card:hover{transform:none}
}
/* 육안 검증에서 드러난 미완성 지점 보정 (REQ-062 재작업 2): Docs·Settings·
   Terminal·Audit이 아직 ledger의 각진 판이라 카드 언어와 충돌했다. */
[data-skin="calm"] .docs{gap:14px;background:none;border:0}  /* board와 같은 이유 — 목록·뷰어가 캔버스 위 판 */
/* 라운드 모서리를 자르려고 넣은 overflow:hidden 이 세로 스크롤까지 막아
   목록 아래쪽에 닿을 수 없었다 (REQ-20260826-004). 가로만 자르고 세로는 흐르게. */
[data-skin="calm"] .doclist{border-right:0;background:var(--panel);width:320px;
  border-radius:var(--calm-r);box-shadow:var(--calm-shadow);
  overflow-x:hidden;overflow-y:auto}
/* calm은 밑줄이 아니라 잉크 필이 활성 문법 (탭·스탯과 같은 규칙) */
[data-skin="calm"] .typebar{border-bottom-color:var(--hairline);padding:2px 10px;min-height:34px}
[data-skin="calm"] .typebar .tb{border-bottom:0;border-radius:999px;padding:5px 8px;
  margin:0;letter-spacing:.03em}
[data-skin="calm"] .typebar .tb.on{background:var(--text);color:var(--bg)}
[data-skin="calm"] .typebar .tb.on b,
[data-skin="calm"] .typebar .tb.on .unans{color:var(--bg)}
[data-skin="calm"] .doclist .row{border-bottom:1px solid var(--hairline);padding:11px 16px}
[data-skin="calm"] .doclist .row:last-child{border-bottom:0}
[data-skin="calm"] .doclist .row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
[data-skin="calm"] .doclist .row.sel{box-shadow:none;
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
[data-skin="calm"] .viewer .empty{display:flex;align-items:center;justify-content:center;
  min-height:220px}
/* Terminal 탭은 자기가 스크롤 컨테이너가 아니다 — 안의 .ccout 이 대신 구른다.
   그래서 여기의 overflow:hidden 은 모서리만 자르고 스크롤은 건드리지 않는다. */
[data-skin="calm"] .ccterm{border:0;border-radius:var(--calm-r);
  box-shadow:var(--calm-shadow);overflow:hidden}
/* .term(Stream 본문)은 반대로 **자기 자신이** 스크롤 컨테이너다
   (max-height + overflow-y:auto). 여기에 overflow:hidden 을 얹으면 둥근 모서리와
   함께 본문 아래쪽까지 잘려 영원히 닿을 수 없다 — 2057px 중 1376px 이 그랬다.
   세 줄 위 .doclist 와 똑같은 함정이라 처방도 같다(REQ-20260826-004):
   가로만 자르고 세로는 흐르게. 스크롤 컨테이너도 border-radius 로 클리핑되므로
   calm 의 둥근 모서리·그림자는 그대로 산다. (REQ-20260827-010) */
[data-skin="calm"] .term{border:0;border-radius:var(--calm-r);
  box-shadow:var(--calm-shadow);overflow-x:hidden;overflow-y:auto}
[data-skin="calm"] .settings-panel{border-radius:var(--calm-r);border:0;
  box-shadow:var(--calm-shadow)}
[data-skin="calm"] .settings-panel select{border-radius:10px;padding:8px 11px}
[data-skin="calm"] .settings-h{letter-spacing:0;text-transform:none;font-size:12px}
[data-skin="calm"] .tblwrap{border-radius:var(--calm-r);overflow:hidden;
  background:var(--panel);box-shadow:var(--calm-shadow)}
[data-skin="calm"] .graphwrap,[data-skin="calm"] .depsum{border:0;border-radius:var(--calm-r);overflow:hidden;
  box-shadow:var(--calm-shadow)}
/* 어두운 톤에서는 그림자가 보이지 않는다 — 깊이를 얇은 링 + 면 밝기로 준다
   (같은 요소를 톤에 따라 다른 수단으로 띄운다) */
[data-skin="calm"][data-theme="graphite"],
[data-skin="calm"][data-theme="carbon"],
[data-skin="calm"][data-theme="phosphor"]{
  --calm-shadow:0 0 0 1px var(--hairline),0 14px 32px -26px #000;
}
[data-skin="calm"][data-theme="graphite"] .card:hover,
[data-skin="calm"][data-theme="carbon"] .card:hover,
[data-skin="calm"][data-theme="phosphor"] .card:hover{
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,var(--hairline)),
             0 18px 38px -26px rgba(0,0,0,1);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="system"][data-skin="calm"]{
    --calm-shadow:0 0 0 1px var(--hairline),0 14px 32px -26px #000;
  }
}

/* ------- hovercard ------- */
.hovercard{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--text);
  padding:11px 14px;max-width:340px;font-size:12.5px;pointer-events:none;opacity:0;
  transition:opacity .1s;line-height:1.5}
.hovercard.show{opacity:1}
.hovercard .hid{font-family:var(--mono);font-size:10px;color:var(--faint)}
.hovercard .ht{font-weight:600;margin:3px 0}
.hovercard .hs{color:var(--muted);font-size:12px}

/* ------- 아티클 (REQ-20260827-073) -------
   요청 문서는 **훑는** 것이고 아티클은 **읽는** 것이다. 그래서 같은 자를 대지
   않는다: 한 줄이 너무 길면 다음 줄 첫 글자를 못 찾으므로 읽기 폭을 34em
   (한글 60~70자)로 물리고, 행간을 한 급 늘리고, 글자를 키운다.
   장식은 없다 — 폭·행간·크기만으로 "이건 읽는 글이다"가 선다. */
.artdoc{max-width:34em;margin:6px 0 10px}
.artdoc h1{font-size:28px;line-height:1.35;margin:2px 0 10px;word-break:keep-all}
.artdoc .artlede{margin:0 0 14px;font-size:15px;line-height:1.7;color:var(--muted);
  word-break:keep-all}
.artdoc .artby{display:flex;align-items:center;gap:10px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.04em;color:var(--faint);
  padding:0 0 14px;border-bottom:1px solid var(--border);margin-bottom:20px}
.artdoc .artmd{font-size:15.5px;line-height:1.9}
.artdoc .artmd p{margin:0 0 17px}
.artdoc .artmd h2{font-size:19px;text-transform:none;letter-spacing:0;
  border-bottom:0;margin:30px 0 10px;padding:0}
.artdoc .artmd h3{font-family:inherit;font-size:16px;font-weight:650;color:var(--text);
  margin:26px 0 8px}
.artdoc .artmd li{margin:0 0 8px}
/* 나온 자리는 없애지 않고 접는다 — 글 뒤에 두되 찾으면 있다 */
.artmeta{margin:26px 0 0;border-top:1px solid var(--hairline);padding-top:12px}
.artmeta > summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);list-style:none}
.artmeta > summary::-webkit-details-marker{display:none}
.artmeta > summary::after{content:" ▸";color:var(--faint)}
.artmeta[open] > summary::after{content:" ▾"}
.artmeta > summary:hover{color:var(--text)}

/* ------- 구간에 메모 달기 (REQ-20260827-072) -------
   뜨는 것은 버튼 **하나**뿐이다. 문서를 읽으려고 끄는 사람이 훨씬 많으니
   쓰기 상자를 먼저 들이밀지 않는다 — 고른 글이 버튼 안에 보이고, 누르면 그때
   071 의 판정 대화상자가 열린다(같은 판·같은 키·같은 버튼 어휘).
   색면은 없다. 짚는 표시는 점선 밑줄 — 이 화면이 doclink 에 이미 쓰는 획이다. */
.anchorpop{position:fixed;z-index:70;display:flex;align-items:baseline;gap:6px;
  max-width:min(360px,calc(100vw - 24px));cursor:pointer;font:inherit;font-size:11.5px;
  padding:5px 11px;background:var(--panel);border:1px solid var(--text);color:var(--text);
  box-shadow:0 8px 22px -10px rgba(0,0,0,.34)}
.anchorpop .am{font-family:var(--mono);color:var(--c-review)}
.anchorpop .at{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted)}
.anchorpop .ac{color:var(--text);white-space:nowrap}
.anchorpop:hover{background:var(--text);color:var(--bg)}
.anchorpop:hover .at,.anchorpop:hover .ac{color:var(--bg)}
.anchorpop:hover .am{color:var(--bg)}
/* 메모가 달린 구간 — 점선 밑줄 + 그 자리의 ⌖. 색면으로 칠하지 않는다:
   본문은 읽으라고 있는 것이지 강조 표시를 보라고 있는 것이 아니다. */
.md .anchored{border-bottom:1px dashed var(--c-review)}
.md .anjump{font-family:var(--mono);font-size:10px;color:var(--c-review);
  text-decoration:none;padding:0 2px;cursor:pointer}
.md .anjump:hover{text-decoration:underline}
/* 인용 — 좌측 세로 색 띠는 금지다. 안쪽 여백과 잉크 명도로 물린다. */
.md blockquote{margin:12px 0;padding:0 0 0 14px;color:var(--muted);
  border-left:1px solid var(--hairline)}
.md blockquote.anchorq{padding-left:0;border-left:0}
.md .anback{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;color:var(--c-review);cursor:pointer;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px}
/* 못 찾았으면 못 찾았다고 말한다 — 엉뚱한 곳을 짚으면서 짚는 척하지 않는다 */
.md .anlost{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;color:var(--c-blocked)}

/* ------- 판정 대화상자 (REQ-20260827-071) -------
   네이티브 prompt/confirm/alert 는 브라우저와 OS 가 그리는 상자다 — 이 제품의
   서체도 색도 깊이도 하나도 쓰지 않는다. 하필 그 자리가 판정 경로라, 가장
   중요한 순간에 남의 얼굴이 나왔다.

   1차는 `.hovercard` 를 그대로 입혔다가 반려됐다 — "팝업 느낌이 덜하고 뭐라고
   설명하기 어려운 이질감이 있다". 정체는 성격의 충돌이다: hovercard 는 **커서
   밑에 났다 사라지는, 읽기만 하는 쪽지**고 대화상자는 **머물러서 행위를 하는
   판**이다. 반대 성격에 같은 껍데기를 입혔으니 무게가 모자랐다.

   그래서 껍데기(배경·라운드·보더색 — 10스킨이 이미 입혀 둔 옷)는 물려받되
   **판의 무게는 새로 준다**. 색면은 여전히 쓰지 않는다. 무게의 재료는 셋:
   ① 3단 구조(캡션 머리 · 본문 · 버튼 바닥)를 가로 규칙선으로 나눈다 — 장부의
      문법 그대로다. 쪽지는 규칙선을 갖지 않는다.
   ② 한 급 위의 깊이 — 스킨의 카드 그림자보다 뚜렷한 부양 + 잉크 저알파 링.
      어두운 톤에서 그림자는 보이지 않으므로 링이 가장자리를 대신 말한다.
   ③ 주 행동 버튼의 인버스 — `.acts:hover` 가 이미 쓰는 그 잉크 반전이다.

   막(scrim)은 두지 않는다. 네이티브 prompt 가 브라우저를 통째로 멈춰서 **뒤의
   문서를 보면서 사유를 쓸 수 없었던 것**이 이 요청의 절반이다 — 판정하는 사람이
   근거를 보면서 못 쓴다면 그건 보기 문제가 아니다. */
/* 자리와 폭은 고정이다 (반려 사유 1·2). 앞선 판은 누른 버튼에 물려 세웠는데,
   승인 버튼과 반려 버튼이 카드 안 다른 자리에 있어 **같은 종류의 행위가 매번
   다른 곳에 다른 크기로** 떴다. 근접성으로 얻으려던 것(무엇을 판정하는지)은
   창 안의 제목이 이미 한다. 위 모서리를 고정해 두면 내용이 길어져도 창의
   시작점은 그대로다 — 세로 가운데 정렬이면 승인/반려의 윗변이 어긋난다. */
.dlgbox{position:fixed;pointer-events:auto;opacity:1;z-index:80;padding:0;
  left:50%;transform:translateX(-50%);top:clamp(48px,18vh,180px);
  width:min(432px,calc(100vw - 32px));max-width:none;
  max-height:calc(100vh - 96px);overflow:auto}
.dlgbox[hidden]{display:none}
/* 부양은 스킨 그림자를 덮는다 — 스킨마다 카드 그림자가 다르면 판의 무게도
   달라져서, "이건 판이다"가 어떤 스킨에선 서지 않는다. 링은 검정 그림자가
   보이지 않는 어두운 톤에서 가장자리를 대신 말한다. */
/* 가장자리는 스킨 것보다 한 급 진하게 — 어두운 톤에서 검정 그림자는 보이지
   않으므로 판을 세우는 일은 결국 획이 한다. 잉크 전부를 쓰면 어두운 톤에서
   흰 테가 너무 세니 스킨 보더와 섞어 무게만 올린다. */
.hovercard.dlgbox{border-color:color-mix(in srgb,var(--text) 55%,var(--border));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--text) 10%,transparent),
  0 26px 62px -18px rgba(0,0,0,.42),0 8px 20px -8px rgba(0,0,0,.26)}
/* ① 캡션 머리 — 색면 없이 규칙선 하나로 띠를 만든다.
   캡션 잉크는 신호다: 판정·전이는 review 잉크, 막힌 일(거부·연결 실패)은
   blocked 잉크. 같은 자주색으로 다 칠하면 "무슨 일이 났다"가 안 읽힌다. */
.dlghead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 16px;border-bottom:1px solid var(--border)}
.dlgcap{font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--c-review);font-weight:700}
.dlgcap.stop{color:var(--c-blocked)}
/* 닫는 법은 머리에 한 번만 적는다 — 버튼 옆의 힌트는 확인 키를 맡는다.
   한글에는 모노·자간을 걸지 않는다 (s9-design: 트래킹은 로마자·숫자의 어휘라
   한글에 걸면 글자가 흩어진다). 키 이름만 모노로 남긴다 — 자판에 새겨진 글자다. */
.dlgesc{font-size:10.5px;color:var(--faint);white-space:nowrap}
.dlgesc kbd,.dlghint kbd{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  font-style:normal;color:var(--muted)}
.dlgbody{padding:13px 16px 15px}
.dlgbox .dlgt{margin:0;font-size:14.5px;font-weight:650;line-height:1.45;
  color:var(--text);word-break:keep-all}
.dlgbox .dlgs{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--muted);
  word-break:keep-all}
.dlgin{display:block;width:100%;box-sizing:border-box;margin-top:11px;resize:vertical;
  min-height:78px;font:inherit;font-size:12.5px;line-height:1.6;padding:8px 10px;
  color:var(--text);background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r)}
.dlgin:focus{outline:none;border-color:var(--text)}
/* ③ 버튼 바닥 — 규칙선 위에 앉아 "여기서 끝난다"를 말한다 */
.dlgfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:9px 16px 11px;border-top:1px solid var(--hairline)}
/* 못 누르는 이유는 버튼 옆에서 말한다 — 창을 다시 띄워 다그치지 않는다 */
/* 두 줄 자리를 미리 비워 둔다 — 한 글자를 적는 순간 힌트가 한 줄에서 두 줄로
   늘면 버튼이 커서 밑에서 내려앉는다. 자리 예약은 흔들림을 없애는 값싼 값이다.
   **flex 는 여기서 글을 부순다** (2026-08-27 사용자 캡처): 문장이 글자와 <kbd>
   조각으로 이루어져 있는데 컨테이너를 flex 로 두면 조각마다 독립 항목이 되어
   줄바꿈이 낱말 한가운데서 일어나고 조각 사이 공백이 사라진다("Shift+Enter
   Ctrl+Enter" 가 붙어 버렸다). 그래서 **속을 한 겹 감싸** 항목을 하나로 만들고,
   문장은 그 안에서 보통의 인라인 흐름으로 흐르게 한다. */
.dlghint{margin:0;font-size:11px;color:var(--faint);line-height:1.5;flex:1 1 auto;
  min-height:33px;display:flex;flex-direction:column;justify-content:center}
/* 규칙 하나에 줄 하나 — 어디서 접힐지는 폭이 아니라 **뜻**이 정한다
   (REQ-20260827-081). 한 문장으로 흘려 두었더니 좁은 바닥에서 한 항목의
   한가운데가 잘려, 첫 줄 끝의 "Shift+Enter ·" 가 별개 항목처럼 보였다.
   항목마다 nowrap 을 걸어 줄은 항목 **사이**에서만 넘어가게 하고, 문구도
   조사만 남기고 줄여 한 항목이 한 줄에 들어가게 했다. 힌트는 문장이 아니라
   라벨이다. */
.dlghint > span{display:block;white-space:nowrap}
.dlghint.need{color:var(--c-blocked)}
.dlghint.need kbd{color:var(--c-blocked)}
.dlgbox .acts{margin:0;justify-content:flex-end;flex:0 0 auto}
.dlgbox .acts button{font-size:11px;padding:5px 13px}
/* 주 행동은 잉크 반전으로 한 급 올린다 — `.acts button:hover` 가 이미 쓰는 그
   반전이다. 색면이 아니라 잉크이고, 한 창에 강조는 이것 하나뿐이다. */
.dlgbox .acts .dlgyes{background:var(--text);color:var(--bg);border-color:var(--text)}
.dlgbox .acts .dlgyes:hover{background:color-mix(in srgb,var(--text) 80%,var(--panel));
  border-color:color-mix(in srgb,var(--text) 80%,var(--panel));color:var(--bg)}
.dlgbox .acts button[disabled]{background:var(--panel);color:var(--text);opacity:.38;
  cursor:not-allowed;border-color:var(--border)}
.dlgbox .acts button[disabled]:hover{background:var(--panel);color:var(--text);
  border-color:var(--border)}
.dlgbox .acts button:focus-visible{outline:1px solid var(--text);outline-offset:2px}

/* ------- 고르는 변형 (REQ-20260827-079) -------
   이 제품에서 팝업이 세 벌이 되면 안 된다 — 사용량 툴팁 · 판정 창 · 모델 팝업이
   각각 다른 얼굴이었고, 사용자가 세 번 같은 지적을 했다. 그래서 모델 고르기와
   계정 바꾸기를 **판정 대화상자와 같은 판**에 얹는다. 다르게 만드는 것은 판이
   아니라 **안에 든 것**뿐이다: 확인/취소 대신 **줄 목록**.

   줄이 곧 버튼이다 — 누르면 그것으로 정해진다. 확인 버튼을 따로 두면 "골랐는데
   왜 안 되지"가 생기고, 목록에서 고르는 일에 확인은 군더더기다. 그래서 바닥에
   남는 것은 '그만두기' 하나다.

   지금 쓰는 줄은 색면이 아니라 **잉크와 표식**으로 말한다 — 왼쪽에 채운 마크,
   오른쪽에 "지금 이것". 색만으로 가르지 않는다. */
.dlglist{display:flex;flex-direction:column;margin-top:2px;
  border-top:1px solid var(--hairline)}
.dlgopt{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--hairline);
  padding:9px 2px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.dlgopt .om{flex:none;width:12px;color:var(--faint);font-family:var(--mono);
  font-size:10px}
.dlgopt .ol{flex:1;min-width:0;font-weight:500}
/* 줄 오른쪽의 한마디 — 부차 값이지만 읽히긴 해야 한다. faint(≈3:1)는 10px
   에서 흐려 잘린 것처럼 보인다(사용량 카드가 같은 이유로 이미 한 급 올라갔다). */
.dlgopt .on{font-size:10.5px;color:var(--muted);white-space:nowrap}
.dlgopt.cur .on{font-family:var(--mono);letter-spacing:.04em;color:var(--text)}
.dlgopt.cur .om{color:var(--text)}
.dlgopt.cur .ol{font-weight:650}
.dlgopt:hover,.dlgopt:focus-visible{background:var(--accent-soft);outline:none}
.dlgopt:focus-visible .ol{text-decoration:underline;text-underline-offset:3px}
/* 곁들이는 축(깊이) — 고르는 것이지 실행하는 것이 아니라 칩으로 둔다.
   실행은 아래 목록의 줄이 한다. */
.dlgchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dlgchips button{background:none;border:1px solid var(--border);color:var(--muted);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:3px 9px;
  cursor:pointer}
.dlgchips button:hover{color:var(--text);border-color:var(--text)}
.dlgchips button.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.dlgsub{margin:11px 0 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-family:var(--mono)}
/* 목록 밖에 딸린 행동 — 줄(고르기)과 헷갈리지 않게 "더 보기"의 텍스트 버튼 어휘 */
.dlgact{display:inline-block;margin-top:6px;background:none;border:0;padding:0;
  font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;
  text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.dlgact:hover{text-decoration-style:solid}
.dlgact:focus-visible{outline:1px solid var(--text);outline-offset:3px}

/* ------- 사용량 카드 (REQ-20260827-056) -------
   네이티브 title 툴팁으로 냈다가 반려됐다("너무 못생겼다"). 맞는 말이다 —
   그 상자는 브라우저가 그리고, 이 제품의 서체도 색도 깊이도 정렬도 쓰지 않는다.
   그래서 doclink 미리보기·우선순위 척도가 이미 쓰는 **그 카드**에 얹는다:
   배울 어휘가 늘지 않고, 위치 계산과 10스킨 대응이 이미 풀려 있다.

   한도 셋은 같은 질문의 세 답이라 표로 세운다. 모노 + tabular-nums + 우측
   정렬이라 퍼센트와 시각이 세로로 맞는다 — 어긋나면 읽는 눈이 매번 다시 찾는다.
   색면은 없다. 색은 찬 한도의 퍼센트 글자에만 얹는 기능 신호다. */
.hovercard.uwide{max-width:none;width:max-content}
.hovercard .ug{display:grid;grid-template-columns:auto auto 1fr auto;
  gap:5px 14px;align-items:baseline;margin:8px 0 2px;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
/* 한글 라벨에는 자간을 벌리지 않는다 — 트래킹은 대문자 로마자·숫자 메타데이터의
   어휘라, 한글에 걸면 글자가 흩어져 성기게 보인다 (교차 리뷰 지적 2). */
.hovercard .ug .uk{color:var(--muted);white-space:nowrap}
/* 굵기는 신호다: 세 줄이 다 굵으면 굵은 것이 없는 것과 같다. 임계 구간에만
   무게와 잉크를 얹는다 (교차 리뷰 지적 1). */
.hovercard .ug .up{text-align:right;color:var(--text)}
.hovercard .ug .up.warn{color:var(--c-inprogress);font-weight:700}
.hovercard .ug .up.crit{color:var(--c-blocked);font-weight:700}
/* 열 이름 (교차 리뷰 지적 3) — 오른쪽 두 칸이 '얼마나 남았나'와 '몇 시인가'로
   갈린다는 것을 한 번만 가르친다. 선행 대기 현황판의 .dslegend 와 같은 손이다. */
.hovercard .ug .uh{font-size:9.5px;color:var(--faint);white-space:nowrap}
.hovercard .ug .uh.ur{text-align:right}
.hovercard .ug .urule{grid-column:1/-1;height:0;border-top:1px solid var(--hairline);
  margin:2px 0 4px}
.hovercard .ug .uw{color:var(--text);white-space:nowrap}
/* 절대 시각은 부차지만 읽히긴 해야 한다 — faint(≈3:1)로는 작은 모노가 흐려진다 */
.hovercard .ug .ua{text-align:right;color:var(--muted);white-space:nowrap}
/* 계정은 주소라 모노가 맞다 — 제목 자리의 무게(600)만 빌린다 */
/* 카드 머리말은 faint 로는 흐려 잘린 것처럼 읽힌다 — .rvcap 이 같은 이유로
   이미 한 급 올라간 전례가 있다 (교차 리뷰 지적 5). */
.hovercard .hid.ucap{color:var(--muted)}
.hovercard .ht.umail{font-family:var(--mono);font-size:11.5px;letter-spacing:.01em}
.hovercard .ht.umail span{color:var(--faint);font-weight:400}
/* 손잡이 — 칩은 누르는 것이 아니라 얹는 것이라 커서만 바꾼다 */
/* 칩은 얹으면 한도를 펴고, 누르면 계정을 바꾼다 (REQ-20260827-079) — 계정에
   관한 일은 계정이 적혀 있는 이 자리에서 된다. 누를 수 있는 것이므로 커서는
   손가락이다(전에는 도움말 커서라 "읽는 것"으로만 보였다). */
.usagechip{cursor:pointer}
.usagechip:focus-visible{outline:1px solid var(--text);outline-offset:3px}

/* ------- Chief: simple-first multi-project front door -----------------------
   Chief borrows Section9's paper, ink, hairlines and depth. Status is carried by
   type and a small text mark—not by painted cards or a vertical accent strip. */
body[data-view="chief"] .hrow2{display:none}
body[data-view="chief"] main{max-width:1540px;margin:0 auto;padding:0 28px 48px}
.chief{display:grid;gap:28px;padding:34px 0 0}
.chief button,.chief a{font-family:inherit}
.chief-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:0 0 24px;border-bottom:1px solid var(--border)}
.chief-kicker{margin:0 0 7px;font:700 10px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-done)}
.chief-top h1{margin:0;max-width:760px;font-size:clamp(28px,4vw,52px);line-height:1.04;
  letter-spacing:-.045em;font-weight:700}
.chief-top p:not(.chief-kicker){margin:12px 0 0;max-width:680px;color:var(--muted);
  font-size:14px;line-height:1.55}
.chief-source{flex:0 0 auto;text-align:right;color:var(--muted);font:10.5px/1.5 var(--mono)}
.chief-source strong{display:block;color:var(--text);font-size:11px;font-weight:600}
.chief-refresh{margin-top:9px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);min-height:32px;padding:6px 12px;cursor:pointer;font-size:11.5px;font-weight:600}
.chief-refresh:hover{border-color:var(--text)}
.chief-refresh:disabled{cursor:progress;color:var(--faint);border-color:var(--hairline)}

.chief-projects{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:thin;scroll-snap-type:x proximity}
.chief-project{min-width:155px;scroll-snap-align:start;text-align:left;border:1px solid var(--border);
  border-radius:calc(var(--r) + 2px);background:var(--panel);color:var(--text);
  padding:13px 14px;cursor:pointer;box-shadow:0 5px 18px color-mix(in srgb,var(--text) 4%,transparent)}
.chief-project:hover{border-color:var(--faint);transform:translateY(-1px)}
.chief-project[aria-pressed="true"]{border-color:var(--text);box-shadow:0 9px 24px color-mix(in srgb,var(--text) 8%,transparent)}
.chief-project b{display:block;margin-bottom:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chief-project span{display:block;color:var(--muted);font:10px/1.45 var(--mono);white-space:nowrap}
.chief-project .attention{color:var(--c-review)}
.chief-project .moving{color:var(--c-inprogress)}
.chief-project-desk{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,2.2fr);
  gap:18px;align-items:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:16px 2px;box-shadow:0 9px 28px color-mix(in srgb,var(--text) 4%,transparent)}
.chief-project-desk h2{margin:4px 0 0;font-size:18px;line-height:1.2;letter-spacing:-.02em}
.chief-project-desk nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.chief-project-entry{text-align:left;border:1px solid var(--border);background:var(--panel);color:var(--text);
  min-height:58px;padding:9px 11px;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--text) 3%,transparent)}
.chief-project-entry:hover{border-color:var(--text);transform:translateY(-1px)}
.chief-project-entry b{display:block;font-size:12px;margin-bottom:4px}
.chief-project-entry span{display:block;color:var(--muted);font:10px/1.35 var(--mono)}
.chief-daily-empty{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:36px}
.chief-daily-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

.chief-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  margin-bottom:12px}
.chief-section-head h2{margin:0;font-size:16px;letter-spacing:-.015em}
.chief-section-head p{margin:0;color:var(--muted);font:10.5px/1.4 var(--mono)}
.chief-section-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.chief-create-report{border:1px solid var(--c-review);background:var(--panel);color:var(--c-review);
  min-height:32px;padding:6px 11px;font-size:11.5px;font-weight:650;cursor:pointer}
.chief-create-report:hover{border-color:var(--text);color:var(--text)}
.chief-create-report:disabled{border-color:var(--hairline);color:var(--faint);cursor:not-allowed}
.chief-add-work{border:1px solid var(--c-open);background:var(--panel);color:var(--c-open);
  min-height:32px;padding:6px 11px;font-size:11.5px;font-weight:650;cursor:pointer}
.chief-add-work:hover{border-color:var(--text);color:var(--text)}
.chief-add-work:disabled{border-color:var(--hairline);color:var(--faint);cursor:not-allowed}
.chief-lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chief-lane{min-width:0;border-top:1px solid var(--border);padding-top:12px}
.chief-lane-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin:0 0 8px}
.chief-lane-head h3{margin:0;font-size:12.5px;font-weight:650}
.chief-lane-head span{color:var(--muted);font:10px/1 var(--mono)}
.chief-lane[data-chief-lane="needs"] h3{color:var(--c-review)}
.chief-lane[data-chief-lane="progress"] h3{color:var(--c-inprogress)}
.chief-lane[data-chief-lane="done"] h3{color:var(--c-done)}
.chief-work-list{display:grid;gap:8px}
.chief-work{min-height:130px;border:1px solid var(--hairline);border-radius:calc(var(--r) + 3px);
  background:var(--panel);padding:13px 14px;box-shadow:0 7px 20px color-mix(in srgb,var(--text) 4%,transparent)}
.chief-work:hover{border-color:var(--border);box-shadow:0 11px 28px color-mix(in srgb,var(--text) 7%,transparent)}
.chief-work-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;
  color:var(--muted);font:9.5px/1.35 var(--mono);letter-spacing:.035em;text-transform:uppercase}
.chief-work-meta .blocked{color:var(--c-blocked)}
.chief-work h4{margin:0;font-size:13.5px;line-height:1.35;letter-spacing:-.012em}
.chief-work p{margin:8px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chief-work-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.chief-work-foot span{min-width:0;color:var(--faint);font:9.5px/1.35 var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chief-work-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:none}
.chief-work-actions a{color:var(--muted);font-size:10.5px;text-underline-offset:3px;white-space:nowrap}
.chief-text-action{border:1px solid var(--border);background:var(--panel);color:var(--text);
  min-height:30px;padding:5px 9px;font-size:11.5px;font-weight:600;line-height:1.2;cursor:pointer;
  white-space:nowrap;text-decoration:none}
.chief-text-action:hover{border-color:var(--text)}
.chief-text-action:disabled{cursor:progress;color:var(--faint);border-color:var(--hairline)}
.chief-text-action:focus-visible,.chief-refresh:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.chief-empty{min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px dashed var(--border);color:var(--faint);font:10.5px/1.55 var(--mono);padding:20px}

.chief-deep{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:22px}
.chief-release-list,.chief-report-list{display:grid;gap:8px}
.chief-release,.chief-report{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;
  align-items:center;border-bottom:1px solid var(--hairline);padding:11px 0}
.chief-release:first-child,.chief-report:first-child{border-top:1px solid var(--hairline)}
.chief-release h3,.chief-report h3{margin:0;font-size:12.5px;line-height:1.35}
.chief-release p,.chief-report p{grid-column:1;margin:4px 0 0;color:var(--muted);
  font:10.5px/1.45 var(--mono)}
.chief-release-state{grid-column:2;grid-row:1/3;color:var(--muted);font:10px/1.3 var(--mono);text-align:right}
.chief-release-state.ready_for_human,.chief-release-state.review{color:var(--c-review)}
.chief-release-state.building,.chief-release-state.in_progress{color:var(--c-inprogress)}
.chief-release-state.blocked{color:var(--c-blocked)}
.chief-release-state.released,.chief-release-state.done{color:var(--c-done)}
.chief-report a{grid-column:2;grid-row:1/3;color:var(--text);font-size:10.5px;text-underline-offset:3px}
.chief-report .chief-report-pending{grid-column:2;grid-row:1/3;color:var(--faint);font:9.5px/1.3 var(--mono)}

/* Report reader — stays above Chief without changing its route or destroying its DOM state. */
.chief-report-reader{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:28px}
.chief-report-reader[hidden]{display:none}
.chief-report-shade{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;
  background:color-mix(in srgb,var(--text) 36%,transparent);cursor:default}
.chief-report-panel{position:relative;z-index:1;width:min(1180px,calc(100vw - 56px));
  height:min(860px,calc(100vh - 56px));display:grid;grid-template-rows:auto minmax(0,1fr);
  background:var(--panel);border:1px solid var(--text);box-shadow:0 28px 80px color-mix(in srgb,#000 34%,transparent)}
.chief-report-head{display:flex;align-items:center;gap:14px;padding:13px 15px;
  border-bottom:1px solid var(--border);min-width:0}
.chief-report-head div{min-width:0;flex:1}
.chief-report-head p{margin:0 0 3px;color:var(--c-done);font:700 9.5px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase}
.chief-report-head h2{margin:0;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chief-report-head a,.chief-report-head button{border:1px solid var(--border);background:var(--panel);
  color:var(--text);padding:6px 10px;font-size:11.5px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.chief-report-head a:hover,.chief-report-head button:hover{border-color:var(--text)}
.chief-report-body{position:relative;min-height:0;background:var(--bg)}
.chief-report-body iframe{display:block;width:100%;height:100%;border:0;background:var(--panel)}
.chief-report-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--panel);color:var(--muted);font:11px/1.5 var(--mono);z-index:1}
.chief-report-loading[hidden]{display:none}

.chief-brief-grid{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(150px,.55fr));gap:10px}
.chief-next{border:1px solid var(--border);background:var(--panel);padding:16px 17px;
  box-shadow:0 9px 26px color-mix(in srgb,var(--text) 5%,transparent)}
.chief-next h2{margin:5px 0 7px;font-size:18px;line-height:1.25;letter-spacing:-.02em}
.chief-next p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.chief-brief-link{border:1px solid var(--hairline);background:var(--panel);color:var(--text);
  padding:14px;text-align:left;cursor:pointer;box-shadow:0 5px 16px color-mix(in srgb,var(--text) 3%,transparent)}
.chief-brief-link:hover{border-color:var(--text);transform:translateY(-1px)}
.chief-brief-link b{display:block;font-size:13px;margin-bottom:8px}
.chief-brief-link span{display:block;color:var(--muted);font:10px/1.4 var(--mono)}

.chief-relations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chief-relation{border:1px solid var(--hairline);background:var(--panel);padding:14px 15px;
  box-shadow:0 7px 20px color-mix(in srgb,var(--text) 4%,transparent)}
.chief-relation h3{margin:0 0 7px;font-size:13.5px;line-height:1.35}
.chief-relation p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.chief-relation-foot{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;color:var(--faint);font:9.5px/1.4 var(--mono)}
.chief-relation-foot .project{color:var(--c-published)}
.chief-relation-foot .jira{color:var(--c-open)}

.chief-sessions{display:grid;grid-template-columns:minmax(230px,.65fr) minmax(0,1.35fr);gap:14px;min-height:520px}
.chief-session-list,.chief-thread{border:1px solid var(--border);background:var(--panel);
  box-shadow:0 9px 28px color-mix(in srgb,var(--text) 5%,transparent);min-width:0}
.chief-session-list header,.chief-thread header{padding:13px 14px;border-bottom:1px solid var(--hairline)}
.chief-session-list header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chief-session-list h3,.chief-thread h3{margin:0;font-size:13px}
.chief-new-session{border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:5px 8px;font-size:10.5px;font-weight:600;cursor:pointer}
.chief-new-session:hover{border-color:var(--text)}
.chief-new-session:disabled{color:var(--faint);border-color:var(--hairline);cursor:not-allowed}
.chief-session-rows{max-height:570px;overflow:auto}
.chief-session-row{display:block;width:100%;border:0;border-bottom:1px solid var(--hairline);
  background:none;color:var(--text);padding:11px 14px;text-align:left;cursor:pointer}
.chief-session-row:hover,.chief-session-row[aria-pressed="true"]{background:var(--accent-soft)}
.chief-session-row b{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px}
.chief-session-row b span{color:var(--c-inprogress);font:9px/1 var(--mono);font-weight:500}
.chief-session-row p{margin:5px 0 0;color:var(--muted);font-size:10.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chief-thread{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.chief-thread header p{margin:4px 0 0;color:var(--muted);font:10px/1.4 var(--mono)}
.chief-messages{overflow:auto;padding:15px;display:grid;align-content:start;gap:10px}
.chief-message{max-width:82%;padding:10px 12px;border:1px solid var(--hairline);font-size:11.5px;line-height:1.5;
  white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg)}
.chief-message.agent{justify-self:start}
.chief-message.jade{justify-self:end;border-color:var(--border);background:var(--panel)}
.chief-message small{display:block;color:var(--faint);font:9px/1.3 var(--mono);margin-bottom:5px}
.chief-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px;
  border-top:1px solid var(--hairline)}
.chief-compose textarea{resize:none;min-height:54px;max-height:150px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);padding:8px 9px;font:12px/1.45 inherit}
.chief-compose button{border:1px solid var(--text);background:var(--text);color:var(--bg);
  padding:7px 13px;font-size:11.5px;font-weight:650;cursor:pointer}
.chief-compose button:disabled{opacity:.45;cursor:not-allowed}

.chief-state{min-height:430px;display:flex;align-items:center;justify-content:center;padding:50px 20px}
.chief-state-inner{max-width:620px;text-align:center}
.chief-state .chief-kicker{color:var(--c-inprogress)}
.chief-state h1{margin:8px 0 12px;font-size:clamp(26px,4vw,46px);line-height:1.08;letter-spacing:-.04em}
.chief-state p{margin:0 auto;color:var(--muted);font-size:13px;line-height:1.6;max-width:540px}
.chief-state code{font:11px/1.4 var(--mono);color:var(--text)}
.chief-state button{margin-top:18px;border:1px solid var(--text);background:var(--text);color:var(--bg);
  padding:9px 18px;cursor:pointer;font-weight:600}
.chief-state button:hover{opacity:.84}

@media(max-width:980px){
  .chief-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chief-deep{grid-template-columns:1fr}
  .chief-project-desk{grid-template-columns:1fr}
  .chief-brief-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chief-next{grid-column:1/-1}
  .chief-sessions{grid-template-columns:1fr;min-height:0}
}
@media(max-width:640px){
  body[data-view="chief"] main{padding:0 16px 34px}
  .chief{gap:22px;padding-top:24px}
  .chief-top{align-items:flex-start;flex-direction:column}
  .chief-source{text-align:left}
  .chief-lanes{grid-template-columns:1fr}
  .chief-work{min-height:0}
  .chief-empty{min-height:92px}
  .chief-section-head{align-items:flex-start;flex-direction:column;gap:4px}
  .chief-section-actions{width:100%;align-items:flex-start;justify-content:space-between}
  .chief-project-desk nav{grid-template-columns:1fr}
  .chief-brief-grid,.chief-relations{grid-template-columns:1fr}
  .chief-next{grid-column:auto}
  .chief-sessions{grid-template-columns:1fr}
  .chief-session-rows{max-height:280px}
  .chief-thread{min-height:500px}
  .chief-report-reader{padding:0}
  .chief-report-panel{width:100vw;height:100vh;border:0}
  .chief-report-head{align-items:flex-start;flex-wrap:wrap;padding:11px 12px}
  .chief-report-head div{flex-basis:100%}
  .chief-report-head a,.chief-report-head button{flex:1;text-align:center}
}
</style>
</head>
<body>
<header>
  <div class="hrow1">
    <div class="brand"><span class="dot"></span>Chief</div>
    <div class="tabs daily-tabs" aria-label="Chief daily navigation">
      <button data-chief-nav="brief" class="active">Brief</button>
      <button data-chief-nav="work">Work</button>
      <button data-chief-nav="release">Release</button>
      <button data-chief-nav="reports">Reports</button>
      <button data-chief-nav="relations">Relations</button>
      <button data-chief-nav="sessions">Sessions</button>
      <button class="talk-chief" data-chief-talk>Talk to Chief</button>
    </div>
    <div class="advanced-nav">
      <button class="advanced-toggle" data-advanced-toggle aria-expanded="false">Advanced</button>
      <div class="advanced-menu" id="advanced-menu" hidden>
        <div class="advanced-cap">Section9 system</div>
        <button data-tab="board">Raw Board</button>
        <button data-tab="docs">Documents</button>
        <button data-tab="graph">Raw Graph</button>
        <button data-tab="audit">Audit</button>
        <button data-tab="stream">Stream</button>
        <button data-tab="terminal">Raw Terminal</button>
        <button data-tab="settings">System settings<span id="settings-badge" class="pbadge" hidden>⚠</span></button>
      </div>
    </div>
    <!-- 서버 상태 칩 — 사람의 손을 요구하지 않는(또는 접어 둔) 서버 사실의 자리
         (REQ-20260827-017-62x6). 전용 행을 주면 아무 할 일 없는 사실 때문에 헤더가
         상시 한 줄 눌린다.
         자리는 브랜드 행의 오른쪽 끝이다. 툴바 행에 두면 필터·신원 묶음과 폭을
         다투다 좁은 화면에서 그 행을 두 줄로 밀어 — 줄이려던 높이를 도로 쓴다.
         브랜드 행은 오른쪽이 늘 비어 있고, 탭 높이에 묻혀 한 픽셀도 더하지 않는다.
         사건이 없으면 비어 있고, :empty 로 자리까지 사라진다. -->
    <span id="sv-chip" class="svchip" role="status" aria-live="polite"></span>
  </div>
  <div class="hrow2">
    <div class="fgroup">
      <input id="q" type="text" placeholder="search…">
      <label class="chk" title="문서 본문(History 포함)까지 검색 — Docs 탭에서 매치 라인 표시">
        <input type="checkbox" id="q-body"> 본문</label>
      <select id="f-user"><option value="">user: all</option></select>
      <label class="chk" id="mine-wrap">
        <input type="checkbox" id="f-mine"> 내 것만</label>
      <select id="f-project"><option value="">project: all</option></select>
      <select id="f-tag"><option value="">tag: all</option></select>
      <select id="f-type"><option value="">type: all</option>
        <option>request</option><option>article</option><option>knowledge</option><option>question</option><option>session</option><option>project</option></select>
    </div>
    <div class="pgroup idcol">
      <!-- 설명은 네이티브 title 이 아니라 이 제품의 hovercard 가 맡는다
           (REQ-20260827-056). tabindex 는 마우스 없이도 그 카드에 닿기 위한 것 —
           손잡이가 곧 포커스 지점이다. 읽어 줄 이름은 usageTitle() 이 채운다. -->
      <span id="usage-chip" class="usagechip" tabindex="0" role="button"></span>
      <span id="whoami" class="who" title="서버가 파생한 신원 — 대시보드는 127.0.0.1 전용이라 브라우저 사용자 = 서버 기동 OS 계정. 다른 계정명으로 연결하려면 터미널에서 s9 user attach"></span>
    </div>
  </div>
  <!-- 서버 코드 낡음 알림 — 낡았을 때만 채워진다 (renderOldCode). 기본은 hidden. -->
  <div class="hrow3" id="oldcode" role="status" aria-live="polite" hidden></div>
  <!-- 서버 자동 복구 알림 — 사건이 있었을 때만 채워진다 (renderGuard). 기본은 hidden.
       코드 낡음 알림 아래에 둔다: 그쪽은 지금 이 순간 잘못 돌고 있다는 사실이라
       사람의 손을 먼저 요구하고, 이쪽은 이미 지나간 일(또는 다음에 벌어질 일)이다. -->
  <div class="hrow3" id="guard" role="status" aria-live="polite" hidden></div>
  <div class="gwlog" id="guard-log" hidden></div>
</header>
<main>
  <p class="count" id="count"></p>
  <div id="my-strip" class="mystrip" hidden></div>
  <div id="proj-info" class="proj-info" hidden></div>
  <div id="view"></div>
</main>
<div id="chief-report-reader" class="chief-report-reader" role="dialog"
     aria-labelledby="chief-report-title" hidden>
  <button class="chief-report-shade" data-chief-report-close aria-label="Close report"></button>
  <section class="chief-report-panel">
    <header class="chief-report-head">
      <div><p>Chief report</p><h2 id="chief-report-title">Report</h2></div>
      <a id="chief-report-external" href="#" target="_blank" rel="noopener">Open in new tab</a>
      <button type="button" data-chief-report-close>Close</button>
    </header>
    <div class="chief-report-body">
      <div id="chief-report-loading" class="chief-report-loading" role="status">Loading report…</div>
      <iframe id="chief-report-frame" title="Chief report"></iframe>
    </div>
  </section>
</div>

<script>
"use strict";
const STATUSES = ["draft","open","in-progress","blocked","review","done","cancelled"];
const TERMINAL = new Set(["done","cancelled"]);
const SCOLOR = {draft:"var(--c-draft)",open:"var(--c-open)","in-progress":"var(--c-inprogress)",
  blocked:"var(--c-blocked)",review:"var(--c-review)",done:"var(--c-done)",
  cancelled:"var(--c-cancelled)",published:"var(--c-published)"};
const TCOLOR = {request:"var(--t-request)",article:"var(--t-article)",
  knowledge:"var(--t-knowledge)",session:"var(--t-session)",
  question:"var(--t-question)"};
const TCOLOR_RAW = {request:"#1d4ed8",knowledge:"#0f766e",session:"#92400e",question:"#9d174d",article:"#6b21a8"};

const COL_LIMIT = 7, COL_LIMIT_TERMINAL = 3, GRP_LIMIT = 20, AUDIT_PAGE = 50;
const GRP_LIMIT_SESSION = 5;                       // session은 기본 노출을 낮춘다 (REQ-20260825-084)

// 끝난 컬럼(done·cancelled)에서 하루가 지난 요청은 **열에서 내린다**
// (REQ-20260827-057). 1차는 "+N 더 보기"로 접어 뒀다가 반려됐다 — "접은 내용에도
// 없애달라". 접는 것은 줄인 것이 아니라 숨긴 것이고, 펼치면 322건이 그대로
// 쏟아져 스크롤은 여전히 힘들다. 그래서 잣대가 둘이 아니라 **순서**다:
// 먼저 하루로 내리고, 남은 것에 원래 개수 접기(3건)를 그대로 적용한다.
// 사용자가 "원래 접는 기능이 괜찮았다"고 못 박았으므로 접기는 손대지 않는다.
// 시각은 카드가 실제로 보여주는 status_since 다 — 끝난 때이지 마지막으로 만진
// 때가 아니다 (REQ-20260827-016과 같은 축: 화면의 시계와 자르는 자는 같아야 한다).
const TERMINAL_WINDOW_MS = 24 * 60 * 60 * 1000;
// 시각을 못 읽는 문서는 오래된 쪽으로 보낸다 — 근거 없이 "방금 끝난 것" 자리를
// 차지하게 두지 않는다. 그런 문서는 Docs 에서 찾는다.
const termAt = r => Date.parse(r.status_since || r.updated || r.created || "") || 0;

// 우선순위 (REQ-20260826-005): 값이 없거나 범위 밖이면 기본 50으로 읽는다 —
// s9의 work_order()와 같은 규칙이라 화면과 CLI의 순서 해석이 갈리지 않는다.
// 정렬은 아래 workOrder() 한 곳에서만 건다.
const PRIO_DEFAULT = 50, PRIO_MAX = 99;
// 등급 경계는 척도 의미 그대로다: low 25 · normal 50 · high 75 · urgent 90.
// 값에서 등급을 파생하는 함수는 하나(prioTier)뿐 — 카드·Docs 목록·문서 뷰어가
// 같은 함수를 쓰므로 세 화면의 등급 판정이 갈릴 수 없다.
// 표는 등급 → 한글 이름 하나다. 게이지 마크(▂▃▅▇)를 뺐다 (REQ-20260827-029):
// 그 블록 문자는 10px 모노 글꼴에서 두부(■)로 떨어져 순위가 아니라 얼룩으로
// 읽혔고, 사용자가 지목한 "예쁘지 않다"의 절반이 그 글자였다. 색을 못 보는
// 조건에서 등급을 가르는 채널은 이제 마크가 아니라 낱말 자체다 —
// '긴급'과 '보통'은 색 없이도 갈린다 (s9-design 접근성 기준 7).
const PRIO_TIERS = {urgent: "긴급", high: "높음", normal: "보통", low: "낮음"};
function prioOf(r){
  const n = Number(r && r.priority);
  return Number.isFinite(n) && n >= 1 && n <= PRIO_MAX ? Math.round(n) : PRIO_DEFAULT;
}
function prioTier(p){ return p >= 90 ? "urgent" : p >= 75 ? "high" : p >= 50 ? "normal" : "low"; }
// request에만 붙인다 — knowledge/session에는 이 축이 없다.
//
// 사람이 읽는 글자는 **등급 낱말**이다 (REQ-20260827-029). 306건이 전부 `50`을
// 달고 있어도 처음 보는 사람은 그 숫자가 무엇인지, 큰 쪽이 급한 것인지 알 수
// 없었다. '보통'은 그 자체로 읽힌다. 접은 것은 표기이지 값이 아니다 —
// 원래 가중치는 세 곳에 그대로 남는다:
//   data-prio  → 정렬·기계·테스트가 읽는 축 (workOrder는 손대지 않았다)
//   title      → 훑는 자리에서 방향까지 한 문장으로 (큰 값이 먼저)
//   full 표기  → 문서 뷰어의 `보통 50/99` — 값과 척도를 함께 가르치는 자리
// full 은 문서 뷰어만 참이다. 훑는 화면에 정확한 값을 다시 깔면 처음 상태로
// 돌아간다 — 목록은 이미 이 값으로 정렬돼 있어 순위는 자리로 읽힌다.
function prioHTML(r, full){
  if (!r || r.type !== "request") return "";
  const p = prioOf(r), tier = prioTier(p), name = PRIO_TIERS[tier];

// "답이 있는가" 하나뿐이고, 그 값은 상태가 아니라 **파생**이다: 진실은 본문의
// answer 노트 하나이고 카탈로그 answered 는 재생성 가능한 사본이다

// 노트 경계는 s9 의 NOTE_HDR_RE 와 같은 형식('### <ts> <label> (by ..)')이다.
const ANSWER_NOTE_RE = /^### \S+ (?:answer|response)\b/im;

// 카탈로그 파생 필드를 쓴다 — 판정 규칙 자체는 이 함수 하나에만 있다.
// 3상이다: true(답함) · false(미답) · null(모른다). 파생 필드가 아직 카탈로그에
// 없을 때 모르는 것을 '미답'이라 단정하면 같은 문서를 두고 목록과 뷰어가 서로

function isAnswered(r, body){
  if (!r || r.type !== "question") return null;

// 무엇이 막혀 있나"에는 답하지 못한다 — 300개 노드에서 화살표 하나를 눈으로 찾는 일은
// 현실적이지 않다. 같은 데이터를 (막힌 요청 × 선행) 짝의 표로 편다.
// dead: 양끝 중 하나가 끝나 화면에서 지운 의존 수 — 표가 비었을 때 "왜 아무것도
// 없나"에 답하는 근거다(수명 규칙 DOC-20260826-001 규칙 4).
function depBoard(rows){
  const groups = [], hold = {};
  let dead = 0;
  for (const r of rows){
    if (r.type !== "request") continue;
    const raw = r.blocked_by || [];
    if (!raw.length) continue;
    const rDead = DEP_DEAD.has(r.status);
    const live = [];
    for (const id of raw){
      const b = catFind(id);
      if (!b) continue;                                  // 카탈로그에 없는 id — 판단 불가, 세지 않는다
      if (rDead || DEP_DEAD.has(b.status)) { dead++; continue; }
      live.push(b);
    }
    if (!live.length) continue;
    live.forEach(b => { hold[b.id] = (hold[b.id] || 0) + 1; });
    groups.push({r, blockers: live});
  }
  // 정렬: ① 그 선행이 붙잡은 건수 ② 막힌 요청이 그 상태로 머문 시간(오래된 것 먼저).
  // 같은 요청의 선행 여러 건은 반드시 붙어 있어야 한다 — 표에서 '〃'가 제 줄을 찾는다.
  const keyT = x => Date.parse(x.status_since || x.updated || "") || Date.now();
  groups.forEach(g => {
    g.blockers.sort((a, b) => hold[b.id] - hold[a.id] || a.id.localeCompare(b.id));
    g.hold = hold[g.blockers[0].id];
  });
  groups.sort((a, b) => b.hold - a.hold || keyT(a.r) - keyT(b.r) || a.r.id.localeCompare(b.r.id));
  const top = Object.entries(hold).sort((a, b) => b[1] - a[1])[0] || null;
  const rowN = groups.reduce((n, g) => n + g.blockers.length, 0);
  return {groups, hold, dead, rowN, top};
}
