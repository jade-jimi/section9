const TERM_WORD = {done: "완료", cancelled: "취소"};

function colHTML(key, label, color, grp){
  const term = TERMINAL.has(key);
  const word = TERM_WORD[key] || "완료";
  // ① 내린다 — 하루가 지난 끝난 요청은 이 열에 없다. 접은 안쪽에도 없다.
  const live = term
    ? grp.filter(r => termAt(r) >= Date.now() - TERMINAL_WINDOW_MS) : grp;
  const cut = grp.length - live.length;
  // ② 남은 것에 원래 접기를 그대로 — 끝난 열 3건, 나머지 7건.
  const limit = term ? COL_LIMIT_TERMINAL : COL_LIMIT;
  const open = expanded.has("col:"+key);
  const shown = open ? live : live.slice(0, limit);
  const hidden = live.length - shown.length;
  // 하루 안에 끝난 것이 없는데 "완료된 요청 없음"이라고만 하면, 322건이 어디
  // 갔는지 답하지 않는 셈이다 — 어느 하루를 말하는지 밝힌다.
  const body = live.length ? shown.map(cardHTML).join("")
    : (cut ? `<div class="colempty">하루 안에 ${word}된 요청 없음</div>`
           : (EMPTY_COL[key] || ""));
  // 내린 것을 설명하는 문구는 두지 않는다 (2026-08-27 사용자 지시 "이런건 문구로
  // 남기지마라"). 하루가 지난 것이 안 보이는 건 **이 화면이 늘 도는 규칙**이지
  // 사고가 아니다 — 규칙을 매번 변명하는 줄은 자리만 먹고 곧 안 읽힌다.
  // (사용자가 건 조건 때문에 안 보이는 경우는 다르다. 그건 원인을 짚어 줘야
  //  풀 수 있어서 Graph 빈 화면이 이름으로 말한다 — REQ-20260827-054.)
  // 컬럼은 이제 전부 request 상태다 (REQ-20260825-084로 etc 컬럼 제거) — 드롭 대상 표시 상시
  return `<div class="col" style="--sc:${color}" data-colstatus="${key}"><h2><span class="cdot"></span>${label}<span class="n">${live.length}</span></h2>
    <div class="cards">${body}
    ${hidden>0 ? `<button class="more" data-expand="col:${key}">${hidden}개 더 보기</button>`
      : (open && live.length>limit ? `<button class="more" data-expand="col:${key}">접기</button>` : "")}
    </div></div>`;
}

// Board는 요청의 상태 흐름만 다룬다 — knowledge/session 컬럼 제거 (REQ-20260825-084).
// 그 컬럼이 하던 일("지식·세션 문서에 도달한다")은 Docs 목록 최상단의 타입바가 받는다.
function renderBoard(rows){
  const reqs = rows.filter(r => r.type === "request");
  const cur = window.__statusFilter || "";
  const shown = cur ? reqs.filter(r => r.status === cur) : reqs;
  /* 띠가 세는 대상을 **열과 같게** 맞춘다 (REQ-20260827-070).
     사용자: "cancelled 카운트 숫자가 다르다." 전수로 세어 보면 계산은 틀리지
     않았다 — 띠는 전체를 세고(cancelled 4), 열 머리는 그 열에 실제로 있는 것만
     센다(3). 차이는 REQ-20260827-057 의 하루 자르기다. 그래도 **같은 낱말에 다른
     수**가 보이면 사람은 고장으로 읽는다. 그리고 그게 맞다: 띠는 열을 여닫는
     필터라, 띠의 수는 눌렀을 때 나올 수와 같아야 한다.
     그래서 세는 집합을 하나로 만든다 — 보드가 실제로 담는 것. */
  const onBoard = reqs.filter(r => !TERMINAL.has(r.status)
    || termAt(r) >= Date.now() - TERMINAL_WINDOW_MS);
  const counts = {};
  onBoard.forEach(r => counts[r.status] = (counts[r.status]||0)+1);
  let html = `<div class="stats">
    <span class="stat${cur===""?" on":""}" data-statf=""><b>${onBoard.length}</b> 전체 요청</span>` +
    STATUSES.filter(s => counts[s]).map(s =>
      `<span class="stat${cur===s?" on":""}" data-statf="${s}" style="--sc:${SCOLOR[s]}">
        <span class="cdot"></span>${s} <b>${counts[s]}</b></span>`).join("") + `</div>`;
  // 병목 한 줄 (REQ-20260826-009 2차): 카드마다 "선행 대기" 줄은 이미 있다 —
  // 카드가 말할 수 없는 것, 즉 "한 선행이 여러 건을 붙잡고 있다"일 때만 띄운다.
  // 그 외에는 같은 사실을 두 번 말하는 것이라 보드를 그대로 둔다.
  const dbk = depBoard(reqs);
  if (dbk.top && dbk.top[1] > 1){
    const b = catFind(dbk.top[0]);
    if (b) html += `<div class="bneck"><span class="bcap">병목</span> `
      + `${dlink(b.id, esc(shortId(b.id)))} `
      + `<b>${esc(b.title)}</b> 이(가) ${dbk.top[1]}건을 붙잡고 있다 · `
      + `전체 ${dbk.groups.length}건이 선행을 기다린다`
      + `<button class="bgo" data-goto="graph">선행 대기 현황 →</button></div>`;
  }
  html += `<div class="board">`;
  for (const st of STATUSES){
    let grp = shown.filter(r => r.status === st);
    // 끝난 컬럼은 우선순위로 세우지 않는다 (REQ-20260827-016).
    // 우선순위는 "다음에 무엇을 할 것인가"에 답하는 축이다 — 이미 끝난 일에는
    // 그 질문이 없다. done 286건이 가중치 계단으로 묶여 있으면 방금 끝난 것을
    // 찾으려고 계단마다 훑어야 한다.
    //
    // 세우는 기준은 **카드가 실제로 보여주는 시각**이다 — `status_since`,
    // 즉 그 상태가 된 때. `updated` 로 세웠다가 반려를 받았다(1차): 그 필드는
    // 노트·링크·인덱스 작업으로 계속 밀려서, 21시간 전에 끝난 문서가 "방금
    // 갱신"으로 맨 위에 왔다. 화면의 시계와 정렬의 자가 다르면 사용자에게는
    // 정렬이 안 된 것으로 보인다 — 그리고 그 말이 맞다.
    if (TERMINAL.has(st))
      grp = [...grp].sort((a, b) => (b.status_since || b.updated || b.created || "")
        .localeCompare(a.status_since || a.updated || a.created || ""));
    // 주요 컬럼은 비어도 자리를 지킨다 — 드롭 대상이자 상태 안내 자리(ux-craft)
    if (!grp.length && (cur || !["open","in-progress","review","done"].includes(st))) continue;
    html += colHTML(st, st, SCOLOR[st], grp);
  }
  html += `</div>`;
  $("#view").innerHTML = html;
  markPicked();   // 집어 둔 카드 표시 복원 (REQ-20260827-064)
  elapsedTimer = setInterval(tickElapsed, 1000);  // 카드 경과시간 실시간 갱신
}

/* ---------------- docs ---------------- */
function hl(text, q){
  let out = esc(text);
  for (const t of q.split(/\s+/).filter(Boolean)){
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, m => `<b>${m}</b>`);
  }
  return out;
}

async function renderDocs(rows){
  const q = $("#q").value.trim();
  let matchMap = null;
  if ($("#q-body").checked && q){
    const data = await (await fetch("/api/search?q=" + encodeURIComponent(q) + "&" + meQ())).json();
    matchMap = Object.fromEntries(data.results.map(r => [r.id, r.matches]));
    rows = rows.filter(r => matchMap[r.id]);
    $("#count").textContent = `${rows.length} matches (body search)`;
  }
  const groups = {request:[],article:[],knowledge:[],question:[],session:[]};
  recentOrder(rows).forEach(r => (groups[r.type] || (groups[r.type]=[])).push(r));
  // 타입 진입점 (REQ-20260825-084): Board에서 knowledge/session 컬럼을 걷어낸 대신,
  // Docs 목록 맨 위에 타입별 건수를 붙박이로 노출하고 한 번 눌러 그 타입만 본다.
  // 카운트는 타입 조건을 뺀 현재 필터 기준 — 다른 타입을 보는 중에도 남은 건수가 보인다.
  const curType = $("#f-type").value;
  let pool = filtered(!!matchMap, true);
  if (matchMap) pool = pool.filter(r => matchMap[r.id]);
  const tcount = {};
  pool.forEach(r => tcount[r.type] = (tcount[r.type]||0)+1);
  // 답 없이 남은 질문 수 — 이 타입을 만든 이유가 여기 있다. "질문이 몇 장인가"와
  // "그중 몇 장이 답이 없나"는 다른 질문이고, 총량만 보이면 뒤엣것을 아무도 묻지
  // 않는다 (REQ-20260826-019). 판정은 목록 행과 같은 함수를 쓴다.
  const qUnanswered = pool.filter(r => isAnswered(r) === false).length;
  const bar = TYPE_ORDER.filter(t => tcount[t] || t === curType).map(t => {
    // 0이면 붙이지 않는다 — 없는 신호를 자리만 채워 두면 있는 신호가 안 읽힌다.
    const un = t === "question" ? qUnanswered : 0;
    return `<button class="tb${curType===t?" on":""}" data-typef="${t}"
      title="${t} 문서만 보기 (다시 누르면 전체)${un ? ` · 답 없는 질문 ${un}장` : ""}"
      >${t}<b>${tcount[t]||0}</b>${un ? `<i class="unans">미답 ${un}</i>` : ""}</button>`;
  }).join("");
  let list = `<div class="typebar">${bar}</div>`;
  for (const [g, grp] of Object.entries(groups)){
    if (!grp.length) continue;
    const open = expanded.has("grp:"+g) || !!matchMap;
    // session은 직접 열어보는 일이 드물다 — 목록에서 자리는 지키되 기본 노출은 짧게.
    const shown = open ? grp : grp.slice(0, g === "session" ? GRP_LIMIT_SESSION : GRP_LIMIT);
    // 건수는 타입바가 소유 — 그룹 헤더는 구획 표시만 한다(같은 숫자 중복 금지).
    // 타입을 골라 보는 중이면 그룹이 하나뿐 — 바로 위 타입바가 같은 단어를
    // 이미 밝혀 놓고 있으므로 헤더를 겹쳐 쓰지 않는다.
    list += (curType ? "" : `<div class="grp">${g}</div>`) + shown.map(r => {
      // 첨부에서 온 줄이면 어느 파일인지 밝힌다 (REQ-20260827-005) — 파일
      // 이름 없이 줄 번호만 보이면 문서 본문의 그 줄로 읽힌다.
      const snips = matchMap?.[r.id] ? matchMap[r.id].slice(0, 3).map(m =>
        `<div class="snip">${m.file ? `<span class="snipf">📎 ${esc(m.file)}</span>` : ""}${m.n}: ${hl(m.text, q)}</div>`).join("") : "";
      // 질문에는 상태 축이 없다 — 색은 상태가 아니라 "답이 남았는가"를 말한다.
      // 미답이 타입색으로 도드라지고 답한 질문은 물러난다: 목록을 훑을 때 눈에
      // 걸려야 하는 것은 아직 답이 없는 질문 쪽이다 (REQ-20260826-017).
      const sc = r.type === "question"
        ? (isAnswered(r) === false ? "var(--t-question)" : "var(--faint)")
        : SCOLOR[r.status];
      // 행 전체가 하나의 컨트롤이다 (REQ-20260827-013) — 보드 카드와 같은 어휘
      // (role=button). 제목만 링크로 떼면 같은 줄에 목적지가 둘로 보인다.
      // tabindex 는 항상 -1 로 나가고 roveSync 가 딱 하나만 0 으로 올린다.
      return `<div class="row${r.id===selectedDoc?" sel":""}" data-doc="${esc(r.id)}"
        role="button" tabindex="-1" data-rove-item${r.id===selectedDoc?' aria-current="true"':""}
        style="--sc:${sc}">
        <span class="st">${esc(statusLabel(r))}</span>
        <div class="id">${esc(shortId(r.id))}${prioHTML(r)}</div><div>${esc(r.title)}</div>${snips}</div>`;
    }).join("");
    if (grp.length > shown.length)
      list += `<button class="more" data-expand="grp:${g}">${grp.length - shown.length}개 더 보기</button>`;
  }
  // 백그라운드 catalog 갱신(15s 폴링)이 뷰어를 파괴하지 않도록 doclist만 교체 —
  // 열려 있는 reqstream 터미널·스크롤·live 폴링이 그대로 산다 (REQ-20260823-071)
  const wrap = $("#view .docs .doclist");
  if (wrap && $("#viewer")){
    // 15초 폴링이 목록을 통째로 갈아끼운다 — 키보드로 짚어 둔 자리를 여기서
    // 놓치면 방향키로 훑던 일이 15초마다 처음으로 돌아간다 (REQ-20260827-013).
    const af = document.activeElement;
    const keepRow = af && af.closest && af.closest(ROVE_ITEM) ? af.dataset.doc : null;
    wrap.innerHTML = list;
    if (keepRow){
      const t = wrap.querySelector(`[data-doc="${cssq(keepRow)}"]`);
      if (t){ t.tabIndex = 0; t.focus({preventScroll: true}); }
    }
  }
  else $("#view").innerHTML = `<div class="docs"><div class="doclist" data-rove
      role="group" aria-label="문서 목록 — 방향키로 이동, Enter 로 열기">${list}</div>
    <div class="viewer" id="viewer"><p class="empty">← 문서를 선택하세요</p></div></div>`;
  roveSync();
  // 그룹 헤더가 붙을 위치 = 타입바의 실제 높이. 좁은 목록에서 타입바가 두 줄로
  // 접히면 30px 고정값은 헤더를 타입바 아래에 숨긴다.
  const tbEl = $("#view .typebar"), dlEl = $("#view .doclist");
  if (tbEl && dlEl) dlEl.style.setProperty("--tbh", tbEl.offsetHeight + "px");
  sizeDocs();
  requestAnimationFrame(sizeDocs);   // 헤더가 자란 뒤(사용량 줄 등) 다시 잰다
  if (selectedDoc) loadDoc(selectedDoc, true);
}

// 목록/뷰어의 높이를 판이 실제로 시작하는 위치에서 잰다 — 헤더 높이는 skin·density·
// 줄바꿈·비동기로 붙는 사용량 줄에 따라 달라져서, 고정 상수(150px)로는 판이 화면
// 밖으로 밀리거나 목록이 짧게 잘렸다 (REQ-20260826-004).
function sizeDocs(){
  const docs = $("#view .docs");
  if (!docs) return;
  // 문서 기준 offset(rect.top + scrollY) — 페이지가 스크롤된 상태에서 재면
  // 높이가 부풀어 다시 페이지 스크롤을 만든다.
  const top = docs.getBoundingClientRect().top + window.scrollY;
  // 아래 여백은 main의 하단 패딩 — skin마다 다르므로 실측해서 뺀다(페이지 스크롤 0).
  const m = $("main"), pad = m ? parseFloat(getComputedStyle(m).paddingBottom) || 0 : 0;
  docs.style.setProperty("--docsh",
    Math.max(240, window.innerHeight - top - pad - 2) + "px");
}
let docsResizeT;
function sizeDocsSoon(){ clearTimeout(docsResizeT); docsResizeT = setTimeout(sizeDocs, 60); }
window.addEventListener("resize", sizeDocsSoon);
// 헤더 높이는 로드 후에도 변한다(사용량 줄, 필터 줄바꿈, skin 전환) — 그때마다 다시 잰다.
if (window.ResizeObserver) requestAnimationFrame(() => {
  const h = document.querySelector("header");
  if (h) new ResizeObserver(sizeDocsSoon).observe(h);
});

// bg=true — renderDocs 경유(탭 진입·필터·15s 폴링) 재로드: updated 무변화면 스킵하고,
// 같은 문서면 뷰어 스크롤·열린 스트림 터미널 상태를 보존한다. 사용자가 직접 문서를
// 클릭하는 경로는 bg 없이 호출되어 기존처럼 상단부터·접힘 기본 (REQ-20260823-071).
async function loadDoc(id, bg){
  selectedDoc = id;
  document.querySelectorAll(".doclist .row").forEach(el => {
    const on = el.dataset.doc === id;
    el.classList.toggle("sel", on);
    // 배경 틴트와 왼쪽 잉크 바는 눈에만 있다 — 열려 있다는 사실을 속성으로도 남긴다
    on ? el.setAttribute("aria-current", "true") : el.removeAttribute("aria-current");
  });
  roveSync();
  const viewer = $("#viewer");
  if (!viewer) return;
  const row = catalog.find(r => r.id === id);
  // 주의: 뷰어의 '표시 중 문서' 상태는 data-showing에 둔다 — data-doc을 쓰면
  // 전역 클릭 위임([data-doc]=문서 링크)과 충돌해 뷰어 내부 클릭마다 리로드된다 (REQ-20260823-076)
  const sameDoc = viewer.dataset.showing === id;
  if (bg && sameDoc && row && viewer.dataset.updated === (row.updated || "")) return;
  let keep = null;  // 같은 문서의 백그라운드 재로드 — 읽던 위치를 잃지 않는다
  if (bg && sameDoc){
    keep = {viewerTop: viewer.scrollTop};
    const det0 = viewer.querySelector(".reqstream");
    if (det0 && det0.open){
      const t0 = det0.querySelector(".term");
      keep.stream = {top: t0.scrollTop,
        atBottom: t0.scrollHeight - t0.scrollTop - t0.clientHeight < 140};
    }
  }
  // fetch 예외(서버 순단 등)가 조용히 삼켜져 뷰어가 빈 채 남던 문제 (REQ-20260824-021):
  // 1회 자동 재시도 후에도 실패면 오류 안내 + 다시 시도 버튼을 표면화한다.
  let res;
  try{
    res = await fetch("/api/doc?id=" + encodeURIComponent(id) + "&" + meQ());
  }catch(e){
    await new Promise(r => setTimeout(r, 800));
    try{
      res = await fetch("/api/doc?id=" + encodeURIComponent(id) + "&" + meQ());
    }catch(e2){
      viewer.innerHTML = `<p class="empty">서버에 연결할 수 없어 문서를 열지 못했습니다 (${esc(id)}).
        서버가 재시작 중일 수 있습니다. <button class="more" data-retrydoc="${esc(id)}">다시 시도</button></p>`;
      return;
    }
  }
  if (!res.ok){
    viewer.innerHTML = `<p class="empty">문서를 찾을 수 없습니다: ${esc(id)} — 삭제되었거나 목록이 오래되었습니다. 목록을 새로고침합니다.</p>`;
    viewer.dataset.showing = ""; viewer.dataset.updated = "";
    selectedDoc = null;
    refreshCatalog(true);
    return;
  }
  const d = await res.json(), m = d.meta;
  // 질문은 여기서 본문을 들고 있다 — 미답 판정을 카탈로그 파생 필드에 의존하지
  // 않고 원본(answer 노트)에서 직접 읽는다 (REQ-20260826-017).
  const isQ = m.type === "question";
  if (isQ) m.answered = isAnswered(m, d.body);
  const li = v => Array.isArray(v) && v.length
    ? v.map(x => DOC_ID_FULL_RE.test(x)
        ? `${dlink(x, esc(shortId(x)))}` : esc(x)).join(", ") : null;
  const rel = v => v ? `${dlink(v, esc(shortId(v)))}` : null;
  // 선행 의존 (REQ-20260826-009): "무엇을 기다리는가"를 상태 바로 아래에서 읽고,
  // 그 문서로 바로 건너뛴다. 끝난 선행은 이 줄에서 사라지고 근거는 아래 History
  // 라인에 남는다 (DOC-20260826-001 규칙 4) — 그래서 목록이 과거로 안 늘어난다.
  const blk = liveBlockers({status: m.status, blocked_by: m.blocked_by});
  const depRow = blk.length
    ? `<span class="depcap">${blk.length > 1 ? `이 ${blk.length}건이 모두` : "이 문서가"} 끝나야 풀린다</span>` + blk.map(b =>
        `<div class="depitem"><span class="cdot" style="background:${SCOLOR[b.status] || "var(--muted)"}"></span>`
        + `${dlink(b.id, esc(shortId(b.id)))} ${esc(b.title)}`
        + `<span class="path"> ${esc(b.status)}</span></div>`).join("")
    : null;
  const fields = [
    // 미답 질문은 여기서 한 번 더 말한다 (REQ-20260826-017): 답이 없다는 사실은
    // 한 단어로는 안 읽히고, 답을 붙이는 명령을 모르면 그대로 방치된다.
    // 질문의 점 색은 상태(published)가 아니라 타입색을 쓴다 — 상태 축이 없는
    // 문서에 상태색을 칠하면 없는 흐름을 읽게 된다.
    ["status", isQ
      ? `<span style="color:var(--t-question)">●</span> ${esc(statusLabel(m))}`
        + (m.answered ? "" :
           `<span class="prio-note">아직 답이 없다 — s9 note ${esc(shortId(m.id))} '…' --label answer</span>`)
      : (m.status ? `<span style="color:${SCOLOR[m.status]}">●</span> ${esc(m.status)}` : null)],
    ["blocked_by", depRow],
    ["summary", esc(m.summary) || null], ["goal", esc(m.goal) || null],
    ["user / machine / session", esc([m.user, m.machine, m.session].filter(Boolean).join(" / "))],
    ["project", esc(m.project) || null],
    // 우선순위는 기본값(50)일 때도 적는다 — 값이 안 보여 "숨겨져 있는 건가"로
    // 반려된 축이다 (REQ-20260826-005). 다만 그 답을 설명문으로 하지는 않는다
    // (REQ-20260827-029): `보통 50/99` 두 낱말이 등급·값·척도를 한 번에 말하고,
    // 척도표와 바꾸는 법은 낱말에 손을 얹거나 Tab으로 닿을 때 카드로 열린다.
    // 카드와 같은 순서로 size보다 앞에 둔다(우선순위 → 크기).
    ["priority", m.type === "request" ? prioHTML(m, true) : null],
    ["size", esc(m.size) || null],
    ["parent", rel(m.parent)], ["children", li(m.children)],
    ["derived_from", rel(m.derived_from)], ["relates", li(m.relates)],
    ["refs_docs", li(m.refs_docs)],
    ["refs_links", (m.refs_links||[]).map(u => `<a href="${esc(u)}" target="_blank">${esc(u)}</a>`).join("<br>") || null],
    ["refs_files", li(m.refs_files)],
    ["tags", (m.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join(" ") || null],  // badge는 @사용자 전용 — 태그에 쓰면 "@#tag"로 렌더
    ["created / updated", esc(m.created) + (m.updated && m.updated !== m.created ? " → " + esc(m.updated) : "")],
  ];
  // 문서별 스트림 터미널도 함께 내린다 (REQ-20260827-042): 서버 /api/reqstream 은
  // 꺼진 사용자에게 아무것도 안 주므로, 접이줄만 남기면 눌러 봐야 "스트림이 없다"만
  // 나온다 — 스위치의 뜻은 하나여야 한다("나는 대화 기록을 쓰지 않는다").
  const streamSec = (m.type === "request" && m.session && streamOn()) ? `
    <details class="reqstream" data-req="${esc(m.id)}">
      <summary>이 요청의 스트림 — 활성 턴의 세션 로그 <span class="path">(한 턴이 여러 요청을 다루면 다른 요청 내용도 섞임 · <b>${esc(m.id)}</b> 언급은 하이라이트)</span></summary>
      <div class="term"><span class="meta">여는 순간 로드됩니다…</span></div>
    </details>` : "";
  // 모든 request 문서: 현재 상태에서 허용되는 전이를 버튼으로 노출.
  // 속성은 data-trans — data-goto 는 본문→탭 점프 전용이고, 그 핸들러가 위임
  // 체인 맨 앞에서 "탭을 못 찾으면 return" 하므로 여기에 재사용하면 문서 본문의
  // 승인/반려가 통째로 죽는다 (REQ-20260826-023 반려: "보드에선 되는데
  // 문서 본문에선 눌러도 아무 반응이 없다"의 원인이 이 이름 충돌이었다).
  const targets = m.type === "request" ? (TRANS[m.status] || []) : [];
  // review 문서의 버튼 문구는 Board 판정 카드와 같은 말을 쓴다 — 같은 행동을
  // 두 화면이 다른 단어로 부르면 사용자가 같은 버튼인지 알 수 없다.
  const RVLABEL = {done: "✓ 승인", "in-progress": "↺ 반려", blocked: "⏸ 보류"};
  /* 읽던 문서에 바로 이어 말한다 (REQ-20260827-064). 보드 카드의 손잡이와 같은
     동작이고, 읽고 있는 자리가 곧 집는 자리다 — 목록으로 돌아가 다시 찾을
     이유가 없다. 전이 버튼들과 같은 줄에 두되 판정과 섞이지 않게 맨 끝이다. */
  const pickAct = `<button data-pick="${esc(m.id)}" title="터미널에서 이 문서에 이어 말한다">→ 이어 말하기</button>`;
  const reviewActs = `<div class="acts" style="margin:10px 0 0">` + targets.map(to => {
        const lb = m.status === "review" && RVLABEL[to] ? RVLABEL[to] : "→ " + to;
        return `<button data-trans="${esc(m.id)}|${to}|${esc(m.status)}" title="${esc(m.status)} → ${to}">${lb}</button>`;
      }).join("") + pickAct + `</div>`;
  // review/blocked 문서: 판단 근거(전이 --note)가 본문 최하단 History에 묻힌다
  // (REQ-20260825-006 반려) — 현재 회차의 note를 상단 callout으로, 과거 회차
  // (이전 확인 포인트·반려 사유)는 접힘 이력으로 (REQ-20260825-011 반려:
  // 다회차 반려 시 회차별 선택지와 최신 선택지가 구분돼 보여야 한다).
  // 패턴은 s9 do_transition의 History 라인 형식과 계약(tests/test_review_gate.py).
  const GATE_RE_SRC = "^- (\\S+) status: ([a-z-]+) -> ([a-z-]+) \\(by ([^)]+)\\)(?: — (.*))?$";
  let gate = "";
  if (m.type === "request" && (m.status === "review" || m.status === "blocked")){
    const gre = new RegExp(GATE_RE_SRC);
    const clean = s => s.replace(/\s*\[via dashboard\]\s*$/, "");
    const rounds = [];  // 시간순: 확인 요청(→현상태) + 반려(review→in-progress)
    for (const ln of d.body.split("\n")){
      const t = ln.match(gre);
      if (!t || !t[5]) continue;
      if (t[3] === m.status)
        rounds.push({ts: t[1], by: t[4], note: clean(t[5]),
                     kind: m.status === "review" ? "확인 요청" : "대기 사유"});
      else if (m.status === "review" && t[2] === "review" && t[3] === "in-progress")
        rounds.push({ts: t[1], by: t[4], note: clean(t[5]), kind: "반려"});
    }
    let curIdx = -1;
    rounds.forEach((r, i) => { if (r.kind !== "반려") curIdx = i; });
    if (curIdx >= 0){
      const cur = rounds[curIdx], prev = rounds.slice(0, curIdx);
      const nth = rounds.filter(r => r.kind !== "반려").length;
      const hist = prev.length
        ? `<details class="gate-h"><summary>이전 판정 이력 ${prev.length}건 — 회차별 확인 포인트·반려 사유</summary>${prev.map(r =>
            `<div class="gate-r"><span class="path">${esc(r.ts.slice(0, 16).replace("T", " "))} · ${r.kind} · ${esc(r.by)}</span><div>${gateNote(r.note)}</div></div>`).join("")}</details>`
        : "";
      // 배경 한 줄: 판단 요구보다 "무엇에 대한 건인가"가 먼저다. 요약이 없는
      // 문서에서는 빈 줄조차 남기지 않는다 (DOC-20260826-015).
      const what = m.summary ? `<div class="gate-w"><span class="gate-wk">무엇을</span>${esc(m.summary)}</div>` : "";
      gate = `<div class="gate">
      <div class="gate-k"><span class="cdot" style="background:${SCOLOR[m.status]}"></span>
        ${m.status === "review" ? (nth > 1 ? `확인 요청 ${nth}차 — 사용자 판단 필요` : "확인 요청 — 사용자 판단 필요") : "blocked — 대기 사유"}
        <span class="path">${esc(cur.ts.slice(0, 16).replace("T", " "))} · ${esc(cur.by)}</span></div>
      ${what}<div class="gate-b">${gateNote(cur.note)}</div>${hist}</div>`;
    }
  }
  /* 아티클은 **읽으려고 여는 문서**다 (REQ-20260827-073). 요청 문서와 같은 틀에
     앉히면 메타표·이력이 글보다 앞자리를 차지하고, 글은 저 아래 한 절로 밀린다.
     그래서 아티클에서만 순서를 뒤집는다: 제목 · 한 줄 요약 · 쓴 사람과 날짜 ·
     **글**. 나머지(원문·메타·이력)는 글 끝에 접어 둔다 — 없애지는 않는다.
     폭과 행간도 다르다. 요청 문서는 훑는 것이고 아티클은 읽는 것이라, 한 줄이
     너무 길면 다음 줄 첫 글자를 못 찾는다(읽기 폭 34em ≈ 60~70자). */
  const artBody = m.type === "article" ? docSection(d.body, "Article") : "";
  if (/[?&]artdbg/.test(location.search))
    document.title = `art type=${m.type} body=${(d.body||"").length} art=${artBody.length}`;
  if (artBody){
    const rest = docWithout(d.body, "Article");
    viewer.innerHTML = `
      <article class="artdoc">
        <h1>${esc(m.title)}</h1>
        ${m.summary ? `<p class="artlede">${esc(m.summary)}</p>` : ""}
        <div class="artby"><span class="badge" style="--ah:${tagHue(m.user||"?")}"><i class="av">${esc((m.user||"?").slice(0,1).toUpperCase())}</i>${esc(m.user||"?")}</span>
          <span>${esc((m.created||"").slice(0,10))}</span>
          <span class="path" title="${esc(m.id)}">${esc(shortId(m.id))}</span></div>
        <div class="md artmd">${md2html(artBody)}</div>
      </article>
      <details class="artmeta"><summary>이 글이 나온 자리 — 원문 · 메타 · 이력</summary>
        <div class="path">${esc(d.path)}</div>
        ${reviewActs}
        <table class="metatbl">${fields.filter(f=>f[1]).map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join("")}</table>
        <div class="md">${md2html(rest)}</div>
      </details>${streamSec}
      <div class="backlinks" id="backlinks"></div>`;
  } else viewer.innerHTML = `
    <div class="path">${esc(d.path)}</div>
    <h1 style="margin:6px 0 2px">${esc(m.title)} <span class="path" style="font-size:13px" title="${esc(m.id)}">${esc(shortId(m.id))}</span></h1>${reviewActs}${gate}
    <table class="metatbl">${fields.filter(f=>f[1]).map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join("")}</table>
    <div class="md">${md2html(d.body)}</div>${streamSec}
    <div class="backlinks" id="backlinks"></div>`;
  viewer.dataset.showing = id;
  viewer.dataset.updated = m.updated || "";
  viewer.scrollTop = keep ? keep.viewerTop : 0;
  renderBacklinks(id);
  attachTexts(viewer, id);
  anchorMark(viewer, m.id);   // 앵커 달린 노트를 그 구간 옆에서 읽게 (REQ-072)
  const det = viewer.querySelector(".reqstream");
  if (det) det.addEventListener("toggle", async () => {
    if (reqStreamTimer){ clearInterval(reqStreamTimer); reqStreamTimer = null; }
    if (!det.open) return;
    const t = det.querySelector(".term");
    let lastCount = -1, firstLoad = true;
    const load = async () => {
      const r = await (await fetch("/api/reqstream?id=" + encodeURIComponent(det.dataset.req) + "&" + meQ())).json();
      if (r.count !== lastCount){  // 변화 있을 때만 재렌더 (flicker/부하 방지)
        lastCount = r.count;
        const nearBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 140;
        t.innerHTML = r.events?.length
          ? `<div class="meta">${r.count} events · session ${esc(r.session)}${r.live ? ' · <span style="color:#34d399">● live</span>' : ""}</div>` + renderEvents(r.events, "")
          : `<span class="meta">이 요청 구간의 스트림이 없습니다 (스트림 미러 이전 문서이거나 다른 머신 세션).</span>`;
        // 자기 요청 언급 하이라이트 (REQ-20260824-029): 다중 REQ 턴에서 내 구간 식별
        const rid = det.dataset.req;
        if (r.events?.length && t.innerHTML.includes(rid)){
          t.innerHTML = t.innerHTML.split(rid).join(`<mark class="reqhl">${rid}</mark>`);
          const nHl = t.querySelectorAll("mark.reqhl").length;
          t.insertAdjacentHTML("afterbegin",
            `<div class="meta">▼ 이 요청(${rid}) 언급 ${nHl}곳 — ` +
            `<a class="hljump" style="cursor:pointer;text-decoration:underline">첫 언급으로 이동</a></div>`);
          t.querySelector(".hljump").addEventListener("click", () => {
            const mk = t.querySelector("mark.reqhl");
            if (mk) mk.scrollIntoView({block: "center"});
          });
        }
        // 펼친 직후엔 최신(하단)으로 — 단, 백그라운드 재렌더 복원이면 읽던 위치 유지.
        // 이후 폴링에선 사용자가 하단 근처일 때만 따라감 (REQ-20260823-071)
        if (firstLoad){
          const rs = det.__restore; det.__restore = null;
          requestAnimationFrame(() => {
            t.scrollTop = rs && !rs.atBottom ? rs.top : t.scrollHeight;
          });
        } else if (r.live && nearBottom){
          requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
        }
      }
      firstLoad = false;
      return r;
    };
    let r;
    try{ r = await load(); }catch(e){ t.textContent = "스트림 로드 실패"; return; }
    if (r && r.live){  // 진행 중인 턴의 요청 — 4초 폴링 follow
      reqStreamTimer = setInterval(async () => {
        if (document.hidden || !det.open) return;
        if (!document.contains(det)){ clearInterval(reqStreamTimer); reqStreamTimer = null; return; }
        try{
          const nr = await load();
          if (!nr.live){ clearInterval(reqStreamTimer); reqStreamTimer = null; }
        }catch(e){}
      }, 4000);
    }
  });
  // 백그라운드 재로드 복원: 이전에 열려 있던 터미널을 다시 열고(toggle 핸들러가
  // 로드·폴링 재개) 저장한 스크롤 위치는 __restore로 전달 (REQ-20260823-071)
  if (det && keep && keep.stream){ det.__restore = keep.stream; det.open = true; }
}

async function renderBacklinks(id){
  const el = $("#backlinks");
  if (!el) return;
  try{
    if (!graph) graph = await (await fetch("/api/graph?" + meQ())).json();
  }catch(e){ return; }
  const back = [...new Set(graph.edges.filter(e => e.to === id).map(e => e.from))];
  if (!back.length){ el.remove(); return; }
  const byId = Object.fromEntries(catalog.map(r => [r.id, r]));
  el.innerHTML = `<h4>Linked mentions — 이 문서를 참조하는 문서 (${back.length})</h4>` +
    back.map(b => {
      const r = byId[b] || {title: b, status: ""};
      return `<div class="bl" data-doc="${esc(b)}"
        role="button" tabindex="-1" data-rove-item><span class="id">${esc(b)}</span>
        ${esc(r.title)} <span class="st" style="color:${SCOLOR[r.status]||"var(--muted)"};font-size:11px"> ${esc(statusLabel(r))}</span></div>`;
    }).join("");
  el.setAttribute("data-rove", "");   // 방향키로 훑는 목록 (REQ-20260827-013)
  roveSync();
}

/* Obsidian식 링크 미리보기 카드.
   여는 경로는 하나(showHover)이고 부르는 손이 둘이다 — 마우스가 얹힐 때와
   키보드가 닿을 때 (REQ-20260827-013). 마우스에만 매달아 두면 링크에 href 를
   붙여 Tab 을 통과시켜 놓고도 "그래서 이게 어느 문서냐"는 마우스에게만 답하는
   꼴이 된다. 읽어 주는 도구에는 숨긴다(aria-hidden) — 링크가 이미 말한 것을
   그림으로 되풀이하는 자리라서다. */
const hovercard = document.createElement("div");
hovercard.className = "hovercard";
hovercard.setAttribute("aria-hidden", "true");
document.body.appendChild(hovercard);
function hideHover(){ hovercard.classList.remove("show"); }
// 넓은 변형은 사용량 카드에서만 — 다음 카드에 묻어가지 않게 열 때마다 정한다
const hoverWide = on => hovercard.classList.toggle("uwide", !!on);
function placeHover(el){
  const rect = el.getBoundingClientRect();
  const top = rect.bottom + 8 + 260 > innerHeight ? rect.top - 8 - 150 : rect.bottom + 8;
  // 폭을 상수로 박아 두면 넓은 카드가 화면 밖으로 나간다 — 내용을 넣은 뒤라
  // 실제로 잰다 (카드는 늘 DOM 에 있고 opacity 로만 숨으므로 측정된다).
  const w = hovercard.offsetWidth || 340;
  hovercard.style.left = Math.max(8, Math.min(rect.left, innerWidth - w - 8)) + "px";
  hovercard.style.top = Math.max(8, top) + "px";
  hovercard.classList.add("show");
}
/* 우선순위 척도 (REQ-20260827-029). 문서 메타 행에 상주하던 설명문
   (`높을수록 먼저 집는다 (1~99, 기본 50)`)이 여기로 왔다 — 한 번 읽으면 끝인
   문장을 306장의 화면에 늘 띄워 둘 이유가 없다. 새 팝오버를 만들지 않고
   doclink 미리보기와 **같은 카드**를 쓴다: 점선 밑줄에 손을 얹으면 뜬다는
   약속이 이 화면에 이미 있어서, 배울 것이 하나도 늘지 않는다. */
function showPrioHover(el){
  hoverWide(false);
  const p = Number(el.dataset.prioscale) || PRIO_DEFAULT, cur = prioTier(p);
  const bands = [["urgent", 90], ["high", 75], ["normal", 50], ["low", 1]]
    .map(([t, lo]) => {
      const seg = `${PRIO_TIERS[t]} ${lo}${t === "low" ? "~49" : "+"}`;
      return t === cur ? `<b>${seg}</b>` : seg;
    }).join(" · ");
  hovercard.innerHTML = `<div class="hid">우선순위</div>
    <div class="ht">${PRIO_TIERS[cur]} · ${p}/${PRIO_MAX}</div>
    <div class="hs">숫자가 클수록 먼저 집는다. 값을 적지 않으면 ${PRIO_DEFAULT}(보통)이다.</div>
    <div class="pscale">${bands}</div>
    <div class="hs" style="margin-top:5px">바꾸기 — <code>s9 set &lt;요청&gt; --priority high</code></div>`;
  placeHover(el);
}
/* 판정 대화상자 (REQ-20260827-071) — prompt·confirm·alert 를 대신하는 한 자리.
   셋을 한 컴포넌트의 변형으로 두는 이유는 이 저장소가 이미 여러 번 겪은 것과
   같다: 판정이 두 벌이면 한 벌만 고쳐진다.

   껍데기는 hovercard 에서 물려받고(스킨이 이미 입혀 둔 배경·라운드·보더색),
   판의 무게는 .dlgbox 가 준다 — 위 CSS 주석에 반려 사유와 재료를 적어 뒀다.
   버튼은 .acts(승인·반려가 쓰는 그 판정 버튼)를 그대로 쓴다.

   자리는 고정이다: 어느 버튼에서 열든 같은 곳에 같은 폭으로 선다. 열 때마다
   자리를 다시 찾게 만들면 "이게 왜 다르지"가 먼저 온다.

   반환: prompt → 적은 글(취소면 null) · confirm → true/false · alert → true. */
const dlg = document.createElement("div");
dlg.className = "dlg hovercard dlgbox";
dlg.setAttribute("role", "dialog");
// aria-modal 을 켜지 않는다 — 보조기술에도 "뒤가 없는 것"이 되면 근거를 읽으며
// 쓸 수 없다. 이 창은 페이지를 잠그지 않는 판정 패널이다.
dlg.hidden = true;
document.body.appendChild(dlg);
let dlgClose = null;   // 열려 있는 창을 닫는 손 (한 번에 하나만 띄운다)

function s9dlg(o){
  if (dlgClose) dlgClose(null);
  const kind = o.kind || "confirm";
  const ask = kind === "prompt";
  if (kind === "choose") return s9choose(o);
  const back = document.activeElement;   // 닫으면 여기로 돌려보낸다
  dlg.innerHTML = `<div class="dlghead">`
    + `<span class="dlgcap${kind === "alert" ? " stop" : ""}">${esc(o.cap || "확인")}</span>`
    + `<span class="dlgesc"><kbd>ESC</kbd> 닫기</span></div>`
    + `<div class="dlgbody">`
    + `<div class="dlgt">${esc(o.title || "")}</div>`
    + (o.desc ? `<div class="dlgs">${esc(o.desc)}</div>` : "")
    + (ask ? `<textarea class="dlgin" rows="3"></textarea>` : "")
    + `</div>`
    + `<div class="dlgfoot"><div class="dlghint"></div><div class="acts">`
    + (kind === "alert" ? "" : `<button type="button" class="dlgno">${esc(o.cancel || "그만두기")}</button>`)
    + `<button type="button" class="dlgyes">${esc(o.ok || "계속")}</button></div></div>`;
  dlg.hidden = false;
  const ta = dlg.querySelector(".dlgin");
  const yes = dlg.querySelector(".dlgyes"), no = dlg.querySelector(".dlgno");
  const hint = dlg.querySelector(".dlghint");
  return new Promise(resolve => {
    // 필수 입력은 벌주지 않는다: 비었으면 확인이 안 눌릴 뿐, 창을 다시 띄워
    // 다그치지 않는다(전에는 빈 값이면 두 번째 prompt 가 떴다).
    const sync = () => {
      const empty = ask && !ta.value.trim();
      if (ask) yes.disabled = !!o.required && empty;
      hint.className = "dlghint" + (o.required && empty ? " need" : "");
      /* 줄바꿈 자리를 **내가 정한다** (REQ-20260827-081). 한 문장으로 흘려
         두었더니 좁은 바닥에서 "…Shift+Enter · / Ctrl+Enter 로 줄바꿈" 처럼
         뜻의 한가운데가 잘렸다. 규칙이 둘이니 줄도 둘이다: 한 줄에 한 규칙씩
         끊어 두면 폭이 얼마든 어색한 자리에서 접히지 않는다. */
      hint.innerHTML = (o.required && empty)
        ? "<span>한 줄이라도 적어야 누를 수 있어요</span>"
        : `<span><kbd>Enter</kbd> 로 ${esc(o.ok || "계속")}</span>`
          // 줄바꿈 키를 둘 다 적는다 — 터미널 입력줄이 둘 다 받으므로
          // (REQ-20260827-038), 한쪽만 적으면 다른 쪽을 못 쓰는 줄 안다.
          + (ask ? `<span><kbd>Shift/Ctrl+Enter</kbd> 로 줄바꿈</span>` : "");
    };
    const done = v => {
      if (dlgClose !== done) return;
      dlgClose = null;
      dlg.hidden = true;
      document.removeEventListener("keydown", onKey, true);
      if (back && back.isConnected && back.focus) back.focus();
      resolve(v);
    };
    const onKey = e => {
      if (e.key === "Escape"){ e.stopPropagation(); done(ask ? null : false); return; }
      if (e.key !== "Enter") return;
      /* 같은 화면의 두 입력 상자가 같은 키에 반대로 굴면 배울 수 없다
         (REQ-20260827-071 재작업). 터미널 입력줄은 REQ-20260827-038 에서 사용자가
         직접 정한 대로 **Enter 로 보내고 Shift+Enter·Ctrl+Enter 로 줄을 바꾼다** —
         대화상자도 같은 손버릇을 쓴다. 여기서 반대로 두면 반려 사유를 쓰던 손이
         터미널로 옮겨갈 때마다 어느 쪽이 보내는 키인지 다시 떠올려야 한다. */
      if (ask && (e.shiftKey || e.ctrlKey || e.metaKey)){
        if (e.target !== ta) return;
        // Shift+Enter 는 textarea 가 스스로 줄을 넣지만 Ctrl+Enter 에는 아무것도
        // 넣지 않는다 — 막기만 하면 "아무 일도 안 일어나는 키"가 된다. 터미널이
        // 쓰는 그 손질을 그대로 한다: 커서 자리에 넣고 다시 그 자리에 세운다.
        if (e.shiftKey) return;
        e.preventDefault();
        const i = ta.selectionStart, j = ta.selectionEnd;
        ta.value = ta.value.slice(0, i) + "\n" + ta.value.slice(j);
        ta.selectionStart = ta.selectionEnd = i + 1;
        sync();
        return;
      }
      // 손이 '그만두기' 위에 있으면 그 버튼이 눌린다 — 포커스가 가 있는 것을
      // 제치고 확인을 누르면 키보드로 쓰는 사람에게는 오작동이다.
      if (no && e.target === no) return;
      if (yes.disabled) return;
      e.preventDefault(); yes.click();
    };
    dlgClose = done;
    document.addEventListener("keydown", onKey, true);
    if (no) no.onclick = () => done(ask ? null : false);
    yes.onclick = () => done(ask ? ta.value.trim() : true);
    sync();
    if (ask){ ta.oninput = sync; ta.focus(); }
    else yes.focus();
  });
}
/* 고르는 변형 (REQ-20260827-079) — 판·깊이·버튼 어휘는 s9dlg 와 같고, 안에 든
   것만 다르다: 확인/취소 대신 **줄 목록**. 줄이 곧 버튼이라 누르면 그것으로
   정해진다(확인 버튼을 따로 두면 "골랐는데 왜 안 되지"가 생긴다).

   returns: {key, chip} · 취소면 null. chip 은 곁들이는 축(깊이)의 선택값. */
function s9choose(o){
  const back = document.activeElement;
  const ch = o.chips;
  let chip = ch ? (ch.cur || "") : "";
  dlg.innerHTML = `<div class="dlghead">`
    + `<span class="dlgcap">${esc(o.cap || "고르기")}</span>`
    + `<span class="dlgesc"><kbd>ESC</kbd> 닫기</span></div>`
    + `<div class="dlgbody">`
    + `<div class="dlgt">${esc(o.title || "")}</div>`
    + (o.desc ? `<div class="dlgs">${esc(o.desc)}</div>` : "")
    + (ch ? `<div class="dlgsub">${esc(ch.label)}</div><div class="dlgchips">`
        + ch.opts.map(([v, t]) => `<button type="button" data-chip="${esc(v)}"`
            + ` class="${v === chip ? "sel" : ""}">${esc(t)}</button>`).join("")
        + `</div>` : "")
    + (o.sub ? `<div class="dlgsub">${esc(o.sub)}</div>` : "")
    + (o.items.length
        ? `<div class="dlglist">` + o.items.map(it =>
            `<button type="button" class="dlgopt${it.cur ? " cur" : ""}"`
            + ` data-opt="${esc(it.key)}">`
            + `<span class="om">${it.cur ? "●" : "○"}</span>`
            + `<span class="ol">${esc(it.label)}</span>`
            + `<span class="on">${esc(it.note || (it.cur ? "지금 이것" : ""))}</span>`
            + `</button>`).join("") + `</div>`
        : `<p class="dlgs" style="margin-top:10px">${esc(o.empty || "고를 것이 없습니다.")}</p>`)
    // 목록과 **다른 종류의 행동**이 하나 딸릴 때가 있다 (모델 창의 ultracode).
    // 줄로 두면 "고르는 것"으로 읽히므로 목록 밖, 아래에 따로 세운다.
    + (o.foot || "")
    + `</div>`
    // 고를 것이 없으면 고르는 법을 알려 주지 않는다 — 없는 조작을 가르치는 줄은
    // 화면을 못 미더워 보이게 만든다.
    + `<div class="dlgfoot"><div class="dlghint">`
    + (o.items.length
        ? `<span><kbd>↑</kbd><kbd>↓</kbd> 로 옮기고 <kbd>Enter</kbd> 로 고르기</span>` : "")
    + `</div>`
    + `<div class="acts"><button type="button" class="dlgno">`
    + `${esc(o.cancel || "그만두기")}</button></div></div>`;
  dlg.hidden = false;
  const opts = [...dlg.querySelectorAll(".dlgopt")];
  const no = dlg.querySelector(".dlgno");
  return new Promise(resolve => {
    const done = v => {
      if (dlgClose !== done) return;
      dlgClose = null;
      dlg.hidden = true;
      document.removeEventListener("keydown", onKey, true);
      if (back && back.isConnected && back.focus) back.focus();
      resolve(v);
    };
    // ↑↓ 는 목록 안에서만 돈다 — 끝에서 반대편으로 감기게 해 두어야 끝에
    // 부딪혀 멈추는 느낌이 없다.
    const onKey = e => {
      if (e.key === "Escape"){ e.stopPropagation(); done(null); return; }
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      if (!opts.length) return;
      e.preventDefault();
      const i = opts.indexOf(document.activeElement);
      const n = opts.length;
      opts[i < 0 ? (e.key === "ArrowDown" ? 0 : n - 1)
                 : (i + (e.key === "ArrowDown" ? 1 : n - 1)) % n].focus();
    };
    dlgClose = done;
    document.addEventListener("keydown", onKey, true);
    if (no) no.onclick = () => done(null);
    dlg.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
      chip = b.dataset.chip;
      dlg.querySelectorAll("[data-chip]").forEach(x => x.classList.toggle("sel", x === b));
    });
    opts.forEach(b => b.onclick = () => done({key: b.dataset.opt, chip}));
    dlg.querySelectorAll("[data-act]").forEach(b =>
      b.onclick = () => done({act: b.dataset.act, chip}));
    // 지금 쓰는 줄에서 시작한다 — 어디에 서 있는지가 먼저 보인다
    (opts.find(b => b.classList.contains("cur")) || opts[0] || no).focus();
  });
}
function showHover(a){
  if (a.classList.contains("prio")){ showPrioHover(a); return; }
  // 사용량 칩은 문서가 아니라 계정의 한도를 편다 — 다시 셈이 필요해 열 때마다
  // 만든다(숨은 탭에서는 60초 폴이 멈춘다: 굳은 "2시간 뒤"는 거짓말이다).
  if (a.id === "usage-chip"){ showUsageHover(a); return; }
  hoverWide(false);
  const r = catFind(a.dataset.doc);   // uid·짧은 지칭 모두 해석 (REQ-034)
  if (!r){ hideHover(); return; }
  hovercard.innerHTML = `<div class="hid">${esc(shortId(r.id))} · ${esc(r.user)} · ${esc((r.updated||"").slice(0,10))}</div>
    <div class="ht">${esc(r.title)}</div>
    ${r.summary ? `<div class="hs">${esc(r.summary)}</div>` : ""}
    <div class="hs" style="margin-top:4px"><span style="color:${SCOLOR[r.status]||"inherit"}">●</span> ${esc(r.status)}${r.project ? " · " + esc(r.project) : ""}</div>`;
  placeHover(a);
}
// 여는 손잡이는 둘이다: 문서 링크와 문서 메타의 우선순위 낱말. 선택자를 하나로
// 두어야 mouseover·focusin·mouseout·focusout 네 경로가 같은 것을 가리킨다.
const hoverTarget = t => t && t.closest
  ? t.closest("a.doclink, .prio.pfull, #usage-chip") : null;
document.addEventListener("mouseover", e => {
  const a = hoverTarget(e.target);
  a ? showHover(a) : hideHover();
});
document.addEventListener("mouseout", e => {
  if (hoverTarget(e.target)) hideHover();
});
document.addEventListener("focusin", e => {
  const a = hoverTarget(e.target);
  a ? showHover(a) : hideHover();
});
document.addEventListener("focusout", e => {
  if (hoverTarget(e.target)) hideHover();
});
// 키보드에는 '마우스를 치우기'가 없다 — 물리는 길을 준다
document.addEventListener("keydown", e => { if (e.key === "Escape") hideHover(); });

/* minimal markdown renderer */
function md2html(src){
  const lines = esc(src).split("\n");
  let out = [], inCode = false, inList = false, para = [];
  const flushPara = () => { if (para.length){ out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (inList){ out.push("</ul>"); inList = false; } };
  // 첨부 인라인 렌더 (REQ-20260825-023/-050): [Image: assets/<id>/<f>] →
  // 문서 가시성을 상속하는 /api/asset 라우트로 <img>. 생성한 HTML은 자리표시자로
  // 보관했다가 마지막에 되돌린다 — linkifyIds가 src/href 속성 안의 문서 id까지
  // 링크로 바꿔 태그를 깨뜨리던 결함(자가 캡처로 발견) 방지.
  const inline = s => {
    const held = [];
    const hold = html => `\u0000${held.push(html) - 1}\u0000`;
    const src2 = s
      .replace(/\[Image: (assets\/([A-Z]{3}-[\w-]+)\/([^\]\/\n]+))\]/g,
        (mm, rel, did, f) => hold(
          `<a class="attlink" href="/api/asset?doc=${encodeURIComponent(did)}&f=${encodeURIComponent(f)}" target="_blank">` +
          `<img class="attimg" src="/api/asset?doc=${encodeURIComponent(did)}&f=${encodeURIComponent(f)}" alt="${f}" loading="lazy"></a>`))
      // data-adoc/data-af: 첨부 본문(attachTexts)이 읽는 자리. data-doc 이라는
      // 이름은 쓰지 않는다 — 그건 문서 열기 위임의 이름이라 칩 클릭을 가로챈다.
      .replace(/\[File: (assets\/([A-Z]{3}-[\w-]+)\/([^\]\/\n]+))\]/g,
        (mm, rel, did, f) => hold(
          `<a class="attfile" data-adoc="${did}" data-af="${f}" href="/api/asset?doc=${encodeURIComponent(did)}&f=${encodeURIComponent(f)}" target="_blank">📎 ${f}</a>`))
      // 레거시 절대경로(미이전) — 로드 불가라 파일명 칩으로만
      .replace(/\[(?:Image|File): ([^\]\n]*\/([^\]\/\n]+))\]/g,
        (mm, full, f) => hold(`<span class="attchip" title="${full}">🖼 ${f}</span>`));
    return linkifyIds(src2
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      // 자리표시자로 빼 두는 이유는 위 첨부와 같다 — 이제 문서 링크도 href 를
      // 가진다(REQ-20260827-013). "#docs/REQ-…" 의 id 앞자는 '/' 인데
      // DOC_ID_INLINE_RE 가 막아 주는 앞자는 따옴표뿐이라, 그대로 두면
      // linkifyIds 가 href 안의 id 를 또 링크로 바꿔 앵커를 중첩시킨다.
      .replace(DOC_ID_WIKI_RE,
        (mm, id) => hold(dlink(id, esc(shortId(id)))))
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>'))
      .replace(/\u0000(\d+)\u0000/g, (mm, i) => held[+i]);
  };
  for (let li = 0; li < lines.length; li++){
    const raw = lines[li];
    if (raw.startsWith("```")){ flushPara(); flushList();
      out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue; }
    if (inCode){ out.push(raw); continue; }
    // 표 — 여러 줄이 모여야 뜻이 생기는 블록이라 문단으로 뭉치기 전에 가른다.
    // 규칙은 터미널 뷰와 **같은 mdTable 한 곳**에 있고, 여기 칸은 원문이라
    // inline 을 걸어 셀 안의 코드·문서 id·첨부 강조를 살린다 (REQ-20260827-008).
    const tb = mdTable(lines, li, "mdtbl", inline);
    if (tb){ flushPara(); flushList(); out.push(tb.html); li = tb.next - 1; continue; }
    const h = raw.match(/^(#{1,6})\s+(.*)/);
    if (h){ flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    /* 인용 — 여태 없어서 `> …` 가 `&gt; …` 로 그대로 나왔다. 구간 메모의 앵커가
       노트 첫 줄에 `> ⌖ 고른 글` 로 남으므로(REQ-20260827-072) 이 자리가 필요해
       졌지만, 없던 것이 결함이기도 하다. 잇닿은 인용 줄은 한 덩이로 묶는다. */
    // 주의: 이 줄들은 이미 `esc()` 를 지나와서 `>` 가 `&gt;` 다 (자가 검증으로
    // 발견 — 처음엔 `>` 로 찾다가 한 줄도 안 걸렸다).
    const QUOTE_RE = /^\s*&gt;\s?/;
    if (QUOTE_RE.test(raw)){
      flushPara(); flushList();
      const q = [];
      while (li < lines.length && QUOTE_RE.test(lines[li]))
        q.push(lines[li++].replace(QUOTE_RE, ""));
      li--;
      out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(raw)){ flushPara();
      if (!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>" + inline(raw.replace(/^\s*[-*]\s+/, "")) + "</li>"); continue; }
    if (!raw.trim()){ flushPara(); flushList(); continue; }
    para.push(raw);
  }
  flushPara(); flushList();
  if (inCode) out.push("</code></pre>");
  return out.join("\n");
}

/* ---------------- 첨부 본문 (REQ-20260827-005) ----------------
   검색은 이미 첨부(PDF 등) 안의 글자를 전문으로 찾는데(REQ-20260826-020),
   문서를 열면 첨부는 파일 이름 칩 하나뿐이었다 — 찾아 놓고도 읽을 수가 없었다.
   원본을 열면 브라우저의 문서 뷰어로 넘어가 대시보드를 떠난다.

   본문은 문서 가시성을 그대로 상속하는 한 곳에서만 가져온다. 화면이 파일
   경로를 직접 조립하면 그 게이트를 비껴가고, 원본은 못 보는 사람이 그 안의
   글자는 다 읽게 된다.

   글자를 뽑아 둔 것이 없는 첨부(이미지·압축 등)에는 아무것도 그리지 않는다 —
   그건 결함이 아니라 정상이고, 없는 것을 첨부마다 알리면 있는 것이 안 읽힌다.

   첫 화면은 발췌다. 전문은 누를 때만 편다: 4천 자가 넘는 본문이 문서 한가운데를
   밀어내면 첨부가 본문을 삼킨다. 검색해서 들어왔으면 찾던 문구가 있는 자리를
   펴 보인다 — 맨 앞 세 줄은 대개 표지다. */
const ATT_HEAD = 3;        // 발췌 줄 수
const ATT_CHARS = 260;     // 발췌 글자 수 (한 줄로 뽑히는 첨부가 많다)
const ATT_MAX = 20000;     // 펼쳐도 여기까지
const ATT_FILES = 8;       // 한 문서에서 훑을 첨부 수
/* `## <이름>` 절 하나만 떼어 내기 / 그 절만 빼고 남기기 (REQ-20260827-073).
   아티클 본문은 `## Article` 절이고, 나머지(원문·이력)는 글 끝에 접어 둔다. */
/* 경계를 "다음 `##`" 으로 잡으면 안 된다 (REQ-20260827-073) — 아티클 본문은 제
   소제목을 `##` 로 쓰므로 `## Article` 바로 다음 줄이 곧 경계가 되어 본문이
   통째로 비었다(자가 검증에서 길이 0 으로 잡았다). 경계는 **이름이 정해진 절**뿐이다. */
const DOC_SECTIONS = ["Original", "Article", "Notes", "History"];
const DOC_SEC_RE = new RegExp(`^##\\s+(?:${DOC_SECTIONS.join("|")})\\s*$`, "m");
function docSectionAt(body, name){
  const m = new RegExp(`^##\\s+${name}\\s*$`, "m").exec(body || "");
  if (!m) return null;
  const from = m.index + m[0].length;
  const next = DOC_SEC_RE.exec((body || "").slice(from));
  return {start: m.index, from, to: next ? from + next.index : (body || "").length};
}
function docSection(body, name){
  const a = docSectionAt(body, name);
  return a ? body.slice(a.from, a.to).trim() : "";
}
function docWithout(body, name){
  const a = docSectionAt(body, name);
  return a ? (body.slice(0, a.start) + body.slice(a.to)).trim() : (body || "");
}

/* ------- 구간에 메모 달기 (REQ-20260827-072) -------
   서버는 `/api/chat` 이 `doc` 와 함께 `anchor`(끌어 고른 글 그대로)를 받으면
   문서 노트 첫 줄에 `> ⌖ 고른 글` 인용으로 남긴다(커밋 2a83a17).
   화면이 할 일은 셋이다: 고른 자리에서 쓰게 하고 · 쓴 것을 그 구간 옆에서 읽게
   하고 · **아무것도 안 쓰면 조용히 사라지는 것**.

   마지막 것이 이 기능의 가장 큰 위험이다. 문서를 **읽으려고** 끄는 사람이 훨씬
   많고, 끌 때마다 쓰기 상자가 튀어나오면 문서를 못 읽는다. 그래서 뜨는 것은
   버튼 하나뿐이고(고른 글이 그 안에 보인다), 쓰는 자리는 그 버튼을 눌러야
   열린다. 다음 클릭·다음 선택·Esc·스크롤이면 버튼은 말없이 사라진다. */
const ANCHOR_MARK = "⌖";
const ANCHOR_MIN = 2, ANCHOR_MAX = 400;
let anchorPop = null;
function anchorPopClose(){
  if (anchorPop){ anchorPop.remove(); anchorPop = null; }
}
function anchorSelText(root){
  const sel = window.getSelection && getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  // 문서 본문 안에서 고른 것만 — 메타표·판정 카드에서 고른 글은 문서의 글이 아니다
  const md = root.querySelector(".md");
  if (!md || !md.contains(r.commonAncestorContainer)) return null;
  const t = String(sel).replace(/\s+/g, " ").trim();
  if (t.length < ANCHOR_MIN || t.length > ANCHOR_MAX) return null;
  return {text: t, rect: r.getBoundingClientRect()};
}
function anchorPopShow(root, docId){
  anchorPopClose();
  const s = anchorSelText(root);
  if (!s) return;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "anchorpop";
  // 고른 글이 버튼 안에 보인다 — 무엇에 다는 메모인지가 곧 라벨이다
  const shown = s.text.length > 34 ? s.text.slice(0, 34) + "…" : s.text;
  b.innerHTML = `<span class="am">${ANCHOR_MARK}</span>`
    + `<span class="at">「${esc(shown)}」</span><span class="ac">에 메모</span>`;
  document.body.appendChild(b);
  const w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = Math.max(8, Math.min(s.rect.left, innerWidth - w - 8)) + "px";
  b.style.top = (s.rect.bottom + 6 + h > innerHeight
    ? Math.max(8, s.rect.top - 6 - h) : s.rect.bottom + 6) + "px";
  b.onclick = e => { e.stopPropagation(); anchorAsk(docId, s.text); };
  anchorPop = b;
}
/* 쓰는 자리는 071 의 판정 대화상자 그대로다 — 같은 판·같은 키·같은 버튼 어휘.
   팝업이 두 벌이면 한 벌만 고쳐진다. */
async function anchorAsk(docId, anchor){
  anchorPopClose();
  const r = catFind(docId);
  const text = await s9dlg({kind: "prompt", cap: "메모",
    title: "고른 구간에 메모를 답니다",
    desc: `「${anchor}」 — ${shortId(docId)} 의 노트로 남고, 그 구간 옆에서 읽힙니다.`,
    required: true, ok: "메모 남기기", cancel: "그만두기"});
  if (text === null) return;
  anchorSend(docId, anchor, text, r);
}
async function anchorSend(docId, anchor, text, r){
  const T = TERM;
  // 노트는 세션을 거쳐 남는다 — 붙어 있는 세션이 없으면 보낼 곳이 없다.
  // 못 하는 일을 말없이 삼키지 않는다.
  if (!T || !T.sid){
    s9dlg({kind: "alert", cap: "연결", title: "메모를 보내지 못했습니다",
      desc: "지금 붙어 있는 세션이 없습니다 — Terminal 탭에서 세션을 깨운 뒤 다시 해 주세요.",
      ok: "닫기"});
    return;
  }
  try{
    const res = await fetch("/api/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, sid: T.sid, doc: docId, anchor})});
    const d = await res.json();
    if (!d.ok) throw new Error(d.reason || d.error || "전송 실패");
    // 끝난 요청에 단 메모는 노트로만 남는다 — 보낸 뒤 한 줄로 말한다
    const end = r && (r.status === "done" || r.status === "cancelled");
    s9dlg({kind: "alert", cap: "메모", title: "그 구간에 메모를 남겼습니다",
      desc: end ? `${shortId(docId)} 는 이미 ${r.status} 라 다시 열리지는 않습니다.`
                : "문서를 다시 열면 그 구간 옆에서 읽힙니다.",
      ok: "닫기"});
  }catch(ex){
    s9dlg({kind: "alert", cap: "연결", title: "메모를 보내지 못했습니다",
      desc: String((ex && ex.message) || "잠시 뒤 다시 시도해 주세요."), ok: "닫기"});
  }
}
/* 앵커 달린 노트를 **그 구간 옆에서** 읽게 짚는다.
   문서가 바뀌어 그 글을 못 찾으면 **못 찾았다고 말한다** — 엉뚱한 곳을 짚으면서
   짚는 척하는 것이 제일 나쁘다. */
/* 팝업을 띄우는 자리와 **지우는 자리**. 지우는 쪽이 더 중요하다 — 읽으려고
   끄는 사람에게 버튼이 남아 있으면 그게 방해다. 다음 선택·클릭·Esc·스크롤·
   탭 이동 어느 것에나 조용히 사라진다. */
function anchorBind(){
  const viewer = $("#viewer") || document;
  document.addEventListener("mouseup", e => {
    if (e.target.closest && e.target.closest(".anchorpop")) return;
    const host = e.target.closest && e.target.closest(".viewer");
    if (!host || !host.dataset.showing){ anchorPopClose(); return; }
    // 브라우저가 선택을 확정한 뒤에 잰다
    setTimeout(() => anchorPopShow(host, host.dataset.showing), 0);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") anchorPopClose();
  });
  document.addEventListener("scroll", anchorPopClose, true);
  document.addEventListener("mousedown", e => {
    if (!(e.target.closest && e.target.closest(".anchorpop"))) anchorPopClose();
  });
}
/* ?anchor — 진단·헤드리스 캡처용 (?dlg·?pick 과 동형). 고른 상태는 손으로
   끌어야 만들어지는데 헤드리스에는 손이 없다. 본문 첫 문단의 한 조각을 골라
   팝업을 세운다. */
function anchorDiag(){
  if (!/[?&]anchor\b/.test(location.search)) return;
  setTimeout(() => {
    const host = document.querySelector(".viewer[data-showing]");
    const md = host && host.querySelector(".md");
    if (!md) return;
    const walk = document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walk.nextNode())) if ((n.nodeValue || "").trim().length > 24) break;
    if (!n) return;
    const r = document.createRange();
    const t = n.nodeValue, i = t.search(/\S/);
    r.setStart(n, i); r.setEnd(n, Math.min(t.length, i + 22));
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    anchorPopShow(host, host.dataset.showing);
  }, 1200);
}
function anchorMark(root, docId){
  const md = root.querySelector(".md");
  if (!md) return;
  // 노트 첫 줄의 `> ⌖ …` 인용 = 앵커. 렌더된 인용문에서 그대로 읽는다.
  const quotes = [...md.querySelectorAll("blockquote")].filter(q =>
    (q.textContent || "").trim().startsWith(ANCHOR_MARK));
  quotes.forEach((q, i) => {
    const anchor = (q.textContent || "").trim().slice(ANCHOR_MARK.length).trim();
    if (!anchor) return;
    const nid = "anq" + i;
    q.id = nid;
    q.classList.add("anchorq");
    const hit = anchorFind(md, anchor, q);
    if (!hit){
      // 못 찾았다고 말한다. 조용히 넘어가면 "메모는 있는데 어디 것인지 모르는"
      // 상태가 되고, 그건 짚는 척보다 낫지만 사람이 이유를 알아야 한다.
      q.insertAdjacentHTML("beforeend",
        `<span class="anlost">문서가 바뀌어 이 구간을 찾지 못했습니다</span>`);
      return;
    }
    hit.classList.add("anchored");
    hit.dataset.anq = nid;
    hit.insertAdjacentHTML("afterend",
      `<a class="anjump" href="#${nid}" title="이 구간에 달린 메모로">${ANCHOR_MARK}</a>`);
    q.insertAdjacentHTML("beforeend",
      `<a class="anback" data-anback="${nid}" title="이 메모가 가리키는 구간으로">${ANCHOR_MARK} 그 구간</a>`);
  });
  md.addEventListener("click", e => {
    const b = e.target.closest("[data-anback]");
    if (!b) return;
    e.preventDefault();
    const t = md.querySelector(`.anchored[data-anq="${b.dataset.anback}"]`);
    if (t) t.scrollIntoView({block: "center", behavior: "smooth"});
  });
}
// 본문에서 그 글을 찾아 감싼다. 공백 차이는 눈감고(마크다운 렌더가 줄바꿈을
// 바꾼다), 그 밖에는 정확히 같은 글만 짚는다 — 비슷한 것을 짚으면 거짓말이다.
function anchorFind(md, anchor, skip){
  const norm = t => (t || "").replace(/\s+/g, " ");
  const want = norm(anchor);
  const walk = document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walk.nextNode())){
    if (skip && skip.contains(n)) continue;
    if (n.parentElement && n.parentElement.closest("blockquote.anchorq")) continue;
    const i = norm(n.nodeValue).indexOf(want);
    if (i < 0) continue;
    // 정규화 인덱스를 원문 인덱스로 되돌린다 (연속 공백이 한 칸으로 접혔다)
    let j = 0, seen = 0, raw = n.nodeValue;
    while (j < raw.length && seen < i){
      if (/\s/.test(raw[j])){ while (j < raw.length && /\s/.test(raw[j])) j++; seen++; }
      else { j++; seen++; }
    }
    const range = document.createRange();
    range.setStart(n, Math.min(j, raw.length));
    // 끝점은 정규화 길이만큼 앞으로 — 원문 공백이 더 길 수 있어 넉넉히 잡고 자른다
    let k = j, left = want.length;
    while (k < raw.length && left > 0){
      if (/\s/.test(raw[k])){ while (k < raw.length && /\s/.test(raw[k])) k++; left--; }
      else { k++; left--; }
    }
    range.setEnd(n, Math.min(k, raw.length));
    const span = document.createElement("span");
    try{ range.surroundContents(span); }catch(e){ return null; }
    return span;
  }
  return null;
}

async function attachTexts(root, docId){
  if (!root) return;
  const chips = [...root.querySelectorAll("a.attfile[data-adoc]")].slice(0, ATT_FILES);
  const qEl = $("#q"), qbEl = $("#q-body");
  const q = (qbEl && qbEl.checked && qEl) ? qEl.value.trim() : "";
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  for (const chip of chips){
    const url = "/api/asset-text?doc=" + encodeURIComponent(chip.dataset.adoc)
              + "&f=" + encodeURIComponent(chip.dataset.af);
    let j = null;
    for (let n = 0; n < 2 && !j; n++){
      try{
        const r = await fetch(url);
        if (!r.ok) break;               // 뽑아 둔 글자가 없는 첨부 — 정상
        j = await r.json();
      }catch(ex){
        // 서버(HTTP/1.0)가 동시 요청에서 이따금 연결을 끊는다 — 한 번 더 묻는다
        // (renderStream 이 쓰는 것과 같은 처방). 두 번째도 안 되면 칩만 남는다.
        if (n) return;
        await new Promise(w => setTimeout(w, 400));
      }
    }
    if (!j) continue;
    if (!chip.isConnected || root.dataset.showing !== docId) return;  // 그새 다른 문서
    const body = String(j.text || "").replace(/[ \t]+\n/g, "\n").trim();
    if (!body) continue;
    // 찾던 문구가 있으면 그 자리를 편다 — 없으면 맨 앞부터
    const low = body.toLowerCase();
    let at = -1, hits = 0;
    for (const t of terms){
      let i = low.indexOf(t);
      while (i >= 0){ hits++; if (at < 0 || i < at) at = i; i = low.indexOf(t, i + t.length); }
    }
    const from = at > 90 ? at - 90 : 0;
    const clip = body.slice(from, from + ATT_CHARS)
      .split("\n").slice(0, ATT_HEAD).join("\n");
    const more = from + clip.length < body.length;
    const full = body.slice(0, ATT_MAX);
    const cut = body.length - full.length;
    const cutNote = cut
      ? `<div class="attcut">…여기까지만 보여준다 — ${cut.toLocaleString("ko-KR")}자가 더 있다. 전부 읽으려면 위의 파일을 열면 된다.</div>`
      : "";
    const box = document.createElement("div");
    box.className = "attext";
    box.innerHTML =
      `<div class="atthd"><span class="attn">${esc(chip.dataset.af)}</span>`
      + `<span>${Number(j.chars || body.length).toLocaleString("ko-KR")}자</span>`
      + (hits ? `<span class="atthit">찾던 문구 ${hits}곳</span>` : "")
      + `</div><div class="attx"></div>`
      + `<button type="button" class="attmore">전문 보기</button>`;
    // 잘라 낸 앞뒤는 말줄임으로 밝힌다 — 발췌를 전문처럼 읽히게 두지 않는다
    const brief = (from ? "…" : "") + hl(clip, q) + (more ? "…" : "");
    const xb = box.querySelector(".attx"), mb = box.querySelector(".attmore");
    xb.innerHTML = brief;
    mb.addEventListener("click", () => {
      const open = !xb.classList.contains("open");
      xb.classList.toggle("open", open);
      xb.innerHTML = open ? hl(full, q) + cutNote : brief;
      // 스크롤 상자는 키보드로도 스크롤돼야 한다 (WCAG 2.1.1) — 마우스 휠만
      // 되는 상자는 키보드 사용자에게 잘린 글이다.
      if (open){ xb.tabIndex = 0; xb.setAttribute("role", "group");
                 xb.setAttribute("aria-label", chip.dataset.af + " 본문"); }
      else { xb.removeAttribute("tabindex"); xb.removeAttribute("role");
             xb.removeAttribute("aria-label"); }
      mb.textContent = open ? "발췌만 보기" : "전문 보기";
      mb.setAttribute("aria-expanded", open);
    });
    mb.setAttribute("aria-expanded", "false");
    let anchor = chip.closest("p") || chip;
    while (anchor.nextElementSibling
           && anchor.nextElementSibling.classList.contains("attext"))
      anchor = anchor.nextElementSibling;
    anchor.insertAdjacentElement("afterend", box);
  }
}

/* ---------------- audit ---------------- */
async function renderAudit(){
  if (!auditCache)
    auditCache = (await (await fetch("/api/audit?" + meQ())).json()).events;
  const q = $("#q").value.trim().toLowerCase();
  const u = $("#f-user").value;
  const kindOf = t =>
    t.startsWith("prompt ") ? "prompt" : t.startsWith("question:") ? "question" :
    t.startsWith("note:") ? "note" : t.startsWith("session ") ? "session" :
    t.startsWith("response") ? "response" : t.includes("removed") ? "removed" : "event";
  const KC = {prompt:"#1d4ed8", question:"#6d28d9", note:"#868c96", response:"#047857",
              session:"#0f766e", removed:"#b91c1c", event:"#5c6470"};
  const evs = auditCache.filter(e =>
    (!u || e.by === u) &&
    (!q || q.split(/\s+/).every(t =>
      (e.text + " " + e.session + " " + e.by + " " + e.ts).toLowerCase().includes(t))));
  $("#count").textContent = `${evs.length} / ${auditCache.length} audit events`;
  const page = evs.slice(0, auditLimit);
  const body = page.map(e => {
    const k = kindOf(e.text);
    return `<tr>
      <td class="ts">${esc(e.ts.slice(0, 16).replace("T", " "))}</td>
      <td><span class="kind" style="--kc:${KC[k]}">${k}</span></td>
      <td>${linkifyIds(esc(e.text))}</td>
      <td>${esc(e.by)}</td>
      <td>${dlink(e.doc, esc(e.session) + "@" + esc(e.machine))}</td>
    </tr>`;
  }).join("");
  $("#view").innerHTML = `<div class="audit">

      작업 상세(구현·응답 전문)는 각 REQ 문서의 Notes에 있습니다.</div>
    <div class="tblwrap"><table>
    <thead><tr><th>time</th><th>type</th><th>event</th><th>by</th><th>session</th></tr></thead>
    <tbody>${body || '<tr><td colspan="5" style="color:var(--faint);padding:18px">no events</td></tr>'}</tbody>
    </table></div>
    ${evs.length > page.length ? `<button class="more" data-audit-more>이전 이벤트 ${evs.length - page.length}건 더 보기</button>` : ""}
  </div>`;
}

/* ---------------- stream ---------------- */
/* 응답 머리의 시각 도장을 화면이 아는 실제 시각으로 고쳐 그린다 (REQ-20260827-010).
   모델이 적는 시각은 프롬프트가 도착한 때의 복사본이다 — 모델은 자기가 말을
   마치는 시각을 알 수 없다. 문서에 남는 기록은 같은 이유로 Stop 훅이 바로잡지만
   (REQ-20260826-038), 이 화면은 세션 로그를 직접 읽어 그리므로 그 보정이 닿지
   않아 같은 응답이 두 자리에서 다른 시각을 말했다.
   **이름은 모델이 쓴 것을 살린다** — 누가 말했는지는 모델만 아는 사실이고,
   눌러 쓰면 위임된 에이전트의 보고가 리드의 말로 둔갑한다.
   **머리에 있는 것만 도장이다**: m 플래그 없는 ^ 로 첫 글자에만 건다 — 본문
   중간에 예시로 적힌 같은 모양까지 고치면 문서가 자기 설명과 어긋난다. */
const STAMP_RE = /^`\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) KST - ([^\]\n]+)\]`/;
const STAMP_DRIFT_SEC = 60;   // 훅과 같은 기준 — 이보다 어긋난 것만 짚어 준다
function stampFix(text, ts){
  const m = STAMP_RE.exec(text || "");
  const real = String(ts || "").slice(0, 19).replace("T", " ");
  if (!m) return null;
  if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(real)) return null;
  const gap = (Date.parse(real.replace(" ", "T"))
             - Date.parse(m[1].replace(" ", "T"))) / 1000;
  return {head: "`[" + real + " KST - " + m[2] + "]`",
          rest: text.slice(m[0].length), wrote: m[1],
          off: isFinite(gap) && Math.abs(gap) >= STAMP_DRIFT_SEC
               ? Math.round(Math.abs(gap)) : 0};
}
const secText = s => s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`;
/* 고쳤다는 사실을 감추지 않는다 — 어긋남이 1분을 넘은 도장만 점선 밑줄로 짚고
   무엇을 고쳤는지 말한다. 색면이 아니라 점선인 것은 doclink 와 같은 어휘라서다. */
const stampHTML = fx => fx.off
  ? `<span class="stampfix" title="모델은 여기에 ${esc(fx.wrote)} 라고 적어 넣었다 — 이 말이 실제로 남은 시각과 ${secText(fx.off)} 어긋난다. 화면은 실제 시각으로 고쳐 그린다.">${esc(fx.head)}</span>`
  : esc(fx.head);
function renderEvents(events, q){
  const RC = {user:"#fbbf24", assistant:"#e2e8f0", tool:"#a5b4fc",
              result:"#94a3b8", thinking:"#64748b"};
  const evs = q ? events.filter(e =>
    (e.text + " " + (e.name || "")).toLowerCase().includes(q)) : events;
  return evs.map(e => {
    const cls = "ev" + (e.agent ? " agent" : "");
    const hd = `<span class="hd" style="color:${RC[e.role] || "#ccc"}">[${esc(e.ts.slice(5,16))}]${e.agent ? " ⚙agent" : ""} ${e.role}${e.name ? " ⚒ " + esc(e.name) : ""}${e.error ? " ⚠ error" : ""}</span>`;
    // 접힌 요약과 펼친 본문이 한 문자열을 함께 본다 — 두 자리가 다른 시각을
    // 말하면 고친 의미가 없다.
    const fx = stampFix(e.text, e.ts);
    const text = fx ? fx.head + fx.rest : e.text;
    const bodyHTML = fx ? stampHTML(fx) + esc(fx.rest) : esc(text);
    if ((e.role === "result" || e.role === "thinking") && text.length > 200){
      return `<div class="${cls}"><details><summary>${hd} <span style="color:#94a3b8">${esc(text.slice(0,110))}…</span></summary>${bodyHTML}</details></div>`;
    }
    return `<div class="${cls}">${hd}\n${bodyHTML}</div>`;
  }).join("");
}

      + `켜려면 터미널에서 <code>s9 user config &lt;이름&gt; stream_mirror on</code>.<br>`
      + `지금 상태는 <code>s9 stream</code> 이 말해 줍니다 (보관 기간·파일 수·용량).<br>`
      + `이미 있던 기록은 지우지 않았습니다 — 지우려면 <code>s9 stream prune --all</code>.`
      + `</span></div></div>`;
    return;
  }
  // 서버(HTTP/1.0)의 간헐 연결 reset이 unhandled rejection으로 새지 않게 —
  // 실패 시 1회 재시도 후 안내 (REQ-037 T7 검증 중 발견)
  let data = await ccFetch("/api/streams");
  if (!data){
    await new Promise(r => setTimeout(r, 400));

  if (!data){

  }
  const sesDocs = Object.fromEntries(
    catalog.filter(r => r.type === "session").map(r => [r.session, r]));
  $("#count").textContent = `${data.streams.length} stream logs (streams/*.jsonl — transcript 미러, 시간은 서버 설정 시간대)`;
  const list = data.streams.map(s => {
    const d = sesDocs[s.session];
    return `<div class="row${s.session===selectedStream?" sel":""}" data-stream="${esc(s.session)}"
      role="button" tabindex="-1" data-rove-item${s.session===selectedStream?' aria-current="true"':""}>
      <span class="st">${(s.size/1024).toFixed(0)}KB</span>
      <div class="id">${esc(s.session)}</div>
      <div>${esc(d ? d.title : "(SES 문서 없음)")}</div>
      <div class="snip">${esc(s.mtime.slice(0,16).replace("T"," "))}</div></div>`;
  }).join("");
  $("#view").innerHTML = `<div class="streamwrap">
    <div class="doclist" data-rove role="group"
      aria-label="세션 목록 — 방향키로 이동, Enter 로 열기">${list || '<div class="grp">no streams — 훅이 턴 종료마다 미러링합니다</div>'}</div>
    <div class="term" id="term"><span class="meta">← 세션을 선택하세요. 터미널 transcript와 동일한 이벤트 흐름이 표시됩니다 (⚙agent = 서브에이전트 실행분). 검색창 = 이벤트 필터. 특정 요청의 구간만 보려면 Docs 탭에서 문서를 열고 "이 요청의 스트림"을 사용하세요.</span></div></div>`;
  roveSync();
  if (selectedStream) loadStream(selectedStream);
}

async function loadStream(s){
  selectedStream = s;
  if (streamTimer){ clearInterval(streamTimer); streamTimer = null; }
  document.querySelectorAll("[data-stream]").forEach(el => {
    const on = el.dataset.stream === s;
    el.classList.toggle("sel", on);
    on ? el.setAttribute("aria-current", "true") : el.removeAttribute("aria-current");
  });
  roveSync();
  const term = $("#term");
  if (!term) return;
  const d = await ccFetch("/api/stream?session=" + encodeURIComponent(s));
  if (!d){ term.textContent = "stream not found: " + s; return; }
  const q = $("#q").value.trim().toLowerCase();
  let offset = d.offset, total = d.count;
  const liveTag = d.live
    ? ' · <span style="color:#34d399">● live</span> <label style="cursor:pointer;color:#94a3b8"><input type="checkbox" id="follow" checked> follow</label>'
    : ' · mirror(턴 종료 시점)';
  term.innerHTML =
    `<div class="meta">session ${esc(s)} · <span id="evcount">${total}</span> events${q ? " · filtered" : ""}${liveTag}</div>` +
    renderEvents(d.events, q);
  term.scrollTop = d.live ? term.scrollHeight : 0;
  if (!d.live) return;
  // 증분 tail: 서버는 offset 이후의 새 라인만 파싱해 반환 — 폴링 부하 최소화.
  // 폴링 조건: follow 체크 + 브라우저 탭 가시 + 요소가 화면에 존재.
  streamTimer = setInterval(async () => {
    if (document.hidden) return;
    if (!document.contains(term)){ clearInterval(streamTimer); streamTimer = null; return; }
    const fl = $("#follow");
    if (!fl || !fl.checked) return;
    try{
      const r = await fetch(`/api/stream?session=${encodeURIComponent(s)}&after=${offset}`);
      if (!r.ok) return;
      const nd = await r.json();
      offset = nd.offset;
      if (nd.events.length){
        const nearBottom = term.scrollHeight - term.scrollTop - term.clientHeight < 140;
        term.insertAdjacentHTML("beforeend",
          renderEvents(nd.events, $("#q").value.trim().toLowerCase()));
        total += nd.events.length;
        const ec = $("#evcount"); if (ec) ec.textContent = total;
        if (nearBottom) term.scrollTop = term.scrollHeight;  // 위로 스크롤해 읽는 중이면 방해 안 함
      }
    }catch(e){ /* 서버 재시작 등 — 다음 tick */ }
  }, 2500);
}

/* 계정·사용량 (REQ-043): 서버가 60s 캐시+계정전환 즉시 무효화 — 클라이언트는
   응답을 캐시하지 않고 매 폴마다 다시 그린다(계정이 바뀔 수 있다는 전제). */
/* 한도가 언제 풀리는지 (REQ-20260827-056).
   칩은 이미 `5h 16% · wk 75% · fable 100%` 를 보여 준다. 100% 를 보고 사람이
   정말로 알고 싶은 것은 숫자가 아니라 **그래서 언제 풀리느냐**이고, 그 답이
   "지금 기다릴까, 다른 길로 갈까"를 결정한다. 서버는 이미 한도마다 resets_at
   을 주므로 화면만 말하면 된다.

   남은 시간을 앞, 절대 시각을 괄호로 둔다: 남은 시간이 결정을 돕는 값이고,
   절대 시각은 일정에 맞추는 값이다. 문장이므로 단위는 사람 말로 쓴다 —
   카드 경과시간의 라틴 축약(2h 37m)은 모노 메타데이터의 어휘라 섞지 않는다.
   보이는 칩에는 넣지 않는다: 헤더는 2행 고정 구조라 칩이 길어지면 툴바가
   접힌다. 그래서 이 정보는 호버의 자리다(사용자도 호버로 요청했다). */
function fmtUntil(iso){
  if (!iso) return "모른다";
  const t = Date.parse(iso);
  if (isNaN(t)) return "모른다";
  const s = Math.floor((t - Date.now()) / 1000);
  if (s <= 60) return "곧";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 60) return `${m}분 뒤`;
  if (h < 24) return (m % 60) ? `${h}시간 ${m % 60}분 뒤` : `${h}시간 뒤`;
  return (h % 24) ? `${d}일 ${h % 24}시간 뒤` : `${d}일 뒤`;
}
// 절대 시각은 보는 사람의 시계로 말한다. 오늘·내일은 이름으로 부른다 —
// "8월 27일 22:59"를 받아 들고 날짜를 다시 세게 만들지 않는다.
function fmtWhen(iso){
  const t = iso ? new Date(iso) : null;
  if (!t || isNaN(t.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  const hm = `${p(t.getHours())}:${p(t.getMinutes())}`;
  const day = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const now = new Date();
  const diff = Math.round((day - new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    / 86400000);
  if (diff === 0) return `오늘 ${hm}`;
  if (diff === 1) return `내일 ${hm}`;
  return `${t.getMonth() + 1}월 ${t.getDate()}일 ${hm}`;
}
let usageLast = null;   // 마지막 응답 — 카드를 열 때 남은 시간을 다시 센다
// 칩에 실린 한도 셋을 [칩 토큰 + 한국어 이름] 순서대로 편다. 이름이 칩에 찍힌
// 글자와 같아야 어느 줄이 칩의 어느 조각인지 옮겨 적지 않아도 된다.
function usageRows(){
  if (!usageLast) return [];
  const L = {};
  (usageLast.limits || []).forEach(x => { L[x.kind] = x; });
  return [[L.session, "5h 세션"], [L.weekly_all, "wk 주간"],
          [L.weekly_scoped, `${L.weekly_scoped
            ? (L.weekly_scoped.scope_name || "모델") : ""} 모델`]]
    .filter(([x]) => x);
}
// 보조기술이 읽는 한 줄 — 화면의 카드와 같은 사실을 평문으로. 카드는 그림이라
// 스크린리더에 닿지 않으므로, 같은 내용을 칩의 이름으로 붙여 준다.
function usageTitle(){
  if (!usageLast) return "클로드 계정과 사용량 — 아직 받지 못했다";
  const d = usageLast;
  return `${d.email || "?"} 사용량. `
    + usageRows().map(([x, name]) => {
        const when = fmtWhen(x.resets_at);
        return `${name} ${x.percent}%, ${fmtUntil(x.resets_at)} 초기화${when ? `, ${when}` : ""}`;
      }).join(". ")
    + ". 60초마다 갱신";
}

   미리보기·우선순위 척도와 **같은 카드**를 쓴다 — 점선/칩에 손을 얹으면 뜬다는

  }).join("");
  hovercard.innerHTML = `<div class="hid ucap">클로드 사용량</div>
    <div class="ht umail">${esc(d.email || "?")}${d.subscription
      ? ` <span>${esc(d.subscription)}</span>` : ""}</div>
    <div class="ug"><span class="uh">한도</span><span class="uh ur">사용</span>`
    + `<span class="uh">남은 시간</span><span class="uh ur">초기화 시각</span>`
    + `<span class="urule"></span>${cells}</div>
    <div class="hs">60초마다 갱신${d.stale ? " · 지금은 마지막으로 받은 값이다" : ""}
      · 눌러서 계정 바꾸기</div>`;

}
async function refreshUsage(){
  const el = $("#usage-chip");
  if (!el) return;
  try{
    const d = await (await fetch("/api/claude/usage")).json();
    if (!d || (!d.ok && !d.stale)){
      // 폭 0 인 빈 칩에 키보드가 멈추면 아무 일도 안 일어나는 정거장이 된다
      // (교차 리뷰 지적 6) — 보여 줄 것이 없으면 tab 순서에서도 빠진다.
      el.textContent = ""; usageLast = null;
      el.removeAttribute("tabindex");
      el.setAttribute("aria-label", usageTitle()); return;

    }
    usageLast = d;
    el.setAttribute("tabindex", "0");   // 되살아나면 다시 tab 으로 닿는다
    // 카드는 그림이라 스크린리더에 닿지 않는다 — 같은 사실을 칩의 이름으로 붙인다
    el.setAttribute("aria-label", usageTitle());
    // ?usagecard: 진단·헤드리스 캡처용 — 호버 카드를 열어 둔다 (?depall·?mpanel 과
    // 동형). 마우스가 없는 환경에서 "직접 보고 고치는" 길을 남긴다.
    if (/[?&]usagecard/.test(location.search)) setTimeout(() => showUsageHover(el), 0);
    const L = {};
    (d.limits || []).forEach(x => { L[x.kind] = x; });
    const pct = x => x == null ? "—"
      : `<span class="${x.percent >= 90 ? "crit" : x.percent >= 70 ? "warn" : ""}">${x.percent}%</span>`;
    el.innerHTML = `${esc(d.email || "?")}${d.stale ? " ⏳" : ""}` +
      ` · 5h ${pct(L.session)} · wk ${pct(L.weekly_all)}` +
      (L.weekly_scoped
        ? ` · ${esc((L.weekly_scoped.scope_name || "model").toLowerCase())} ${pct(L.weekly_scoped)}` : "");
  }catch(e){ /* 다음 폴 */ }
}
