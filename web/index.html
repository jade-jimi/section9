/* 빈 캔버스가 이유를 말한다 (REQ-20260826-039). 원인이 셋이라 답도 셋이다 —
   기록 자체가 없음 / 위 검색·필터가 0건으로 좁힘 / 남은 문서의 종류를 범례에서
   꺼 둠. 셋을 한 문장으로 뭉뚱그리면 사용자는 여전히 어디를 눌러야 할지 모른다.
   문구는 화면에 그대로 나가므로 내부 이름을 쓰지 않는다. */
const GKO = {request:"요청", article:"아티클", knowledge:"지식", question:"질문",
             session:"세션", project:"프로젝트"};

/* 헤더에 지금 걸려 있는 조건들 (REQ-20260827-054).
   반려 사유는 안내가 "조건"이라고 뭉뚱그린 것이었다 — 사용자는 범례에서
   REQUEST 를 켰는데 화면이 그대로였고, 진짜 범인인 헤더의 종류 조건은 안내에
   한 번도 등장하지 않았다. 되돌릴 자리를 모르면 그건 고장으로 읽힌다.
   그래서 조건마다 [이름 · 지금 값 · 되돌리는 손 · 짚어 줄 자리]를 한곳에 둔다.
   verb/undo 를 따로 두는 건 한국어 때문이다: '내 것만'은 걸리는 게 아니라
   켜지고, 지우는 게 아니라 끈다. */
const HCOND = [
  {k:"q", sel:"#q", mark:"#q", ko:"검색어", verb:"걸려 있다", undo:"지우면",
   btn:"검색어 지우기", val: () => $("#q").value.trim(),
   clear: () => { $("#q").value = ""; }},
  {k:"user", sel:"#f-user", mark:"#f-user", ko:"사용자", verb:"걸려 있다", undo:"지우면",
   btn:"사용자 조건 지우기", val: () => $("#f-user").value,
   clear: () => { $("#f-user").value = ""; }},
  {k:"mine", sel:"#f-mine", mark:"#mine-wrap", ko:"'내 것만'", verb:"켜져 있다", undo:"끄면",
   btn:"'내 것만' 끄기", val: () => mineActive() ? "on" : "",
   clear: () => { const mi = $("#f-mine");
     if (mi && mi.checked){ mi.checked = false;
       try{ localStorage.setItem("s9mine", "0"); }catch(e){}
       fillProjects(); } }},
  {k:"project", sel:"#f-project", mark:"#f-project", ko:"프로젝트", verb:"걸려 있다", undo:"지우면",
   btn:"프로젝트 조건 지우기", val: () => $("#f-project").value,
   clear: () => { $("#f-project").value = ""; }},
  {k:"tag", sel:"#f-tag", mark:"#f-tag", ko:"태그", verb:"걸려 있다", undo:"지우면",
   btn:"태그 조건 지우기", val: () => $("#f-tag").value,
   clear: () => { $("#f-tag").value = ""; }},
  {k:"type", sel:"#f-type", mark:"#f-type", ko:"종류", verb:"걸려 있다", undo:"지우면",
   btn:"종류 조건 지우기", val: () => $("#f-type").value,
   clear: () => { $("#f-type").value = ""; }},
];
const hdrConds = () => HCOND.filter(c => c.val());
// 조건 이름은 값까지 함께 말한다 — 화면에 찍힌 그 글자여야 되돌릴 자리를 찾는다.
// ('내 것만'은 값이 곧 이름이라 괄호를 달지 않는다)
const condName = c => `<b>${c.ko}</b>`
  + (c.k === "mine" ? "" : `(<code>${esc(c.val())}</code>)`);
/* 이 종류를 지금 조건에서 지운 범인 하나. 조건을 하나씩 빼 보고, 빼자마자 그
   종류가 나타나면 그게 범인이다. 둘 이상이 겹쳐 가리면 하나를 고르지 않는다 —
   틀린 범인을 대는 것은 아무 말도 안 하는 것보다 나쁘다. */
function condHiding(type){
  const on = hdrConds();
  for (const c of on){
    const rest = filtered(false, false, new Set([c.k]));
    if (rest.some(r => r.type === type)) return {c, n: rest.filter(r => r.type === type).length};
  }
  return null;
}
function graphEmptyState(rows){
  if (!catalog.length)
    return {fix:null,
      msg:"아직 기록된 문서가 없다. 요청을 하나 만들면 여기에 점으로 나타난다.",
      note:"터미널에서 <code>s9 new request</code> 로 첫 요청을 만들 수 있다."};
  // 켰는데도 화면이 그대로면 화면이 그렇게 말한다 (2026-08-27 반려 재작업).
  // 같은 문장을 말없이 다시 그리는 것이 반려의 직접 원인이었다 — 사용자는
  // 컨트롤이 죽은 줄 안다. 켠 것만 인정한다(끄는 건 의도적 축소다).
  const lit = gLastOn ? `<code>${gLastOn.toUpperCase()}</code>` : "";
  /* 켠 종류가 지금 조건에 아예 없다면 범인은 범례가 아니라 헤더다
     (REQ-20260827-054). 이 갈래가 먼저 오는 이유: 사용자가 방금 말한 것이
     "요청을 보여 달라"이므로, 그걸 되돌려 줄 손 하나만 화면에 둔다. 범례를
     켜는 손은 다른 질문("그럼 지금 뭐가 있나")에 답하는 손이라 부연으로 내린다. */
  if (gLastOn && !rows.some(r => r.type === gLastOn)
      && catalog.some(r => r.type === gLastOn)){
    const h = condHiding(gLastOn);
    if (h){
      const ko = GKO[gLastOn] || gLastOn;
      // 남은 것이 무엇인지도 이름으로 말한다 — 여기 있는 종류는 전부 범례에서
      // 꺼 둔 것들이라, 이름을 주면 다른 질문("그럼 지금 뭐가 있나")도 풀린다.
      const other = [...new Set(rows.map(r => r.type))].filter(t => GRAPH_TYPES.includes(t));
      const otherKo = other.map(t => GKO[t] || t).join("·");
      const otherTag = other.map(t => `<code>${t.toUpperCase()}</code>`).join(" · ");
      return {fix:{k:"cond", cond:h.c, label:h.c.btn},
        ack:`${lit} 를 켰지만 화면은 그대로다 — 지금 화면에 ${ko}은 한 건도 없다.`,
        msg:`${condName(h.c)} 조건이 ${h.c.verb}. ${h.c.undo} ${ko} <b>${h.n}건</b>이 다시 보인다.`,
        note: !rows.length ? `이 조건에는 어떤 종류도 남지 않았다.`
          : (other.length
            ? `남은 <b>${rows.length}건</b>은 전부 ${otherKo}이다 — 범례의 ${otherTag} 을 켜면 그쪽이 보인다.`
            : `남은 <b>${rows.length}건</b>은 이 화면이 점으로 그리지 않는 종류다.`)};
    }
  }
  if (!rows.length)
    return {fix:{k:"filters", label:"검색·필터 지우기"},
      ack: gLastOn ? `${lit} 를 켰지만 화면은 그대로다 — 검색·필터가 문서를 먼저 전부 걸러냈다.` : "",
      msg:`검색·필터가 문서를 전부 걸러냈다. 조건을 지우면 <b>${catalog.length}건</b>이 다시 보인다.`,
      note:"새로고침해도 조건이 풀려 다시 보이지만, 이 버튼은 지금 바로 되돌린다."};
  const hid = [...new Set(rows.map(r => r.type))]
    .filter(t => GRAPH_TYPES.includes(t) && !gtypes.has(t));
  if (hid.length){
    const ko = hid.map(t => GKO[t] || t);
    const name = hid.map(t => `<b style="color:${TCOLOR[t] || "var(--text)"}">${GKO[t] || t}</b>`).join("·");
    // 범례에 실제로 찍힌 글자를 그대로 준다. 한국어 이름만 주면 사용자가 영문
    // 대문자 라벨로 스스로 옮겨 찾아야 하고, 취소선 그어진 항목이 여럿이면
    // 그 번역이 곧 오클릭이 된다 — 반려가 그 경로였다.
    const tag = hid.map(t => `<code>${t.toUpperCase()}</code>`).join(" · ");
    return {fix:{k:"types", label:`${ko.join("·")} 다시 켜기`, types:hid},
      ack: (gLastOn && !hid.includes(gLastOn))
        ? `${lit} 를 켰지만 화면은 그대로다 — 지금 조건에 ${GKO[gLastOn] || gLastOn}은 없다.` : "",
      msg:`조건에 맞는 문서 <b>${rows.length}건</b>이 전부 ${name}인데, 그 종류를 지금 꺼 두었다.`,
      note:`범례의 ${tag} 을 직접 눌러도 된다 — 그 설정은 이 브라우저에 저장돼 새로고침해도 남는다.`};
  }
  return {fix:{k:"filters", label:"검색·필터 지우기"},
    msg:`조건에 맞는 <b>${rows.length}건</b>은 이 화면이 점으로 그리지 않는 종류다. 조건을 지우면 전체 관계도가 다시 보인다.`,
    note:"요청·지식·질문·세션만 점으로 그린다."};
}
/* 빈 화면이 지목한 헤더 조건을 화면에서도 짚는다 (REQ-20260827-054).
   점선 = "여기를 누르세요" — 드래그 허용 컬럼(.col.dropok)·범례 지목(.gtype.want)과
   같은 어휘다. 색면을 깔지 않는다. 안내가 사라지면(다른 탭·조건이 풀림) 지목도
   사라져야 하므로 그릴 때마다 전부 지우고 다시 짚는다. */
function markHeaderCause(sel){
  document.querySelectorAll(".fgroup .want").forEach(el => el.classList.remove("want"));
  // 그래프 첫 진입은 await 를 한 번 거친다 — 그 사이 탭이 바뀌었으면 지나간
  // 화면의 지목을 새 화면에 붙이지 않는다.
  const el = (sel && tab === "graph") ? $(sel) : null;
  if (el) el.classList.add("want");
}
function graphEmptyHTML(st){
  if (!st) return "";
  const f = st.fix
    ? `<button class="gefix" data-gfix="${st.fix.k}"${st.fix.types
        ? ` data-gtypes="${esc(st.fix.types.join(","))}"` : ""}${st.fix.cond
        ? ` data-gcond="${esc(st.fix.cond.k)}"` : ""}>${esc(st.fix.label)}</button>`
    : "";
  // 순서 = 방금 누른 것에 대한 응답 → 원인 → 지금 할 일(버튼) → 부연.
  // 인정 줄은 role="status" 안이라 스크린리더에도 "눌린 건 맞다"가 전달된다.
  return `<div class="gempty" role="status">` +
    (st.ack ? `<p class="geack">${st.ack}</p>` : "") +
    `<p class="gemsg">${st.msg}</p>${f}<p class="genote">${st.note}</p></div>`;
}

async function renderGraph(rows){
  if (!graph) graph = await (await fetch("/api/graph?" + meQ())).json();
  // 타입 표시 토글 (REQ-20260824-026): 세션 노드는 로그성 소음이라 기본 숨김 —
  // 범례 클릭으로 타입별 on/off (localStorage 유지)
  const visible = new Set(rows.filter(r => gtypes.has(r.type)).map(r => r.id));
  const nodes = graph.nodes.filter(n => visible.has(n.id)).map(n => ({...n}));
  // 선행 의존 엣지는 수명이 있다 (DOC-20260826-001 규칙 4) — 양끝 중 하나라도
  // 끝났으면 그리지 않는다. 끝난 의존을 계속 그리면 그래프가 과거로 채워진다.
  const stOf = Object.fromEntries(graph.nodes.map(n => [n.id, n.status]));
  const edges = graph.edges.filter(e => visible.has(e.from) && visible.has(e.to)
    && !(e.rel === "blocked_by" && (DEP_DEAD.has(stOf[e.to]) || DEP_DEAD.has(stOf[e.from]))));
  // 병목 농도: 이 선행이 지금 몇 건을 붙잡고 있는가. 노드 후광이 아니라 엣지의
  // 굵기·농도로 — 진한 화살표가 여럿 뻗은 노드가 곧 병목이다 (설계 문서 렌더 요구).
  const blocking = {};
  edges.forEach(e => { if (e.rel === "blocked_by") blocking[e.to] = (blocking[e.to] || 0) + 1; });
  // 범례가 없는 것을 약속하지 않게 — 살아 있는 의존 획 수를 범례에 적고, 0이면 흐려진다.
  const depEdgeN = edges.filter(e => e.rel === "blocked_by").length;
  const edgeOrder = edges.filter(e => e.rel !== "blocked_by")
    .concat(edges.filter(e => e.rel === "blocked_by"));
  const deg = {};
  edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const adj = {};
  edges.forEach(e => {
    (adj[e.from] = adj[e.from] || new Set()).add(e.to);
    (adj[e.to] = adj[e.to] || new Set()).add(e.from);
  });
  // 병목 가중치: 미완료 노드의 "미완료 파생(자손) 수" — 이 노드가 막고 있는 작업량
  const childrenOf = {};
  edges.filter(e => e.rel === "parent").forEach(e => {
    (childrenOf[e.to] = childrenOf[e.to] || []).push(e.from);  // to=부모, from=자식
  });
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const pendingMemo = {};
  const isPending = id => {
    const n = byId[id];
    return n && n.status !== "done" && n.status !== "cancelled" && n.type === "request";
  };
  const pendingDesc = id => {
    if (id in pendingMemo) return pendingMemo[id];
    pendingMemo[id] = 0;  // 순환 가드
    let c = 0;
    for (const ch of (childrenOf[id] || []))
      c += (isPending(ch) ? 1 : 0) + pendingDesc(ch);
    return pendingMemo[id] = c;
  };
  nodes.forEach(n => n.waiting = isPending(n.id) ? pendingDesc(n.id) : 0);

  // 레일에 답할 것이 없으면(막힌 요청 0건) 그리드가 폭을 캔버스에 돌려준다
  const depEmpty = !depBoard(rows).groups.length;
  // 그릴 노드가 하나라도 있으면 안내는 뜨지 않는다 — 그려진 그래프를 덮지 않는다
  const gEmpty = nodes.length ? null : graphEmptyState(rows);
  // 안내가 "이걸 켜라"고 지목한 종류 — 버튼(data-gtypes)과 **같은 출처**를 읽는다.
  // 마크업과 핸들러가 서로 다른 이름을 보다 조용히 갈라지는 것이 REQ-20260826-025
  // 의 결함이었다. 여기서는 st.fix.types 하나만 본다.
  const gWant = new Set((gEmpty && gEmpty.fix && gEmpty.fix.types) || []);
  // 원인이 헤더 조건이면 그 컨트롤을 화면에서도 짚는다 (REQ-20260827-054).
  // 버튼과 **같은 출처**(fix.cond)를 읽어야 말과 손이 갈라지지 않는다.
  markHeaderCause(gEmpty && gEmpty.fix && gEmpty.fix.cond ? gEmpty.fix.cond.mark : null);
  $("#view").innerHTML = `<div class="gsplit${depEmpty ? " empty" : ""}"><div class="graphwrap">
    <div class="legend">
      <button class="gmode${graphLayout==="force"?" on":""}" data-glayout="force">force</button>
      <button class="gmode${graphLayout==="dag"?" on":""}" data-glayout="dag">dag</button>
      ${GRAPH_TYPES.map(t => `<button type="button" class="gtype${gtypes.has(t) ? "" : " off"}${gWant.has(t) ? " want" : ""}" data-gtype="${t}" aria-pressed="${gtypes.has(t)}"
        title="${gWant.has(t) ? "이걸 켜면 지금 조건의 문서가 보인다 — " : ""}${t} 표시 켜기/끄기"><span class="dot" style="background:${TCOLOR[t]}"></span>${t}</button>`).join("")}
      <span class="gedge${depEdgeN ? "" : " none"}" title="blocked_by — 선행이 끝나야 후행이 풀린다. 화살촉이 가리키는 쪽이 막혀 있는 요청이다. 계보(parent 실선 · derived/relates 가는 점선)와 달리 잉크로 그리고, 여러 건을 붙잡은 선행일수록 진하고 굵다. 선행이 끝나면 이 화살표는 사라진다."><svg width="40" height="9" aria-hidden="true"><line x1="0" y1="4.5" x2="28" y2="4.5" stroke="currentColor" stroke-width="1.6" stroke-dasharray="9 5"/><polygon points="28,0.7 39,4.5 28,8.3" fill="currentColor"/></svg>선행 → 후행 대기 <b class="gecount">${depEdgeN}</b></span>
      <span style="margin-left:auto">앰버 호+숫자 = 미완료 파생 병목(1건=¼둘레, 4건+=만원) · 점멸 = in-progress · 실선 링 = blocked · 점선 링 = review</span>
    </div>
    <canvas id="gcanvas"></canvas>${graphEmptyHTML(gEmpty)}
    <button type="button" class="gfit" id="gfit" hidden>⤢ 전체 보기</button>
    <div class="ghint">${graphLayout==="dag" ? "dag: 위→아래 = parent→파생 · " : ""}드래그 = 이동/노드 끌기 · 휠 = 줌 · 빈 곳 더블클릭 = 전체 보기 · 클릭 = 문서 열기</div>
  </div>` + depSummaryHTML(rows) + `</div>`;

  const canvas = $("#gcanvas");
  const dark = isDarkTheme();
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || (dark ? "#111214" : "#fafaf8");
  const wrap = canvas.parentElement;
  // 현황판이 옆으로 나갔으니 캔버스는 세로를 온전히 쓴다 (2차 반려: 아래 패널이
  // 그래프를 눌러 화면이 좁았다). 가로는 그리드가 정한 레일 폭만큼만 내준다.
  const W = wrap.clientWidth || 1200, H = Math.max(340, innerHeight - 210);
  const dpr = devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + "px";
  syncRailH();
  const ctx = canvas.getContext("2d");
  // ---- 우주 별무리 공간감 (2026-08-23 반려 반영: 노드 개체 광택 대신 장면 레벨 깊이) ----
  // 스타필드: 멀리 있는 희미한 입자를 깊이 레이어별 오프스크린 타일에 1회만 렌더 →
  // 매 프레임은 pattern fill뿐(프레임당 arc 0개). 팬/줌 시 레이어마다 다르게 움직여
  // (시차 parallax) 깊이가 생긴다. 배경 전용 — 노드 좌표·히트테스트·물리에 무관.
  const parseCol = v => { ctx.fillStyle = "#888"; ctx.fillStyle = v; const s = ctx.fillStyle;
    if (s[0] === "#") return [1,3,5].map(i => parseInt(s.slice(i, i+2), 16));
    const m = s.match(/[\d.]+/g); return m ? m.slice(0,3).map(Number) : [136,136,136]; };
  const rootCS = getComputedStyle(document.documentElement);
  const bgRGB = parseCol(bgColor);
  // 타입색은 토큰 해석값 사용 — skin/tone이 타입 토큰을 재정의하면 그래프도 따라간다 (스킨 무관 구조 개선 — 유지)
  const TC = {};
  for (const k of GRAPH_TYPES)
    TC[k] = rootCS.getPropertyValue("--t-" + k).trim() || TCOLOR_RAW[k];
  const TCrgb = {};
  for (const k in TC) TCrgb[k] = parseCol(TC[k]);
  // 선행 의존 획은 잉크(--text)다 — 계보 엣지의 저채도 회색과 대비되어 "계보가
  // 아니라 지금 작동 중인 제약"으로 읽힌다. 토큰 파생이라 skin/tone을 따라간다.
  const inkRGB = parseCol(rootCS.getPropertyValue("--text").trim() || (dark ? "#e8e8e4" : "#141518"));
  // 대기 원근(aerial perspective): 원경 노드 색을 배경 쪽으로 — 알파 단독보다 깊이가 뚜렷
  const mixToBg = (rgb, m) => rgb.map((c, i) => Math.round(c + (bgRGB[i] - c) * m));
  // 비네트: 가장자리를 bg 파생 셰이드로 살짝 가라앉혀 중앙 클러스터에 깊이 — 1회 생성
  const vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.38,
                                            W/2, H/2, Math.hypot(W, H) * 0.62);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, `rgba(${bgRGB.map(c => Math.round(c * 0.45)).join(",")},${dark ? 0.5 : 0.18})`);

  let restored = 0;
  if (graphLayout === "dag"){
    // 계층 배치: parent 체인 기준 depth(위=루트, 아래=파생). 병목이 위계로 보인다.
    const parentOf = {};
    edges.filter(e => e.rel === "parent").forEach(e => parentOf[e.from] = e.to);
    const depth = {};
    const depthOf = (id, seen) => {
      if (id in depth) return depth[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const p = parentOf[id];
      return depth[id] = (p && byId[p]) ? depthOf(p, seen) + 1 : 0;
    };
    nodes.forEach(n => depthOf(n.id, new Set()));
    const layers = {};
    nodes.forEach(n => (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n));
    Object.entries(layers).forEach(([d, layer]) => {
      // 부모 x 기준 정렬로 교차 최소화 (단순 barycenter)
      layer.sort((a, b) => {
        const px = id => { const p = parentOf[id]; return p && byId[p] ? byId[p].x || 0 : 0; };
        return px(a.id) - px(b.id);
      });
      const gap = Math.min(170, (W - 120) / Math.max(layer.length, 1));
      layer.forEach((n, i) => {
        n.x = W/2 + (i - (layer.length - 1) / 2) * gap;
        n.y = 70 + d * 105;
      });
    });
    nodes.forEach(n => { n.vx = 0; n.vy = 0;
      n.r = 5 + Math.min(9, 2.2 * Math.sqrt(deg[n.id] || 0)); });
  } else {
    nodes.forEach((n, i) => {
      const saved = graphPos[n.id];
      if (saved){ n.x = saved.x; n.y = saved.y; restored++; }
      else {
        const a = 2 * Math.PI * i / Math.max(nodes.length, 1);
        const rr = 120 + 90 * ((i * 7919) % 13) / 13;   // 결정적 초기 산포
        n.x = W/2 + Math.cos(a) * rr; n.y = H/2 + Math.sin(a) * rr;
      }
      n.vx = 0; n.vy = 0;
      n.r = 5 + Math.min(9, 2.2 * Math.sqrt(deg[n.id] || 0));
    });
  }
  // 병목 노드는 물리적으로도 크게 — 시선이 먼저 간다
  nodes.forEach(n => { if (n.waiting) n.r += Math.min(7, 1.8 * Math.sqrt(n.waiting)); });
  const idx = Object.fromEntries(nodes.map((n,i) => [n.id, i]));
  // ---- 노드 z축 (2026-08-24 반려 반영: 배경 말고 노드 구름 자체에 깊이) ----
  // zf 0=전경 1=원경. 반지름과 독립된 축: 해시(안정 산포) + 허브 근접 + 상태 의미
  // (진행/블록/리뷰=전경으로 끌리고, 종결=원경으로 물러남 — 깊이가 의미를 갖는다).
  const hash01 = id => { let h = 2166136261;
    for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 8) & 0xffff) / 65535; };
  let degMax = 1;
  nodes.forEach(n => { degMax = Math.max(degMax, deg[n.id] || 0); });
  nodes.forEach(n => {
    const hub = Math.sqrt((deg[n.id] || 0) / degMax);
    const act = n.status === "in-progress" || n.status === "blocked" || n.status === "review";
    const fin = n.status === "done" || n.status === "cancelled";
    n.zf = Math.min(0.97, Math.max(0.03,
      0.50 * hash01(n.id) + 0.42 * (1 - hub) + (act ? -0.30 : 0) + (fin ? 0.22 : 0)));
    n.near = 1 - n.zf;
  });
  const drawOrder = [...nodes].sort((a, b) => b.zf - a.zf);   // 원경부터 → 전경이 덮는다
  const depthOf01 = n => n.near;                              // 에지 페이드 호환 (0=원경 1=전경)

  const st = { tf: graphTf ? {...graphTf} : {x:0,y:0,k:1},
               // dag=고정 배치(물리 off), force=기존 배치 살아있으면 살짝만 재정착
               alpha: graphLayout === "dag" ? 0.005
                      : restored > nodes.length * 0.6 ? 0.12 : 1,
               hover:null, drag:null, pan:null, moved:0,
               dx:0, dy:0, lastTouch: performance.now() };
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 깊이 투영: 팬 오프셋을 깊이에 가중(전경이 더 크게 흐름) — 팬/줌 시 노드 사이
  // 상대 이동(운동 시차)이 생겨 구름이 부피로 읽힌다. 줌 k는 전 깊이 공통(역변환 단순).
  const pfOf = n => 0.72 + 0.52 * n.near;                    // 원경 0.72 ~ 전경 1.24
  const sxOf = n => n.x * st.tf.k + (st.tf.x + st.dx) * pfOf(n);
  const syOf = n => n.y * st.tf.k + (st.tf.y + st.dy) * pfOf(n);
  const scOf = n => st.tf.k * (0.62 + 0.55 * n.near);        // 깊이 반지름 배율(원근 축소)
  // 시험 이음새: CDP 검증이 스크린 좌표·zf·카메라 드리프트를 수치로 확인 (REQ-078)
  // 세대 번호를 함께 둔다: 그래프는 목록 갱신마다 다시 세워지고 그때마다 이 판이
  // 통째로 교체된다. 진단이 **이미 죽은 판**을 재고 "잘 된다"고 말하는 사고를
  // 막으려는 표식이다 (REQ-20260827-083 재작업: 앞선 검증이 정확히 그 함정에 빠졌다).
  const myGen = ++gGen;
  window.__gdbg = { gen: myGen, st,
    snap: () => nodes.map(n => ({ id: n.id, sx: sxOf(n), sy: syOf(n),
    zf: n.zf, rr: n.r * scOf(n) })),
    cam: () => ({ dx: st.dx, dy: st.dy }),
    box: () => gBBox(), fit: () => gFit(), size: () => ({W, H}), seen: () => gSeen(),
    screen: (k, x, y) => gScreenBox(k, x, y),
    // 프레임 한 장을 손으로 그린다: 헤드리스 캡처는 rAF 가 거의 돌지 않아
    // (측정: 3초에 3장) 화면이 옛 상태로 남는다 — 눈으로 볼 수 있게 밀어 준다.
    frame: () => { gFitStep(); draw(); gAwaySync(); } };

  function step(){
    const a = st.alpha;
    for (let i = 0; i < nodes.length; i++) for (let j = i+1; j < nodes.length; j++){
      const p = nodes[i], q = nodes[j];
      let dx = p.x-q.x, dy = p.y-q.y, d2 = dx*dx+dy*dy || 1;
      if (d2 > 90000) continue;
      const d = Math.sqrt(d2), f = 2600 / d2 * a;
      p.vx += f*dx/d; p.vy += f*dy/d; q.vx -= f*dx/d; q.vy -= f*dy/d;
    }
    for (const e of edges){
      const p = nodes[idx[e.from]], q = nodes[idx[e.to]];
      let dx = q.x-p.x, dy = q.y-p.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
      const f = (d - 130) * 0.05 * a;
      p.vx += f*dx/d; p.vy += f*dy/d; q.vx -= f*dx/d; q.vy -= f*dy/d;
    }
    for (const n of nodes){
      if (st.drag === n) { n.vx = n.vy = 0; continue; }
      n.vx += (W/2 - n.x) * 0.004 * a; n.vy += (H/2 - n.y) * 0.004 * a;
      n.x += n.vx; n.y += n.vy; n.vx *= 0.85; n.vy *= 0.85;
    }
    st.alpha = Math.max(0.005, st.alpha * 0.985);
  }

  // 화살촉: 선행(x0,y0) → 후행(x1,y1). 막힌 문서 원의 경계 바로 밖에 촉을 놓아
  // 노드를 덮지 않게 한다. 크기는 화면 px 기준(√k)이라 줌아웃해도 방향이 남는다.
  //
  // 1차 반려("촉이 보이지 않는다")의 기하 원인 4가지를 여기서 함께 고쳤다:
  //  ① 획이 촉을 관통했다 — 중심→중심으로 긋고 그 위에 삼각형을 얹으니 실루엣이
  //     "끝이 좀 두꺼운 선"으로만 읽혔다. 이제 획은 촉의 밑변에서 끊는다(depGeom.bx/by).
  //  ② 촉이 획과 같은 알파였다 — 촉은 불투명(hover 감쇠 중에도 획보다 한 단계 진하게).
  //  ③ 분리선이 없었다 — 배경색 1.4px 테두리를 둘러 노드 링·교차 계보선과 겹쳐도
  //     윤곽이 남는다.
  //  ④ 밑변이 좁았다(L*0.44) — 가는 다트라 9/5 대시 한 칸과 구별되지 않았다. L 하한을
  //     11px로 올리고 밑변을 L*0.52로 넓혔다.
  function depGeom(x0, y0, x1, y1, rTo, rFrom, w){
    const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    // 촉이 들어갈 자리: 두 원 사이의 빈 구간. 이웃한 두 허브가 붙어 있으면 이
    // 구간이 촉보다 짧다 — 그때만 촉을 줄이되 7px 밑으로는 내리지 않는다.
    const gap = d - rTo - rFrom - 3;
    let L = Math.min(17, Math.max(11, (8.5 + 1.6 * w) * Math.sqrt(st.tf.k)));
    if (gap < L) L = Math.max(7, gap);
    const B = L * 0.52;
    const off = Math.min(rTo + 2.5, Math.max(0, d - L - 1));   // 촉 끝은 항상 선 위에 남는다
    const tx = x1 - ux * off, ty = y1 - uy * off;
    return {ux, uy, L, B, tx, ty, bx: tx - ux * L, by: ty - uy * L};
  }
  function depArrow(g, col){
    const {ux, uy, L, B, tx, ty} = g;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * L - uy * B, ty - uy * L + ux * B);
    ctx.lineTo(tx - ux * L + uy * B, ty - uy * L - ux * B);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.lineJoin = "round"; ctx.lineWidth = 1.4; ctx.strokeStyle = bgColor; ctx.stroke();
    ctx.lineJoin = "miter";
  }

  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    // 유휴 카메라 드리프트: 정지 화면에서도 깊이별 상대 운동이 보이게 (5차 반려 반영).
    // 인터랙션 5초 후 3초 페이드인, ±8px 리사주(비정수 주기비 — 반복 패턴 없음)
    const tnow = performance.now();
    const idleAmp = (!RM && tnow - st.lastTouch > 5000)
      ? Math.min(1, (tnow - st.lastTouch - 5000) / 3000) : 0;
    st.dx = idleAmp * 8 * Math.sin(tnow / 2900);
    st.dy = idleAmp * 6 * Math.sin(tnow / 4100 + 1.7);
    // (6차 반려로 배경 스타필드 제거 — 깊이는 노드 z축·유휴 드리프트가 담당)
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    const hov = st.hover, nb = hov ? (adj[hov.id] || new Set()) : null;
    const dim = id => hov && id !== hov.id && !nb.has(id);
    // 의존 획은 계보 획 다음에 — 노드 300개의 회색 선 다발에 파묻히지 않게 위로 올린다
    for (const e of edgeOrder){
      const p = nodes[idx[e.from]], q = nodes[idx[e.to]];   // p=막힌 문서(후행), q=선행
      const hot = hov && (e.from === hov.id || e.to === hov.id);
      if (e.rel === "blocked_by"){
        // 세 번째 획: 잉크 + 긴 대시 리듬(9/5) + 화살촉. parent 실선·계보 점선(4/4)
        // 어느 쪽과도 굵기·색·리듬이 다르다. 굵기와 농도는 이 선행이 붙잡은
        // 건수에 비례 — 병목이 그림에서 바로 읽힌다.
        const w = Math.min(4, blocking[e.to] || 1);
        const dz = 0.68 + 0.32 * Math.max(depthOf01(p), depthOf01(q));  // 원근은 절제 — 제약은 흐려지면 안 된다
        const a = Math.min(0.92, hov ? 0.16 : ((dark ? 0.66 : 0.60) + 0.07 * w) * dz);  // hover 시 나머지는 물러난다
        const HOT = dark ? "#8b9cf5" : "#6474e0";
        const col = hot ? HOT : `rgba(${inkRGB.join(",")},${a.toFixed(3)})`;
        // 촉은 획보다 한 단계 진하게 — 평시엔 불투명, hover 감쇠 중에도 획 위로 뜬다
        const headCol = hot ? HOT
          : `rgba(${inkRGB.join(",")},${(hov ? Math.min(1, a + 0.30) : 1).toFixed(3)})`;
        const g = depGeom(sxOf(q), syOf(q), sxOf(p), syOf(p),
                          p.r * scOf(p), q.r * scOf(q), w);
        // 획은 촉의 밑변에서 끊는다 — 관통하면 실루엣이 "끝이 두꺼운 선"이 된다
        ctx.beginPath(); ctx.moveTo(sxOf(q), syOf(q)); ctx.lineTo(g.bx, g.by);
        ctx.setLineDash([9, 5]);
        ctx.lineWidth = (hot ? 2.1 : 1.0 + 0.42 * w) * dz;
        ctx.strokeStyle = col;
        ctx.stroke();
        ctx.setLineDash([]);
        depArrow(g, headCol);
        continue;
      }
      ctx.beginPath(); ctx.moveTo(sxOf(p), syOf(p)); ctx.lineTo(sxOf(q), syOf(q));
      ctx.setLineDash(e.rel === "parent" ? [] : [4, 4]);
      if (hot){
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = dark ? "#8b9cf5" : "#6474e0";
      } else {
        // 에지 원근: 깊은 쪽 끝점을 따라 얇고 흐리게 — 에지가 깊이 방향으로 가라앉는다
        const dz = 0.6 * Math.min(depthOf01(p), depthOf01(q))
                 + 0.4 * (depthOf01(p) + depthOf01(q)) / 2;
        const ea = (hov ? (dark ? .15 : .2) : (dark ? .5 : .6)) * (0.30 + 0.70 * dz);
        ctx.lineWidth = 0.6 + 0.9 * dz;
        ctx.strokeStyle = dark ? `rgba(90,105,130,${ea})` : `rgba(150,165,190,${ea})`;
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    const now = performance.now();
    // 활성 상태 링 색 (canvas는 CSS 변수 rgba 조립을 위해 raw RGB)
    const RING = dark
      ? {"in-progress":"217,149,55", blocked:"224,93,93", review:"165,130,232"}
      : {"in-progress":"180,83,9",  blocked:"185,28,28", review:"109,40,217"};
    function drawNode(n){
      const terminal = n.status === "done" || n.status === "cancelled";
      const faded = dim(n.id);
      const hovered = hov && n.id === hov.id;
      const px = sxOf(n), py = syOf(n);
      const rr = n.r * scOf(n) * (hovered ? 1.12 : 1);
      // 깊이 3중주: 투명도(반려 요구) + 대기 원근(색이 배경으로 물러남) + 크기 감쇠.
      // 7차 반려로 대비 강화: 하한 0.12 + 지수 커브 — 원근 차이가 정지 화면에서도 즉시 보인다.
      // hover는 일시 전경화(알파 1·원색) — 깊은 노드도 짚으면 앞으로 나온다.
      const bodyA = faded ? 0.12 : hovered ? 1
                  : (terminal ? 0.55 : 1) * (0.12 + 0.88 * Math.pow(n.near, 1.35));
      const sigA  = faded ? 0.12 : terminal ? 0.45 : Math.max(0.6, n.near + 0.35);
      ctx.globalAlpha = bodyA;
      if (hovered){ ctx.shadowColor = TC[n.type] || "#999"; ctx.shadowBlur = 14; }
      ctx.beginPath(); ctx.arc(px, py, rr, 0, 7);
      const rgb = TCrgb[n.type] || [153,153,153];

      if (showLabel){
        ctx.font = `11px "Noto Sans KR",sans-serif`;
        ctx.textAlign = "center";

    for (const n of drawOrder) if (!hov || n.id !== hov.id) drawNode(n);

  /* ------- 전체 보기 (REQ-20260827-083) -------
     커서 기준 줌은 옳다 — 옵시디언도 그렇게 한다. 문제는 **되돌릴 방법이 없다**는
     것이었다: 화면 가장자리에서 줌아웃하면 그래프가 그 구석에 남고, 손으로 끌어
     되찾아야 하니 사용자에게는 "대각선으로 고정된다"로 보인다.

     그래서 두 가지를 더한다. ① 전체 보기 — 경계 상자를 재서 여백을 두고 꽉 채운다.
     ② 줌아웃이 화면을 비우지 않게 — 그래프가 화면보다 작아지면 그때부터는 커서
     대신 화면 가운데로 물린다. 사람이 줌아웃하는 이유는 "다 보고 싶다"이지
     "구석으로 보내고 싶다"가 아니다.

     2차(반려 "빈 곳을 더블클릭 하면 원복이 안된다") — 세 군데가 틀려 있었다.
     ㉠ 옮기는 일을 프레임 루프에만 맡겼다. 프레임은 늘 도는 것이 아니다(배경 탭·
        전원 절약·헤드리스에서는 3초에 세 장). 그러면 눌러도 아무 일이 없다.
        이제 시간이 지나면 프레임과 무관하게 도착한다.

        클릭이 짝으로 묶이지 않는 환경이 있다. 이제 우리가 직접 센다.

        지나므로, 그 자로 "맞췄다"고 해도 화면에서는 어긋난다. 이제 그리는 자와

  const GFIT_PAD = 56;
  function gBBox(){
    if (!nodes.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes){
      if (x0 > n.x - n.r) x0 = n.x - n.r;
      if (y0 > n.y - n.r) y0 = n.y - n.r;
      if (x1 < n.x + n.r) x1 = n.x + n.r;
      if (y1 < n.y + n.r) y1 = n.y + n.r;

  /* 화면 상자 — 노드가 **실제로 그려지는 자리**로 잰다. 팬 오프셋은 깊이에 가중돼

  function gScreenBox(k, tx, ty){
    if (!nodes.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes){
      const pf = pfOf(n), rr = n.r * k * (0.62 + 0.55 * n.near);
      const sx = n.x * k + (tx + st.dx) * pf, sy = n.y * k + (ty + st.dy) * pf;
      if (x0 > sx - rr) x0 = sx - rr;
      if (y0 > sy - rr) y0 = sy - rr;
      if (x1 < sx + rr) x1 = sx + rr;
      if (y1 < sy + rr) y1 = sy + rr;
    }
    return {x0, y0, x1, y1, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0),

  const gClampK = k => Math.min(4, Math.max(0.25, k));
  /* 화면에 꽉 채우는 변환값 — 계산만 하고 옮기지는 않는다.
     배율과 자리가 서로 맞물려 있어(자리를 옮기면 깊이 가중 때문에 폭도 바뀐다)
     한 번에 풀리지 않는다. 배율 → 자리를 몇 번 번갈아 재면 곧 붙는다. */
  function gFitTf(){
    const b = gBBox();
    if (!b) return null;
    let k = gClampK(Math.min((W - GFIT_PAD * 2) / b.w, (H - GFIT_PAD * 2) / b.h));
    let x = W / 2 - b.cx * k, y = H / 2 - b.cy * k;
    for (let i = 0; i < 4; i++){
      let s = gScreenBox(k, x, y);
      k = gClampK(k * Math.min((W - GFIT_PAD * 2) / s.w, (H - GFIT_PAD * 2) / s.h));
      s = gScreenBox(k, x, y);
      x += W / 2 - s.cx; y += H / 2 - s.cy;
    }
    return {k, x, y};
  }
  /* 순간이동하면 어디로 갔는지 사람이 못 따라간다 — 짧게, 감속으로 옮긴다.
     240ms 는 이 제품의 모션 규약(120~240ms · ease-out) 안이다. 움직임을 줄여
     달라고 한 사람에게는 옮기지 않고 바로 놓는다. */
  const REDUCE_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function gFit(){
    const to = gFitTf();

    st.fit = {t0: performance.now(), ms: 240, from: {...st.tf}, to};
    /* **반드시 도착한다.** 옮기는 일은 프레임 루프가 하는데, 프레임은 늘 도는 것이
       아니다 — 배경 탭·전원 절약·헤드리스에서는 초당 한 장도 안 그린다. 그때
       애니메이션만 걸어 두면 그래프는 구석에 그대로 남고 사용자에게는 "눌러도
       아무 일이 없다"가 된다(반려 사유). 약속한 것은 부드러움이 아니라 전체 보기다:
       옮기는 시간이 지났는데 아직 가는 중이면 그냥 놓는다. */
    clearTimeout(st.fitLand);

    }, 320);

  function gFitStep(){
    if (!st.fit) return;

  /* 그래프가 화면 밖으로 거의 나갔을 때만 손잡이를 띄운다 (터미널의 "맨 아래로"와
     같은 손이다 — 늘 떠 있는 안내는 곧 안 읽힌다).

     상자가 화면보다 커져 손잡이가 떠 버리는데, 그건 갇힌 게 아니라 들여다보는

  function gSeen(){

  // 히트테스트: 깊이 투영과 동일한 스크린 좌표로 판정 — 전경(위에 그려진 것)부터.
  const hit = (mx, my) => {
    for (let i = drawOrder.length - 1; i >= 0; i--){
      const n = drawOrder[i], dx = mx - sxOf(n), dy = my - syOf(n);
      const rr = n.r * scOf(n) + 4;
      if (dx*dx + dy*dy < rr*rr) return n;

  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  canvas.addEventListener("pointerdown", e => {
    const [mx, my] = pos(e); st.moved = 0; st.lastTouch = performance.now();

      st.drag.y = (my - (st.tf.y + st.dy) * pf) / st.tf.k; st.moved += 2;

       커서가 판을 벗어나도 놓치지 않으려고), 그 상태에서 두 번째 클릭이 같은 짝으로
       묶이지 않는 환경이 있다 — 그러면 더블클릭은 조용히 사라지고 사용자에게는
       "빈 곳을 두 번 눌러도 원복이 안 된다"만 남는다(반려 사유).

    e.preventDefault();

  const gfit = $("#gfit");

  /* ?goff — 진단·헤드리스 캡처용 (?dlg·?ccjump 와 동형). 그래프가 구석으로
     밀려난 상태는 손으로 굴려야 만들어지는데 헤드리스에는 손이 없다. 물리가
     자리를 잡은 뒤 경계 상자를 재서 오른쪽 아래로 밀어낸다. */

      L.st.tf.k = 0.55;

  if (/[?&]gfit/.test(location.search)) setTimeout(gFit, 2600);
  /* ?gzoom[=N] — 화면 **왼쪽 위 구석**에 커서를 두고 N번 줌아웃한 결과를 찍는다.

  function gReport(lines){
    const box = document.createElement("pre");
    box.style.cssText = "position:fixed;left:10px;top:10px;z-index:99;margin:0;"
      + "padding:8px 12px;font:11px/1.6 ui-monospace,monospace;white-space:pre;"

  if (gz && !window.__gzArmed){
    window.__gzArmed = 1;
    setTimeout(() => {
      const L = window.__gdbg, {W: LW, H: LH} = L.size();
      const cv = $("#gcanvas"), r = cv.getBoundingClientRect();
      const at = {tl: [24, 24], br: [LW - 24, LH - 24], c: [LW / 2, LH / 2],
                  tr: [LW - 24, 24], bl: [24, LH - 24]}[gat] || [24, 24];
      const mid = () => { const s = L.snap();
        return {x: s.reduce((a, n) => a + n.sx, 0) / Math.max(1, s.length),
                y: s.reduce((a, n) => a + n.sy, 0) / Math.max(1, s.length)}; };
      const n0 = mid(), seen0 = L.seen(), steps = Number(gz[1]) || 10;
      for (let i = 0; i < Math.abs(steps); i++)
        cv.dispatchEvent(new WheelEvent("wheel",
          {deltaY: steps > 0 ? 120 : -120, cancelable: true,
           clientX: r.left + at[0], clientY: r.top + at[1]}));
      const n1 = mid();
      L.frame();
      gReport([
        `gzoom ${gat} n${steps} at ${Math.round(at[0])},${Math.round(at[1])}`
          + `   canvas ${LW}x${LH} (mid ${Math.round(LW/2)},${Math.round(LH/2)})`,
        `무리 중심 ${Math.round(n0.x)},${Math.round(n0.y)}`
          + ` → ${Math.round(n1.x)},${Math.round(n1.y)}`,
        `k${L.st.tf.k.toFixed(3)}   visible ${(seen0*100).toFixed(0)}%`
          + ` → ${(L.seen()*100).toFixed(0)}%`,
      ]);
    }, 1800);
  }
  /* ?gdbl — **빈 곳 더블클릭을 실제로 해 본다.** 반려 사유가 "더블클릭하면 원복이
     안 된다"였는데, 앞선 검증은 gFit() 을 직접 불러 결과만 찍었다 — 그건 손이
     닿는 길을 건너뛴 것이라 이 결함을 잡을 수 없었다.
     그래서 좌표에서 실제로 이벤트를 받는 요소를 `elementFromPoint` 로 찾아
     거기서 버블링시킨다: 캔버스 위에 뭔가 덮여 있으면 이 진단도 같이 빗나간다.
     사람이 누르는 순서(pointerdown/up · click 두 번 · dblclick)를 그대로 밟는다. */
  if (/[?&]gdbl/.test(location.search) && !window.__gdblArmed){
    window.__gdblArmed = 1;                 // 판이 여러 번 세워져도 손은 한 번만
    setTimeout(() => {
      // 재는 대상은 **지금 살아 있는 판**이다 — 이 타이머를 건 판이 아니라.
      const live = () => window.__gdbg;
      const cv = $("#gcanvas");
      const {W: LW, H: LH} = live().size();
      const r = cv.getBoundingClientRect();
      const near = (x, y) => live().snap().some(n =>
        (n.sx - x) ** 2 + (n.sy - y) ** 2 < (n.rr + 10) ** 2);
      let spot = [LW * 0.5, LH * 0.5];
      for (const [fx, fy] of [[0.28,0.3],[0.7,0.26],[0.3,0.72],[0.72,0.7],[0.5,0.5]])
        if (!near(LW * fx, LH * fy)){ spot = [LW * fx, LH * fy]; break; }
      // ?gdbl=btn — 같은 자리를 손잡이 버튼으로 눌러 본다. 계약은 "두 길 모두"다.
      // 먼저 한 장 그려 손잡이 표시를 지금 상태에 맞춘다(rAF 가 안 도는 환경 대비).
      live().frame();
      const viaBtn = /[?&]gdbl=btn/.test(location.search);
      const bt = viaBtn && $("#gfit") && !$("#gfit").hidden
        ? $("#gfit").getBoundingClientRect() : null;
      const [mx, my] = spot;
      const cx = bt ? bt.left + bt.width / 2 : r.left + mx;
      const cy = bt ? bt.top + bt.height / 2 : r.top + my;
      const el = document.elementFromPoint(cx, cy) || cv;
      const gen0 = live().gen, tf0 = {...live().st.tf};
      const mk = (type, C) => new C(type, {bubbles: true, cancelable: true,
        clientX: cx, clientY: cy, view: window,
        ...(C === PointerEvent ? {pointerId: 1, pointerType: "mouse", isPrimary: true} : {}),
        ...(type === "dblclick" ? {detail: 2} : {})});
      if (viaBtn) el.dispatchEvent(mk("click", MouseEvent));
      else {
        for (let i = 0; i < 2; i++){
          el.dispatchEvent(mk("pointerdown", PointerEvent));
          el.dispatchEvent(mk("pointerup", PointerEvent));
          el.dispatchEvent(mk("click", MouseEvent));
        }
        el.dispatchEvent(mk("dblclick", MouseEvent));
      }
      const started = !!live().st.fit || REDUCE_MOTION, fr0 = live().st.frames;
      const seen0 = live().seen();
      setTimeout(() => {
        const L = live();
        L.frame();                       // rAF 가 안 도는 헤드리스에서도 눈에 보이게
        const seen = L.seen();
        gReport([
          `${viaBtn ? "손잡이 클릭" : "빈 곳 더블클릭"} at ${Math.round(cx - r.left)},`
            + `${Math.round(cy - r.top)} → <${el.tagName.toLowerCase()}`
            + `${el.id ? "#" + el.id : ""}${el.className ? "." + String(el.className).trim().split(/\s+/)[0] : ""}>`,
          `gen  ${gen0} → ${L.gen}`,
          `tf0  k${tf0.k.toFixed(3)} ${Math.round(tf0.x)},${Math.round(tf0.y)}`,
          `tf1  k${L.st.tf.k.toFixed(3)} ${Math.round(L.st.tf.x)},${Math.round(L.st.tf.y)}`,
          `fit started: ${started}   moved: ${Math.abs(L.st.tf.x - tf0.x) + Math.abs(L.st.tf.y - tf0.y) > 1}`,
          `frames ${fr0} → ${L.st.frames}   fit pending: ${!!L.st.fit}`,
          `visible ${(seen0 * 100).toFixed(0)}% → ${(seen * 100).toFixed(0)}%`
            + `   handle: ${$("#gfit") && !$("#gfit").hidden}`,
        ]);
      }, 700);
    }, 2600);
  }
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    st.lastTouch = performance.now();
    st.fit = null;                // 손이 개입하면 옮기던 것은 멈춘다
    const [mx, my] = pos(e);
    const k2 = Math.min(4, Math.max(0.25, st.tf.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    // 커서 기준 줌 — 표준 공식. 이 줄은 옳고, 옵시디언도 이렇게 한다.
    st.tf.x = mx - (mx - st.tf.x) * k2 / st.tf.k;
    st.tf.y = my - (my - st.tf.y) * k2 / st.tf.k;
    st.tf.k = k2;
    /* 다만 그래프 전체가 화면보다 작아지면 커서 기준을 놓는다 (REQ-083).
       여유가 클수록 더 세게 가운데로 물어, 줌아웃할수록 구석이 아니라 가운데로
       모인다. 한 번에 끌어당기지 않고 비율로 섞는 것은 톡 튀지 않게 하려는 것이다. */
    const s = gScreenBox(k2, st.tf.x, st.tf.y);
    if (!s) return;
    const fill = Math.max(s.w / (W - GFIT_PAD * 2), s.h / (H - GFIT_PAD * 2));
    // ?graw — 가운데로 물리는 손질을 끄고 **날것의 커서 기준 줌**만 남긴다.
    // 고치기 전과 후를 같은 자에 놓고 재기 위한 진단 전용 스위치다.
    if (/[?&]graw/.test(location.search)) return;
    if (fill >= 1) return;                      // 아직 화면을 넘친다 — 커서 기준 그대로
    const t = 0.15 + 0.5 * (1 - fill);          // 0.15 ~ 0.65
    st.tf.x += (W / 2 - s.cx) * t;
    st.tf.y += (H / 2 - s.cy) * t;
  }, { passive: false });
  canvas.addEventListener("pointerleave", () => { st.hover = null; });

  stopGraph();
  ganim = { raf: 0, save(){
    if (graphLayout !== "force") return;  // dag 배치를 force 저장본에 덮지 않음
    nodes.forEach(n => graphPos[n.id] = {x: n.x, y: n.y});
    graphTf = {...st.tf};
  }};
  loop();
}

let selectedUser = null;

// admin 대리 모드(asUser)면 쓰기 본문에 as 를 첨부 — 그 외 신원 파라미터는 보내지
// 않는다 (actor 는 서버 whoami 파생, REQ-20260824-027)
const withAs = body => asUser ? {...body, as: asUser} : body;

// 쓰기 공통 — 결과 객체 반환 (팝업 없음). 인라인 표시가 필요한 폼은 이걸 직접 쓴다.
async function postJSONRaw(url, body){
  try{
    const r = await fetch(url, {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(withAs(body))});
    const d = await r.json();
    if (!d.ok) return {ok: false, refused: true, error: d.error || `HTTP ${r.status}`};
    return {ok: true};
  }catch(e){ return {ok: false, error: "서버에 연결할 수 없습니다"}; }
}

async function postJSON(url, body){
  const res = await postJSONRaw(url, body);
  if (!res.ok)
    s9dlg({kind:"alert", cap:res.refused ? "거부" : "연결",
      title:res.refused ? "서버가 거절했습니다" : "서버에 닿지 못했습니다",
      desc:String(res.error || ""), ok:"닫기"});
  return res.ok;
}

/* ------- 머신·계정 이력 (REQ-20260827-066) -------
   서버가 `/api/users` 의 사용자마다 `machine_accounts` 를 준다: 어느 머신에서,
   어떤 운영체제로, 어떤 OS 계정으로 이 계정을 썼는지 + 처음 본 때 · 마지막 본 때.

   열 이름은 `OS 계정` 이 아니라 그냥 `계정` 이다 (2026-08-27 반려: "이 머신에
   nicehugepark 이라는 os 계정은 없다. 그냥 하네스 아이디를 내가 자주 쓰는 순수
   개인 아이디로서 정한거다"). 이 칸에는 그 머신의 OS 계정이 올 수도 있고 사람이
   정한 하네스 이름이 올 수도 있다 — 둘 중 하나라고 이름 붙이면 절반은 거짓말이
   된다. 화면이 모르는 것을 아는 척하지 않는다.

   화면의 일은 하나다 — **"지금도 쓰는 머신"과 "한 번 스쳐간 머신"을 가른다.**
   그 둘을 가르는 값이 first/last 이고, 그래서 둘을 나란히 둔다. 가르는 방법은
   색면이 아니라 세 가지다:
   ① 마지막으로 본 때 순으로 세운다 — 지금 쓰는 것이 맨 위다.
   ② 마지막 칸에 **경과**를 붙인다(카드가 쓰는 그 표기). "6d 12h" 는 날짜보다
      먼저 읽히고, 날짜를 머릿속에서 빼지 않아도 된다.
   ③ 하루가 넘은 줄은 잉크를 한 급 내린다 — 목록이 길어져도 위쪽 몇 줄이
      살아 있는 머신임이 먼저 보인다. 색상이 아니라 명도다.
   처음과 마지막이 같은 줄은 그 자리에서 **한 번**이라고 말한다 — 스쳐간 머신의
   가장 흔한 모습이고, 두 날짜를 눈으로 비교하게 만들 이유가 없다. */
const MACHINE_FRESH_MS = 24 * 60 * 60 * 1000;
const shortWhen = iso => (iso || "").slice(0, 16).replace("T", " ");
/* ?mh=demo|empty — 진단·헤드리스 캡처용 (?usagecard·?dlg·?ccjump 와 동형).
   지금 이 저장소에는 살아 있는 머신 줄만 있어서, 오래 안 쓴 머신과 빈 계정이
   어떻게 보이는지 손으로 확인할 길이 없다. 화면을 눈으로 못 보면 고칠 수도 없다. */
function machineDemo(rows){
  const m = /[?&]mh=([a-z]+)/.exec(location.search);
  if (!m) return rows;
  if (m[1] === "empty") return [];
  const ago = d => new Date(Date.now() - d * 86400000).toISOString();
  return rows.concat([
    {machine: "MACBOOK-AIR", os: "macOS", account: "sjpark", first: ago(9), last: ago(9)},
    {machine: "BUILD-BOX-02", os: "Linux", account: "runner", first: ago(31), last: ago(4)},
  ]);
}
function machineHistoryHTML(u){
  const rows = machineDemo((u.machine_accounts || []).slice())
    .sort((a, b) => (Date.parse(b.last || "") || 0) - (Date.parse(a.last || "") || 0));
  // 빈 것은 고장이 아니다 — 이 계정으로 세션을 연 적이 없을 뿐이다. 옛 프로필은
  // 정말로 비어 있으므로 표를 세우지 않고 한 줄로 이유를 말한다.
  if (!rows.length)
    return `<div class="cfg-h">머신·계정 이력</div>
      <p class="empty mhempty">이 계정으로 세션을 연 적이 없습니다.</p>`;
  const body = rows.map(r => {
    const t = Date.parse(r.last || "") || 0;
    const stale = !t || Date.now() - t > MACHINE_FRESH_MS;
    // 처음과 마지막이 같으면 같은 시각을 두 번 적지 않는다 — 그 자리에 무슨
    // 뜻인지를 적는다. 스쳐간 머신의 가장 흔한 모습이고, 두 날짜를 눈으로
    // 비교하게 만들 이유가 없다.
    const once = r.first && r.last && r.first === r.last;
    return `<tr class="${stale ? "stale" : ""}">
      <td class="mn">${esc(r.machine || "?")}</td>
      <td class="mo">${esc(r.os || "?")}</td>
      <td class="ma">@${esc(r.account || "?")}</td>
      <td class="mw">${esc(shortWhen(r.first))}</td>
      <td class="mw">${once ? `<span class="mone">한 번뿐</span>`
                            : esc(shortWhen(r.last))}
        <span class="mel">${esc(fmtElapsed(r.last))}</span></td></tr>`;
  }).join("");
  return `<div class="cfg-h">머신·계정 이력</div>
    <div class="mhwrap"><table class="mhtbl"><thead><tr>
      <th>머신</th><th>운영체제</th><th>계정</th><th>처음</th><th>마지막</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
}

// 프로필+config 편집 폼 (account 섹션: 본인 / users 섹션: admin이 타인 편집)
function showUserForm(u, host, isAdminEdit){
  if (!host) return;
  const cfg = u.config || {};
  const prefs = Object.entries(cfg).filter(([k]) => k.startsWith("pref_"));
  const extraCfg = Object.entries(cfg).filter(([k]) =>
    !["timezone","digest_budget","ui_skin","ui_tone","ui_density"].includes(k) && !k.startsWith("pref_"));
  // 회사 이메일: emails[] 우선, 비어 있으면 legacy email 단수를 시드(저장 시 emails로 이관)
  const seedEmails = (u.emails && u.emails.length) ? u.emails : (u.email ? [u.email] : []);
  const emRowHTML = val => `<div class="emrow">
      <input class="uf em-val" value="${esc(val)}" placeholder="name@company.com">
      <button type="button" class="em-rm" title="이 이메일 행 삭제">− 삭제</button></div>`;
  const reqhint = `<span class="reqhint">권장 — 미기재</span>`;
  host.innerHTML = `
    <div class="path">users/${esc(u.name)}/profile.md · 등록 ${esc((u.registered||"?").slice(0,16))} @ ${esc(u.registered_on||"?")}</div>
    <h1 style="margin:6px 0 14px">@${esc(u.name)}</h1>
    <table class="metatbl">
      <tr><td>display</td><td><input class="uf" id="uf-display" value="${esc(u.display)}"></td></tr>
      <tr><td>회사 이메일</td><td id="uf-emails">
        ${seedEmails.map(em => emRowHTML(em)).join("")}
        <button type="button" class="em-add" id="uf-em-add">＋ 이메일 추가</button>${seedEmails.length ? "" : reqhint}
        <div class="path">회사 이메일 N개 — 빈 행은 저장 시 제외됩니다</div></td></tr>
      <tr><td>github (개인)</td><td><input class="uf" id="uf-github" value="${esc(u.github||"")}" placeholder="개인 GitHub 계정명">${u.github ? "" : reqhint}</td></tr>
      <tr><td>github (조직)</td><td><input class="uf" id="uf-github-org" value="${esc(u.github_org||"")}" placeholder="조직 GitHub 계정/org (선택)"></td></tr>
      <tr><td>role</td><td><select class="uf" id="uf-role">
        ${["admin","member","viewer"].map(r => `<option${r===u.role?" selected":""}>${r}</option>`).join("")}
      </select> <span class="path">변경은 admin만</span></td></tr>
    </table>
    <div class="acts"><button id="uf-save">프로필 저장</button><span class="ferr" id="uf-err"></span></div>
    ${machineHistoryHTML(u)}
    <div class="cfg-h">개인화 설정 — config/settings.json</div>
    <table class="metatbl">
      <tr><td>timezone</td><td><input class="uf" id="cf-timezone" placeholder="Asia/Seoul" value="${esc(cfg.timezone||"")}"></td></tr>
      <tr><td>digest_budget</td><td><input class="uf" id="cf-digest_budget" placeholder="2500" value="${esc(cfg.digest_budget||"")}"></td></tr>
      <tr><td><input class="uf" id="cf-key" placeholder="임의 키" style="width:130px"></td>
          <td><input class="uf" id="cf-val" placeholder="값 (빈 값=삭제)"></td></tr>
    </table>
    <div class="acts"><button id="cf-save">설정 저장</button></div>
    <div class="cfg-h">개인 선호 — 리드 에이전트의 말투·작업 방식 (매 턴 자동 반영, REQ-20260824-006)</div>
    <table class="metatbl" id="pf-table">
      ${prefs.map(([k, v]) => `<tr data-pref="${esc(k)}">
        <td>${esc(k.slice(5))}</td>
        <td><input class="uf pf-val" value="${esc(String(v))}" placeholder="비우고 저장 = 삭제"></td>
      </tr>`).join("")}
      <tr><td><input class="uf" id="pf-key" placeholder="주제 (예: 말투)" style="width:130px"></td>
          <td><input class="uf" id="pf-new" placeholder="내용 (예: 반말로 간결하게)"></td></tr>
    </table>
    <div class="acts"><button id="pf-save">선호 저장</button></div>
    ${prefs.length ? "" : `<div class="path" style="margin-top:6px">아직 없음 — 프롬프트에서 말해도 되고("앞으로 반말로 해줘") 여기서 직접 추가해도 된다.</div>`}
    ${extraCfg.length ? `<div class="path" style="margin-top:12px">기타: ${esc(JSON.stringify(Object.fromEntries(extraCfg)))}</div>` : ""}
    <div class="path" style="margin-top:16px">변경은 profile.md Notes에 audit + git 동기화. 본인 또는 admin만 수정.</div>`;
  // 이메일 행 추가/삭제 — DOM만 조작(재렌더 없음 → 다른 입력값 보존)
  host.querySelector("#uf-emails").addEventListener("click", e => {
    if (e.target.classList.contains("em-rm")) e.target.closest(".emrow").remove();
  });
  host.querySelector("#uf-em-add").addEventListener("click", () => {
    host.querySelector("#uf-em-add").insertAdjacentHTML("beforebegin", emRowHTML(""));
    const rows = host.querySelectorAll("#uf-emails .em-val");
    rows[rows.length - 1].focus();
  });
  host.querySelector("#uf-save").addEventListener("click", async () => {
    const errEl = host.querySelector("#uf-err");
    errEl.textContent = "";
    const emails = [...host.querySelectorAll("#uf-emails .em-val")]
      .map(i => i.value.trim()).filter(Boolean);
    const body = {name: u.name, display: host.querySelector("#uf-display").value.trim(),
                  emails,  // legacy email 단수는 더 보내지 않음 — 서버는 미전달 필드 무변경
                  github: host.querySelector("#uf-github").value.trim(),
                  github_org: host.querySelector("#uf-github-org").value.trim()};
    const nr = host.querySelector("#uf-role").value;
    if (nr !== u.role) body.role = nr;
    const res = await postJSONRaw("/api/user/update", body);
    if (!res.ok){ errEl.textContent = "✕ " + res.error; return; }  // 인라인 — 팝업 금지
    renderSettings();
  });
  host.querySelector("#cf-save").addEventListener("click", async () => {
    const sets = [["timezone", $("#cf-timezone").value.trim()],
                  ["digest_budget", $("#cf-digest_budget").value.trim()]];
    const ck = $("#cf-key").value.trim();
    if (ck) sets.push([ck, $("#cf-val").value.trim()]);
    let ok = true;
    for (const [k, val] of sets){
      if (val === String(cfg[k] ?? "")) continue;
      ok = (await postJSON("/api/user/config", {name: u.name, key: k, value: val})) && ok;
    }
    if (ok) renderSettings();
  });
  host.querySelector("#pf-save").addEventListener("click", async () => {
    const sets = [];
    host.querySelectorAll("#pf-table tr[data-pref]").forEach(tr => {
      const k = tr.dataset.pref, val = tr.querySelector(".pf-val").value.trim();
      if (val !== String(cfg[k] ?? "")) sets.push([k, val]);  // 빈 값 = 서버가 삭제
    });
    const nk = host.querySelector("#pf-key").value.trim();
    if (nk) sets.push(["pref_" + nk.replace(/^pref_/, ""),
                       host.querySelector("#pf-new").value.trim()]);
    let ok = true;
    for (const [k, val] of sets)
      ok = (await postJSON("/api/user/config", {name: u.name, key: k, value: val})) && ok;
    if (ok && sets.length) renderSettings();
  });
}

/* ---------------- drag & drop 상태 전이 ---------------- */
document.addEventListener("dragstart", e => {
  const c = e.target.closest('.card[draggable="true"]');
  if (!c) return;
  e.dataTransfer.setData("text/plain",
    JSON.stringify({id: c.dataset.doc, from: c.dataset.status}));
  e.dataTransfer.effectAllowed = "move";
  window.__dragFrom = c.dataset.status;
});
document.addEventListener("dragend", () => {
  window.__dragFrom = null;
  document.querySelectorAll(".col.dropok").forEach(el => el.classList.remove("dropok"));
});
document.addEventListener("dragover", e => {
  const col = e.target.closest(".col[data-colstatus]");
  document.querySelectorAll(".col.dropok").forEach(el => el.classList.remove("dropok"));
  if (!col || !window.__dragFrom) return;
  if ((TRANS[window.__dragFrom] || []).includes(col.dataset.colstatus)){
    e.preventDefault();  // 허용 전이 컬럼만 drop 가능
    col.classList.add("dropok");
  }
});
document.addEventListener("drop", e => {
  const col = e.target.closest(".col[data-colstatus]");
  if (!col) return;
  e.preventDefault();
  try{
    const d = JSON.parse(e.dataTransfer.getData("text/plain"));
    const to = col.dataset.colstatus;
    if (d.id && d.from !== to && (TRANS[d.from] || []).includes(to))
      postStatus(d.id, to, "drag 이동");
  }catch(err){}
});

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const dailyNav = e.target.closest("[data-chief-nav]");
  if (dailyNav){
    tab = "chief"; chiefDaily = dailyNav.dataset.chiefNav || "brief"; advancedOpen = false;
    pushRoute(); syncChiefNav(); render();
    if (chiefDaily === "sessions") chiefRefreshSessions();
    return;
  }
  if (e.target.closest("[data-chief-talk]")){ chiefTalk(); return; }
  const advanced = e.target.closest("[data-advanced-toggle]");
  if (advanced){ advancedOpen = !advancedOpen; syncChiefNav(); return; }
  const chiefReportClose = e.target.closest("[data-chief-report-close]");
  if (chiefReportClose){ chiefCloseReport(); return; }
  const chiefReport = e.target.closest("[data-chief-report-open]");
  if (chiefReport){
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    chiefOpenReport(chiefReport.getAttribute("href"),chiefReport.dataset.chiefReportTitle || "Report",chiefReport);
    return;
  }
  const chiefRefresh = e.target.closest("[data-chief-refresh]");
  if (chiefRefresh){ refreshChief(true); return; }
  const chiefSync = e.target.closest("[data-chief-sync]");
  if (chiefSync){ chiefManualSync(); return; }
  const chiefProj = e.target.closest("[data-chief-project]");
  if (chiefProj){
    chiefProject = chiefProj.dataset.chiefProject || "";
    if (chiefDaily === "sessions"){ chiefSelectedSession = ""; chiefThread = null; }
    renderChief(); return;
  }
  const chiefJump = e.target.closest("[data-chief-jump]");
  if (chiefJump){
    const target = $("#chief-" + chiefJump.dataset.chiefJump);
    if (target) target.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  const chiefAddWork = e.target.closest("[data-chief-add-work]");
  if (chiefAddWork && !chiefAddWork.disabled){ chiefCreateWork(chiefAddWork.dataset.chiefProject || "",false); return; }
  const chiefNewSession = e.target.closest("[data-chief-new-session]");
  if (chiefNewSession && !chiefNewSession.disabled){ chiefCreateWork(chiefNewSession.dataset.chiefProject || "",true); return; }
  if (e.target.closest("[data-chief-refresh-sessions]")){ chiefRefreshSessions(); return; }
  const chiefSession = e.target.closest("[data-chief-session]");
  if (chiefSession){ chiefOpenThread(chiefSession.dataset.chiefSession || ""); return; }
  const chiefCreateReport = e.target.closest("[data-chief-create-report]");
  if (chiefCreateReport && !chiefCreateReport.disabled){
    const project = chiefCreateReport.dataset.chiefProject || "this project";
    const registered = chiefArr(chiefData.projects).find(p => chiefNorm(p.id) === chiefNorm(project));
    const title = registered && registered.title || project;
    const brief = await s9dlg({kind:"prompt",cap:"Meeting report",
      title:`What is the ${title} meeting for?`,
      desc:"Include the meeting, audience, date, and the decision or update they need. Chief will gather current Jira, release, work-order, and report evidence.",
      ok:"Assign report",cancel:"Not now",required:true});
    if (brief === null) return;
    chiefNotice = `Assigning the ${title} meeting report…`; renderChief();
    const order = `Create a meeting-ready report for the ${title} project.\n\nJade's brief:\n${brief}\n\n`
      + `Use current Jira, release, repository work-order, existing report, and runtime evidence; record every source and observation time. `
      + `Use /home/jade/section9-chief/projects/meeting-reports/assets/MEETING-REPORT-TEMPLATE.md. `
      + `Write the durable Markdown source under /home/jade/section9-chief/projects/meeting-reports/assets/ and a dashboard-readable HTML report under /home/jade/chief/reports/. `
      + `Create or update the durable work record before gathering evidence, attach the finished report to the ${project} project, and surface any follow-up as separate Jira work. `
      + `If a PowerPoint is requested, use /home/jade/EE the.thmx with its actual slide master/layouts. Do not publish to Confluence or send Teams messages without Jade's explicit approval.`;
    try{
      const result = await chiefOrder({target:"chief",text:order});
      const state = String(result.status || "assigned");
      chiefNotice = state === "delivered"
        ? `${title} meeting report assigned to Chief.`
        : `${title} meeting report recorded; delivery state: ${state.replaceAll("-"," ")}.`;
      renderChief();
    }catch(err){
      chiefNotice = `Meeting report was not assigned: ${err.message || err}`; renderChief();
    }
    return;
  }
  const chiefAct = e.target.closest("[data-chief-action]");
  if (chiefAct){
    const action = chiefAct.dataset.chiefAction || "ready";
    const id = chiefAct.dataset.chiefWork || "";
    const title = chiefAct.dataset.chiefTitle || chiefAct.dataset.chiefWork || "this work";
    const row = chiefArr(chiefData && chiefData.portfolio).find(r => r.id === id) || {};
    if (action === "ready" || action === "progress") { chiefStartWork(id,title); return; }
    if (row.report_file){ chiefOpenReport(chiefGet(`report?f=${encodeURIComponent(row.report_file)}`),title,chiefAct); return; }
    s9dlg({kind:"alert",cap:action === "needs" ? "Your decision" : "Evidence",title,
      desc:chiefShort(row.next || row.outcome || row.goal || row.why || "The durable record has no attached report yet.",520),ok:"Close"});
    return;
  }
  const chiefRelease = e.target.closest("[data-chief-release]");
  if (chiefRelease){ chiefStartRelease(chiefRelease.dataset.chiefRelease || "",
    chiefRelease.dataset.chiefReleaseAction || "merge_dev",chiefRelease.dataset.chiefTitle || "release work"); return; }
  // 본문 안에서 탭으로 건너뛰는 링크 — 헤더 탭 버튼의 active 표시를 빼앗지 않도록
  // data-tab 이 아니라 data-goto 로 둔다(그 핸들러는 클릭된 요소를 active로 만든다).
  // data-goto 는 두 뜻으로 쓰인다: 탭 이름("graph") 과 문서 본문의 상태 전이
  // ("REQ-…|to|from"). 여기서 전이까지 삼키면 본문의 승인/반려 버튼이 조용히
  // 죽는다 — 아래 전이 핸들러가 **같은 리스너 안**이라 return 이 곧 무반응이다
  // (REQ-20260826-025: 보드에서는 되는데 본문에서는 안 되던 결함).
  const go = e.target.closest("[data-goto]");
  if (go && !go.dataset.goto.includes("|")){
    const hdr = document.querySelector(
      `header [data-tab="${go.dataset.goto}"]`);
    if (hdr) hdr.click();
    return;
  }
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn){
    tab = tabBtn.dataset.tab;
    advancedOpen = false;
    if (tab === "audit") auditCache = null;
    document.querySelectorAll("[data-tab]").forEach(b =>
      b.classList.toggle("active", b === tabBtn));
    syncChiefNav();
    pushRoute();
    render();
    refreshCatalog(true);
    // 탭 전환은 visibilitychange 를 일으키지 않는다 — 터미널로 돌아온 순간
    // 스트립을 서버 목록으로 맞춘다 (REQ-20260826-016).
    if (tab === "terminal" && TERM && TERM.agTick) TERM.agTick();
    return;
  }
  const gt2 = e.target.closest("[data-gtype]");
  if (gt2){
    const t = gt2.dataset.gtype;
    gtypes.has(t) ? gtypes.delete(t) : gtypes.add(t);
    if (!gtypes.size) gtypes.add("request");  // 전부 끄면 무의미 — 최소 1종 유지
    // 켠 것만 기억한다 — 끄는 건 의도적 축소라 인정할 것이 없다.
    gLastOn = gtypes.has(t) ? t : null;
    try{ localStorage.setItem("s9gtypes", JSON.stringify([...gtypes])); }catch(e){}
    render(); return;
  }
  // 빈 화면 안내의 되돌리기 (REQ-20260826-039) — 안내가 원인을 말했으면
  // 되돌리는 손도 같은 자리에 있어야 한다. 말만 하고 손이 없으면 절반이다.
  const gf = e.target.closest("[data-gfix]");
  if (gf){
    if (gf.dataset.gfix === "filters"){
      const q = $("#q"); if (q) q.value = "";
      const qb = $("#q-body"); if (qb) qb.checked = false;
      ["#f-user", "#f-project", "#f-tag", "#f-type"].forEach(sel => {
        const el = $(sel); if (el) el.value = "";
      });
      // '내 것만'도 필터다 — 안 풀면 이 버튼이 조용히 죽는다
      const mi = $("#f-mine");
      if (mi && mi.checked){
        mi.checked = false;
        try{ localStorage.setItem("s9mine", "0"); }catch(e2){}
        fillProjects();
      }
    } else if (gf.dataset.gcond){
      // 범인 하나만 푼다 (REQ-20260827-054) — 사용자가 걸어 둔 나머지 조건까지
      // 쓸어내면 되돌리기가 아니라 초기화가 된다.
      const c = HCOND.find(x => x.k === gf.dataset.gcond);
      if (c) c.clear();
    } else {
      (gf.dataset.gtypes || "").split(",").filter(Boolean).forEach(t => gtypes.add(t));
      try{ localStorage.setItem("s9gtypes", JSON.stringify([...gtypes])); }catch(e2){}
    }
    gLastOn = null;   // 되돌렸으니 직전 헛클릭에 대한 인정은 더 이상 사실이 아니다
    render(); return;
  }
  const gl = e.target.closest("[data-glayout]");
  if (gl){
    graphLayout = gl.dataset.glayout;
    try{ localStorage.setItem("s9glayout", graphLayout); }catch(e2){}
    graphTf = null;  // 레이아웃 전환 시 뷰 리셋
    render();
    return;
  }
  // 문서 본문의 전이 버튼 — 속성 이름이 data-goto 와 갈라져 있어야 한다.
  // 같은 이름을 쓰면 위 탭 점프 분기가 먼저 집어삼킨다 (REQ-20260826-025).
  const gt = e.target.closest("[data-trans]");
  if (gt){
    const [id, to, from] = gt.dataset.trans.split("|");
    // review에서 되돌리는(반려성) 전이는 사유 필수 — Board와 일관성
    if (from === "review" && (to === "in-progress" || to === "blocked")){
      rejectWithReason(id); return;
    }
    (async () => {
      if (to === "cancelled" && !await s9dlg({kind:"confirm", cap:"전이",
            title:`${shortId(id)} 을(를) 취소 처리합니다`,
            desc:"취소한 요청은 보드에서 내려갑니다. 되돌리려면 다시 전이하면 됩니다.",
            ok:"취소 처리", cancel:"그만두기"})) return;
      const note = await s9dlg({kind:"prompt", cap:"전이",
        title:`${shortId(id)} → ${to}`,
        desc:"메모는 History 에 남습니다. 비워 두어도 됩니다.",
        ok:"전이하기", cancel:"그만두기"});
      if (note === null) return;
      postStatus(id, to, note);
    })();
    return;
  }
  const ap = e.target.closest("[data-approve]");
  if (ap){
    // 승인: 메모는 선택 (비우고 확인해도 done)
    (async () => {
      const id2 = ap.dataset.approve;
      const memo = await s9dlg({kind:"prompt", cap:"판정",
        title:`${shortId(id2)} 을(를) 승인합니다`,
        desc:"메모는 History 에 남습니다. 비워 두어도 승인됩니다.",
        ok:"승인하기", cancel:"그만두기"});
      if (memo === null) return;  // 취소
      postStatus(id2, "done", memo ? "승인: " + memo : "대시보드 승인");
    })();
    return;
  }
  const rj = e.target.closest("[data-reject]");
  if (rj){ rejectWithReason(rj.dataset.reject); return; }
  // 상단 계정 칩 — 얹으면 한도를 펴고, 누르면 계정을 바꾼다 (REQ-20260827-079)
  if (e.target.closest("#usage-chip")){ hideHover(); claudeAccountSwitch(); return; }
  // 문서 집기 손잡이는 카드(문서 열기)보다 **먼저** 잡는다 (REQ-20260827-064)
  const pk = e.target.closest("[data-pick]");
  if (pk){ e.stopPropagation(); docPick(pk.dataset.pick); return; }
  const sf = e.target.closest("[data-statf]");
  if (sf){
    window.__statusFilter = window.__statusFilter === sf.dataset.statf ? "" : sf.dataset.statf;
    render(); return;
  }
  // MY PROJECTS 스트립 행: 클릭 = 단일 프로젝트 선택, 선택 행 재클릭 = 합집합(all) 복귀
  const mr = e.target.closest("[data-mine-slug]");
  if (mr){
    const el = $("#f-project");
    el.value = el.value === mr.dataset.mineSlug ? "" : mr.dataset.mineSlug;
    auditLimit = AUDIT_PAGE;
    render(); return;
  }
  const tf = e.target.closest("[data-typef]");
  if (tf){
    const el = $("#f-type");
    el.value = el.value === tf.dataset.typef ? "" : tf.dataset.typef;  // 같은 걸 다시 누르면 전체
    auditLimit = AUDIT_PAGE;
    render(); return;
  }
  const ex = e.target.closest("[data-expand]");
  if (ex){
    const k = ex.dataset.expand;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    render(); return;
  }
  if (e.target.closest("[data-depmore]")){
    // 전체 render()는 그래프 물리·카메라를 리셋한다 — 표만 제자리에서 갈아끼운다
    expanded.has("depsum") ? expanded.delete("depsum") : expanded.add("depsum");
    const ds = $("#depsum");
    if (ds) ds.outerHTML = depSummaryHTML(filtered());
    syncRailH();
    return;
  }
  if (e.target.closest("[data-audit-more]")){
    auditLimit += AUDIT_PAGE; render(); return;
  }
  const st = e.target.closest("[data-stream]");
  if (st){ selectedStream = st.dataset.stream; pushRoute(); loadStream(st.dataset.stream); return; }
  const ss = e.target.closest("[data-sset]");
  if (ss){ settingsSection = ss.dataset.sset;
    const meAdmin = isAdmin();
    document.querySelectorAll("[data-sset]").forEach(el => el.classList.toggle("sel", el === ss));
    pushRoute(); renderSettingsSection(meAdmin); return; }
  const rd = e.target.closest("[data-retrydoc]");
  if (rd){ loadDoc(rd.dataset.retrydoc); return; }
  const doc = e.target.closest("[data-doc]");
  if (doc){
    // 문서 링크가 진짜 href 를 갖게 되면서(REQ-20260827-013) 클릭에는 두 주인이
    // 생겼다. 수식키/가운데클릭은 브라우저 몫으로 남긴다 — 새 탭으로 여는 중에
    // 이 탭의 문서까지 바꾸면 "새 탭에서 열기"가 아니라 "두 군데서 열기"다.
    // 맨클릭은 우리가 막는다: 해시 이동과 pushRoute 가 겹쳐 뒤로가기가 두 번
    // 눌려야 하는 일을 없앤다. 카드·행(div)에는 막을 기본 동작이 없다.
    const link = doc.tagName === "A" && doc.getAttribute("href");
    if (link && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0)) return;
    if (link) e.preventDefault();
    selectedDoc = doc.dataset.doc;
    if (tab !== "docs"){
      tab = "docs";
      document.querySelectorAll("[data-tab]").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === "docs"));
      pushRoute();
      render();
    } else { pushRoute(); loadDoc(selectedDoc); }
  }
});
document.addEventListener("submit", e => {
  if (e.target.matches("[data-chief-compose]")){ e.preventDefault(); chiefSendMessage(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#chief-report-reader").hidden){ e.preventDefault(); chiefCloseReport(); }
  else if (e.key === "Escape" && advancedOpen){ advancedOpen = false; syncChiefNav(); }
});
["#q","#q-body","#f-user","#f-project","#f-tag","#f-type"].forEach(s =>
  $(s).addEventListener("input", () => {
    auditLimit = AUDIT_PAGE;
    gLastOn = null;   // 조건이 바뀌면 직전 클릭에 대한 인정은 무효다
    render();
  }));
// '내 것만' 토글 — 필터 변경으로 취급: 저장(s9mine) + 드롭다운 재스코핑 + 목록 제한 리셋.
// URL 해시에는 넣지 않는다(기기 로컬 정체성 — DOC-20260823-006 명시적 결정).
$("#f-mine").addEventListener("change", e => {
  try{ localStorage.setItem("s9mine", e.target.checked ? "1" : "0"); }catch(e2){}
  expanded.delete("mystrip");
  auditLimit = AUDIT_PAGE;
  gLastOn = null;   // '내 것만'도 조건이다 — 바뀌면 직전 클릭에 대한 인정은 무효
  fillProjects();   // 옵션 스코핑 + 범위 밖 선택은 all로 리셋
  render();
});

boot();

/* ?dlg=reject|memo|approve|cancel|alert|model|account — 진단·헤드리스 캡처용 (?usagecard·
   ?depall 과 동형). 판정 대화상자는 손이 있어야 열리는데, 마우스가 없는
   환경에서도 **직접 보고 고치는** 길이 있어야 한다. */
(function dlgPreview(){
  const m = /[?&]dlg=([a-z]+)/.exec(location.search);
  if (!m) return;
  const shapes = {
    reject: {kind:"prompt", cap:"판정", title:"REQ-20260827-071 을(를) 반려합니다",
      desc:"사유는 History 에 그대로 남습니다. 무엇이 부족한지 한 줄이면 됩니다.",
      required:true, ok:"반려하기", cancel:"그만두기"},
    memo: {kind:"prompt", cap:"전이", title:"REQ-20260827-071 → done",
      desc:"메모는 History 에 남습니다. 비워 두어도 됩니다.",
      ok:"전이하기", cancel:"그만두기"},
    approve: {kind:"prompt", cap:"판정", title:"REQ-20260827-071 을(를) 승인합니다",
      desc:"메모는 History 에 남습니다. 비워 두어도 승인됩니다.",
      ok:"승인하기", cancel:"그만두기"},
    cancel: {kind:"confirm", cap:"전이", title:"REQ-20260827-071 을(를) 취소 처리합니다",
      desc:"취소한 요청은 보드에서 내려갑니다. 되돌리려면 다시 전이하면 됩니다.",
      ok:"취소 처리", cancel:"그만두기"},
    alert: {kind:"alert", cap:"거부", title:"상태를 바꾸지 못했습니다",
      desc:"review 에서 done 으로는 갈 수 없습니다.", ok:"닫기"},
    // 고르는 변형 (REQ-20260827-079) — 실제 창과 같은 재료로 세운다
    model: {kind:"choose", cap:"모델", title:"이 세션이 무엇으로 생각할지 고릅니다",
      desc:"고른 순간 같은 대화가 새 설정으로 다시 시작됩니다. 유휴 상태에서만 됩니다.",
      chips:{label:"생각의 깊이", cur:"",
        opts:[["","유지"],["low","낮게"],["medium","보통"],["high","높게"],
              ["xhigh","아주 높게"],["max","최대"]]},
      sub:"모델", cancel:"그만두기",
      foot: MODEL_FOOT,
      items:[{key:"opus", label:"opus", note:"지금 이것", cur:true},
             {key:"sonnet", label:"sonnet", note:"빠르고 균형 잡혔다 — 대부분의 일에"},
             {key:"haiku", label:"haiku", note:"가장 빠르다 — 가볍고 반복되는 일에"},
             {key:"fable", label:"fable", note:"실험용"}]},
    account: {kind:"choose", cap:"계정", title:"클로드 로그인 계정을 바꿉니다",
      desc:"지금 로그인: me@example.invalid. 고른 순간 같은 대화가 그 계정으로 다시 시작됩니다. 유휴 상태에서만 됩니다.",
      sub:"계정 프로필", cancel:"닫기",
      items:[{key:"work", label:"work"}, {key:"personal", label:"personal"}]},
    empty: {kind:"choose", cap:"계정", title:"클로드 로그인 계정을 바꿉니다",
      desc:"지금은 붙어 있는 세션이 없습니다 — 세션을 깨운 뒤 다시 시도해 주세요.",
      sub:"계정 프로필", cancel:"닫기", items:[],
      empty:"전환할 계정 프로필이 없습니다. 터미널에서 CLAUDE_CONFIG_DIR=~/.claude-profiles/<이름> claude 로 한 번 로그인하면 여기에 나옵니다."},
  };
  const o = shapes[m[1]] || shapes.reject;
  /* ?dlgnav=<탭> — 창을 연 뒤 그 탭으로 옮겨 가 **정말 닫히는지** 확인한다
     (2026-08-27 결함: 탭을 옮겨도 창이 남아 있었다). 결과를 제목에 찍는다. */
  const nav = (/[?&]dlgnav=([a-z]+)/.exec(location.search) || [])[1];
  if (nav) setTimeout(() => {
    location.hash = "#" + nav;
    setTimeout(() => {
      document.title = `dlgnav ${nav} hidden=${dlg.hidden} tab=${tab}`;
    }, 120);
  }, 1900);
  setTimeout(() => {
    s9dlg(o);
    // 잰 값을 제목에 찍는다 — 헤드리스에서 --dump-dom 으로 읽어 **자·폭이 정말
    // 같은지 눈이 아니라 숫자로** 확인한다. 승인 창과 반려 창의 왼쪽 위 모서리와
    // 폭이 같아야 한다는 것이 이 재작업의 요구였고, 눈으로만 보면 또 놓친다.
    setTimeout(() => {
      const r = document.querySelector(".dlgbox").getBoundingClientRect();
      document.title = `dlg ${m[1]} L${Math.round(r.left)} T${Math.round(r.top)}`
        + ` W${Math.round(r.width)} H${Math.round(r.height)}`;
    }, 60);
  }, 1200);
})();
</script>
