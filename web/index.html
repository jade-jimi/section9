/* ANSI SGR → HTML (의존성 0, XSS 방지: 텍스트 조각은 esc() 후 span만 입힘).
   기본 16색은 CC 근사 팔레트, 256색은 xterm 큐브/그레이스케일 산식. */
const CC16 = ["#3f4451","#e06c75","#4ec97a","#e5c07b","#61afef","#c678dd",
              "#56c8d8","#d7dae0","#5c6370","#ff7a85","#5fe08d","#f0cd8a",
              "#74bdf7","#d894ec","#6fdbe8","#ffffff"];
function ansi256(n){
  n = +n;
  if (n < 16) return CC16[n];
  if (n < 232){
    n -= 16;
    const L = [0,95,135,175,215,255];
    return "#" + [L[(n/36|0)], L[((n/6|0))%6], L[n%6]]
      .map(v => v.toString(16).padStart(2,"0")).join("");
  }
  const v = 8 + (n - 232) * 10;
  return `rgb(${v},${v},${v})`;
}
function ccStrip(raw){                           // 접힘 미리보기용 — ANSI 전부 제거
  return String(raw ?? "").replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g, "")
    .replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\x1b[=>]/g, "");
}
function ccText(raw){
  raw = String(raw ?? "")
    .replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g, "")     // OSC 제거
    .replace(/\x1b\[[0-9;?]*[A-HJKSTfhilnsu]/g, "")          // 비-SGR CSI 제거
    .replace(/\x1b[=>]/g, "");
  const parts = raw.split(/\x1b\[([0-9;]*)m/);
  const md = s => esc(s)                                     // 마크다운 근사 (CC식)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`\n]+)`/g, '<span class="cccode">$1</span>');
  let st = {fg:null, bg:null, b:false, d:false, i:false, u:false};
  const wrap = h => {
    const css = [];
    if (st.fg) css.push("color:" + st.fg);
    if (st.bg) css.push("background:" + st.bg);
    if (st.b) css.push("font-weight:700");
    if (st.d) css.push("opacity:.6");
    if (st.i) css.push("font-style:italic");
    if (st.u) css.push("text-decoration:underline");
    return css.length ? `<span style="${css.join(";")}">${h}</span>` : h;
  };
  let html = "";
  for (let i = 0; i < parts.length; i++){
    if (i % 2 === 0){ if (parts[i]) html += wrap(md(parts[i])); continue; }
    const codes = parts[i] === "" ? [0] : parts[i].split(";").map(Number);
    for (let j = 0; j < codes.length; j++){
      const c = codes[j];
      if (c === 0) st = {fg:null, bg:null, b:false, d:false, i:false, u:false};
      else if (c === 1) st.b = true;
      else if (c === 2) st.d = true;
      else if (c === 3) st.i = true;
      else if (c === 4) st.u = true;
      else if (c === 22) st.b = st.d = false;
      else if (c === 23) st.i = false;
      else if (c === 24) st.u = false;
      else if (c >= 30 && c <= 37) st.fg = CC16[c - 30];
      else if (c === 39) st.fg = null;
      else if (c >= 90 && c <= 97) st.fg = CC16[c - 82];
      else if (c >= 40 && c <= 47) st.bg = CC16[c - 40];
      else if (c === 49) st.bg = null;
      else if (c >= 100 && c <= 107) st.bg = CC16[c - 92];
      else if (c === 38 || c === 48){
        let col = null;
        if (codes[j+1] === 5){ col = ansi256(codes[j+2]); j += 2; }
        else if (codes[j+1] === 2){
          col = `rgb(${codes[j+2]|0},${codes[j+3]|0},${codes[j+4]|0})`; j += 4;
        }
        if (col){ if (c === 38) st.fg = col; else st.bg = col; }
      }
    }
  }
  return html;
}

/* CC 글리프 줄 빌더 */
function ccLine(glyph, gcolor, bodyHtml, cls){
  return `<div class="ln${cls ? " " + cls : ""}">` +
    `<span class="g"${gcolor ? ` style="color:${gcolor}"` : ""}>${glyph}</span>` +
    `<span class="b">${bodyHtml}</span></div>`;
}
function ccFold(preview, full){                 // 긴 본문은 CC처럼 접는다
  return `<details><summary>${preview}</summary><div class="full">${full}</div></details>`;
}
function ccChatLine(l){                          // /api/chat/log 한 줄
  if (l.kind === "chat")
    return ccLine("❯", "var(--cc-dim)", ccText(l.text || ""));
  return ccLine("●", "var(--cc-faint)",          // 전이 통지 등 kind=event
    ccText(l.text || "") +
    ` <span style="color:var(--cc-faint)">· ${esc((l.ts || "").slice(11,16))}</span>`,
    "ccdim");
}
/* ---- transcript 이벤트 → CC 표시 규칙 (L10): 같은 시점의 CC 터미널과 같은
   내용만 보인다. 숨김: 훅 주입 컨텍스트(system-reminder 등 구조화 주입),
   사이드체인 thinking·원문(요약선만). thinking은 CC처럼 기본 접힘 한 줄.
   반환 {html,k,role} — k는 "Ran N shell commands" 접힘 분류, null = 숨김. */
function ccUserText(t){
  return String(t || "")
    .replace(/<system-reminder>[\s\S]*?(<\/system-reminder>|$)/g, "").trim();
}
function ccEvent(T, e){
  const t = e.text || "";
  if (e.agent){                                  // 사이드체인 — CC는 요약선만 (L8)
    if (e.role === "thinking") return null;
    if (e.role === "result")
      return {k:"x", html: ccLine("⎿", null,
        ccStrip(t).length > 60
          ? ccFold('<span style="color:var(--cc-dim)">agent result</span>', ccText(t))
          : `<span style="color:var(--cc-dim)">${ccText(t)}</span>`, "sub ccagent")};
    const nm = e.role === "tool" ? `<b>${esc(e.name || "tool")}</b> ` : "";
    return {k:"x", html: ccLine("⚙", "var(--cc-faint)",
      `<span style="color:var(--cc-dim)">agent · ${nm}${esc(ccStrip(t).replace(/\s+/g," ").slice(0,110))}</span>`,
      "ccagent")};
  }
  if (e.role === "user"){
    const u = ccUserText(t);
    if (!u) return null;                         // 훅 주입 컨텍스트만 있던 턴
    if (/^<task-notification>/.test(u)){         // 백그라운드 에이전트 완료 통지
      if (T) termAgentDone(T);
      const id = (u.match(/<task-id>([^<]+)<\/task-id>/) || [])[1] || "";
      return {k:"x", role:"notif", html: ccLine("●", "var(--cc-faint)",
        ccFold(`<span style="color:var(--cc-dim)">background task ${esc(id)} 완료 통지</span>`, ccText(u)),
        "ccdim")};
    }
    if (/^<[a-z-]+>/.test(u)) return null;       // 기타 구조화 주입(command 등)
    return {k:"x", role:"user", html: ccLine("❯", "var(--cc-dim)", ccText(u))};
  }
  if (e.role === "assistant")
    return {k:"x", role:"assistant", html: ccLine("●", "var(--cc-text)", ccText(t))};
  if (e.role === "thinking"){
    const prev = esc(ccStrip(t).replace(/\s+/g, " ").slice(0, 80));
    return {k:"x", role:"thinking", html: ccLine("✻", "var(--cc-dim)",
      ccFold(`<span style="font-style:italic">${prev}…</span>`, ccText(t)), "ccdim")};
  }
  if (e.role === "tool"){
    if (e.name === "Agent" || e.name === "Task"){ // L8 — 스폰 줄 + Backgrounded 라벨
      let o = {}; try{ o = JSON.parse(t) || {}; }catch(x){}
      const at = o.subagent_type || "agent", ad = o.description || "";
      if (T) termAgentSpawn(T, at, ad);
      return {k:"x", role:"tool", name:e.name, html:
        ccLine("●", "var(--cc-green)",
          `<b>${esc(at)}</b><span style="color:var(--cc-dim)">(${esc(ad)})</span>`) +
        ccLine("⎿", null, '<span style="color:var(--cc-dim)">Backgrounded agent</span>', "sub")};
    }
    const nm = `<b>${esc(e.name || "tool")}</b>`;
    const sum = esc(ccToolSummary(e.name, t));
    const body = ccStrip(t).length > 130
      ? ccFold(`${nm}<span style="color:var(--cc-dim)">(${sum}…)</span>`, ccText(t))
      : `${nm}<span style="color:var(--cc-dim)">(${sum})</span>`;
    return {k: e.name === "Bash" ? "bash" : "x", role:"tool", name:e.name,
            html: ccLine("●", "var(--cc-text)", body)};
  }
  // result — ⎿ 연속줄, 길면 접힘, 에러는 분홍 ✗
  const body = t.length > 200
    ? ccFold(esc(ccStrip(t).slice(0,140)) + "…", ccText(t))
    : ccText(t);
  return {k: T && T.lastToolName === "Bash" ? "bashres" : "x", role:"result",
    html: ccLine("⎿", null,
      e.error ? `<span style="color:var(--cc-red)">✗ ${body}</span>` : body, "sub")};
}
function ccToolSummary(name, raw){                // 도구명 옆 핵심 인자 한 줄 (L10)
  let o = null; try{ o = JSON.parse(raw); }catch(e){}
  if (!o || typeof o !== "object")
    return ccStrip(raw).replace(/\s+/g, " ").slice(0, 100);
  const v = o.command ?? o.file_path ?? o.path ?? o.pattern ?? o.skill ?? o.url ??
            o.query ?? o.description ?? o.prompt ?? JSON.stringify(o);
  return String(v).replace(/\s+/g, " ").slice(0, 100);
}
/* 배치 렌더: (수신함 라인 | transcript 이벤트) 목록 → html. 연속 Bash 실행(≥2)은
   CC처럼 "Ran N shell commands" 접힘으로 묶는다. 스피너/에이전트 상태도 갱신. */
function ccRenderBatch(T, evs){
  const items = [];
  for (const x of evs){
    if (x && x.__chat){                          // 초기 병합용 수신함 라인
      items.push({k:"x", html: ccChatLine(x)});
      if (x.kind === "chat" && T){ T.lastRole = "user"; T.waitBase = Date.now(); }
      continue;
    }
    const r = ccEvent(T, x);
    if (!r) continue;
    items.push(r);
    if (T && r.role && r.role !== "notif"){
      T.lastRole = r.role;
      if (r.role === "tool") T.lastToolName = r.name || "";
      const p = Date.parse(String(x.ts || "").replace(" ", "T"));
      T.waitBase = isNaN(p) ? Date.now() : p;
    }
  }
  let html = "", i = 0;
  while (i < items.length){
    if (items[i].k !== "bash"){ html += items[i].html; i++; continue; }
    let j = i, n = 0, seg = "";
    while (j < items.length && (items[j].k === "bash" || items[j].k === "bashres")){
      if (items[j].k === "bash") n++;
      seg += items[j].html; j++;
    }
    html += n >= 2
      ? `<div class="ln ccdim"><span class="g"></span><span class="b"><details><summary><span style="color:var(--cc-dim)">Ran ${n} shell commands</span></summary><div class="full">${seg}</div></details></span></div>`
      : seg;
    i = j;
  }
  return html;
}
function ccTsKey(x){ return (x.ts || "").replace("T", " ").slice(0, 19); }
/* 타임아웃 있는 JSON fetch — 서버 backlog 포화로 연결이 hang/reset 되어도
   (실서버 /api/catalog reset 전례) 터미널 렌더가 멈추지 않게 null로 강등.
   실패분은 어차피 폴러(offset 0부터)가 채운다. */
function ccFetch(url, ms){
  return new Promise(res => {
    const ac = new AbortController();
    const to = setTimeout(() => { ac.abort(); res(null); }, ms || 8000);
    fetch(url, {signal: ac.signal})
      .then(r => r.ok ? r.json() : null)
      .then(v => { clearTimeout(to); res(v); })
      .catch(() => { clearTimeout(to); res(null); });
  });
}
function renderTerminal(){
  // 셸 1회 생성(L0). 살아있는 셸은 render()의 조기 반환 가드가 지키므로
  // 여기 도달 = 탭 새 진입. 이후 이 DOM은 탭을 떠날 때까지 재생성되지 않는다.
  stopChat();
  $("#count").textContent = "라이브 클로드 세션 터미널 (전송 = 수신함 append → Monitor가 깨움 · 수신 = SSE 푸시 tail)";
  const T = TERM = {
    sid: null, live: false, offset: 0, evCount: 0, chatCount: 0,
    es: null, esFails: 0, esRetryT: null, poll: false, pollT: null,
    timers: [], raf: 0, buf: [],
    atts: [], hist: [], histIdx: null, agents: [],
    lastRole: null, lastToolName: "", waitOn: false, waitT: null,
    waitBase: Date.now(),
    pal: {open: false, idx: 0, items: []},
  };
  $("#view").innerHTML = `<div class="ccterm" id="cc-root">
    <div class="ccout" id="ccout"><div class="ccwaitline" id="cc-wait" hidden></div></div>
    <div class="ccout" id="cc-agview" hidden></div>
    <div class="ccerr" id="chat-err" hidden></div>
    <div class="ccpal" id="cc-pal" hidden></div>
    <div class="ccatt" id="cc-att" hidden></div>
    <div class="ccinputrow"><span class="ccp">❯</span><textarea id="chat-in" rows="1" disabled placeholder="connecting…"></textarea><button class="ccclip" id="cc-clip" title="이미지 첨부 (붙여넣기·드래그도 가능)">📎</button><input type="file" id="cc-file" accept="image/*" multiple hidden></div>
    <div class="ccstatus">
      <div class="ccs1"><span class="ccmode">▶▶ <span id="cc-live" class="ccwarn">connecting</span><span id="cc-tgt"></span></span><span class="r ccrc" title="Remote Control — 터미널에서 /rc 로 연결하면 폰·다른 기기에서도 이 세션과 대화할 수 있다">/rc</span></div>
      <div class="ag ccmain" title="메인 타임라인으로 복귀"><span class="g">●</span> <b>main</b></div>
      <div id="cc-agents"></div>
      <div class="ag sub"><span class="g">○</span> <span id="cc-src">transcript</span><span class="r" id="cc-meta"></span></div>
    </div></div>`;
  termBindInput(T);
  termStripBind(T);
  termTargetLoop(T);
}

/* 대상 감시: 최초 즉시 + 5s 주기 — live/stale은 텍스트 노드만 patch,
   sid가 바뀌면(대격변) 타임라인만 교체. 입력줄은 어떤 경우에도 불변(L0). */
async function termTargetLoop(T){
  const tick = async () => {
    const nt = await ccFetch("/api/chat/target", 4000);
    if (TERM !== T) return;
    if (!nt){ termStatus(T, null); return; }
    if (nt.sid && nt.sid !== T.sid){ termAttach(T, nt); return; }
    termStatus(T, nt.sid ? nt : null);
  };
  await tick();
  if (TERM !== T) return;
  if (!T.sid) termWaitingGuide(T);
  T.timers.push(setInterval(() => {
    if (document.hidden || tab !== "terminal") return;
    tick();
  }, 5000));
  // 수신함 로그(보낸 메시지 echo·전이 이벤트) 3s 폴 — append 전용
  T.timers.push(setInterval(() => {
    if (document.hidden || tab !== "terminal" || !T.sid) return;
    refreshTermChat(T);
  }, 3000));
  // 에이전트 스트립(이름·실시간 라벨·경과·토큰) 10s 폴 (REQ-044)
  const agTick = async () => {
    if (document.hidden || tab !== "terminal" || !T.sid) return;
    const d = await ccFetch("/api/agents?session=" +
                            encodeURIComponent(T.sid), 5000);
    if (TERM !== T || !d) return;
    T.srvAgents = d.agents || [];
    termAgentsRender(T);
  };
  agTick();
  T.timers.push(setInterval(agTick, 10000));
}

function termStatus(T, nt){
  const lv = $("#cc-live"), tg = $("#cc-tgt");
  if (!lv) return;
  if (!nt || !nt.sid){
    T.live = false;
    lv.textContent = T.sid ? "stale" : "no session";
    lv.className = "ccwarn";
    if (!T.sid && tg) tg.textContent = " · waiting";
    return;
  }
  T.live = !!nt.live;
  lv.textContent = T.live ? "live" : "stale";
  lv.className = T.live ? "ccok" : "ccwarn";
  if (tg) tg.innerHTML = ` · target <span class="cccyan">${esc(nt.sid)}</span> <span class="cccyan">@${esc(nt.user || "?")}</span>`;
}

function termWaitingGuide(T){
  const w = $("#cc-wait");
  if (!w) return;
  w.insertAdjacentHTML("beforebegin",
    ccLine("✻", "var(--cc-dim)",
      '<span style="color:var(--cc-dim)">Waiting for a live Claude session…</span>') +
    ccLine("⎿", null, `라이브 클로드 세션이 없습니다 — 세션이 뜨면 이 화면이 자동 전환됩니다.
  1. 터미널을 연다
  2. <span class="cccode">cd ~/section9 &amp;&amp; bin/s9 code</span> 실행
  3. 세션이 뜨면 이 탭에서 전송`, "sub"));
  const ta = $("#chat-in");
  ta.disabled = true;
  ta.placeholder = "no live session";
  termStatus(T, null);
}

/* 대상 세션 부착/교체 — 타임라인·상태 스트립만 만진다. 입력줄 DOM 불변(L0). */
async function termAttach(T, nt){
  const sid = nt.sid;
  T.sid = sid; T.offset = 0; T.evCount = 0; T.chatCount = 0;
  T.buf = []; T.agents = []; T.lastRole = null; T.lastToolName = "";
  termCloseSSE(T);
  termClearOut(T);
  termStatus(T, nt);
  termAgentsRender(T);
  const src = $("#cc-src"); if (src) src.textContent = `${sid} transcript`;
  const ta = $("#chat-in");
  ta.disabled = false;
  ta.placeholder = "메시지 — Enter 전송 · Shift+Enter 줄바꿈 · / 명령 · 이미지 붙여넣기/드래그";
  if (tab === "terminal" && !document.hidden) ta.focus();
  termMeta(T);
  // 초기 로드: 수신함 로그 + transcript 병합(동초는 chat 먼저 — 안정 정렬)
  const retry = async url => {   // 간헐 연결 reset — 1회 재시도
    const v = await ccFetch(url);
    if (v) return v;
    await new Promise(r => setTimeout(r, 400));
    return ccFetch(url);
  };
  const [logR, evR] = await Promise.all([
    retry("/api/chat/log?sid=" + encodeURIComponent(sid)),
    retry("/api/stream?session=" + encodeURIComponent(sid)),
  ]);
  if (TERM !== T || T.sid !== sid) return;
  const log = logR || {lines: []}, ev = evR || {events: [], offset: 0};
  T.chatCount = (log.lines || []).length;
  T.offset = ev.offset || 0;
  T.evCount = (ev.events || []).length;
  const merged = [
    ...(log.lines || []).map(l => ({...l, __chat: true})),
    ...(ev.events || []),
  ].sort((a, b) => {
    const ka = ccTsKey(a), kb = ccTsKey(b);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  const html = ccRenderBatch(T, merged);
  const w = $("#cc-wait");
  if (w) w.insertAdjacentHTML("beforebegin", html ||
    ccLine("✻", "var(--cc-dim)",
      '<span style="color:var(--cc-dim)">empty transcript — 첫 메시지를 보내보세요</span>'));
  const out = $("#ccout");
  if (out) out.scrollTop = out.scrollHeight;
  termMeta(T); termSpinnerEval(T); termAgentsRender(T);
  termConnectSSE(T);
}

function termClearOut(T){
  const out = $("#ccout"), w = $("#cc-wait");
  if (!out) return;
  [...out.children].forEach(n => { if (n !== w) n.remove(); });
  T.waitOn = false;
  if (w) w.hidden = true;
}

/* ---- SSE 수신 (L1): 증분 push → rAF 배칭 append. 서버는 5분마다 정상 종료 —
   onerror에서 마지막 offset으로 재접속. 연속 실패 시 폴링 폴백. ---- */
function termCloseSSE(T){
  if (T.es){ try{ T.es.close(); }catch(e){} T.es = null; }
  if (T.esRetryT){ clearTimeout(T.esRetryT); T.esRetryT = null; }
}
function termConnectSSE(T){
  termCloseSSE(T);
  if (!T.sid) return;
  if (!window.EventSource){ termPollFallback(T); return; }
  const es = new EventSource(`/api/stream/sse?session=${encodeURIComponent(T.sid)}&after=${T.offset}`);
  T.es = es; T.poll = false;
  termMeta(T);
  es.onopen = () => { if (TERM === T && T.es === es) T.esFails = 0; };
  es.onmessage = m => {
    if (TERM !== T || T.es !== es){ try{ es.close(); }catch(e){} return; }
    T.esFails = 0;
    let d = null; try{ d = JSON.parse(m.data); }catch(e){}
    if (!d) return;
    if (typeof d.offset === "number") T.offset = d.offset;
    if (d.events && d.events.length){
      T.buf.push(...d.events);
      termScheduleFlush(T);
    }
  };
  es.onerror = () => {
    try{ es.close(); }catch(e){}
    if (TERM !== T || T.es !== es) return;
    T.es = null; T.esFails++;
    if (T.esFails >= 4){ termPollFallback(T); return; }
    T.esRetryT = setTimeout(() => {
      if (TERM === T && !document.hidden) termConnectSSE(T);
    }, Math.min(500 * Math.pow(2, T.esFails - 1), 5000));
  };
}
function termPollFallback(T){
  T.poll = true;
  termMeta(T);
  if (T.pollT) return;   // 폴백 인터벌은 1개만 — SSE 복귀 후 재폴백에도 재사용
  let n = 0;
  T.pollT = setInterval(async () => {
    if (document.hidden || tab !== "terminal" || !T.sid || T.es) return;
    if (++n % 12 === 0 && window.EventSource){ termConnectSSE(T); return; }
    const nd = await ccFetch(`/api/stream?session=${encodeURIComponent(T.sid)}&after=${T.offset}`, 6000);
    if (TERM !== T || !nd || T.es) return;
    T.offset = nd.offset;
    if (nd.events && nd.events.length){
      T.buf.push(...nd.events);
      termScheduleFlush(T);
    }
  }, 2500);
  T.timers.push(T.pollT);
}
function termScheduleFlush(T){
  if (T.raf) return;
  T.raf = requestAnimationFrame(() => {
    T.raf = 0;
    if (TERM !== T) return;
    const evs = T.buf; T.buf = [];
    if (evs.length) termAppendBatch(T, evs);
  });
}
function termAppendBatch(T, evs){
  const out = $("#ccout"), w = $("#cc-wait");
  if (!out || !w) return;
  T.evCount += evs.length;
  const hadWait = T.waitOn, waitStart = T.waitBase;
  const html = ccRenderBatch(T, evs);   // lastRole/waitBase/agents 갱신 포함
  termMeta(T);
  if (!html){ termSpinnerEval(T); return; }   // 전부 숨김 이벤트(L10)
  const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 140;
  if (hadWait) termSpinnerFinalize(T, waitStart);   // 스피너 자리 → 완료줄 확정
  w.insertAdjacentHTML("beforebegin", html);
  termSpinnerEval(T);
  termAgentsRender(T);
  if (nearBottom) out.scrollTop = out.scrollHeight;  // 위로 읽는 중이면 방해 안 함
}
function termMeta(T){
  const m = $("#cc-meta");
  if (m) m.textContent =
    `${T.es ? "sse" : T.poll ? "poll 2.5s" : "…"} · ↓ ${T.evCount} events`;
}

/* ---- 웨이팅 상태줄 (L6): 마지막 이벤트가 user/tool_use이고 후속이 없으면
   점멸 글리프(CSS 애니메이션, reduced-motion 존중) + 동사 + 경과초. ---- */
function termSpinnerEval(T){
  const w = $("#cc-wait");
  if (!w) return;
  const on = !!T.sid && (T.lastRole === "user" || T.lastRole === "tool");
  if (!on){
    T.waitOn = false; w.hidden = true;
    return;
  }
  const verb = T.lastRole === "user" ? "Thinking…"
             : T.lastToolName === "Bash" ? "Running…" : "Doing…";
  if (!T.waitOn){
    T.waitOn = true; w.hidden = false;
    w.innerHTML = `<span class="ccspin"></span><span class="ccwv"> ${verb} </span><span class="ccwe"></span>`;
    if (!T.waitT){
      T.waitT = setInterval(() => {
        if (TERM !== T) return;
        const el = w.querySelector(".ccwe");
        if (el && T.waitOn && !w.hidden)
          el.textContent = `(${Math.max(0, Math.round((Date.now() - T.waitBase) / 1000))}s)`;
      }, 1000);
      T.timers.push(T.waitT);
    }
  } else {
    const wv = w.querySelector(".ccwv");
    if (wv) wv.textContent = ` ${verb} `;
  }
  const el = w.querySelector(".ccwe");
  if (el) el.textContent = `(${Math.max(0, Math.round((Date.now() - T.waitBase) / 1000))}s)`;
}
function termSpinnerFinalize(T, base){
  const w = $("#cc-wait");
  const secs = Math.max(0, Math.round((Date.now() - (base != null ? base : T.waitBase)) / 1000));
  if (w && T.waitOn)
    w.insertAdjacentHTML("beforebegin",
      `<div class="ln ccdim"><span class="g" style="color:var(--cc-dim)">✻</span><span class="b" style="color:var(--cc-faint)">~ (총 ${secs}s)</span></div>`);
  T.waitOn = false;
  if (w) w.hidden = true;
}

/* ---- 활성 에이전트 스트립 (L8): Agent 스폰 = 추가, task-notification = 종결.
   상태 스트립의 작은 컨테이너만 재렌더 — 입력줄과 무관. ---- */
function termAgentSpawn(T, type, desc){
  T.agents.push({type, desc});
  if (T.agents.length > 5) T.agents.shift();
}
function termAgentDone(T){
  T.agents.shift();   // 통지엔 타입 정보가 없다 — 가장 오래된 활성분 종결로 근사
}
const fmtDur = s => s >= 3600 ? `${s/3600|0}h ${(s%3600/60)|0}m`
  : s >= 60 ? `${(s/60)|0}m ${s%60|0}s` : `${s|0}s`;
const fmtTok = n => n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n | 0);

function termAgentsRender(T){
  const box = $("#cc-agents");
  if (!box) return;
  // 서버 파싱(/api/agents — 실시간 라벨·토큰)이 있으면 그것을, 없으면
  // transcript 근사(T.agents)를 그린다 (REQ-20260824-044)
  const srv = (T.srvAgents || []).filter(a => a.active).slice(-5);
  if (srv.length){
    const selId = T.agv ? T.agv.id : null;   // 열람 중 에이전트 = 활성 표시 (REQ-057)
    box.innerHTML = srv.map(a => {
      const sel = a.id === selId;
      return `<div class="ag sub ccagrow${sel ? " sel" : ""}" data-agent="${esc(a.id)}" title="클릭 또는 ← 키로 이 에이전트의 작업 내용을 터미널에서 본다">` +
        `<span class="g"${sel ? ' style="color:var(--cc-green)"' : ""}>${sel ? "●" : "○"}</span> <b>${esc(a.type)}</b> ` +
        `<span style="color:var(--cc-faint)">${esc(a.label || a.desc)}</span>` +
        `<span class="r">${sel ? "viewing · " : ""}${fmtDur(a.elapsed)} · ↓ ${fmtTok(a.tokens)} tokens</span></div>`;
    }).join("");
    termMainRow(T);
    return;
  }
  termMainRow(T);
  box.innerHTML = T.agents.map(a =>
    `<div class="ag sub"><span class="g">○</span> ${esc(a.type)} <span style="color:var(--cc-faint)">${esc(a.desc)}</span><span class="r">running</span></div>`).join("");
}

/* ---- 에이전트 뷰어 (REQ-044): 스트립 행 클릭/← 키 → 해당 에이전트 transcript
   를 타임라인 자리에서 열람. 세션 스트림 기계와 완전 분리(ccout 숨김 토글만) —
   입력줄 불변(L0). esc/←/main 클릭으로 복귀. ---- */
function termStripBind(T){
  const st = document.querySelector("#cc-root .ccstatus");
  if (st) st.addEventListener("click", ev => {
    if (TERM !== T) return;
    const row = ev.target.closest(".ccagrow");
    if (row){ termAgentOpen(T, row.dataset.agent); return; }
    if (ev.target.closest(".ccmain")) termAgentClose(T);
  });
  const inp = $("#chat-in");
  if (inp) inp.addEventListener("keydown", ev => {
    if (TERM !== T || inp.value) return;
    if (ev.key === "ArrowLeft" && !T.agv && (T.srvAgents || []).some(a => a.active)){
      ev.preventDefault();
      const act = T.srvAgents.filter(a => a.active);
      termAgentOpen(T, act[act.length - 1].id);
    } else if ((ev.key === "ArrowLeft" || ev.key === "Escape") && T.agv){
      ev.preventDefault();
      termAgentClose(T);
    }
  });
}

function termAgvLine(e){
  const t = e.text || "";
  if (e.role === "thinking")
    return ccLine("✻", "var(--cc-dim)", ccFold(
      `<span style="color:var(--cc-faint)">${esc(t.slice(0, 90))}…</span>`,
      ccText(t)), "ccdim");
  if (e.role === "tool")
    return ccLine("●", "var(--cc-faint)",
      `<b>${esc(e.name || "")}</b>(` + (t.length > 110
        ? ccFold(esc(t.slice(0, 100)) + "…", ccText(t)) : esc(t)) + ")");
  if (e.role === "result")
    return ccLine("⎿", "var(--cc-faint)", t.length > 180
      ? ccFold(esc(t.slice(0, 140)) + "…", ccText(t)) : ccText(t),
      e.error ? "" : "ccdim");
  if (e.role === "user")
    return ccLine("❯", "var(--cc-dim)", ccText(t.slice(0, 3000)));
  return ccLine("●", "", ccText(t.slice(0, 6000)));
}

function termMainRow(T){
  // main 행 활성 표시: 에이전트 뷰 열람 중이면 ○/dim, 아니면 ● (REQ-057)
  const m = document.querySelector("#cc-root .ccmain");
  if (!m) return;
  const g = m.querySelector(".g");
  if (T.agv){
    m.classList.add("dim");
    if (g) g.textContent = "○";
  } else {
    m.classList.remove("dim");
    if (g) g.textContent = "●";
  }
}

function termAgentOpen(T, id){
  termAgentClose(T);
  const out = $("#ccout"), av = $("#cc-agview");
  if (!out || !av || !T.sid) return;
  const meta = (T.srvAgents || []).find(a => a.id === id) || {};
  T.agv = {id, off: 0, timer: null};
  out.hidden = true;
  av.hidden = false;
  av.innerHTML = ccLine("⚙", "var(--cc-green)",
    `<b>${esc(meta.type || "agent")}</b> <span style="color:var(--cc-faint)">${esc(meta.desc || "")}` +
    ` — ← 또는 esc 로 main 복귀</span>`);
  const load = async () => {
    if (TERM !== T || !T.agv || T.agv.id !== id) return;
    const d = await ccFetch(
      `/api/agentstream?session=${encodeURIComponent(T.sid)}` +
      `&agent=${encodeURIComponent(id)}&after=${T.agv.off}`, 6000);
    if (TERM !== T || !T.agv || T.agv.id !== id || !d) return;
    T.agv.off = d.offset || T.agv.off;
    if ((d.events || []).length){
      const nearBottom = av.scrollHeight - av.scrollTop - av.clientHeight < 140;
      av.insertAdjacentHTML("beforeend",
        d.events.map(termAgvLine).filter(Boolean).join(""));
      if (nearBottom) av.scrollTop = av.scrollHeight;
    }
  };
  load();
  T.agv.timer = setInterval(() => { if (!document.hidden) load(); }, 2000);
  T.timers.push(T.agv.timer);
  termAgentsRender(T);   // 스트립 활성 표시 즉시 반영 (REQ-057)
}

function termAgentClose(T){
  if (T.agv){ clearInterval(T.agv.timer); T.agv = null; }
  const out = $("#ccout"), av = $("#cc-agview");
  if (av) av.hidden = true;
  if (out) out.hidden = false;
  termAgentsRender(T);   // 선택 해제 → main 활성 복귀 (REQ-057)
}

async function refreshTermChat(T){
  const d = await ccFetch("/api/chat/log?sid=" + encodeURIComponent(T.sid), 6000);
  if (TERM !== T || !d || !T.sid) return;
  const lines = d.lines || [];
  if (lines.length <= T.chatCount){ T.chatCount = lines.length; return; }
  const add = lines.slice(T.chatCount);
  T.chatCount = lines.length;
  const out = $("#ccout"), w = $("#cc-wait");
  if (!out || !w) return;
  out.querySelectorAll(".ln.pending").forEach(n => n.remove());  // 낙관 줄 → echo 대체
  const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 140;
  w.insertAdjacentHTML("beforebegin", add.map(ccChatLine).join(""));
  if (add.some(l => l.kind === "chat")){ T.lastRole = "user"; T.waitBase = Date.now(); }
  termSpinnerEval(T);
  if (nearBottom) out.scrollTop = out.scrollHeight;
}

/* ---- 입력줄 (L0/L4/L5/L7): 리스너는 셸 생성 시 1회 바인딩.
   키 처리·팔레트 필터·로컬 에코는 전부 로컬 — 네트워크와 결합 금지(L1). ---- */
function termBindInput(T){
  const ta = $("#chat-in"), root = $("#cc-root"),
        pal = $("#cc-pal"), att = $("#cc-att");
  ta.addEventListener("keydown", e => termKeydown(T, e));
  ta.addEventListener("input", () => {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    T.histIdx = null;          // 편집 시작 = 히스토리 탐색 종료
    termPalUpdate(T);
  });
  ta.addEventListener("paste", e => {            // L5 — 클립보드 이미지
    const items = [...(((e.clipboardData || {}).items) || [])]
      .filter(i => i.kind === "file" && /^image\//.test(i.type));
    if (!items.length) return;
    e.preventDefault();
    items.forEach(i => { const f = i.getAsFile(); if (f) termUpload(T, f); });
  });
  $("#cc-clip").addEventListener("click", () => $("#cc-file").click());
  $("#cc-file").addEventListener("change", e => {
    [...e.target.files].forEach(f => termUpload(T, f));
    e.target.value = "";
  });
  root.addEventListener("dragover", e => {       // L5 — 드래그&드롭
    const ty = e.dataTransfer ? [...e.dataTransfer.types] : [];
    if (!ty.includes("Files")) return;
    e.preventDefault(); e.stopPropagation();
    root.classList.add("dragover");
  });
  root.addEventListener("dragleave", () => root.classList.remove("dragover"));
  root.addEventListener("drop", e => {
    root.classList.remove("dragover");
    const fs = e.dataTransfer ? [...e.dataTransfer.files] : [];
    if (!fs.length) return;
    e.preventDefault(); e.stopPropagation();
    fs.forEach(f => termUpload(T, f));
  });
  pal.addEventListener("mousedown", e => {       // mousedown — blur 전에 선택
    const pi = e.target.closest("[data-pi]");
    if (!pi) return;
    e.preventDefault();
    T.pal.idx = +pi.dataset.pi;
    termPalPick(T);
  });
  att.addEventListener("click", e => {
    const rm = e.target.closest("[data-attrm]");
    if (!rm) return;
    T.atts.splice(+rm.dataset.attrm, 1);
    termAttRender(T);
  });
}

function termKeydown(T, e){
  const ta = e.target;
  if (T.pal.open){                               // L4 — 팔레트 내비게이션
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const n = T.pal.items.length;
      if (n) T.pal.idx = (T.pal.idx + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      termPalRender(T);
      return;
    }
    if (e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); termPalPick(T); return; }
    if (e.key === "Escape"){ e.preventDefault(); termPalClose(T); return; }
  }
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); return; }
  if (e.key === "Escape"){                       // L7 — 첨부 → 입력 순 클리어
    e.preventDefault();
    if (T.atts.length){ T.atts = []; termAttRender(T); }
    else { ta.value = ""; ta.style.height = "auto"; T.histIdx = null; }
    return;
  }
  // L7 — ↑/↓ 히스토리: 입력이 비어있거나 탐색 중일 때만. 편집 중엔 커서 이동.
  if (e.key === "ArrowUp" && T.hist.length && (ta.value === "" || T.histIdx !== null)){
    e.preventDefault();
    T.histIdx = T.histIdx === null ? T.hist.length - 1 : Math.max(0, T.histIdx - 1);
    ta.value = T.hist[T.histIdx];
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    ta.setSelectionRange(ta.value.length, ta.value.length);
    termPalClose(T);
    return;
  }
  if (e.key === "ArrowDown" && T.histIdx !== null){
    e.preventDefault();
    T.histIdx++;
    if (T.histIdx >= T.hist.length){ T.histIdx = null; ta.value = ""; }
    else ta.value = T.hist[T.histIdx];
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    return;
  }
}

function termClearLocal(T){                      // L7 — Ctrl+L (로컬 클리어)
  termClearOut(T);
  T.lastRole = null;
  termSpinnerEval(T);
}

// 전역 단축키/포커스 리다이렉트 (L7) — 1회 등록, 터미널 탭에서만 동작
document.addEventListener("keydown", e => {
  if (tab !== "terminal" || !TERM) return;
  const ta = $("#chat-in");
  if (!ta) return;
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === "l" || e.key === "L")){
    e.preventDefault(); termClearLocal(TERM); return;
  }
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === "o" || e.key === "O")){
    e.preventDefault();
    const ds = document.querySelectorAll("#ccout details");
    if (ds.length){ const d = ds[ds.length - 1]; d.open = !d.open; }
    return;
  }
  if (e.target === ta) return;
  if (e.target.closest && e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length !== 1) return;
  if (window.getSelection && String(getSelection())) return;  // 선택/복사 중 방해 금지
  ta.focus();   // preventDefault 없음 — 문자는 그대로 입력줄에 꽂힌다
});
// 백그라운드 탭은 SSE 연결 반납, 복귀 시 마지막 offset으로 재접속 (live follow 규약)
document.addEventListener("visibilitychange", () => {
  const T = TERM;
  if (!T || tab !== "terminal" || !T.sid) return;
  if (document.hidden) termCloseSSE(T);
  else if (!T.es && !T.poll){ T.esFails = 0; termConnectSSE(T); }
});

/* ---- / 팔레트 (L4): /api/chat/commands(스킬·커맨드) + CC 빌트인(CLI 전용 dim).
   스킬/커맨드 선택 = "/이름 " 완성 — 전송하면 세션이 스킬로 처리한다. ---- */
function termPalLoad(){
  if (termCmdCache) return Promise.resolve(termCmdCache);
  return ccFetch("/api/chat/commands", 5000).then(d => {
    const got = d && d.commands;
    const list = [...(got || []), ...CC_BUILTINS];
    if (got) termCmdCache = list;   // 실패는 캐시하지 않는다 — 다음 열림에 재시도
    return list;
  });
}
function termPalUpdate(T){
  const ta = $("#chat-in");
  const v = ta.value;
  if (!/^\/[A-Za-z0-9_:-]*$/.test(v)){ termPalClose(T); return; }
  termPalLoad().then(items => {
    if (TERM !== T) return;
    if ($("#chat-in").value !== v) return;       // 그 사이 입력이 변함
    const q = v.slice(1).toLowerCase();
    const list = items
      .filter(c => c.name.toLowerCase().includes(q))
      .sort((a, b) =>
        (b.name.toLowerCase().startsWith(q) ? 1 : 0) -
        (a.name.toLowerCase().startsWith(q) ? 1 : 0) ||
        a.name.localeCompare(b.name))
      .slice(0, 12);
    T.pal.items = list;
    T.pal.idx = Math.max(0, Math.min(T.pal.idx, list.length - 1));
    T.pal.open = list.length > 0;
    termPalRender(T);
  });
}
function termPalRender(T){
  const pal = $("#cc-pal");
  if (!pal) return;
  pal.hidden = !T.pal.open;
  if (!T.pal.open){ pal.innerHTML = ""; return; }
  pal.innerHTML = T.pal.items.map((c, i) =>
    `<div class="pi${i === T.pal.idx ? " sel" : ""}${c.source === "cli" ? " cli" : ""}" data-pi="${i}"><span class="pn">/${esc(c.name)}</span><span class="pd">${esc(c.desc || "")}${c.source === "cli" ? ' <span class="pcli">(CLI 전용)</span>' : ""}</span></div>`).join("");
  const sel = pal.querySelector(".pi.sel");
  if (sel) sel.scrollIntoView({block: "nearest"});
}
function termPalPick(T){
  const c = T.pal.items[T.pal.idx];
  if (!c) return;
  const ta = $("#chat-in");
  ta.value = "/" + c.name + " ";
  termPalClose(T);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
function termPalClose(T){
  T.pal.open = false; T.pal.items = []; T.pal.idx = 0;
  const pal = $("#cc-pal");
  if (pal){ pal.hidden = true; pal.innerHTML = ""; }
}

/* ---- 이미지 첨부 (L5): 붙여넣기/드래그/📎 → /api/chat/upload(base64) →
   칩 표시 → 전송 시 "[Image: <절대경로>]" 줄 추가 (CC 관례 — 세션이 Read). ---- */
function termAttRender(T){
  const box = $("#cc-att");
  if (!box) return;
  box.hidden = !T.atts.length;
  box.innerHTML = T.atts.map((a, i) =>
    `<span class="chip">[Image #${i + 1}] ${esc(a.name)}${a.up ? ' <span class="up">uploading…</span>' : ""}<button data-attrm="${i}" title="제거">×</button></span>`).join("");
}
async function termUpload(T, file){
  if (file.size > 10 * 1024 * 1024){ termErr("✗ 첨부가 너무 크다 (10MB 한도)"); return; }
  const a = {name: file.name || "pasted.png", up: true, path: null};
  T.atts.push(a);
  termAttRender(T);
  try{
    const data = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("파일 읽기 실패"));
      fr.readAsDataURL(file);
    });
    const r = await fetch("/api/chat/upload", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: a.name, data})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "업로드 실패");
    a.path = d.path; a.up = false;
    if (TERM === T){ termErrClear(); termAttRender(T); }
  }catch(ex){
    if (TERM === T){
      T.atts = T.atts.filter(x => x !== a);
      termAttRender(T);
      termErr("✗ 첨부 실패: " + (ex && ex.message ? ex.message : ex));
    }
  }
}
function termErr(msg){
  const err = $("#chat-err");
  if (err){ err.textContent = msg; err.hidden = false; }
}
function termErrClear(){
  const err = $("#chat-err");
  if (err) err.hidden = true;
}

async function sendChat(){
  const T = TERM, ta = $("#chat-in");
  if (!T || !T.sid || !ta || ta.disabled) return;
  const raw = ta.value.trim();
  if (T.atts.some(a => a.up)){ termErr("✗ 첨부 업로드 중 — 잠시 후 전송"); return; }
  const atts = T.atts.filter(a => a.path);
  if (!raw && !atts.length) return;
  let text = raw;
  atts.forEach(a => { text += `\n[Image: ${a.path}]`; });
  // 로컬 에코 + 입력 클리어는 즉시(동기) — 네트워크 왕복과 결합하지 않는다 (L1).
  // 성공 시 수신함 echo 도착이 .pending을 제거·대체한다. 전송 중 입력 비활성화 금지.
  const out = $("#ccout"), w = $("#cc-wait");
  let pend = null;
  if (out && w){
    const clip = atts.length
      ? ` <span style="color:var(--cc-dim)">📎${atts.length}</span>` : "";
    w.insertAdjacentHTML("beforebegin",
      `<div class="ln pending"><span class="g" style="color:var(--cc-dim)">❯</span><span class="b">${ccText(raw || "(첨부)")}${clip}</span></div>`);
    pend = w.previousElementSibling;
    out.scrollTop = out.scrollHeight;
  }
  if (raw && T.hist[T.hist.length - 1] !== raw) T.hist.push(raw);
  T.histIdx = null;
  ta.value = ""; ta.style.height = "auto";
  T.atts = []; termAttRender(T);
  termPalClose(T);
  T.lastRole = "user"; T.waitBase = Date.now();
  termSpinnerEval(T);
  try{
    const r = await fetch("/api/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, sid: T.sid})});
    const d = await r.json();
    if (TERM !== T) return;
    if (!d.ok) throw new Error(d.error || "전송 실패");
    termErrClear();
    refreshTermChat(T);
  }catch(ex){
    if (TERM !== T) return;
    if (pend && pend.isConnected) pend.remove();
    termErr("✗ " + (ex && ex.message ? ex.message
      : "서버에 연결할 수 없습니다 — 잠시 후 다시 시도"));
    if (!ta.value) ta.value = raw;   // 실패 시 입력 복원 — 바로 재전송 가능
    T.lastRole = null;
    termSpinnerEval(T);
  }
  ta.focus();
}

/* ------- graph (Obsidian-style: live physics, drag, pan/zoom, hover focus) ------- */
let ganim = null;
let graphPos = {}, graphTf = null;  // auto refresh 시 배치/줌 보존
let graphLayout = (() => {         // force(자유 물리) | dag(계층 — 병목 파악용)
  try{ return localStorage.getItem("s9glayout") || "force"; }catch(e){ return "force"; }
})();

function stopGraph(){
  if (ganim){
    cancelAnimationFrame(ganim.raf);
    if (ganim.save) ganim.save();
    ganim = null;
  }
}

async function renderGraph(rows){
  if (!graph) graph = await (await fetch("/api/graph?" + meQ())).json();
  // 타입 표시 토글 (REQ-20260824-026): 세션 노드는 로그성 소음이라 기본 숨김 —
  // 범례 클릭으로 타입별 on/off (localStorage 유지)
  const visible = new Set(rows.filter(r => gtypes.has(r.type)).map(r => r.id));
  const nodes = graph.nodes.filter(n => visible.has(n.id)).map(n => ({...n}));
  const edges = graph.edges.filter(e => visible.has(e.from) && visible.has(e.to));
  const deg = {};
  edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const adj = {};
  edges.forEach(e => {
    (adj[e.from] = adj[e.from] || new Set()).add(e.to);
    (adj[e.to] = adj[e.to] || new Set()).add(e.from);
  });
  // 병목 가중치: 미완료 노드의 "미완료 파생(자손) 수" — 이 노드가 막고 있는 작업량
  const childrenOf = {};
  edges.filter(e => e.rel === "parent").forEach(e => {
    (childrenOf[e.to] = childrenOf[e.to] || []).push(e.from);  // to=부모, from=자식
  });
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const pendingMemo = {};
  const isPending = id => {
    const n = byId[id];
    return n && n.status !== "done" && n.status !== "cancelled" && n.type === "request";
  };
  const pendingDesc = id => {
    if (id in pendingMemo) return pendingMemo[id];
    pendingMemo[id] = 0;  // 순환 가드
    let c = 0;
    for (const ch of (childrenOf[id] || []))
      c += (isPending(ch) ? 1 : 0) + pendingDesc(ch);
    return pendingMemo[id] = c;
  };
  nodes.forEach(n => n.waiting = isPending(n.id) ? pendingDesc(n.id) : 0);

  $("#view").innerHTML = `<div class="graphwrap">
    <div class="legend">
      <button class="gmode${graphLayout==="force"?" on":""}" data-glayout="force">force</button>
      <button class="gmode${graphLayout==="dag"?" on":""}" data-glayout="dag">dag</button>
      ${["request","knowledge","session"].map(t => `<span class="gtype${gtypes.has(t) ? "" : " off"}" data-gtype="${t}"
        title="클릭 = ${t} 노드 표시 토글"><span class="dot" style="background:${TCOLOR[t]}"></span>${t}</span>`).join("")}
      <span style="margin-left:auto">앰버 호+숫자 = 미완료 파생 병목(1건=¼둘레, 4건+=만원) · 점멸 = in-progress · 실선 링 = blocked · 점선 링 = review</span>
    </div>
    <canvas id="gcanvas"></canvas>
    <div class="ghint">${graphLayout==="dag" ? "dag: 위→아래 = parent→파생 · " : ""}드래그 = 이동/노드 끌기 · 휠 = 줌 · 클릭 = 문서 열기</div>
  </div>`;

  const canvas = $("#gcanvas");
  const dark = isDarkTheme();
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || (dark ? "#111214" : "#fafaf8");
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth || 1200, H = Math.max(420, innerHeight - 210);
  const dpr = devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  // ---- 우주 별무리 공간감 (2026-08-23 반려 반영: 노드 개체 광택 대신 장면 레벨 깊이) ----
  // 스타필드: 멀리 있는 희미한 입자를 깊이 레이어별 오프스크린 타일에 1회만 렌더 →
  // 매 프레임은 pattern fill뿐(프레임당 arc 0개). 팬/줌 시 레이어마다 다르게 움직여
  // (시차 parallax) 깊이가 생긴다. 배경 전용 — 노드 좌표·히트테스트·물리에 무관.
  const parseCol = v => { ctx.fillStyle = "#888"; ctx.fillStyle = v; const s = ctx.fillStyle;
    if (s[0] === "#") return [1,3,5].map(i => parseInt(s.slice(i, i+2), 16));
    const m = s.match(/[\d.]+/g); return m ? m.slice(0,3).map(Number) : [136,136,136]; };
  const rootCS = getComputedStyle(document.documentElement);
  const bgRGB = parseCol(bgColor);
  // 타입색은 토큰 해석값 사용 — skin/tone이 타입 토큰을 재정의하면 그래프도 따라간다 (스킨 무관 구조 개선 — 유지)
  const TC = {};
  for (const k of ["request","knowledge","session"])
    TC[k] = rootCS.getPropertyValue("--t-" + k).trim() || TCOLOR_RAW[k];
  const TCrgb = {};
  for (const k in TC) TCrgb[k] = parseCol(TC[k]);
  // 대기 원근(aerial perspective): 원경 노드 색을 배경 쪽으로 — 알파 단독보다 깊이가 뚜렷
  const mixToBg = (rgb, m) => rgb.map((c, i) => Math.round(c + (bgRGB[i] - c) * m));
  // 비네트: 가장자리를 bg 파생 셰이드로 살짝 가라앉혀 중앙 클러스터에 깊이 — 1회 생성
  const vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.38,
                                            W/2, H/2, Math.hypot(W, H) * 0.62);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, `rgba(${bgRGB.map(c => Math.round(c * 0.45)).join(",")},${dark ? 0.5 : 0.18})`);

  let restored = 0;
  if (graphLayout === "dag"){
    // 계층 배치: parent 체인 기준 depth(위=루트, 아래=파생). 병목이 위계로 보인다.
    const parentOf = {};
    edges.filter(e => e.rel === "parent").forEach(e => parentOf[e.from] = e.to);
    const depth = {};
    const depthOf = (id, seen) => {
      if (id in depth) return depth[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const p = parentOf[id];
      return depth[id] = (p && byId[p]) ? depthOf(p, seen) + 1 : 0;
    };
    nodes.forEach(n => depthOf(n.id, new Set()));
    const layers = {};
    nodes.forEach(n => (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n));
    Object.entries(layers).forEach(([d, layer]) => {
      // 부모 x 기준 정렬로 교차 최소화 (단순 barycenter)
      layer.sort((a, b) => {
        const px = id => { const p = parentOf[id]; return p && byId[p] ? byId[p].x || 0 : 0; };
        return px(a.id) - px(b.id);
      });
      const gap = Math.min(170, (W - 120) / Math.max(layer.length, 1));
      layer.forEach((n, i) => {
        n.x = W/2 + (i - (layer.length - 1) / 2) * gap;
        n.y = 70 + d * 105;
      });
    });
    nodes.forEach(n => { n.vx = 0; n.vy = 0;
      n.r = 5 + Math.min(9, 2.2 * Math.sqrt(deg[n.id] || 0)); });
  } else {
    nodes.forEach((n, i) => {
      const saved = graphPos[n.id];
      if (saved){ n.x = saved.x; n.y = saved.y; restored++; }
      else {
        const a = 2 * Math.PI * i / Math.max(nodes.length, 1);
        const rr = 120 + 90 * ((i * 7919) % 13) / 13;   // 결정적 초기 산포
        n.x = W/2 + Math.cos(a) * rr; n.y = H/2 + Math.sin(a) * rr;
      }
      n.vx = 0; n.vy = 0;
      n.r = 5 + Math.min(9, 2.2 * Math.sqrt(deg[n.id] || 0));
    });
  }
  // 병목 노드는 물리적으로도 크게 — 시선이 먼저 간다
  nodes.forEach(n => { if (n.waiting) n.r += Math.min(7, 1.8 * Math.sqrt(n.waiting)); });
  const idx = Object.fromEntries(nodes.map((n,i) => [n.id, i]));
  // ---- 노드 z축 (2026-08-24 반려 반영: 배경 말고 노드 구름 자체에 깊이) ----
  // zf 0=전경 1=원경. 반지름과 독립된 축: 해시(안정 산포) + 허브 근접 + 상태 의미
  // (진행/블록/리뷰=전경으로 끌리고, 종결=원경으로 물러남 — 깊이가 의미를 갖는다).
  const hash01 = id => { let h = 2166136261;
    for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 8) & 0xffff) / 65535; };
  let degMax = 1;
  nodes.forEach(n => { degMax = Math.max(degMax, deg[n.id] || 0); });
  nodes.forEach(n => {
    const hub = Math.sqrt((deg[n.id] || 0) / degMax);
    const act = n.status === "in-progress" || n.status === "blocked" || n.status === "review";
    const fin = n.status === "done" || n.status === "cancelled";
    n.zf = Math.min(0.97, Math.max(0.03,
      0.50 * hash01(n.id) + 0.42 * (1 - hub) + (act ? -0.30 : 0) + (fin ? 0.22 : 0)));
    n.near = 1 - n.zf;
  });
  const drawOrder = [...nodes].sort((a, b) => b.zf - a.zf);   // 원경부터 → 전경이 덮는다
  const depthOf01 = n => n.near;                              // 에지 페이드 호환 (0=원경 1=전경)

  const st = { tf: graphTf ? {...graphTf} : {x:0,y:0,k:1},
               // dag=고정 배치(물리 off), force=기존 배치 살아있으면 살짝만 재정착
               alpha: graphLayout === "dag" ? 0.005
                      : restored > nodes.length * 0.6 ? 0.12 : 1,
               hover:null, drag:null, pan:null, moved:0,
               dx:0, dy:0, lastTouch: performance.now() };
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 깊이 투영: 팬 오프셋을 깊이에 가중(전경이 더 크게 흐름) — 팬/줌 시 노드 사이
  // 상대 이동(운동 시차)이 생겨 구름이 부피로 읽힌다. 줌 k는 전 깊이 공통(역변환 단순).
  const pfOf = n => 0.72 + 0.52 * n.near;                    // 원경 0.72 ~ 전경 1.24
  const sxOf = n => n.x * st.tf.k + (st.tf.x + st.dx) * pfOf(n);
  const syOf = n => n.y * st.tf.k + (st.tf.y + st.dy) * pfOf(n);
  const scOf = n => st.tf.k * (0.62 + 0.55 * n.near);        // 깊이 반지름 배율(원근 축소)
  // 시험 이음새: CDP 검증이 스크린 좌표·zf·카메라 드리프트를 수치로 확인 (REQ-078)
  window.__gdbg = { snap: () => nodes.map(n => ({ id: n.id, sx: sxOf(n), sy: syOf(n),
    zf: n.zf, rr: n.r * scOf(n) })),
    cam: () => ({ dx: st.dx, dy: st.dy }) };

  function step(){
    const a = st.alpha;
    for (let i = 0; i < nodes.length; i++) for (let j = i+1; j < nodes.length; j++){
      const p = nodes[i], q = nodes[j];
      let dx = p.x-q.x, dy = p.y-q.y, d2 = dx*dx+dy*dy || 1;
      if (d2 > 90000) continue;
      const d = Math.sqrt(d2), f = 2600 / d2 * a;
      p.vx += f*dx/d; p.vy += f*dy/d; q.vx -= f*dx/d; q.vy -= f*dy/d;
    }
    for (const e of edges){
      const p = nodes[idx[e.from]], q = nodes[idx[e.to]];
      let dx = q.x-p.x, dy = q.y-p.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
      const f = (d - 130) * 0.05 * a;
      p.vx += f*dx/d; p.vy += f*dy/d; q.vx -= f*dx/d; q.vy -= f*dy/d;
    }
    for (const n of nodes){
      if (st.drag === n) { n.vx = n.vy = 0; continue; }
      n.vx += (W/2 - n.x) * 0.004 * a; n.vy += (H/2 - n.y) * 0.004 * a;
      n.x += n.vx; n.y += n.vy; n.vx *= 0.85; n.vy *= 0.85;
    }
    st.alpha = Math.max(0.005, st.alpha * 0.985);
  }

  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    // 유휴 카메라 드리프트: 정지 화면에서도 깊이별 상대 운동이 보이게 (5차 반려 반영).
    // 인터랙션 5초 후 3초 페이드인, ±8px 리사주(비정수 주기비 — 반복 패턴 없음)
    const tnow = performance.now();
    const idleAmp = (!RM && tnow - st.lastTouch > 5000)
      ? Math.min(1, (tnow - st.lastTouch - 5000) / 3000) : 0;
    st.dx = idleAmp * 8 * Math.sin(tnow / 2900);
    st.dy = idleAmp * 6 * Math.sin(tnow / 4100 + 1.7);
    // (6차 반려로 배경 스타필드 제거 — 깊이는 노드 z축·유휴 드리프트가 담당)
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    const hov = st.hover, nb = hov ? (adj[hov.id] || new Set()) : null;
    const dim = id => hov && id !== hov.id && !nb.has(id);
    for (const e of edges){
      const p = nodes[idx[e.from]], q = nodes[idx[e.to]];
      const hot = hov && (e.from === hov.id || e.to === hov.id);
      ctx.beginPath(); ctx.moveTo(sxOf(p), syOf(p)); ctx.lineTo(sxOf(q), syOf(q));
      ctx.setLineDash(e.rel === "parent" ? [] : [4, 4]);
      if (hot){
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = dark ? "#8b9cf5" : "#6474e0";
      } else {
        // 에지 원근: 깊은 쪽 끝점을 따라 얇고 흐리게 — 에지가 깊이 방향으로 가라앉는다
        const dz = 0.6 * Math.min(depthOf01(p), depthOf01(q))
                 + 0.4 * (depthOf01(p) + depthOf01(q)) / 2;
        const ea = (hov ? (dark ? .15 : .2) : (dark ? .5 : .6)) * (0.30 + 0.70 * dz);
        ctx.lineWidth = 0.6 + 0.9 * dz;
        ctx.strokeStyle = dark ? `rgba(90,105,130,${ea})` : `rgba(150,165,190,${ea})`;
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    const now = performance.now();
    // 활성 상태 링 색 (canvas는 CSS 변수 rgba 조립을 위해 raw RGB)
    const RING = dark
      ? {"in-progress":"217,149,55", blocked:"224,93,93", review:"165,130,232"}
      : {"in-progress":"180,83,9",  blocked:"185,28,28", review:"109,40,217"};
    function drawNode(n){
      const terminal = n.status === "done" || n.status === "cancelled";
      const faded = dim(n.id);
      const hovered = hov && n.id === hov.id;
      const px = sxOf(n), py = syOf(n);
      const rr = n.r * scOf(n) * (hovered ? 1.12 : 1);
      // 깊이 3중주: 투명도(반려 요구) + 대기 원근(색이 배경으로 물러남) + 크기 감쇠.
      // 7차 반려로 대비 강화: 하한 0.12 + 지수 커브 — 원근 차이가 정지 화면에서도 즉시 보인다.
      // hover는 일시 전경화(알파 1·원색) — 깊은 노드도 짚으면 앞으로 나온다.
      const bodyA = faded ? 0.12 : hovered ? 1
                  : (terminal ? 0.55 : 1) * (0.12 + 0.88 * Math.pow(n.near, 1.35));
      const sigA  = faded ? 0.12 : terminal ? 0.45 : Math.max(0.6, n.near + 0.35);
      ctx.globalAlpha = bodyA;
      if (hovered){ ctx.shadowColor = TC[n.type] || "#999"; ctx.shadowBlur = 14; }
      ctx.beginPath(); ctx.arc(px, py, rr, 0, 7);
      const rgb = TCrgb[n.type] || [153,153,153];
      ctx.fillStyle = `rgb(${(hovered ? rgb : mixToBg(rgb, 0.55 * n.zf)).join(",")})`;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = sigA;
      if (!faded && RING[n.status]){
        const rc = RING[n.status];
        if (n.status === "in-progress"){
          const t = (now % 1800) / 1800;
          ctx.beginPath(); ctx.arc(px, py, rr + (3 + t * 11) * st.tf.k, 0, 7);
          ctx.strokeStyle = `rgba(${rc},${(1 - t) * 0.7})`;
          ctx.lineWidth = 1.6; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(px, py, rr + 3 * st.tf.k, 0, 7);
        ctx.setLineDash(n.status === "review" ? [3, 3] : []);
        ctx.strokeStyle = `rgba(${rc},0.95)`;
        ctx.lineWidth = n.status === "blocked" ? 2 : 1.1;
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (!faded && n.waiting > 0){
        // 병목 게이지: 둘레를 채우는 앰버 호 (1건=90°, 4건+=만원) — 점선 후광 대체
        // (5차 반려: 3중 인코딩 과잉 → 호 게이지 + 캡슐 배지로 정리)
        const frac = Math.min(1, n.waiting / 4);
        ctx.beginPath();
        ctx.arc(px, py, rr + 5 * st.tf.k, -Math.PI/2, -Math.PI/2 + frac * 2 * Math.PI);
        ctx.strokeStyle = dark ? "rgba(217,149,55,.85)" : "rgba(180,83,9,.8)";
        ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.stroke(); ctx.lineCap = "butt";
        // 파생 수는 노드 안에 — 별도 배지 제거 (7차 반려). 작은 노드는 숫자 생략,
        // 양은 호 게이지가 전달한다.
        if (rr >= 7){
          ctx.font = `700 ${Math.max(8, Math.min(11, rr))}px ui-monospace,monospace`;
          ctx.fillStyle = dark ? "#0b0c0e" : "#ffffff";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(String(n.waiting), px, py + 0.5);
          ctx.textBaseline = "alphabetic";
        }
      }
      const showLabel = !faded && ((st.tf.k > 0.75 && n.near > 0.45) ||
        (hov && (n.id === hov.id || nb.has(n.id))) || graphLayout === "dag");
      if (showLabel){
        ctx.font = `11px "Noto Sans KR",sans-serif`;
        ctx.textAlign = "center";
        ctx.fillStyle = dark ? `rgba(226,232,240,${.35 + .5 * n.near})`
                             : `rgba(24,32,43,${.3 + .5 * n.near})`;
        const t = n.title.length > 16 ? n.title.slice(0,16) + "…" : n.title;
        ctx.fillText(t, px, py + rr + 13);
      }
      ctx.globalAlpha = 1;
    }
    // 원경→전경 순서로: 가까운 노드가 먼 노드를 덮는다. hover는 최전면.
    for (const n of drawOrder) if (!hov || n.id !== hov.id) drawNode(n);
    if (hov) drawNode(hov);
  }

  function loop(){
    if (st.alpha > 0.006) step();
    draw();
    ganim.raf = requestAnimationFrame(loop);
  }

  // 히트테스트: 깊이 투영과 동일한 스크린 좌표로 판정 — 전경(위에 그려진 것)부터.
  const hit = (mx, my) => {
    for (let i = drawOrder.length - 1; i >= 0; i--){
      const n = drawOrder[i], dx = mx - sxOf(n), dy = my - syOf(n);
      const rr = n.r * scOf(n) + 4;
      if (dx*dx + dy*dy < rr*rr) return n;
    }
    return null;
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  canvas.addEventListener("pointerdown", e => {
    const [mx, my] = pos(e); st.moved = 0; st.lastTouch = performance.now();
    const n = hit(mx, my);
    if (n){ st.drag = n; if (graphLayout === "force") st.alpha = Math.max(st.alpha, 0.3); }
    else st.pan = { mx, my, x: st.tf.x, y: st.tf.y };
    canvas.classList.add("grabbing");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    const [mx, my] = pos(e);
    if (st.drag){
      st.lastTouch = performance.now();
      const pf = pfOf(st.drag);  // 드래그 역변환도 같은 투영(드리프트 포함) — 커서에 정확히
      st.drag.x = (mx - (st.tf.x + st.dx) * pf) / st.tf.k;
      st.drag.y = (my - (st.tf.y + st.dy) * pf) / st.tf.k; st.moved += 2;
      if (graphLayout === "force") st.alpha = Math.max(st.alpha, 0.25);
    } else if (st.pan){
      st.lastTouch = performance.now();
      st.tf.x = st.pan.x + (mx - st.pan.mx); st.tf.y = st.pan.y + (my - st.pan.my);
      st.moved += 2;
    } else {
      const n = hit(mx, my);
      if (n !== st.hover){ st.hover = n; canvas.style.cursor = n ? "pointer" : "grab"; }
    }
  });
  canvas.addEventListener("pointerup", e => {
    if (st.drag && st.moved < 4){
      const id = st.drag.id;
      selectedDoc = id; tab = "docs";
      document.querySelectorAll("[data-tab]").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === "docs"));
      stopGraph(); render(); return;
    }
    st.drag = null; st.pan = null;
    canvas.classList.remove("grabbing");
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    st.lastTouch = performance.now();
    const [mx, my] = pos(e);
    const k2 = Math.min(4, Math.max(0.25, st.tf.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    st.tf.x = mx - (mx - st.tf.x) * k2 / st.tf.k;
    st.tf.y = my - (my - st.tf.y) * k2 / st.tf.k;
    st.tf.k = k2;
  }, { passive: false });
  canvas.addEventListener("pointerleave", () => { st.hover = null; });

  stopGraph();
  ganim = { raf: 0, save(){
    if (graphLayout !== "force") return;  // dag 배치를 force 저장본에 덮지 않음
    nodes.forEach(n => graphPos[n.id] = {x: n.x, y: n.y});
    graphTf = {...st.tf};
  }};
  loop();
}

/* ---------------- users 탭 (계정/프로필/개인화) ---------------- */
let selectedUser = null;

// admin 대리 모드(asUser)면 쓰기 본문에 as 를 첨부 — 그 외 신원 파라미터는 보내지
// 않는다 (actor 는 서버 whoami 파생, REQ-20260824-027)
const withAs = body => asUser ? {...body, as: asUser} : body;

// 쓰기 공통 — 결과 객체 반환 (팝업 없음). 인라인 표시가 필요한 폼은 이걸 직접 쓴다.
async function postJSONRaw(url, body){
  try{
    const r = await fetch(url, {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(withAs(body))});
    const d = await r.json();
    if (!d.ok) return {ok: false, refused: true, error: d.error || `HTTP ${r.status}`};
    return {ok: true};
  }catch(e){ return {ok: false, error: "서버에 연결할 수 없습니다"}; }
}

async function postJSON(url, body){
  const res = await postJSONRaw(url, body);
  if (!res.ok) alert(res.refused ? "거부: " + res.error : res.error);
  return res.ok;
}

let settingsSection = "display";  // display | account | users

  const SECTIONS = [
    ["display", "디스플레이", "스킨·톤·밀도 (내 계정에 저장)"],
    ["account", "내 계정", me
      ? `@${me} 프로필·개인화${myMiss.length ? ` ⚠ 미기재 ${myMiss.length}` : ""}`
      : "미등록 계정"],
    ["users", "사용자 관리", meAdmin ? "등록·역할·시점 미리보기 (admin)" : "admin 전용"],
    ["about", "시스템", "저장소·통계·문서 안내"],
  ];
  $("#count").textContent = `Settings — ${me ? "@"+me : "미등록 계정"}`;
  const nav = SECTIONS.map(([k, label, sub]) =>
    `<div class="row${k===settingsSection?" sel":""}" data-sset="${k}">
      <div>${esc(label)}</div><div class="path">${esc(sub)}</div></div>`).join("");
  $("#view").innerHTML = `<div class="docs">
    <div class="doclist"><div class="grp">설정</div>${nav}
      <a class="row" href="/guide.html" target="_blank" style="display:block;text-decoration:none"><div>가이드 열기</div><div class="path">/guide.html — 사용자 안내서</div></a></div>
    <div class="viewer" id="sview"></div></div>`;
  renderSettingsSection(meAdmin);
}

function renderSettingsSection(meAdmin){

    el.classList.toggle("sel", el.dataset.sset === settingsSection));

    const cur = {};
    UI_DIMS.forEach(d => cur[d.attr] = document.documentElement.dataset[d.attr] || d.def);
    const rows = UI_DIMS.map(d => `<tr><td>${esc(d.label)}</td><td>
      <select class="uf" data-dim="${d.attr}">
        ${d.opts.map(([val,txt]) => `<option value="${esc(val)}"${val===cur[d.attr]?" selected":""}>${esc(txt)}</option>`).join("")}
      </select></td></tr>`).join("");
    v.innerHTML = `<h1 style="margin:0 0 4px">디스플레이</h1>
      <div class="path">${me ? `@${me} 계정에 저장 — 다른 기기에서도 적용됩니다.` : "미등록 계정 — s9 user add 로 등록하면 계정에 저장되어 기기 간 동기화됩니다. 지금은 이 브라우저에만 저장."}</div>

    // 각 select에 change 바인딩 — render() 없이 값만 적용(재렌더로 select 파괴되던 버그 수정).
    // skin/density는 다른 탭 레이아웃에 영향 → Settings에 머무는 동안엔 즉시 CSS 반영으로 충분.
    v.querySelectorAll("select[data-dim]").forEach(sel => {
      sel.addEventListener("change", async () => {
        const d = UI_DIMS.find(x => x.attr === sel.dataset.dim);
        await setUIDim(d, sel.value);
      });
    });
  } else if (settingsSection === "account"){
    if (!me){ v.innerHTML = `<p class="empty">이 OS 계정(${esc((window.__whoami||{}).user||"?")})은 미등록입니다 — 터미널에서 <code>s9 user add ${esc((window.__whoami||{}).user||"&lt;이름&gt;")}</code> 으로 등록하세요. 다른 이름의 기존 계정에 연결하려면 <code>s9 user attach &lt;이름&gt;</code>.</p>`; return; }
    const u = (window.__users||[]).find(x => x.name === me);
    if (u) showUserForm(u, v, false);
  } else if (settingsSection === "users"){
    if (!meAdmin){ v.innerHTML = `<p class="empty">사용자 관리는 admin만 가능합니다. (whoami=${esc((window.__whoami||{}).user||"?")})</p>`; return; }
    const list = (window.__users||[]).map(u => `<div class="urow" data-uname="${esc(u.name)}">
        <span class="st">${esc(u.role)}</span> <b>${esc(u.display||u.name)}</b>
        <span class="path">@${esc(u.name)} · ${esc((u.registered||"").slice(0,10))}</span>${
          profileMissing(u).length ? `<span class="pbadge" title="프로필 미기재: ${esc(profileMissing(u).join(" · "))}">⚠</span>` : ""}</div>`).join("");
    v.innerHTML = `<h1 style="margin:0 0 10px">사용자 관리</h1>
      <div class="ulist">${list}</div>
      <div class="cfg-h">새 사용자 등록</div>
      <div class="uform" style="max-width:340px">
        <input id="nu-name" type="text" placeholder="계정명 (영문/숫자/._-)">
        <input id="nu-display" type="text" placeholder="표시 이름 (선택)">
        <input id="nu-email" type="text" placeholder="email (선택)">
        <select id="nu-role"><option value="member">role: member</option>
          <option value="viewer">role: viewer</option><option value="admin">role: admin</option></select>
        <button id="nu-add">＋ 등록</button>
      </div>
      <div class="cfg-h">시점 미리보기 / 대리 (admin)</div>
      <div class="path">다른 사용자의 화면(열람 격리)을 그대로 보고, 그 사용자로 조작합니다. 저장되지 않으며 이 화면에서만 유효합니다.</div>
      <select id="as-user" class="uf">
        <option value="">(내 시점 — 미리보기 해제)</option>
        ${(window.__users||[]).filter(x => x.name !== me).map(x =>
          `<option value="${esc(x.name)}"${x.name===asUser?" selected":""}>@${esc(x.name)} [${esc(x.role)}] 시점으로 보기</option>`).join("")}
      </select>
      <div id="uedit" style="margin-top:20px"></div>`;
    $("#as-user").addEventListener("change", e => {
      asUser = e.target.value;
      onViewerChanged();
    });
    $("#nu-add").addEventListener("click", async () => {
      const name = $("#nu-name").value.trim();
      if (!name){ alert("계정명을 입력하세요"); return; }
      if (await postJSON("/api/user/add", {name, display: $("#nu-display").value.trim(),
          email: $("#nu-email").value.trim(), role: $("#nu-role").value}))
        renderSettings();
    });
    v.querySelectorAll("[data-uname]").forEach(el => el.addEventListener("click", () => {
      const u = (window.__users||[]).find(x => x.name === el.dataset.uname);
      if (u) showUserForm(u, $("#uedit"), true);
    }));
  } else if (settingsSection === "about"){
    const c = catalog;
    const byType = {}, byStatus = {};
    c.forEach(r => { byType[r.type]=(byType[r.type]||0)+1;
      if(r.type==="request") byStatus[r.status]=(byStatus[r.status]||0)+1; });
    v.innerHTML = `<h1 style="margin:0 0 10px">시스템</h1>
      <table class="metatbl">
        <tr><td>저장소</td><td class="path">~/section9 (로컬 md + git 동기화)</td></tr>
        <tr><td>문서 수</td><td>${c.length} — request ${byType.request||0}, knowledge ${byType.knowledge||0}, session ${byType.session||0}</td></tr>
        <tr><td>요청 상태</td><td>${Object.entries(byStatus).map(([k,n])=>`${k} ${n}`).join(" · ")||"(없음)"}</td></tr>
        <tr><td>등록 사용자</td><td>${(window.__users||[]).map(u=>`@${esc(u.name)}[${esc(u.role)}]`).join(" ")||"(없음)"}</td></tr>
      </table>
      <div class="cfg-h">설계 문서</div>
      <div class="path" style="line-height:1.9">
        docs/00~11 (개요·포맷·인덱스·상태머신·검색·대시보드·audit·사용자·git·설치/인가·부트스트랩·Windows)<br>
        harness/README.md (멀티 하네스) · harness/claude/agents/README.md (에이전트 26종)<br>
        CLI: <code>s9 digest / ls / search --body / show / status / note / serve / shot</code>
      </div>
      <div class="cfg-h">이 대시보드</div>
      <div class="path" style="line-height:1.9">
        읽기 = 자유, 쓰기 = 상태 전이만(CLI와 동일 함수 경유, History에 [via dashboard]).<br>
        탭/문서/설정 이동은 URL 해시로 기록되어 브라우저 뒤로가기·딥링크 지원.
      </div>`;

// 프로필+config 편집 폼 (account 섹션: 본인 / users 섹션: admin이 타인 편집)
function showUserForm(u, host, isAdminEdit){
  if (!host) return;
  const cfg = u.config || {};
  const prefs = Object.entries(cfg).filter(([k]) => k.startsWith("pref_"));
  const extraCfg = Object.entries(cfg).filter(([k]) =>
    !["timezone","digest_budget","ui_skin","ui_tone","ui_density"].includes(k) && !k.startsWith("pref_"));
  // 회사 이메일: emails[] 우선, 비어 있으면 legacy email 단수를 시드(저장 시 emails로 이관)
  const seedEmails = (u.emails && u.emails.length) ? u.emails : (u.email ? [u.email] : []);
  const emRowHTML = val => `<div class="emrow">
      <input class="uf em-val" value="${esc(val)}" placeholder="name@company.com">
      <button type="button" class="em-rm" title="이 이메일 행 삭제">− 삭제</button></div>`;
  const reqhint = `<span class="reqhint">필수 권장 — 미기재</span>`;
  host.innerHTML = `
    <div class="path">users/${esc(u.name)}/profile.md · 등록 ${esc((u.registered||"?").slice(0,16))} @ ${esc(u.registered_on||"?")}</div>
    <h1 style="margin:6px 0 14px">@${esc(u.name)}</h1>
    <table class="metatbl">
      <tr><td>display</td><td><input class="uf" id="uf-display" value="${esc(u.display)}"></td></tr>
      <tr><td>회사 이메일</td><td id="uf-emails">
        ${seedEmails.map(em => emRowHTML(em)).join("")}
        <button type="button" class="em-add" id="uf-em-add">＋ 이메일 추가</button>${seedEmails.length ? "" : reqhint}
        <div class="path">회사 이메일 N개 — 빈 행은 저장 시 제외됩니다</div></td></tr>
      <tr><td>github (개인)</td><td><input class="uf" id="uf-github" value="${esc(u.github||"")}" placeholder="개인 GitHub 계정명">${u.github ? "" : reqhint}</td></tr>
      <tr><td>github (조직)</td><td><input class="uf" id="uf-github-org" value="${esc(u.github_org||"")}" placeholder="조직 GitHub 계정/org">${u.github_org ? "" : reqhint}</td></tr>
      <tr><td>role</td><td><select class="uf" id="uf-role">
        ${["admin","member","viewer"].map(r => `<option${r===u.role?" selected":""}>${r}</option>`).join("")}
      </select> <span class="path">변경은 admin만</span></td></tr>
    </table>
    <div class="acts"><button id="uf-save">프로필 저장</button><span class="ferr" id="uf-err"></span></div>
    <div class="cfg-h">개인화 설정 — config/settings.json</div>
    <table class="metatbl">
      <tr><td>timezone</td><td><input class="uf" id="cf-timezone" placeholder="Asia/Seoul" value="${esc(cfg.timezone||"")}"></td></tr>
      <tr><td>digest_budget</td><td><input class="uf" id="cf-digest_budget" placeholder="2500" value="${esc(cfg.digest_budget||"")}"></td></tr>
      <tr><td><input class="uf" id="cf-key" placeholder="임의 키" style="width:130px"></td>
          <td><input class="uf" id="cf-val" placeholder="값 (빈 값=삭제)"></td></tr>
    </table>
    <div class="acts"><button id="cf-save">설정 저장</button></div>
    <div class="cfg-h">개인 선호 — 리드 에이전트의 말투·작업 방식 (매 턴 자동 반영, REQ-20260824-006)</div>
    <table class="metatbl" id="pf-table">
      ${prefs.map(([k, v]) => `<tr data-pref="${esc(k)}">
        <td>${esc(k.slice(5))}</td>
        <td><input class="uf pf-val" value="${esc(String(v))}" placeholder="비우고 저장 = 삭제"></td>
      </tr>`).join("")}
      <tr><td><input class="uf" id="pf-key" placeholder="주제 (예: 말투)" style="width:130px"></td>
          <td><input class="uf" id="pf-new" placeholder="내용 (예: 반말로 간결하게)"></td></tr>
    </table>
    <div class="acts"><button id="pf-save">선호 저장</button></div>
    ${prefs.length ? "" : `<div class="path" style="margin-top:6px">아직 없음 — 프롬프트에서 말해도 되고("앞으로 반말로 해줘") 여기서 직접 추가해도 된다.</div>`}
    ${extraCfg.length ? `<div class="path" style="margin-top:12px">기타: ${esc(JSON.stringify(Object.fromEntries(extraCfg)))}</div>` : ""}
    <div class="path" style="margin-top:16px">변경은 profile.md Notes에 audit + git 동기화. 본인 또는 admin만 수정.</div>`;
  // 이메일 행 추가/삭제 — DOM만 조작(재렌더 없음 → 다른 입력값 보존)
  host.querySelector("#uf-emails").addEventListener("click", e => {
    if (e.target.classList.contains("em-rm")) e.target.closest(".emrow").remove();
  });
  host.querySelector("#uf-em-add").addEventListener("click", () => {
    host.querySelector("#uf-em-add").insertAdjacentHTML("beforebegin", emRowHTML(""));
    const rows = host.querySelectorAll("#uf-emails .em-val");
    rows[rows.length - 1].focus();
  });
  host.querySelector("#uf-save").addEventListener("click", async () => {
    const errEl = host.querySelector("#uf-err");
    errEl.textContent = "";
    const emails = [...host.querySelectorAll("#uf-emails .em-val")]
      .map(i => i.value.trim()).filter(Boolean);
    const body = {name: u.name, display: host.querySelector("#uf-display").value.trim(),
                  emails,  // legacy email 단수는 더 보내지 않음 — 서버는 미전달 필드 무변경
                  github: host.querySelector("#uf-github").value.trim(),
                  github_org: host.querySelector("#uf-github-org").value.trim()};
    const nr = host.querySelector("#uf-role").value;
    if (nr !== u.role) body.role = nr;
    const res = await postJSONRaw("/api/user/update", body);
    if (!res.ok){ errEl.textContent = "✕ " + res.error; return; }  // 인라인 — 팝업 금지
    renderSettings();
  });
  host.querySelector("#cf-save").addEventListener("click", async () => {
    const sets = [["timezone", $("#cf-timezone").value.trim()],
                  ["digest_budget", $("#cf-digest_budget").value.trim()]];
    const ck = $("#cf-key").value.trim();
    if (ck) sets.push([ck, $("#cf-val").value.trim()]);
    let ok = true;
    for (const [k, val] of sets){
      if (val === String(cfg[k] ?? "")) continue;
      ok = (await postJSON("/api/user/config", {name: u.name, key: k, value: val})) && ok;
    }
    if (ok) renderSettings();
  });
  host.querySelector("#pf-save").addEventListener("click", async () => {
    const sets = [];
    host.querySelectorAll("#pf-table tr[data-pref]").forEach(tr => {
      const k = tr.dataset.pref, val = tr.querySelector(".pf-val").value.trim();
      if (val !== String(cfg[k] ?? "")) sets.push([k, val]);  // 빈 값 = 서버가 삭제
    });
    const nk = host.querySelector("#pf-key").value.trim();
    if (nk) sets.push(["pref_" + nk.replace(/^pref_/, ""),
                       host.querySelector("#pf-new").value.trim()]);
    let ok = true;
    for (const [k, val] of sets)
      ok = (await postJSON("/api/user/config", {name: u.name, key: k, value: val})) && ok;
    if (ok && sets.length) renderSettings();
  });
}

/* ---------------- drag & drop 상태 전이 ---------------- */
document.addEventListener("dragstart", e => {
  const c = e.target.closest('.card[draggable="true"]');
  if (!c) return;
  e.dataTransfer.setData("text/plain",
    JSON.stringify({id: c.dataset.doc, from: c.dataset.status}));
  e.dataTransfer.effectAllowed = "move";
  window.__dragFrom = c.dataset.status;
});
document.addEventListener("dragend", () => {
  window.__dragFrom = null;
  document.querySelectorAll(".col.dropok").forEach(el => el.classList.remove("dropok"));
});
document.addEventListener("dragover", e => {
  const col = e.target.closest(".col[data-colstatus]");
  document.querySelectorAll(".col.dropok").forEach(el => el.classList.remove("dropok"));
  if (!col || !window.__dragFrom) return;
  if ((TRANS[window.__dragFrom] || []).includes(col.dataset.colstatus)){
    e.preventDefault();  // 허용 전이 컬럼만 drop 가능
    col.classList.add("dropok");
  }
});
document.addEventListener("drop", e => {
  const col = e.target.closest(".col[data-colstatus]");
  if (!col) return;
  e.preventDefault();
  try{
    const d = JSON.parse(e.dataTransfer.getData("text/plain"));
    const to = col.dataset.colstatus;
    if (d.id && d.from !== to && (TRANS[d.from] || []).includes(to))
      postStatus(d.id, to, "drag 이동");
  }catch(err){}
});

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn){
    tab = tabBtn.dataset.tab;
    if (tab === "audit") auditCache = null;
    document.querySelectorAll("[data-tab]").forEach(b =>
      b.classList.toggle("active", b === tabBtn));
    pushRoute();
    render();
    refreshCatalog(true);
    return;
  }
  const gt2 = e.target.closest("[data-gtype]");
  if (gt2){
    const t = gt2.dataset.gtype;
    gtypes.has(t) ? gtypes.delete(t) : gtypes.add(t);
    if (!gtypes.size) gtypes.add("request");  // 전부 끄면 무의미 — 최소 1종 유지
    try{ localStorage.setItem("s9gtypes", JSON.stringify([...gtypes])); }catch(e){}
    render(); return;
  }
  const gl = e.target.closest("[data-glayout]");
  if (gl){
    graphLayout = gl.dataset.glayout;
    try{ localStorage.setItem("s9glayout", graphLayout); }catch(e2){}
    graphTf = null;  // 레이아웃 전환 시 뷰 리셋
    render();
    return;
  }
  const gt = e.target.closest("[data-goto]");
  if (gt){
    const [id, to, from] = gt.dataset.goto.split("|");
    // review에서 되돌리는(반려성) 전이는 사유 필수 — Board와 일관성
    if (from === "review" && (to === "in-progress" || to === "blocked")){
      rejectWithReason(id); return;
    }
    if (to === "cancelled" && !confirm(`${id} 를 cancelled 로 전이합니다. 계속할까요?`)) return;
    const note = prompt(`${id} → ${to}\n메모 (선택, History에 기록):`, "");
    if (note === null) return;
    postStatus(id, to, note || "");
    return;
  }
  const ap = e.target.closest("[data-approve]");
  if (ap){
    // 승인: 메모는 선택 (비우고 확인해도 done)
    const memo = prompt(`${ap.dataset.approve} 승인 → done\n메모 (선택, 비워도 됨):`, "");
    if (memo === null) return;  // 취소
    postStatus(ap.dataset.approve, "done", memo ? "승인: " + memo : "대시보드 승인");
    return;
  }
  const rj = e.target.closest("[data-reject]");
  if (rj){ rejectWithReason(rj.dataset.reject); return; }
  const sf = e.target.closest("[data-statf]");
  if (sf){
    window.__statusFilter = window.__statusFilter === sf.dataset.statf ? "" : sf.dataset.statf;
    render(); return;
  }
  // MY PROJECTS 스트립 행: 클릭 = 단일 프로젝트 선택, 선택 행 재클릭 = 합집합(all) 복귀
  const mr = e.target.closest("[data-mine-slug]");
  if (mr){
    const el = $("#f-project");
    el.value = el.value === mr.dataset.mineSlug ? "" : mr.dataset.mineSlug;
    auditLimit = AUDIT_PAGE;
    render(); return;
  }
  const ex = e.target.closest("[data-expand]");
  if (ex){
    const k = ex.dataset.expand;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    render(); return;
  }
  if (e.target.closest("[data-audit-more]")){
    auditLimit += AUDIT_PAGE; render(); return;
  }
  const st = e.target.closest("[data-stream]");
  if (st){ selectedStream = st.dataset.stream; pushRoute(); loadStream(st.dataset.stream); return; }
  const ss = e.target.closest("[data-sset]");
  if (ss){ settingsSection = ss.dataset.sset;
    const meAdmin = isAdmin();
    document.querySelectorAll("[data-sset]").forEach(el => el.classList.toggle("sel", el === ss));
    pushRoute(); renderSettingsSection(meAdmin); return; }
  const rd = e.target.closest("[data-retrydoc]");
  if (rd){ loadDoc(rd.dataset.retrydoc); return; }
  const doc = e.target.closest("[data-doc]");
  if (doc){
    selectedDoc = doc.dataset.doc;
    if (tab !== "docs"){
      tab = "docs";
      document.querySelectorAll("[data-tab]").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === "docs"));
      pushRoute();
      render();
    } else { pushRoute(); loadDoc(selectedDoc); }
  }
});
["#q","#q-body","#f-user","#f-project","#f-tag","#f-type"].forEach(s =>
