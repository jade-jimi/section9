        return `<div class="dsblk">${dot(b.status)}${dlink(b.id, esc(shortId(b.id)))}
          <span class="ti">${esc(b.title)}</span>
          <span class="dsmeta"><span class="st" style="color:${SCOLOR[b.status] || "var(--muted)"}">${esc(b.status)}</span><span
            class="num" title="선행이 현재 상태로 머문 시간">${esc(fmtElapsed(b.status_since) || "-")}</span>${
            mark ? `<span class="dshold" title="이 선행이 지금 붙잡고 있는 요청 수">${held}건 붙잡음</span>` : ""}</span></div>`;
      }).join("")}
    </div>`).join("");
  return `<aside class="depsum" id="depsum">
    <div class="dshead"><span>선행 대기 현황</span>
      <span class="dscount">${d.groups.length}건이 막혀 있다</span>${scope}</div>
    ${lead}
    <div class="dslegend">막힌 요청 <i>↳ 기다리는 선행</i></div>
    <div class="dsbody" tabindex="0" role="group" aria-label="선행 대기 목록">${body}</div>
    ${hidden > 0 ? `<button class="more" data-depmore>${hidden}개 더 보기</button>`
      : (open && d.groups.length > DEP_ROWS ? `<button class="more" data-depmore>접기</button>` : "")}

}
const linkifyIds = escaped => escaped.replace(
  DOC_ID_INLINE_RE,
  (mm, pre, id) => `${pre}` + dlink(id, esc(shortId(id))));

// 확인 포인트/대기 사유를 갈래로 끊어 렌더한다 (DOC-20260826-015).
// 전이 note 는 대개 "① … ② … ③ …" 또는 "(1) … (2) …" 로 여러 갈래를 한
// 문단에 욱여넣는다 — 한 덩어리로 흘리면 몇 개를 판단해야 하는지조차 세어야
// 한다. 원문은 치환하지 않는다: 번호 앞에서 자르기만 한다.
// 규칙 셋 — ① escape 를 분할보다 먼저 (순서가 뒤집히면 note 본문이 HTML로
// 샌다) ② lookbehind 금지 (구형 엔진에서 스크립트를 통째로 죽인다)
// ③ 번호가 1,2,3… 순서일 때만 갈래로 본다 (문장 속 "테스트 (3) 건"에
// 끊기면 안 된다). 계약: tests/test_review_context.py
function gateNote(note){
  const CN = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
  const src = esc(note);
  const marks = [0];
  for (let i = 1; i < src.length; i++){
    if (/[①-⑳]/.test(src[i]) || /^\s\(\d{1,2}\)\s/.test(src.slice(i, i + 6))) marks.push(i);
  }
  marks.push(src.length);
  const parts = [];
  for (let k = 0; k < marks.length - 1; k++){
    const s = src.slice(marks[k], marks[k + 1]).trim();
    if (s) parts.push(s);
  }
  const num = s => {
    const c = CN.indexOf(s.charAt(0));
    if (c >= 0) return c + 1;
    const t = /^\((\d{1,2})\)/.exec(s);
    return t ? +t[1] : 0;
  };
  const marked = parts.map(num).filter(n => n);
  const split = marked.length > 1 && marked.every((n, i) => n === i + 1);
  const wrap = s => `<div class="gate-p">` + linkifyIds(s) + `</div>`;
  return split ? parts.map(wrap).join("") : wrap(src);
}

// 경과시간 포맷: <60s=Ns, <60m=Mm Ss, <24h=Hh Mm, 그 이상=Dd Hh
function fmtElapsed(sinceIso){
  if (!sinceIso) return "";
  const t = Date.parse(sinceIso);
  if (isNaN(t)) return "";
  let s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 60) return `${m}m ${s % 60}s`;
  if (h < 24) return `${h}h ${m % 60}m`;
  return `${d}d ${h % 24}h`;
}
let elapsedTimer = null;  // 카드 경과시간 1초 갱신 (화면 이탈 시 정리)
function tickElapsed(){
  if (document.hidden) return;
  document.querySelectorAll(".elapsed[data-since]").forEach(el => {
    el.textContent = fmtElapsed(el.dataset.since);
  });
}

function isDarkTheme(){
  // skin이 자체 필드 색을 가질 수 있으므로 tone 추론이 아니라 실제 --bg 휘도로 판정 (스킨 무관 구조 개선 — 유지)
  const v = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = v.match(/^#([0-9a-f]{6})$/i);
  if (m){
    const n = parseInt(m[1], 16);
    return 0.2126*(n>>16&255) + 0.7152*(n>>8&255) + 0.0722*(n&255) < 128;
  }
  const t = document.documentElement.dataset.theme || "system";
  if (t === "carbon" || t === "phosphor") return true;
  if (t === "paper") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}

// 현재 각 축의 적용값 (me config > localStorage > 기본). documentElement에 반영.
function currentUIValue(d, userCfg){
  let v = d.def;
  try{ if (localStorage.getItem(d.key)) v = localStorage.getItem(d.key); }catch(e){}
  if (userCfg && userCfg[d.cfg]) v = userCfg[d.cfg];
  const ren = UI_RENAMED[d.attr];
  if (ren && ren[v]) v = ren[v];
  if (!d.opts.some(([val]) => val === v)) v = d.def;
  return v;
}
function applyUISettings(userCfg){
  for (const d of UI_DIMS){
    let v = currentUIValue(d, userCfg);
    // ?skin=·?theme=·?density= — 검증(s9 shot)·공유용 일회성 오버라이드. 저장 경로에는 불관여.
    try{
      const ov = new URLSearchParams(location.search).get(d.attr);
      if (ov && d.opts.some(([val]) => val === ov)) v = ov;
    }catch(e){}
    document.documentElement.dataset[d.attr] = v;
  }
}

// 한 축 변경 저장: dataset 즉시 반영(CSS 자동) + localStorage + (등록 계정이면) 계정 config.

async function setUIDim(d, v){

  if (me) await postJSON("/api/user/config", {name: me, key: d.cfg, value: v});

/* 신원 = 서버 파생 whoami (REQ-20260824-027) — me 셀렉터·localStorage s9me 폐기.

/* ── 서버 코드 낡음 (REQ-20260826-011-62x6) ────────────────────────────────
   구동 중인 serve 프로세스는 기동 시점의 bin/s9 를 그대로 물고 있다. 화면은
   디스크에서 매번 읽히니 UI만 새로 보이고 서버 동작은 낡은 채 남는다 — 이
   어긋남이 실제로 12시간 지속됐다(테스트는 디스크 코드를 직접 돌려 전부 통과).
   **자동 재기동은 하지 않는다**: 재기동은 진행 중 요청과 SSE 를 끊는다. 화면은
   사실과 명령까지만 주고 판단은 사람이 한다.
   용어 주의: 터미널 뷰의 "stale" 은 **세션 무응답**을 뜻한다. 코드 낡음은 다른
   사실이라 문구·식별자를 oldcode 로 갈랐다 — 두 경고가 같은 말을 쓰면 어느
   쪽도 못 믿게 된다. */
const OC_ACK = "s9oldcode_ack";   // 접어둔 서버 기동 시각 — 그 서버가 살아 있는 동안만 유효
// ?oldcode=1: 진단·헤드리스 캡처용 상태 고정 (?guard·?conn·?nosse 선례). 이 알림도
// 서버가 낡아야만 보이는데 그 상황은 캡처로 만들 수 없다 — 두 알림이 같이 떴을 때
// 헤더가 얼마나 먹는지를 눈으로 재려면 훅이 필요하다 (REQ-20260827-017-62x6).
const OC_FORCE = /[?&]oldcode=1/.test(location.search);
let ocInfo = null, ocSig = "", ocCopyT = null;

const ocAck = () => { try{ return localStorage.getItem(OC_ACK); }catch(e){ return null; } };
const ocSetAck = v => { try{
  if (v) localStorage.setItem(OC_ACK, v); else localStorage.removeItem(OC_ACK);
}catch(e){} };

async function checkOldCode(){
  let d = null;
  try{
    const r = await fetch("/api/serveinfo", {cache: "no-store"});
    if (r.ok) d = await r.json();
  }catch(e){}
  if (OC_FORCE) d = {started: new Date(Date.now() - 4.2e6).toISOString(), stale: true};
  // 무응답은 "코드 낡음"이 아니다 — 재기동 중일 수도 있다. 서버 단절 표시는
  // 터미널 뷰가 따로 한다. 여기서는 직전 판정을 그대로 두고 다음 폴을 기다린다.
  if (!d || typeof d.stale !== "boolean") return;
  ocInfo = d;
  renderOldCode();
}

function renderOldCode(){
  const el = $("#oldcode");
  if (!el) return;
  const d = ocInfo;
  // 낡지 않았으면 흔적을 남기지 않는다. 상시 자리표시자를 두면 곧 안 읽힌다.
  if (!d || !d.stale){
    ocSetAck(null);
    if (ocSig !== "off"){
      ocSig = "off"; el.hidden = true; el.innerHTML = ""; renderSvChip();
    }
    return;
  }
  const folded = ocAck() === d.started;
  const sig = d.started + "|" + folded;
  if (sig === ocSig) return;   // 같은 내용 재작성 금지 (aria-live 재낭독·복사 피드백 소실)
  ocSig = sig;
  renderSvChip();
  if (folded){
    // 접으면 줄이 사라진다 — 사실은 브랜드 행의 서버 상태 칩으로 내려간다
    // (REQ-20260827-017). 줄을 남긴 채 글자만 줄이면 접기 버튼이 거짓말이 된다.
    el.hidden = true; el.innerHTML = "";
    return;
  }
  el.hidden = false;
  const at = String(d.started || "").slice(11, 16);
  el.innerHTML = `<span class="oc-t"><span class="oc-mark" aria-hidden="true">▲</span>`
    + ` 서버가 옛 코드로 돌고 있습니다</span>`
    + `<span class="oc-d">${at ? esc(at) + " 기동 이후 " : ""}<code>bin/s9</code> 가 바뀌었습니다`
    + ` — 서버 쪽 변경은 재기동해야 동작합니다.</span>`
    + `<span class="oc-act">`
    +   `<span class="oc-note">재기동은 진행 중 요청·실시간 연결을 끊습니다</span>`
    +   `<button class="oc-cmd" id="oc-cmd" title="클릭하면 복사됩니다 — 터미널에 붙여넣어 실행하세요">`
    +     `s9 serve --restart</button>`
    +   `<span class="oc-copied" id="oc-copied" role="status"></span>`
    +   `<button class="oc-fold" id="oc-fold" title="이 서버가 재기동될 때까지 한 줄로 접어 둡니다">접기</button>`
    + `</span>`;
  $("#oc-cmd").addEventListener("click", ocCopyCmd);
  $("#oc-fold").addEventListener("click", () => {
    ocSetAck((ocInfo || {}).started || "1");
    renderOldCode();
  });
}

// 명령은 대신 실행하지 않는다 — 복사까지가 화면의 몫이다.
async function ocCopyCmd(){
  const cmd = "s9 serve --restart", out = $("#oc-copied");
  let ok = false;
  try{ await navigator.clipboard.writeText(cmd); ok = true; }catch(e){}
  if (!ok){        // 클립보드 API가 막힌 브라우저 — 선택 상태로라도 넘겨준다
    try{
      const ta = document.createElement("textarea");
      ta.value = cmd; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    }catch(e){}
  }
  if (!out) return;
  out.textContent = ok ? "복사됨" : "복사 실패";
  out.style.color = ok ? "" : "var(--c-blocked)";
  clearTimeout(ocCopyT);
  ocCopyT = setTimeout(() => { out.textContent = ""; out.style.color = ""; }, 2000);
}

/* ── 서버 자동 복구 (REQ-20260826-018-62x6) ────────────────────────────────
   감시자(REQ-20260825-096)는 죽은 서버를 되살릴 때마다 사유·직전 출력·연속
   실패 횟수·되살리기까지의 대기를 기록으로 남긴다. 그런데 그걸 보려면 파일을
   열어야 했다 — 대시보드가 왜 죽었나는 대시보드 안에서 답해야 하는 질문이다.

   설계 판단 셋:
   ① 상시 표시하지 않는다. 평소엔 아무 일도 없고, 늘 떠 있는 줄은 곧 배경이
      되어 진짜 사고 때도 안 읽힌다. 사건이 있을 때만 나타나고 잠잠해지면
      스스로 걷힌다(GW_FRESH_*). 걷히는 것까지가 설계다.
   ② 신선도는 서버 시각으로 잰다. 기록의 시각은 전부 서버 것이므로 기준도
      서버가 준 now 여야 한다 — 브라우저 시계가 틀어진 기기에서 6시간 전
      사고가 방금이 되면 안 된다.
   ③ 무응답을 사건 없음으로 읽지 않는다. 서버가 죽어 있는 동안 이 폴은
      실패하는데, 그 순간이야말로 이 알림이 존재하는 이유다. 실패하면 직전
      판정을 그대로 두고 다음 폴을 기다린다.

   어휘: 위 코드 낡음 알림은 사람이 하는 재기동을 말한다. 여기는 감시자가 하는
   자동 복구다. 터미널 뷰의 stale 은 세션 무응답이라는 또 다른 사실이라 그
   단어도 쓰지 않는다 — 셋이 같은 말을 쓰면 어느 것도 못 믿게 된다. */
const GW_ACK = "s9guard_ack";        // 접어 둔 사건 — 새 사건이 나면 다시 펼쳐진다
const GW_FRESH_OK = 6 * 3600 * 1000;    // 되살아난 사건을 말해 주는 기간
const GW_FRESH_BAD = 24 * 3600 * 1000;  // 자동 복구가 멈춘 사실을 말해 주는 기간
const GW_ROWS = 8;                   // 기록 표시 제한 (무한 목록 금지)
// 기록의 종류를 사용자 말로 옮긴다 — 원래 값을 그대로 보여주면 기록이 아니라 암호다
const GW_EV = {start:"감시 시작", died:"멈춤", "clean-exit":"정상 종료",
               "gave-up":"감시 포기", "spawn-error":"기동 실패",
               "guard-error":"감시자 오류", stop:"감시 중지", end:"감시 종료"};
const GW_SEV = {died:"bad", "gave-up":"bad", "spawn-error":"bad",
                "guard-error":"bad", start:"on", "clean-exit":"ok"};
// ?guard=recovered|attention|none: 진단·헤드리스 캡처용 상태 고정. 이 알림은
// 사고가 나야만 보이는데 사고는 캡처로 재현할 수 없다 (?nosse·?mpanel·?conn 선례)
const GW_FORCE =
  (location.search.match(/[?&]guard=(recovered|attention|none)/) || [])[1] || null;

let gwInfo = null, gwSig = "", gwOpen = false, gwAll = false, gwCopyT = null;
let gwOut = new Set();               // 펼쳐 둔 직전 출력

const gwAck = () => { try{ return localStorage.getItem(GW_ACK); }catch(e){ return null; } };
const gwSetAck = v => { try{
  if (v) localStorage.setItem(GW_ACK, v); else localStorage.removeItem(GW_ACK);
}catch(e){} };

async function checkGuard(){
  let d = null;
  try{
    const r = await fetch("/api/serveguard", {cache: "no-store"});
    if (r.ok) d = await r.json();
  }catch(e){}
  if (GW_FORCE) d = gwDemo(GW_FORCE);
  // 서버가 죽어 있는 동안 이 폴은 실패한다 — 그 실패를 사건 없음으로 읽으면
  // 알림은 정확히 필요한 순간에 침묵한다. 직전 판정을 두고 다음 폴을 기다린다.
  if (!d || typeof d.now !== "string") return;
  gwInfo = d;
  renderGuard();
}

// 사건이 얼마나 지났는지는 서버 시각으로 잰다 (설계 판단 ②).
function gwState(d){
  if (!d || !d.last_death || !d.last_death.ts) return null;
  const age = Date.parse(d.now) - Date.parse(d.last_death.ts);
  if (!(age >= 0)) return null;
  // 감시자가 물러났으면 다음 사망은 아무도 되살리지 않는다 — 사람의 손이 필요하다.
  if (d.guard !== "watching") return age < GW_FRESH_BAD ? "attention" : null;
  return age < GW_FRESH_OK ? "recovered" : null;
}

function renderGuard(){
  const el = $("#guard"), log = $("#guard-log");
  if (!el || !log) return;
  const d = gwInfo, st = gwState(d);
  // 말할 것이 없으면 흔적을 남기지 않는다 (설계 판단 ①).
  if (!st){
    gwSetAck(null);
    if (gwSig !== "off"){
      gwSig = "off"; gwOpen = false; gwAll = false; gwOut.clear();
      el.hidden = true; el.innerHTML = "";
      log.hidden = true; log.innerHTML = "";
      renderSvChip();
    }
    return;
  }
  const ev = d.last_death;
  /* 헤더 줄은 **사람의 손을 요구하는 사실**에만 준다 (REQ-20260827-017-62x6).
     자동 복구가 성공한 것은 이미 끝난 일이라 읽고 나서 할 일이 없다 — 자주
     복구되는 서버일수록 그 줄은 사실상 상시 표시가 되어 아래의 보드를 밀어낸다.
     그래서 성공은 브랜드 행의 상태 칩 한 자리로 말하고, "왜 죽었나"의 답은 기록
     패널이 한다. 그 사이의 한 줄 요약은 칩과 기록 둘 다와 겹치는 잉여였다.
     접어 둔 경고도 줄을 비운다 — 줄이 남으면 접기 버튼이 거짓말이 된다. */
  const line = st === "attention" && gwAck() !== ev.ts;
  const sig = [st, ev.ts, line, gwOpen, gwAll, [...gwOut].join()].join("|");
  if (sig === gwSig) return;   // 같은 내용 재작성 금지 (aria-live 재낭독·복사 피드백 소실)
  gwSig = sig;
  renderSvChip();
  el.hidden = !line;
  el.innerHTML = "";
  if (line){
    const at = String(ev.ts || "").slice(11, 16);
    // 사유는 괄호로 붙인다. 값이 signal SIGTERM 이기도 exit 1 이기도 해서 뒤에
    // 조사를 붙이면(로/으로) 어느 한쪽이 반드시 어긋난다.
    const why = ev.reason ? ` (<code>${esc(ev.reason)}</code>)` : "";
    let detail = (d.guard === "gave-up")
      ? `서버가 ${ev.fails || "여러"}번 잇따라 자리잡지 못해 감시자가 물러났습니다${why}.`
      : `${at} 에 멈춘 뒤로 서버를 지켜보는 것이 없습니다${why}.`;
    detail += " 지금 서버가 죽으면 다시 뜨지 않습니다.";
    el.innerHTML = `<span class="gw-t" style="color:var(--c-blocked)">`
      +   `<span class="gw-mark" aria-hidden="true">▲</span> 자동 복구가 멈췄습니다</span>`
      + `<span class="gw-d">${detail}</span>`
      + `<span class="gw-act">`
      +   `<button class="gw-cmd" id="gw-cmd"`
      +     ` title="클릭하면 복사됩니다 — 터미널에 붙여넣어 실행하세요">s9 serve --supervise</button>`
      +   `<span class="gw-copied" id="gw-copied" role="status"></span>`
      +   `<button class="gw-link" id="gw-log">${gwOpen ? "기록 닫기" : "기록 보기"}</button>`
      +   `<button class="gw-link" id="gw-fold"`
      +     ` title="다음 사건이 날 때까지 위쪽 상태 칩으로 접어 둡니다">접기</button>`
      + `</span>`;
    $("#gw-cmd").addEventListener("click", gwCopyCmd);
    $("#gw-log").addEventListener("click", () => { gwOpen = !gwOpen; renderGuard(); });
    $("#gw-fold").addEventListener("click", () => {
      gwSetAck(((gwInfo || {}).last_death || {}).ts || "1");
      renderGuard();
    });
  }
  log.hidden = !gwOpen;
  log.innerHTML = gwOpen ? gwLogHTML(d) : "";
  if (gwOpen) gwLogWire();
}

/* 서버 상태 칩 — 이 서버 자신에 대한 사실 중 **줄을 받지 못한 것**들의 자리
   (REQ-20260827-017-62x6). 이미 있는 브랜드 행 안이라 헤더가 높아지지 않는다.
   ① 자동 복구가 성공한 사실: 읽고 나서 할 일이 없다. 눌러서 기록으로 바로 간다.
   ② 접어 둔 경고(코드 낡음·자동 복구 멈춤): 눌러서 되펼친다. 접기가 줄을 실제로
      지우려면 접힌 사실이 갈 곳이 있어야 한다 — 되돌릴 수 없는 접기는 삭제다.
   말할 것이 없으면 비운다. 상시 자리표시자는 곧 배경이 되어 진짜 사고 때도
   안 읽힌다 — 018 이 세운 규칙을 칩에서도 그대로 지킨다. */
let svSig = "";
function renderSvChip(){
  const el = $("#sv-chip");
  if (!el) return;
  const items = [];
  const oc = ocInfo;
  if (oc && oc.stale && ocAck() === oc.started)
    items.push({tone: "sv-warn", mark: "▲", label: "서버 재기동 필요",
      title: "구동 중인 서버가 기동 시점 코드로 돌고 있습니다 — 눌러서 자세히",
      act: () => { ocSetAck(null); renderOldCode(); }});
  const d = gwInfo, st = gwState(d);
  if (st === "attention" && gwAck() === d.last_death.ts)
    items.push({tone: "sv-bad", mark: "▲", label: "자동 복구 멈춤",
      title: "지금 서버가 죽으면 다시 뜨지 않습니다 — 눌러서 자세히",
      act: () => { gwSetAck(null); renderGuard(); }});
  else if (st === "recovered"){
    const ev = d.last_death, at = String(ev.ts || "").slice(11, 16);
    items.push({tone: "sv-ok", mark: "↻",
      label: `자동 복구 ${Math.max(1, d.restarts || 1)}회`,
      title: `${at} 에 멈췄다가 `
        + (ev.retry_in ? `${ev.retry_in}초 뒤 ` : "곧 ") + "스스로 다시 떴습니다"
        + (ev.reason ? ` (${ev.reason})` : "") + " — 눌러서 기록 보기",
      act: () => { gwOpen = !gwOpen; renderGuard(); }});
  }
  // 같은 내용 재작성 금지 — aria-live 영역을 다시 쓰면 화면 낭독이 되풀이된다
  const sig = items.map(it => it.tone + it.label).join("|");
  if (sig === svSig) return;
  svSig = sig;
  if (!items.length){ el.innerHTML = ""; return; }
  el.innerHTML = items.map((it, i) =>
    `<button class="${it.tone}" data-svi="${i}" title="${esc(it.title)}">`
    + `<span class="sv-m" aria-hidden="true">${it.mark}</span> ${esc(it.label)}</button>`
  ).join("");
  el.querySelectorAll("[data-svi]").forEach(b =>
    b.addEventListener("click", () => items[+b.dataset.svi].act()));
}

function gwLogHTML(d){
  const evs = d.events || [];
  const head = `<div class="gw-h">서버 감시 기록`
    + (d.port ? ` <b>· 포트 ${esc(String(d.port))}</b>` : "")
    + `<button class="gw-link" id="gw-close">닫기</button></div>`;
  if (!evs.length) return head + `<p class="gw-none">아직 남은 기록이 없습니다.</p>`;
  const shown = gwAll ? evs : evs.slice(0, GW_ROWS);
  const rows = shown.map((e, i) => {
    const bits = [];
    if (e.reason) bits.push(`<code>${esc(e.reason)}</code>`);
    if (e.ran_sec != null) bits.push(`${Math.round(e.ran_sec)}초 살아 있었음`);
    if (e.fails > 1) bits.push(`잇따라 ${e.fails}번째`);
    if (e.retry_in) bits.push(`${e.retry_in}초 뒤 되살림`);
    const out = (e.tail || []).filter(Boolean);
    const key = e.ts + "#" + i;
    const open = gwOut.has(key);
    return `<div class="gw-row">`
      +   `<span class="gw-ts">${esc(String(e.ts || "").slice(11, 19))}</span>`
      +   `<span class="gw-ev ${GW_SEV[e.event] || ""}">${esc(GW_EV[e.event] || e.event || "")}</span>`
      +   `<span class="gw-det">${bits.join(" · ") || esc(e.msg || "")}</span>`
      +   (out.length ? `<button class="gw-link" data-gwout="${esc(key)}">`
            + (open ? "직전 출력 접기" : `직전 출력 ${out.length}줄`) + `</button>` : "")
      + `</div>`
      + (out.length && open ? `<pre class="gw-out">${esc(out.join("\n"))}</pre>` : "");
  }).join("");
  const more = (!gwAll && evs.length > GW_ROWS)
    ? `<button class="gw-link" id="gw-more">+ ${evs.length - GW_ROWS}개 더 보기</button>` : "";
  return head + rows + more;
}

function gwLogWire(){
  const log = $("#guard-log");
  if (!log) return;
  const close = $("#gw-close");
  if (close) close.addEventListener("click", () => { gwOpen = false; renderGuard(); });
  const more = $("#gw-more");
  if (more) more.addEventListener("click", () => { gwAll = true; renderGuard(); });
  log.querySelectorAll("[data-gwout]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.gwout;
    gwOut.has(k) ? gwOut.delete(k) : gwOut.add(k);
    renderGuard();
  }));
}

// 명령은 대신 실행하지 않는다 — 감시자를 다시 세울지는 사람의 판단이다.
async function gwCopyCmd(){
  const cmd = "s9 serve --supervise", outEl = $("#gw-copied");
  let ok = false;
  try{ await navigator.clipboard.writeText(cmd); ok = true; }catch(e){}
  if (!ok){        // 클립보드 API가 막힌 브라우저 — 선택 상태로라도 넘겨준다
    try{
      const ta = document.createElement("textarea");
      ta.value = cmd; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    }catch(e){}
  }
  if (!outEl) return;
  outEl.textContent = ok ? "복사됨" : "복사 실패";
  outEl.style.color = ok ? "" : "var(--c-blocked)";
  clearTimeout(gwCopyT);
  gwCopyT = setTimeout(() => { outEl.textContent = ""; outEl.style.color = ""; }, 2000);
}

// 상태 고정용 표본 (GW_FORCE). 실제 사망은 헤드리스 캡처로 재현할 수 없다.
let gwDemoCache = null;
function gwDemo(kind){
  if (gwDemoCache && gwDemoCache.kind === kind) return gwDemoCache.d;
  const t = Date.now(), iso = ms => new Date(t - ms).toISOString();
  const base = {port: 9909, now: iso(0), guard: "watching",
                guard_since: iso(7.2e6), restarts: 0, last_death: null, events: []};
  if (kind === "none") return (gwDemoCache = {kind, d: base}).d;
  const out = ["Traceback (most recent call last):",
               "  File bin/s9, line 8241, in do_GET",
               "    self._json(catalog_with_live())",
               "MemoryError"];
  const died = n => ({ts: iso(3e5 + n * 9e5), event: "died", rc: -15,
                      reason: "signal SIGTERM", ran_sec: 47.2, fails: 1,
                      retry_in: 12, tail: out, msg: "서버가 멈춰 되살렸다"});
  const hist = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(died)
    .concat([{ts: iso(7.2e6), event: "start", msg: "9909 감시 시작 (pid 545741)"}]);
  const keep = d => (gwDemoCache = {kind, d}).d;
  if (kind === "attention")
    return keep({...base, guard: "gave-up", restarts: 9,
            last_death: {...died(0), event: "gave-up", rc: 1, reason: "exit 1",
                         fails: 10, retry_in: 0},
            events: [{...died(0), event: "gave-up", rc: 1, reason: "exit 1",
                      fails: 10, retry_in: 0}].concat(hist)});
  return keep({...base, restarts: 9, last_death: died(0), events: hist});
}

/* '내 것만' 스코프 (DOC-20260823-006) — '나' = 화면 시점(viewMe), 저장 = s9mine.
   mine 판정 = /api/projects members에 user===viewMe && active. 만료·미등록 slug 제외. */
function getMineOnly(){
  try{ return localStorage.getItem("s9mine") === "1"; }catch(e){ return false; }
}
// 미등록 whoami면 저장값(s9mine)은 보존한 채 무시 — '나 없음'엔 mine이 정의 안 됨
const mineActive = () => !!viewMe() && getMineOnly();
const mineProjects = () => {
  const me = viewMe();
  return me ? projects.filter(p => (p.members || []).some(m => m.user === me && m.active)) : [];
};
// 토글 체크박스는 상태(localStorage)의 파생 뷰 — render()마다 동기화
function syncMineToggle(){
  const el = $("#f-mine"), me = viewMe();
  el.disabled = !me;
  el.checked = mineActive();
  $("#mine-wrap").title = me
    ? `@${me}가 active 멤버인 프로젝트의 문서만 표시 (Board·Docs·Graph 공통)`
    : "미등록 계정 — s9 user add 로 등록하면 내 프로젝트만 볼 수 있습니다";
}

async function boot(){
  try{ TRANS = await (await fetch("/api/transitions")).json(); }catch(e){}
  try{
    // 신원은 서버가 파생 — 표시 라벨 1회 + 등록 계정의 저장 설정 적용
    window.__whoami = await (await fetch("/api/whoami")).json();
    updateTitle();
    refreshUsage();
    setInterval(() => { if (!document.hidden) refreshUsage(); }, 60000);
    renderWhoami();
    applyStreamVisibility();   // 스트림을 끈 사용자에겐 Stream 탭 자체가 없다
    let cfg = null;
    try{
      const u = await (await fetch("/api/users")).json();
      window.__users = u.users;
      cfg = ((u.users || []).find(x => x.name === getMe()) || {}).config || null;
    }catch(e){}
    applyUISettings(cfg);
    updateProfileBadge();
  }catch(e){}
  applyRoute(location.hash, false);  // 초기 URL 해시(#docs/REQ-... 등) 반영
  if (!location.hash) history.replaceState(null, "", "#" + tab);  // 초기 진입점 고정(뒤로가기 기준)
  await refreshProjects();
  await refreshCatalog();
  await refreshChief();
  // ?project=slug — 공유 가능한 프로젝트 단위 뷰(보드/그래프가 그 프로젝트로 필터)
  const qp = new URLSearchParams(location.search).get("project");
  if (qp && [...$("#f-project").options].some(o => o.value === qp)) $("#f-project").value = qp;
  render();
  setTimeout(docPickDiag, 900);   // ?pick=<문서id> — 진단·헤드리스 캡처용 (셸이 선 뒤)
  anchorBind();    // 구간 메모 팝업 (REQ-20260827-072)
  anchorDiag();    // ?anchor — 진단·헤드리스 캡처용
  window.addEventListener("focus", () => refreshCatalog(true));
  window.addEventListener("focus", () => { if (tab === "chief") refreshChief(true); });
  setInterval(() => refreshCatalog(true), 15000);
  setInterval(() => { if (!document.hidden && tab === "chief") refreshChief(true); }, 60000);
  // 코드 낡음 감시: 20s 폴은 가시일 때만, 그리고 포커스 복귀 즉시 한 번 —
  // 터미널에서 재기동하고 돌아온 순간 알림이 사라지는 것이 곧 성공 확인이다.
  checkOldCode();
  setInterval(() => { if (!document.hidden) checkOldCode(); }, 20000);
  window.addEventListener("focus", checkOldCode);
  // 자동 복구 기록 (REQ-20260826-018). focus 확인이 특히 중요하다 — 서버가 죽어
  // 있는 동안 폴은 실패하고, 사람이 화면으로 돌아오는 순간이 대개 복구 직후다.
  checkGuard();
  setInterval(() => { if (!document.hidden) checkGuard(); }, 20000);
  window.addEventListener("focus", checkGuard);
  window.addEventListener("popstate", () => applyRoute(location.hash, true));
}

const TABS = ["chief","board","docs","graph","audit","stream","terminal","settings"];
const CHIEF_DAILY = ["brief","work","release","reports","relations","sessions"];
function syncChiefNav(){
  document.querySelectorAll("[data-chief-nav]").forEach(b =>
    b.classList.toggle("active",tab === "chief" && b.dataset.chiefNav === chiefDaily));
  const adv = document.querySelector("[data-advanced-toggle]");
  if (adv){
    adv.classList.toggle("active",tab !== "chief");
    adv.textContent = tab === "chief" ? "Advanced" : `Advanced · ${tab}`;
    adv.setAttribute("aria-expanded",advancedOpen ? "true" : "false");
  }
  const menu = $("#advanced-menu"); if (menu) menu.hidden = !advancedOpen;
}

// URL 해시 ↔ 상태. 형태: #<tab> 또는 #docs/REQ-.. 또는 #settings/account
function applyRoute(hash, doRender){
  const parts = (hash || "").replace(/^#/, "").split("/");
  const raw0 = parts[0];
  if (parts[0] === "chat") parts[0] = "terminal";  // 구 해시 alias (REQ-037 개명)
  // 스트림을 끈 사용자에게 #stream 은 없는 자리다 (REQ-20260827-042). 북마크·
  // 뒤로가기로 들어와도 빈 탭에 앉히지 않고 Board 로 보낸다 — 세션 조각(parts[1])
  // 까지 지워야 아래 정규화가 "#board/<sid>" 같은 엉뚱한 주소를 만들지 않는다.
  if (parts[0] === "stream" && !streamOn()){ parts[0] = "board"; parts.length = 1; }
  const t = TABS.includes(parts[0]) ? parts[0] : "chief";
  // 해시 정규화 (REQ-20260825-010): alias(#chat)·미지 해시 엔트리가 history에
  // 그대로 남으면 뒤로가기가 같은 화면 재방문·엉뚱한 탭 점프로 어긋난다 —
  // 현재 엔트리를 정규형으로 교체한다 (스택 방향은 보존)
  if (raw0 !== t){
    const canon = "#" + t + (TABS.includes(parts[0]) && parts[1] ? "/" + parts[1] : "");
    try{ history.replaceState(null, "", canon); }catch(e){}
  }
  /* 화면이 실제로 바뀌면 열려 있던 대화상자를 닫는다 (2026-08-27 사용자 지적:
     "팝업이 탭을 옮겨다녀도 계속 떠있는건 의도된게 맞는건가?").
     아니다. 이 창은 **특정 문서를 판정하는 자리**라, 그 문서가 있던 화면을 떠나면
     무엇을 판정하는지가 사라진다. 게다가 뒤를 가리지 않는 설계라 다른 화면 위에
     유령처럼 얹힌다. 취소와 같은 취급이다 — 적던 사유는 버린다.
     같은 화면 안의 해시 정규화(#chat→#terminal 같은 것)로는 닫지 않는다:
     화면이 그대로인데 창만 사라지면 그게 더 놀랍다. */
  const moved = t !== tab
    || (t === "docs" && parts[1] && parts[1] !== selectedDoc)
    || (t === "settings" && parts[1] && parts[1] !== settingsSection)
    || (t === "stream" && parts[1] && parts[1] !== selectedStream);
  if (moved && dlgClose) dlgClose(null);
  tab = t;
  if (t === "chief") chiefDaily = CHIEF_DAILY.includes(parts[1]) ? parts[1] : "brief";
  if (t === "docs" && parts[1]) selectedDoc = parts[1];
  if (t === "stream" && parts[1]) selectedStream = parts[1];
  if (t === "settings" && parts[1]) settingsSection = parts[1];
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === t));
  syncChiefNav();
  if (doRender) render();
}

// 상태 → 해시 push (뒤로가기가 동작하도록 history에 쌓는다)
function pushRoute(){
  let h = "#" + tab;
  if (tab === "chief") h += "/" + chiefDaily;
  else if (tab === "docs" && selectedDoc) h += "/" + selectedDoc;
  else if (tab === "stream" && selectedStream) h += "/" + selectedStream;
  else if (tab === "settings") h += "/" + settingsSection;
  if (location.hash !== h){ history.pushState(null, "", h); }
}

async function refreshProjects(){
  try{
    const d = await (await fetch("/api/projects?" + meQ())).json();
    projects = d.projects || [];
    window.__projects = projects;
  }catch(e){ /* 구버전 서버 등 — 프로젝트 API 없으면 무시 */ }
}

async function refreshCatalog(rerender){
  try{
    const fresh = await (await fetch("/api/catalog?" + meQ())).json();
    const before = JSON.stringify(projects);
    await refreshProjects();  // 프로젝트는 자주 안 바뀌므로 catalog와 함께 갱신
    const changed = JSON.stringify(fresh) !== JSON.stringify(catalog)
                 || JSON.stringify(projects) !== before;
    catalog = fresh;
    rebuildIdMap();   // uid 축약 표시의 겹침 판정 갱신 (REQ-20260825-031)
    if (changed){ fillFilters(); graph = null; }
    // Settings는 폼 입력 중일 수 있다 — 폴링발 재렌더로 DOM(입력값)을 파괴하지
    // 않는다. 탭을 떠날 때 render()가 최신 catalog로 다시 그린다 (REQ-055 E7).
    if (rerender && changed){ auditCache = null; if (tab !== "settings") render(); }
  }catch(e){ /* 서버 재시작 중 등 — 다음 주기에 재시도 */ }
}

function fillFilters(){
  const fill = (sel, vals) => {
    const el = $(sel), cur = el.value;
    while (el.options.length > 1) el.remove(1);
    [...new Set(vals.filter(Boolean))].sort().forEach(v => {
      const o = document.createElement("option"); o.value = o.textContent = v; el.appendChild(o);
    });
    el.value = [...el.options].some(o => o.value === cur) ? cur : "";
  };
  fill("#f-user", catalog.map(r => r.user));
  // 시스템 태그(생성 경로 표식)는 필터에서 숨긴다 (REQ-20260825-055 인접 지적:
  // auto-audit은 주제가 아니라 출처 — 문서에는 남기되 태그 UI는 의미 태그만)
  fill("#f-tag", catalog.flatMap(r => r.tags || []).filter(t => !SYS_TAGS.has(t)));
  fillProjects();
}

// 프로젝트 드롭다운: 등록된 모든 프로젝트(요청 없어도) + 문서 없는 레거시 slug.
// value=slug, label="title (slug)" — 요청의 project 필드는 slug를 저장하므로 필터가 일치.
// '내 것만' ON이면 옵션을 mine으로 스코핑(첫 옵션 'project: mine(N)', 미등록 slug 숨김),
// 현재 선택이 범위 밖이면 all로 명시 리셋 — 조용한 빈 결과 금지 (DOC-20260823-006).
function fillProjects(){
  const el = $("#f-project"), cur = el.value;
  while (el.options.length > 1) el.remove(1);
  const scoped = mineActive() ? mineProjects() : projects;
  el.options[0].textContent = mineActive() ? `project: mine(${scoped.length})` : "project: all";
  const known = new Set();
  scoped.forEach(p => {
    known.add(p.slug);
    const o = document.createElement("option");
    o.value = p.slug;
    o.textContent = p.title && p.title !== p.slug ? `${p.title} (${p.slug})` : p.slug;
    el.appendChild(o);
  });
  // 프로젝트 문서는 없지만 요청에 적힌 레거시 project 값도 필터 가능하게 포함
  // (mine 스코프에서는 멤버 판정 불가 → 숨김)
  if (!mineActive())
    [...new Set(catalog.map(r => r.project).filter(Boolean))].sort().forEach(slug => {
      if (known.has(slug)) return;
      const o = document.createElement("option");
      o.value = slug; o.textContent = `${slug} ·미등록`;
      el.appendChild(o);
    });
  el.value = [...el.options].some(o => o.value === cur) ? cur : "";
}

// 선택된 프로젝트의 정보 패널(고객/담당자/멤버) — 특정 프로젝트 선택 시 표시.
// '내 것만' ON + mine 1개면 선택 없이도 범위가 단일 확정이므로 병행 표시 (필터는 안 건드림).
function renderProjectInfo(){
  const box = $("#proj-info"), slug = $("#f-project").value, meName = viewMe();
  let p = slug && projects.find(x => x.slug === slug);
  if (!p && mineActive()){
    const mp = mineProjects();
    if (mp.length === 1) p = mp[0];
  }
  if (!p){ box.hidden = true; box.innerHTML = ""; return; }
  const contact = [p.contact_name, p.contact_org, p.contact_email, p.contact_phone]
    .filter(Boolean).map(esc).join(" · ");
  // manage 권한 판정(표시용) — 실제 인가는 서버 do_member_set/rm(project_can) 단일 경로
  const LVL = {viewer:1, contributor:2, maintainer:3, owner:4};
  const isAdmin = ((window.__users || []).find(u => u.name === meName) || {}).role === "admin";
  const myMem = meName && (p.members || []).find(m => m.user === meName && m.active);
  const myLvl = isAdmin ? 4 : (myMem ? (LVL[myMem.role] || 0) : 0);
  const canManage = myLvl >= 3, canOwn = myLvl >= 4;
  const roleSel = (cur, cls) => {
    const roles = (canOwn || cur === "owner")
      ? ["owner","maintainer","contributor","viewer"] : ["maintainer","contributor","viewer"];
    return `<select class="${cls}"${cur === "owner" && !canOwn ? " disabled title='owner 변경은 owner만 가능'" : ""}>${
      roles.map(r => `<option value="${r}"${r === cur ? " selected" : ""}>${r}</option>`).join("")}</select>`;
  };
  const nameCell = m => m.user === meName
    ? `<span class="m-me-name">${esc(m.user)}</span> <span class="m-me">· ME</span>`
    : esc(m.user);
  const rows = (p.members || []).map(m => canManage ? `<tr data-member="${esc(m.user)}">
      <td>${nameCell(m)}</td>
      <td>${roleSel(m.role, "pi-role")}</td>
      <td><input class="pi-pos" value="${esc(m.position || "")}" placeholder="—" size="10"></td>
      <td>${esc(m.since || "")}</td>
      <td><input class="pi-until" type="date" value="${esc(m.until || "")}" title="비우면 무기한"></td>
      <td class="${m.active ? "m-act" : "m-exp"}">${m.active ? "활성" : "만료"}</td>
      <td><button class="pi-x" data-rm="${esc(m.user)}"${m.role === "owner" && !canOwn
        ? " disabled title='owner 제거는 owner만 가능'" : ""}>− 제거</button></td>
    </tr>` : `<tr>
      <td>${nameCell(m)}</td>
      <td class="m-role">${esc(m.role)}</td>
      <td>${m.position ? esc(m.position) : "<span class='pi-k'>—</span>"}</td>
      <td>${esc(m.since || "")}</td>
      <td>${m.until ? esc(m.until) : "<span class='pi-k'>무기한</span>"}</td>
      <td class="${m.active ? "m-act" : "m-exp"}">${m.active ? "활성" : "만료"}</td>
    </tr>`).join("");
  // 추가 행: 아직 멤버가 아닌 등록 사용자만 후보로
  const memberSet = new Set((p.members || []).map(m => m.user));
  const candidates = (window.__users || []).map(u => u.name).filter(n => !memberSet.has(n));
  const addRow = canManage ? `<tr class="pi-addrow">
      <td>${candidates.length
        ? `<select class="pi-newuser">${candidates.map(n => `<option>${esc(n)}</option>`).join("")}</select>`
        : "<span class='pi-k'>추가할 등록 사용자 없음</span>"}</td>
      <td>${candidates.length ? roleSel("contributor", "pi-newrole") : ""}</td>
      <td>${candidates.length ? `<input class="pi-newpos" placeholder="직무(선택)" size="10">` : ""}</td>
      <td></td>
      <td>${candidates.length ? `<input class="pi-newuntil" type="date" title="비우면 무기한">` : ""}</td>
      <td></td>
      <td>${candidates.length ? `<button class="pi-x" data-add="1">+ 추가</button>` : ""}</td>
    </tr>` : "";
  box.hidden = false;
  box.innerHTML = `
    <div class="pi-head">
      <div><span class="pi-title">${esc(p.title || p.slug)}</span>
        <span class="pi-slug">${esc(p.id)} · ${esc(p.slug)}</span></div>
      <span class="pi-status">${esc(p.status)} · 멤버 ${p.member_active}/${p.member_total}</span>
    </div>
    <div class="pi-grid">
      <span class="pi-k">고객</span><span class="pi-v">${esc(p.customer) || "<span class='pi-k'>—</span>"}</span>
      <span class="pi-k">현업 담당자</span><span class="pi-v">${contact || "<span class='pi-k'>—</span>"}</span>
      ${p.summary ? `<span class="pi-k">개요</span><span class="pi-v">${esc(p.summary)}</span>` : ""}
    </div>
    ${rows || addRow ? `<table><thead><tr><th>사용자</th><th>권한</th><th>직무</th><th>참여일</th><th>만료</th><th>상태</th>${
      canManage ? "<th></th>" : ""}</tr></thead>
      <tbody>${rows}${addRow}</tbody></table>` : "<p class='pi-k'>멤버 없음</p>"}
    <div class="pi-err" hidden></div>`;
  if (canManage) wireMemberControls(box, p.slug, meName);
}

// 멤버 관리 컨트롤 배선 — 변경 즉시 POST(서버 단일 인가 경로), 성공 시 전체 갱신
function wireMemberControls(box, slug, meName){
  // render()는 패널을 통째로 다시 그리므로, 오류는 재렌더 후의 .pi-err에 써야 남는다
  const fail = msg => {
    const e2 = document.querySelector("#proj-info .pi-err");
    if (e2){ e2.textContent = "거부: " + msg; e2.hidden = false; }
  };
  const post = async (path, payload) => {
    try{
      const r = await fetch(path, {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user: meName, slug, ...payload})});
      const d = await r.json();
      if (!d.ok){ render(); fail(d.error); return; }  // 컨트롤 원복 후 거부 사유 표시
      await refreshProjects();
      render();  // mine 스코프·스트립·패널 즉시 갱신
    }catch(e){ render(); fail("서버에 연결할 수 없습니다"); }
  };
  box.querySelectorAll("tr[data-member]").forEach(tr => {
    const member = tr.dataset.member;
    tr.querySelector(".pi-role").addEventListener("change",
      e => post("/api/project/member", {member, role: e.target.value}));
    tr.querySelector(".pi-until").addEventListener("change",
      e => post("/api/project/member", {member, until: e.target.value}));
    const pos = tr.querySelector(".pi-pos");
    pos.addEventListener("change",
      e => post("/api/project/member", {member, position: e.target.value}));
    const rm = tr.querySelector("[data-rm]");
    rm && !rm.disabled && rm.addEventListener("click", async () => {
      if (await s9dlg({kind:"confirm", cap:"멤버",
            title:`${member} 을(를) ${slug} 에서 뺍니다`,
            desc:"프로젝트 문서는 그대로 남고, 이 사람의 접근만 끊깁니다.",
            ok:"멤버 빼기", cancel:"그만두기"}))
        post("/api/project/member/rm", {member});
    });
  });
  const add = box.querySelector("[data-add]");
  add && add.addEventListener("click", () => {
    const v = c => { const el = box.querySelector(c); return el ? el.value : ""; };
    post("/api/project/member", {member: v(".pi-newuser"), role: v(".pi-newrole"),
      position: v(".pi-newpos"), until: v(".pi-newuntil")});
  });
}

/* MY PROJECTS 레저 스트립 — '내 것만' ON일 때 board/docs/graph에서 표시 (DOC-20260823-006).
   행=전폭 button(키보드 순회), 행 클릭=단일 프로젝트 선택, 선택 행 재클릭=합집합 복귀. */
const MY_STRIP_LIMIT = 8;
function renderMyStrip(){
  const box = $("#my-strip");
  if (!mineActive()){ box.hidden = true; box.innerHTML = ""; return; }
  const me = viewMe(), mp = mineProjects(), sel = $("#f-project").value;
  // 만료 멤버십(active=false만 남은 프로젝트)은 mine에서 제외하되 존재만 고지
  const expiredN = projects.filter(p =>
    (p.members || []).some(m => m.user === me && !m.active) &&
    !(p.members || []).some(m => m.user === me && m.active)).length;
  let body;
  if (!mp.length){
    body = `<div class="ms-note">@${esc(me)}가 멤버인 활성 프로젝트가 없습니다 —
      <code>s9 project member add &lt;slug&gt; ${esc(me)}</code> 또는 토글 해제${
      expiredN ? ` · 만료된 멤버십 ${expiredN}건` : ""}</div>`;
  } else {
    const open = expanded.has("mystrip");
    const shown = open ? mp : mp.slice(0, MY_STRIP_LIMIT);
    body = shown.map(p => {
      const m = (p.members || []).find(x => x.user === me && x.active) || {};
      const soon = m.until && (Date.parse(m.until) - Date.now()) <= 14 * 86400e3;
      return `<button class="ms-row${p.slug === sel ? " sel" : ""}" data-mine-slug="${esc(p.slug)}"
        title="${p.slug === sel ? "클릭 = 내 프로젝트 전체(합집합)로 복귀" : "클릭 = 이 프로젝트만 보기"}">
        <span class="ms-t">${esc(p.title || p.slug)}</span><span class="ms-slug">(${esc(p.slug)})</span>
        <span class="ms-role">${esc(m.role || "")}${m.position ? " · " + esc(m.position) : ""}</span>
        <span class="ms-until${soon ? " soon" : ""}"${soon ? ' title="만료 14일 이내"' : ""}>${
          m.until ? "~" + esc(m.until) : "무기한"}</span></button>`;
    }).join("");
    if (mp.length > shown.length)
      body += `<button class="more" data-expand="mystrip">${mp.length - shown.length}개 더 보기</button>`;
    else if (open && mp.length > MY_STRIP_LIMIT)
      body += `<button class="more" data-expand="mystrip">접기</button>`;
    if (expiredN)
      body += `<div class="ms-note">+ 만료된 멤버십 ${expiredN}건 — 토글 해제 후 전체 뷰에서 확인</div>`;
  }
  box.hidden = false;
  box.innerHTML = `<div class="ms-head"><span>MY PROJECTS · @${esc(me)}</span>
    <span>${mp.length} ACTIVE</span></div>${body}`;
}

// skipType — 타입 진입점(Docs 타입바)의 카운트용: 지금 보고 있는 타입과 무관하게
// "다른 타입에 몇 건 있는지"를 세야 하므로 타입 조건만 뺀 같은 필터를 쓴다.
// skip — 조건 하나를 빼고 다시 세어 보기 위한 열쇠 집합(q·type·user·project·tag·mine).
// 빈 화면이 "무엇 때문에 비었나"에 답하려면 조건을 하나씩 빼 보는 수밖에 없다:
// 빼자마자 찾던 종류가 나타나는 조건, 그게 범인이다 (REQ-20260827-054).
function filtered(skipQ, skipType, skip){
  const off = k => !!(skip && skip.has(k));
  const q = (skipQ || off("q")) ? "" : $("#q").value.trim().toLowerCase();
  const [u,p,t,ty] = ["#f-user","#f-project","#f-tag","#f-type"].map(s => $(s).value);
  // Board에는 타입 축이 없다 (REQ-20260826-006): 084로 보드가 request 전용이 된
  // 뒤에도 헤더의 타입 필터는 탭을 가로질러 걸려 있었고, Docs에서 knowledge를
  // 고른 채 Board로 넘어오면 전 컬럼이 0건인 빈 판이 됐다. 값을 지우지 않고
  // 적용만 건너뛴다 — Docs로 돌아가면 사용자가 고른 타입이 그대로 살아 있다.
  const typeOff = skipType || off("type") || tab === "board";
  // mine 가드(앞단): '내 것만' ON이면 내 active 프로젝트 문서만 — Board/Docs/Graph 공통
  const mine = (mineActive() && !off("mine")) ? new Set(mineProjects().map(x => x.slug)) : null;
  return workOrder(catalog).filter(r => {
    if (mine && !mine.has(r.project)) return false;
    if (!off("user") && u && r.user !== u) return false;
    if (!off("project") && p && r.project !== p) return false;
    if (!off("tag") && t && !(r.tags||[]).includes(t)) return false;
    if (!typeOff && ty && r.type !== ty) return false;
    if (q){
      const hay = [r.id,r.title,r.summary,(r.tags||[]).join(" "),r.project,r.slug||""].join(" ").toLowerCase();
      if (!q.split(/\s+/).every(term => hay.includes(term))) return false;
    }
    return true;
  });
}

// 타입 필터는 타입 축이 있는 화면에서만 보인다. Board는 request 상태 흐름
// 전용이라 이 컨트롤이 할 일이 없다 — 남겨 두면 조작할 수 없는 조건이 결과를
// 0건으로 만든다(REQ-20260826-006). 값은 보존 → Docs 복귀 시 선택 그대로.

/* ---------------- Chief ----------------
   Data belongs to Chief; this screen is only a projection. The contract is the
   existing /api/work response proxied by GET /api/chief/work. Missing arrays are
   unknown/empty, never fabricated demo work. */
const chiefArr = v => Array.isArray(v) ? v : [];

function chiefGet(path){

  return `api/chief/${path.replace(/^\//, "")}`;
}
function chiefOpenReport(href,title,trigger){

function chiefProxyRoot(){
  const m = location.pathname.match(/^(.*?)\/app\/[^/]+(?:\/|$)/);
  return m ? (m[1] || "") : null;
}
function chiefWrite(name){
  const root = chiefProxyRoot();
  const routes = {
    sync:["api/chief/sync","/sync"],
    createWork:["api/chief/work/create","/work/create"],
    session:["api/chief/session/start","/work-session/start"],
    release:["api/chief/release/ensure","/release/autopilot/ensure"],
    complete:["api/chief/work/complete","/work/done"],
    investigate:["api/chief/work/investigate","/work/investigate"],
    order:["api/chief/order","/orders"],
    chatSession:["api/chief/chat/session","/chief-chat/session"],
    chatMessage:["api/chief/chat/message","/chief-chat/message"],
    projectSessionMessage:["api/chief/project-session/message","/project-session/message"],
  };
  const pair = routes[name];
  return root === null ? pair[0] : root + pair[1];
}
async function chiefPost(name,payload){
  const res = await fetch(chiefWrite(name),{method:"POST",cache:"no-store",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(payload || {})});
  const raw = await res.text();
  let body;
  try{ body = JSON.parse(raw); }catch(_e){ throw new Error(`HTTP ${res.status}: ${raw.slice(0,160)}`); }
  if (!res.ok || body.ok === false) throw new Error(body.error || body.detail || body.status || `HTTP ${res.status}`);
  return body;
}
async function chiefOrder(payload){
  const res = await fetch(chiefWrite("order"),{method:"POST",cache:"no-store",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(payload || {})});
  const raw = await res.text();
  let body;
  try{ body = JSON.parse(raw); }catch(_e){ throw new Error(`HTTP ${res.status}: ${raw.slice(0,160)}`); }
  if (body.status === "rejected" || (!res.ok && res.status !== 202))
    throw new Error(body.error || body.detail || body.status || `HTTP ${res.status}`);
  return body;
}
const chiefRunActive = run => run && ["starting","running","waiting_result","unknown","requested"].includes(String(run.status || ""));
async function chiefPollRun(key,runId){
  if (!runId) return;
  try{
    const res = await fetch(chiefGet(`session/status?id=${encodeURIComponent(runId)}`),{cache:"no-store"});
    const run = await res.json();
    chiefRuns[key] = run; if (tab === "chief") renderChief();
    if (chiefRunActive(run)) setTimeout(() => chiefPollRun(key,runId),2600);
    else { chiefNotice = run.status === "done" ? "Agent result recorded. Source state refreshed." : `Agent stopped: ${run.error || run.status || "attention needed"}`; await refreshChief(true); }
  }catch(e){
    chiefRuns[key] = {...chiefRuns[key],status:"unknown",error:String(e)};
    if (tab === "chief") renderChief();
    setTimeout(() => chiefPollRun(key,runId),5000);
  }
}
async function chiefStartWork(id,title){
  if (!id || chiefRunActive(chiefRuns[id])) return;
  chiefRuns[id] = {status:"starting"}; chiefNotice = `Starting ${title}…`; renderChief();
  try{
    const priorRes = await fetch(chiefGet(`session/status?work_id=${encodeURIComponent(id)}`),{cache:"no-store"});
    const prior = priorRes.ok ? await priorRes.json() : null;
    if (chiefRunActive(prior)){
      chiefRuns[id] = prior; chiefNotice = `${title} already has a live session; monitoring it instead of starting a duplicate.`;
      renderChief(); chiefPollRun(id,prior.run_id); return;
    }
    const order = `Continue this bounded work autonomously through a verified PR and integration to dev. Preserve the durable request/work order, create same-scope repair follow-ups when needed, update Jira and report evidence, and keep moving while safe progress remains. Stop only at a named external blocker or Jade's dev-to-production human gate. Never merge production.`;
    // Chief's "codex" engine is a Codex-provider thread inside T3 Code: durable,
    // steerable in T3, and independent from a project's saved Claude default.
    const run = await chiefPost("session",{work_id:id,engine:"codex",order});
    chiefRuns[id] = run; chiefNotice = `${title} is assigned. The agent owns safe work through dev.`;
    renderChief(); chiefPollRun(id,run.run_id);
  }catch(e){ chiefRuns[id] = {status:"failed",error:String(e)}; chiefNotice = `Could not start ${title}: ${e.message || e}`; renderChief(); }
}
async function chiefStartRelease(id,action,title){
  const key = `release:${id}:${action}`;

  chiefRuns[key] = {status:"starting"}; chiefNotice = `Starting ${title}…`; renderChief();
  try{
    const payload = action === "merge_dev" ? {release_id:id,engine:"codex",explicit_start:true} :
      {release_id:id,action,engine:"codex"};
    const run = await chiefPost(action === "merge_dev" ? "release" : "session",payload);
    chiefRuns[key] = run; chiefNotice = `${title} is agent-owned. Production remains Jade's gate.`;
    renderChief(); if (run.run_id) chiefPollRun(key,run.run_id); else await refreshChief(true);
  }catch(e){ chiefRuns[key] = {status:"failed",error:String(e)}; chiefNotice = `Could not start ${title}: ${e.message || e}`; renderChief(); }
}

async function chiefCreateWork(project,startSession=false){
  const registered = chiefArr(chiefData && chiefData.projects).find(p => chiefNorm(p.id) === chiefNorm(project));
  const projectTitle = registered && registered.title || project;
  if (!registered){ chiefNotice = "Select one registered project before adding work."; renderChief(); return; }
  const title = await s9dlg({kind:"prompt",cap:startSession ? "New project session" : "Add work",
    title:`What outcome does ${projectTitle} need?`,desc:"Use one short, concrete outcome. Chief will create the Jira Story and matching durable work record before it can start.",ok:"Continue",cancel:"Not now",required:true});
  if (title === null) return;
  const goal = await s9dlg({kind:"prompt",cap:"Evidence gate",title:"What proves this is done?",
    desc:"Name the observable result, report, PR, or live check. This becomes the agent's durable boundary.",ok:startSession ? "Create and start" : "Create work",cancel:"Not now",required:true});
  if (goal === null) return;
  chiefNotice = `Creating Jira-backed work for ${projectTitle}…`; renderChief();
  try{
    const made = await chiefPost("createWork",{project,title,goal});
    if (!made.jira || !made.request_id){
      chiefNotice = `${title} is only a draft because Jira-backed creation did not complete. It cannot be started yet.`;
      renderChief(); return;
    }
    chiefProject = project;
    chiefNotice = `${made.jira} and ${made.request_id} created for ${projectTitle}.`;
    await refreshChief(true);
    if (startSession){
      await chiefStartWork(made.request_id,made.title || title);
      chiefSessions = null;
      if (chiefDaily === "sessions") await chiefRefreshSessions();
    }
  }catch(e){
    chiefNotice = `${title} remains a draft: Jira creation was unavailable or declined, so it cannot be started. ${e.message || e}`;
    renderChief();
  }
}

async function refreshChief(rerender=false){
  if (chiefLoading) return;
  chiefLoading = true; chiefError = "";
  if (rerender && tab === "chief") renderChief();
  try{
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), 8000);
    const res = await fetch(chiefGet("work"), {cache:"no-store",signal:ac.signal});
    clearTimeout(t);
    const raw = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object") throw new Error("response was not an object");
    chiefData = data;
  }catch(e){
    chiefError = `GET /api/chief/work failed (${e && e.message ? e.message : e})`;
    if (!chiefData) chiefData = null;
  }finally{
    chiefLoading = false;
    if (tab === "chief") renderChief();
  }
}

  //    바로 아래 .stats 줄이 그걸 이미 말한다.
  //  - Docs/Graph: 필터가 실제로 줄였을 때만 몇 건인지 말한다. 안 좁힌 상태의
  //    "301 / 301"은 사용자가 의미를 못 찾은 그 숫자다. 총량 감각은 Docs 타입바
  //    (request/knowledge/session/project 건수)가 대신 준다.
  // 빈 줄은 .count:empty가 접어 유령 여백을 남기지 않는다.
  const narrowed = rows.length !== catalog.length || mineActive();
  $("#count").textContent = (tab === "board" || !narrowed) ? ""
    : `${rows.length} / ${catalog.length} documents`
      + (mineActive() ? ` · my ${mineProjects().length} projects` : "");

function cardHTML(r){
  const isReq = r.type === "request";
  // "무엇을 기다리는가" 한 줄 (REQ-20260826-009). blocked 전용이 아니다 —
  // open/in-progress 카드도 안 끝난 선행을 가질 수 있고, 사용자가 알고 싶었던
  // 것이 바로 그 경우다. 카드에선 선행 1건 제목 + 외 N건까지만; 전부와 이동
  // 경로는 문서 뷰가 맡는다.
  const bl = isReq ? liveBlockers(r) : [];
  const dep = bl.length
    ? `<div class="rvpt dep" title="${esc(bl.map(b => shortId(b.id) + " " + b.title).join(" · "))}">`
      + `<span class="rvcap">선행 대기</span>${esc(bl[0].title || shortId(bl[0].id))}`
      + (bl.length > 1 ? `<span class="depmore"> 외 ${bl.length - 1}건</span>` : "") + `</div>`
    : "";
  // 판정 카드: 배경 → 판단 요구 → 행동 (DOC-20260826-015). 요약 한 줄이 없으면
  // 제목만으로 무슨 건인지 떠오르지 않은 채 결론부터 읽게 된다 — 그래서 확인
  // 포인트 "위에" 요약을 놓는다. 이 블록(판정 카드)에만 붙인다.
  const acts = isReq && r.status === "review"
    ? `<div class="judge">${r.summary ? `<div class="rvpt what"><span class="rvcap">무엇을</span><span class="wtx">${esc(r.summary)}</span></div>` : ""}${r.review_point ? `<div class="rvpt"><span class="rvcap">확인 요청</span>${esc(r.review_point)}</div>` : ""}<div class="acts"><button data-approve="${esc(r.id)}" title="done으로 전이">✓ 승인</button><button data-reject="${esc(r.id)}" title="in-progress로 반려">↺ 반려</button></div></div>`
    // 선행이 잡히면 구조화된 대기 줄이 이긴다 — 같은 사실을 두 줄로 말하지 않는다.
    // 관계가 없는 과거 문서만 note 본문의 대기 사유로 폴백 (DOC-20260826-001 규칙 7).
    : isReq && r.status === "blocked" && r.block_reason && !bl.length
    ? `<div class="rvpt"><span class="rvcap">대기 사유</span>${esc(r.block_reason)}</div>`
    : "";
  const liveDot = r.status === "in-progress"
    ? (r.live ? `<span class="livedot on" title="이 요청을 실행 중인 세션이 활동 중 (${r.live_age}s 전 갱신 — last_req/active_reqs 등록)"></span>`
       : r.live_kind === "session"
         ? `<span class="livedot sess" title="담당 세션은 활동 중이나 이 요청의 직접 신호는 없음 (${r.live_age}s 전 세션 갱신)"></span>`
       : r.live_kind === "spawn_failed"
         ? `<span class="livedot dot-stopped" title="처리 주체가 멈췄다 — ${esc(r.live_reason||"프로세스 종료")}"></span>`
       : r.live_kind === "stalled"
         ? `<span class="livedot dot-stopped mild" title="진전이 끊겼다 — ${esc(r.live_reason||"transcript 진전 없음")}"></span>`
       : r.live_kind === "spawned"
         ? `<span class="livedot spawn" title="무인 재작업 작업자가 기동됨(${r.live_age}s 전 스폰) — 클레임 등록 대기 중"></span>`
         : `<span class="livedot off" title="in-progress지만 스트림 조용함 — 실제 동작 아닐 수 있음"></span>`)
    : "";
  return `<div class="card" ${isReq ? 'draggable="true"' : ""} tabindex="0" role="button" style="--sc:${SCOLOR[r.status]||"var(--muted)"}" data-doc="${esc(r.id)}" data-status="${esc(r.status)}">
    <button type="button" class="pickdoc" data-pick="${esc(r.id)}"
      aria-label="${esc(shortId(r.id))} 에 이어 말하기">→ 이어 말하기</button>
    <div class="id">${liveDot}${esc(shortId(r.id))}</div>
    <div class="t">${esc(r.title)}</div>
    <div class="m">
      <span class="badge" style="--ah:${tagHue(r.user||"?")}"><i class="av">${esc((r.user||"?").slice(0,1).toUpperCase())}</i>${esc(r.user)}</span>
      ${prioHTML(r)}
      ${r.size ? `<span class="size">${esc(r.size)}</span>` : ""}
      ${r.tdd ? `<span class="tdd${r.tdd.passed===r.tdd.total?" full":""}" title="TDD 시나리오 ${r.tdd.passed}/${r.tdd.total} 통과">TDD ${r.tdd.passed}/${r.tdd.total}</span>` : ""}
      ${(r.tags||[]).filter(t=>!SYS_TAGS.has(t)).slice(0,2).map(t=>`<span class="tag" style="--th:${tagHue(t)}">#${esc(t)}</span>`).join("")}
    </div>${acts}${dep}
    ${r.status_since ? `<span class="elapsed" data-since="${esc(r.status_since)}" title="현재 상태(${esc(r.status)}) 시작 이후 경과">${fmtElapsed(r.status_since)}</span>` : ""}</div>`;
}

// 반려: 사유 필수. Board·문서 뷰어 공용 (REQ-20260827-071 로 제품 대화상자 사용).
// 빈 값에 두 번째 창을 띄우던 흐름은 없앴다 — 그건 벌주는 흐름이고, 한 창 안에서
// 확인이 안 눌리는 것으로 족하다.
async function rejectWithReason(id){
  const why = await s9dlg({kind:"prompt", cap:"판정",
    title:`${shortId(id)} 을(를) 반려합니다`,
    desc:"사유는 History 에 그대로 남습니다. 무엇이 부족한지 한 줄이면 됩니다.",
    required:true, ok:"반려하기", cancel:"그만두기"});
  if (why === null) return;  // 취소
  postStatus(id, "in-progress", "반려: " + why);
}

async function postStatus(id, to, note){
  try{
    const r = await fetch("/api/status", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(withAs({id, to, note}))});  // actor는 서버 whoami 파생
    const d = await r.json();
    if (!d.ok){
      s9dlg({kind:"alert", cap:"거부", title:"상태를 바꾸지 못했습니다",
        desc:String(d.error || ""), ok:"닫기"});
      return;
    }
    refreshCatalog(true);
  }catch(e){
    s9dlg({kind:"alert", cap:"연결", title:"서버에 닿지 못했습니다",
      desc:"잠시 뒤 다시 시도해 주세요. 서버가 재기동 중일 수 있습니다.", ok:"닫기"});
  }
}
