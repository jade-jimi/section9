/* ANSI SGR → HTML (의존성 0, XSS 방지: 텍스트 조각은 esc() 후 span만 입힘).
   기본 16색은 CC 근사 팔레트, 256색은 xterm 큐브/그레이스케일 산식. */
const CC16 = ["#3f4451","#e06c75","#4ec97a","#e5c07b","#61afef","#c678dd",
              "#56c8d8","#d7dae0","#5c6370","#ff7a85","#5fe08d","#f0cd8a",
              "#74bdf7","#d894ec","#6fdbe8","#ffffff"];
function ansi256(n){
  n = +n;
  if (n < 16) return CC16[n];
  if (n < 232){
    n -= 16;
    const L = [0,95,135,175,215,255];
    return "#" + [L[(n/36|0)], L[((n/6|0))%6], L[n%6]]
      .map(v => v.toString(16).padStart(2,"0")).join("");
  }
  const v = 8 + (n - 232) * 10;
  return `rgb(${v},${v},${v})`;
}
function ccStrip(raw){                           // 접힘 미리보기용 — ANSI 전부 제거
  return String(raw ?? "").replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g, "")
    .replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\x1b[=>]/g, "");
}
/* 블록 수준 마크다운 (REQ-20260826-029). ccText 의 근사는 줄 안쪽(코드/굵게/
   경로/해시)만 다뤘다 — 표와 헤딩은 여러 줄이 모여야 뜻이 생기는 블록이라
   규칙이 아예 없었고, 그래서 화면에 파이프와 해시가 원문 그대로 흘렀다.
   실제 CC 터미널은 같은 텍스트를 표·제목으로 그린다. */
const CCTBL_DELIM = /^\s*(?=.*\|)\|?\s*:?-{2,}:?\s*(?:\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const CCTBL_CELL = /(?<!\\)\|/;
const CCHEAD = /^ {0,3}(#{1,6})[ \t]+(\S.*?)[ \t]*#*[ \t]*$/;
/* 숫자만 든 열은 오른쪽 정렬 — 자릿수를 세로로 맞춰야 비교가 된다 */
const CCNUM = /^[-+]?[\d,]+(?:\.\d+)?\s*(?:%|원|건|개|명|초|분|시간|ms|s|B|KB|MB|GB)?$/;

function ccCells(line){                          // 표 한 줄 → 칸 배열
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (/(?:^|[^\\])\|$/.test(t)) t = t.slice(0, -1);
  return t.split(CCTBL_CELL).map(c => c.replace(/\\\|/g, "|").trim());
}
function ccCell(tag, html, al){
  return `<${tag}${al ? ` style="text-align:${al}"` : ""}>${html}</${tag}>`;
}

/* 마크다운 표 파서 — **터미널 뷰와 문서 뷰어가 이 함수 하나를 부른다.**
   두 벌로 두면 한쪽만 고쳐진다: 이 결함이 정확히 그렇게 생겼다. 029 에서
   터미널 쪽 구멍을 막았는데 문서 뷰어는 별개 렌더러라 파이프가 그대로
   화면에 남아 있었다 (REQ-20260827-008).

   lines[i] 부터 표를 읽어 {html, next} 를 주고, 표가 아니면 null.
   cls  — 스타일 계열 이름(cctbl=터미널 팔레트 / mdtbl=문서 뷰어 토큰).
          두 화면은 색 토큰이 달라서 같은 클래스를 쓸 수 없다.
   cell — 칸 하나를 HTML 로 만드는 함수. 터미널은 인라인 규칙이 이미 끝난
          문자열을 넘기므로 그대로 두고, 문서 뷰어는 원문이라 inline 을 건다. */
function mdTable(lines, i, cls, cell){
  const dl = lines[i + 1], b0 = lines[i + 2];
  // 헤더행 + 구분행 + 본문행이 다 있을 때만. 파이프 하나 낀 평범한 문장을
  // 표로 만들면 지금보다 나쁘다.
  if (dl === undefined || b0 === undefined) return null;
  if (!CCTBL_DELIM.test(dl) || !lines[i].includes("|") || !b0.includes("|")) return null;
  const head = ccCells(lines[i]), spec = ccCells(dl);
  if (head.length !== spec.length) return null;   // 칸 수 불일치 = 표 아님 (GFM)
  const al = spec.map(c => {
    const L = c.startsWith(":"), R = c.endsWith(":");
    return L && R ? "center" : R ? "right" : "";
  });
  const rows = [];
  let j = i + 2;
  for (; j < lines.length; j++){
    if (!lines[j].includes("|") || CCTBL_DELIM.test(lines[j])) break;
    const r = ccCells(lines[j]);
    while (r.length < head.length) r.push("");
    rows.push(r.slice(0, head.length));
  }
  // 숫자만 든 열은 오른쪽 정렬 — 자릿수를 세로로 맞춰야 비교가 된다
  for (let c = 0; c < al.length; c++){
    if (al[c]) continue;
    const vals = rows.map(r => r[c]).filter(v => v !== "");
    if (vals.length && vals.every(v => CCNUM.test(v))) al[c] = "right";
  }
  const f = cell || (x => x);
  return {next: j,
    html: `<div class="${cls}w"><table class="${cls}"><thead><tr>`
      + head.map((c, k) => ccCell("th", f(c), al[k])).join("")
      + "</tr></thead><tbody>"
      + rows.map(r => "<tr>" + r.map((c, k) => ccCell("td", f(c), al[k])).join("")
          + "</tr>").join("")
      + "</tbody></table></div>"};
}

/* 인라인 규칙이 끝난 HTML 을 받아 블록만 다시 짠다. placeholder 복원 전이므로
   코드블록 안의 파이프는 이미 빠져 있고(오탐 없음), 셀 안의 코드/경로 강조는
   그대로 살아 있다. */
function ccBlocks(rendered){
  if (!/\|/.test(rendered) && !/^ {0,3}#{1,6}[ \t]/m.test(rendered)) return rendered;
  const lines = rendered.split("\n");
  const out = [];                                // {b:블록인가, h:HTML}
  for (let i = 0; i < lines.length; i++){
    // 표 — 규칙은 mdTable 한 곳에만 있다. 여기 칸은 인라인 규칙이 이미 끝난
    // HTML 이라 셀 렌더러를 넘기지 않는다.
    const t = mdTable(lines, i, "cctbl");
    if (t){ out.push({b:true, h:t.html}); i = t.next - 1; continue; }
    // 헤딩 — 해시는 표시 문자가 아니라 위계 표시다. 크기·굵기로 갈음한다.
    const h = CCHEAD.exec(lines[i]);
    if (h){ out.push({b:true, h:`<div class="cch cch${h[1].length}">${h[2]}</div>`}); continue; }
    out.push({b:false, h:lines[i]});
  }
  // 블록은 스스로 줄을 나눈다 — 앞뒤 빈 줄까지 살리면 간격이 두 번 벌어진다.
  const keepers = out.filter((x, k) =>
    x.b || x.h.trim() || !((out[k - 1] && out[k - 1].b) || (out[k + 1] && out[k + 1].b)));
  return keepers.map((x, k) =>
    (k && !x.b && !keepers[k - 1].b ? "\n" : "") + x.h).join("");
}

function ccText(raw){
  raw = String(raw ?? "")
    .replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g, "")     // OSC 제거
    .replace(/\x1b\[[0-9;?]*[A-HJKSTfhilnsu]/g, "")          // 비-SGR CSI 제거
    .replace(/\x1b[=>]/g, "");
  const parts = raw.split(/\x1b\[([0-9;]*)m/);
  // 마크다운 근사 (CC식). 완성 조각은 placeholder로 보호해 후속 정규식의
  // 속성/중첩 오염을 막는다 (REQ-20260825-033: 코드블록·경로·해시 값 강조)
  const md = s => {
    const ph = [];
    const keep = h => { ph.push(h); return `\x00${ph.length - 1}\x00`; };
    const inline = esc(s)
      .replace(/```\w*\n?([\s\S]*?)```/g, (m0, c) =>
        keep(`<span class="ccblk">${c.replace(/\n$/, "")}</span>`))
      // 첨부 참조 강조 (REQ-20260825-012): CC처럼 시안 칩 — 경로는 파일명만 표시
      .replace(/\[(Image|File): ([^\]\n]+)\]/g, (m0, k, p) =>
        keep(`<span class="ccatt" title="${p}">${k === "Image" ? "🖼" : "📎"} ${p.split(/[\\/]/).pop()}</span>`))
      .replace(/\[Image #(\d+)\]/g, m0 =>
        keep(`<span class="ccatt">🖼 ${m0.slice(1, -1)}</span>`))
      .replace(/`([^`\n]+)`/g, (m0, c) =>
        keep(`<span class="cccode">${c}</span>`))
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      // 파일 경로(절대/~, :라인 허용) — CC처럼 값 자체를 시안으로
      .replace(/(^|[\s([])(~?\/[\w.@-]+(?:\/[\w.@-]+)+(?::\d+)?)/gm,
        (m0, a, p) => a + keep(`<span class="ccval">${p}</span>`))
      // 해시류(7~40자리 16진, 영문자 포함 필수 — 날짜 등 순수 숫자 제외)
      .replace(/\b(?=[0-9a-f]*[a-f])([0-9a-f]{7,40})\b/g,
        (m0, h) => keep(`<span class="ccval">${h}</span>`));
    return ccBlocks(inline).replace(/\x00(\d+)\x00/g, (m0, i) => ph[+i]);
  };
  let st = {fg:null, bg:null, b:false, d:false, i:false, u:false};
  const wrap = h => {
    const css = [];
    if (st.fg) css.push("color:" + st.fg);
    if (st.bg) css.push("background:" + st.bg);
    if (st.b) css.push("font-weight:700");
    if (st.d) css.push("opacity:.6");
    if (st.i) css.push("font-style:italic");
    if (st.u) css.push("text-decoration:underline");
    return css.length ? `<span style="${css.join(";")}">${h}</span>` : h;
  };
  let html = "";
  for (let i = 0; i < parts.length; i++){
    if (i % 2 === 0){ if (parts[i]) html += wrap(md(parts[i])); continue; }
    const codes = parts[i] === "" ? [0] : parts[i].split(";").map(Number);
    for (let j = 0; j < codes.length; j++){
      const c = codes[j];
      if (c === 0) st = {fg:null, bg:null, b:false, d:false, i:false, u:false};
      else if (c === 1) st.b = true;
      else if (c === 2) st.d = true;
      else if (c === 3) st.i = true;
      else if (c === 4) st.u = true;
      else if (c === 22) st.b = st.d = false;
      else if (c === 23) st.i = false;
      else if (c === 24) st.u = false;
      else if (c >= 30 && c <= 37) st.fg = CC16[c - 30];
      else if (c === 39) st.fg = null;
      else if (c >= 90 && c <= 97) st.fg = CC16[c - 82];
      else if (c >= 40 && c <= 47) st.bg = CC16[c - 40];
      else if (c === 49) st.bg = null;
      else if (c >= 100 && c <= 107) st.bg = CC16[c - 92];
      else if (c === 38 || c === 48){
        let col = null;
        if (codes[j+1] === 5){ col = ansi256(codes[j+2]); j += 2; }
        else if (codes[j+1] === 2){
          col = `rgb(${codes[j+2]|0},${codes[j+3]|0},${codes[j+4]|0})`; j += 4;
        }
        if (col){ if (c === 38) st.fg = col; else st.bg = col; }
      }
    }
  }
  return html;
}

/* CC 글리프 줄 빌더 */
function ccLine(glyph, gcolor, bodyHtml, cls){
  return `<div class="ln${cls ? " " + cls : ""}">` +
    `<span class="g"${gcolor ? ` style="color:${gcolor}"` : ""}>${glyph}</span>` +
    `<span class="b">${bodyHtml}</span></div>`;
}
function ccFold(preview, full){                 // 긴 본문은 CC처럼 접는다
  return `<details><summary>${preview}</summary><div class="full">${full}</div></details>`;
}
function ccChatLine(l){                          // /api/chat/log 한 줄
  if (l.kind === "chat")
    return ccLine("❯", "var(--cc-dim)", ccText(l.text || ""));
  return ccLine("●", "var(--cc-faint)",          // 전이 통지 등 kind=event
    ccText(l.text || "") +
    ` <span style="color:var(--cc-faint)">· ${esc((l.ts || "").slice(11,16))}</span>`,
    "ccdim");
}
/* ---- transcript 이벤트 → CC 표시 규칙 (L10): 같은 시점의 CC 터미널과 같은
   내용만 보인다. 숨김: 훅 주입 컨텍스트(system-reminder 등 구조화 주입),
   사이드체인 thinking·원문(요약선만). thinking은 CC처럼 기본 접힘 한 줄.
   반환 {html,k,role} — k는 "Ran N shell commands" 접힘 분류, null = 숨김. */
function ccUserText(t){
  return String(t || "")
    .replace(/<system-reminder>[\s\S]*?(<\/system-reminder>|$)/g, "").trim();
}
function ccEvent(T, e){
  const t = e.text || "";
  if (e.agent){                                  // 사이드체인 — CC는 요약선만 (L8)
    if (e.role === "thinking") return null;
    if (e.role === "result")
      return {k:"x", html: ccLine("⎿", null,
        ccStrip(t).length > 60
          ? ccFold('<span style="color:var(--cc-dim)">agent result</span>', ccText(t))
          : `<span style="color:var(--cc-dim)">${ccText(t)}</span>`, "sub ccagent")};
    const nm = e.role === "tool" ? `<b>${esc(e.name || "tool")}</b> ` : "";
    return {k:"x", html: ccLine("⚙", "var(--cc-faint)",
      `<span style="color:var(--cc-dim)">agent · ${nm}${esc(ccStrip(t).replace(/\s+/g," ").slice(0,110))}</span>`,
      "ccagent")};
  }
  if (e.role === "user"){
    const u = ccUserText(t);
    if (!u) return null;                         // 훅 주입 컨텍스트만 있던 턴
    if (/^<task-notification>/.test(u)){         // 백그라운드 에이전트 완료 통지
      // 수신함 배달 통지(Monitor의 inbox tail 이벤트)는 전달 수단일 뿐이다 —
      // 사용자 메시지는 이미 ❯ 채팅 줄로 보이므로 숨긴다. 이걸 보이면
      // "background task 완료 통지"가 뜨고 스피너까지 종결시켜 응답 없이
      // "~ (총 Ns)"만 찍힌다 (REQ-20260825-005)
      if (/Monitor event/.test(u) && /inbox-/.test(u)) return null;
      if (T) termAgentDone(T);
      const id = (u.match(/<task-id>([^<]+)<\/task-id>/) || [])[1] || "";
      return {k:"x", role:"notif", html: ccLine("●", "var(--cc-faint)",
        ccFold(`<span style="color:var(--cc-dim)">background task ${esc(id)} 완료 통지</span>`, ccText(u)),
        "ccdim")};
    }
    if (/^<[a-z-]+>/.test(u)) return null;       // 기타 구조화 주입(command 등)
    return {k:"x", role:"user", html: ccLine("❯", "var(--cc-dim)", ccText(u))};
  }
  if (e.role === "assistant")
    return {k:"x", role:"assistant", html: ccLine("●", "var(--cc-text)", ccText(t))};
  if (e.role === "thinking"){
    const prev = esc(ccStrip(t).replace(/\s+/g, " ").slice(0, 80));
    return {k:"x", role:"thinking", html: ccLine("✻", "var(--cc-dim)",
      ccFold(`<span style="font-style:italic">${prev}…</span>`, ccText(t)), "ccdim")};
  }
  if (e.role === "tool"){
    if (e.name === "Agent" || e.name === "Task"){ // L8 — 스폰 줄 + Backgrounded 라벨
      let o = {}; try{ o = JSON.parse(t) || {}; }catch(x){}
      const at = o.subagent_type || "agent", ad = o.description || "";
      if (T) termAgentSpawn(T, at, ad);
      return {k:"x", role:"tool", name:e.name, html:
        ccLine("●", "var(--cc-green)",
          `<b>${esc(at)}</b><span style="color:var(--cc-dim)">(${esc(ad)})</span>`) +
        ccLine("⎿", null, '<span style="color:var(--cc-dim)">Backgrounded agent</span>', "sub")};
    }
    const nm = `<b>${esc(e.name || "tool")}</b>`;
    const sum = esc(ccToolSummary(e.name, t));
    const body = ccStrip(t).length > 130
      ? ccFold(`${nm}<span style="color:var(--cc-dim)">(${sum}…)</span>`, ccText(t))
      : `${nm}<span style="color:var(--cc-dim)">(${sum})</span>`;
    return {k: e.name === "Bash" ? "bash" : "x", role:"tool", name:e.name,
            html: ccLine("●", "var(--cc-text)", body)};
  }
  // result — ⎿ 연속줄, 길면 접힘, 에러는 분홍 ✗
  const body = t.length > 200
    ? ccFold(esc(ccStrip(t).slice(0,140)) + "…", ccText(t))
    : ccText(t);
  return {k: T && T.lastToolName === "Bash" ? "bashres" : "x", role:"result",
    html: ccLine("⎿", null,
      e.error ? `<span style="color:var(--cc-red)">✗ ${body}</span>` : body, "sub")};
}
function ccToolSummary(name, raw){                // 도구명 옆 핵심 인자 한 줄 (L10)
  let o = null; try{ o = JSON.parse(raw); }catch(e){}
  if (!o || typeof o !== "object")
    return ccStrip(raw).replace(/\s+/g, " ").slice(0, 100);
  const v = o.command ?? o.file_path ?? o.path ?? o.pattern ?? o.skill ?? o.url ??
            o.query ?? o.description ?? o.prompt ?? JSON.stringify(o);
  return String(v).replace(/\s+/g, " ").slice(0, 100);
}
/* 배치 렌더: (수신함 라인 | transcript 이벤트) 목록 → html. 연속 Bash 실행(≥2)은
   CC처럼 "Ran N shell commands" 접힘으로 묶는다. 스피너/에이전트 상태도 갱신. */
function ccRenderBatch(T, evs){
  const items = [];
  for (const x of evs){
    if (x && x.__chat){                          // 초기 병합용 수신함 라인
      items.push({k:"x", html: ccChatLine(x)});
      if (x.kind === "chat" && T){
        T.lastRole = "user";
        // 경과시간은 줄의 실제 ts 기준 (REQ-20260825-004: Date.now()로 잡으면
        // 탭 복귀 재렌더마다 대기 시계가 0초부터 다시 시작)
        const p = Date.parse(String(x.ts || ""));
        T.waitBase = isNaN(p) ? Date.now() : p;
      }
      continue;
    }
    const r = ccEvent(T, x);
    if (!r) continue;
    items.push(r);
    if (T && r.role && r.role !== "notif"){
      T.lastRole = r.role;
      if (r.role === "tool") T.lastToolName = r.name || "";
      const p = Date.parse(String(x.ts || "").replace(" ", "T"));
      T.waitBase = isNaN(p) ? Date.now() : p;
    }
  }
  let html = "", i = 0;
  while (i < items.length){
    if (items[i].k !== "bash"){ html += items[i].html; i++; continue; }
    let j = i, n = 0, seg = "";
    while (j < items.length && (items[j].k === "bash" || items[j].k === "bashres")){
      if (items[j].k === "bash") n++;
      seg += items[j].html; j++;
    }
    html += n >= 2
      ? `<div class="ln ccdim"><span class="g"></span><span class="b"><details><summary><span style="color:var(--cc-dim)">Ran ${n} shell commands</span></summary><div class="full">${seg}</div></details></span></div>`
      : seg;
    i = j;
  }
  return html;
}
function ccTsKey(x){ return (x.ts || "").replace("T", " ").slice(0, 19); }
/* 타임아웃 있는 JSON fetch — 서버 backlog 포화로 연결이 hang/reset 되어도
   (실서버 /api/catalog reset 전례) 터미널 렌더가 멈추지 않게 null로 강등.
   실패분은 어차피 폴러(offset 0부터)가 채운다. */
function ccFetch(url, ms){
  return new Promise(res => {
    const ac = new AbortController();
    const to = setTimeout(() => { ac.abort(); res(null); }, ms || 8000);
    fetch(url, {signal: ac.signal})
      .then(r => r.ok ? r.json() : null)
      .then(v => { clearTimeout(to); res(v); })
      .catch(() => { clearTimeout(to); res(null); });
  });
}

/* 대상 감시: 최초 즉시 + 5s 주기 — live/stale은 텍스트 노드만 patch,
   sid가 바뀌면(대격변) 타임라인만 교체. 입력줄은 어떤 경우에도 불변(L0). */
async function termTargetLoop(T){
  const tick = async () => {
    // 타깃 고착 (REQ-20260825-020): 현 대상이 있으면 sid를 명시해 유지 —
    // listening 세션이 여럿일 때 최신 활동이 타깃을 가로채는 재발 차단.
    // 현 대상이 죽었을 때만 자동 재선택으로 폴백한다.
    let nt = await ccFetch("/api/chat/target"
      + (T.sid ? "?sid=" + encodeURIComponent(T.sid) : ""), 4000);
    if (TERM !== T) return;
    if (T.sid && nt && nt.sid && !nt.live){
      nt = await ccFetch("/api/chat/target", 4000);
      if (TERM !== T) return;
    }
    if (nt && nt.hint) T.hint = nt.hint;   // 빈 상태 안내용 실행 명령(실경로)
    if (!nt){ termStatus(T, null, "offline"); return; }   // 서버 무응답
    if (nt.sid && nt.sid !== T.sid){ termAttach(T, nt); return; }
    termStatus(T, nt.sid ? nt : null);
  };
  await tick();
  if (TERM !== T) return;
  if (!T.sid) termWaitingGuide(T);
  // ?mpanel: 진단·헤드리스 캡처용 — 살아 있는 세션의 모델 창을 열어 둔다.
  // (창 자체의 모양은 ?dlg=model 로 세션 없이도 본다 — REQ-20260827-079)
  if (T.sid && /[?&]mpanel/.test(location.search) && dlg.hidden)
    termModelChange(T);
  T.timers.push(setInterval(() => {
    if (document.hidden || tab !== "terminal") return;
    tick();
  }, 5000));
  // 수신함 로그(보낸 메시지 echo·전이 이벤트) 3s 폴 — append 전용
  T.timers.push(setInterval(() => {
    if (document.hidden || tab !== "terminal" || !T.sid) return;
    refreshTermChat(T);
  }, 3000));
  // 에이전트 스트립(이름·실시간 라벨·경과·토큰) 10s 폴 (REQ-044)
  const agTick = async () => {
    if (document.hidden || tab !== "terminal" || !T.sid) return;
    const d = await ccFetch("/api/agents?session=" +
                            encodeURIComponent(T.sid), 5000);
    if (TERM !== T || !d) return;
    // 서버가 한 번이라도 목록을 준 적이 있으면 그 뒤로는 서버만 신뢰한다
    // (REQ-20260825-083). 활성 0건이면 "행 없음"이 정답이고, transcript 근사
    // 목록을 덧그리면 클릭도 안 되는 유령 행이 남는다. 폴백은 이 API 자체가
    // 없는 구버전 serve 전용 — 한 번 확인한 사실이라 sticky.
    T.srvAgentsOk = true;
    T.srvAgents = d.agents || [];
    termAgentsRender(T);
  };
  T.agTick = agTick;          // 탭 복귀 즉시 맞추기 위해 노출 (REQ-20260826-016)
  agTick();
  T.timers.push(setInterval(agTick, 10000));
}

/* ------- 컨텍스트 압축 중 (REQ-20260827-065) -------
   서버가 `/api/chat/target` 응답에 `compacting` 을 준다. 압축이 도는 동안
   세션은 한동안 말이 없는데, 대시보드만 보는 사람에게 그 침묵은 고장과
   구분되지 않는다 — 로컬 터미널에는 압축 표시가 있고 여기에는 없었다.

   두 자리에 세운다. 하나는 **침묵이 생기는 자리**(출력 판 끝) — 응답 대기 줄과
   같은 어휘(스피너 · 하는 일 · 경과)라 배울 것이 없다. 다른 하나는 상태줄인데,
   출력을 위로 올려 읽는 중이면 판 끝의 줄이 화면 밖이라 안 보이기 때문이다.
   상태줄에서는 `live` 를 덮지 않고 그 옆에 선다 — 압축 중에도 세션은 살아 있다.

   경과 시간을 함께 보이는 이유: 정적인 문구는 멈춘 것처럼 읽힌다. */
function termCompactSync(T, on){
  const box = $("#cc-compact"), chip = $("#cc-cmpk");
  if (/[?&]compacting/.test(location.search)) on = true;   // 진단·헤드리스 캡처용
  if (on && !T.compactSince){
    T.compactSince = Date.now();
    // 대상 감시는 5초에 한 번 돈다 — 경과를 그 박자로 적으면 5초씩 건너뛰어
    // 오히려 굳은 것처럼 보인다. 초 단위는 초 단위로 센다.
    T.compactT = setInterval(() => {
      if (TERM !== T || !T.compactSince) return;
      termCompactSync(T, true);
    }, 1000);
    T.timers.push(T.compactT);
  }
  if (!on){
    T.compactSince = null;
    if (T.compactT){ clearInterval(T.compactT); T.compactT = null; }
  }
  if (chip){
    chip.hidden = !on;
    chip.textContent = on ? " · 압축 중" : "";
  }
  if (!box) return;
  if (!on){ box.hidden = true; box.innerHTML = ""; return; }
  const out = $("#ccout"), wasBottom = termAtBottom(out);
  if (box.hidden){
    box.hidden = false;
    box.innerHTML = `<span class="ccspin"></span>`
      + `<span>컨텍스트 압축 중 <span class="cce"></span></span>`;
  }
  const el = box.querySelector(".cce");
  if (el) el.textContent = `(${fmtElapsed(new Date(T.compactSince).toISOString())})`;
  // 바닥에 붙어 있던 사람에게는 이 줄이 계속 보여야 한다 — 판 끝에 붙는 줄이라
  // 한 번 밀리면 다시는 안 보인다. 위로 올려 읽는 중이면 건드리지 않는다.
  if (wasBottom && out) out.scrollTop = out.scrollHeight;
}
function termStatus(T, nt, why){
  const lv = $("#cc-live"), tg = $("#cc-tgt");
  if (!lv) return;
  if (!nt || !nt.sid){
    T.live = false;
    // 서버 무응답(재기동 중)과 "세션이 없음"은 다른 상태다 — 같은 문구로
    // 뭉뚱그리면 사용자가 세션을 다시 띄우려 한다 (실사고: 배포 중 no session)
    const off = why === "offline";
    lv.textContent = off ? "서버 재연결 중" : (T.sid ? "stale" : "no session");
    lv.className = "ccwarn";
    lv.title = off ? "대시보드 서버 응답 없음(재기동 중일 수 있음) — 자동으로 다시 연결합니다. 세션은 그대로입니다."
                   : "";
    if (!T.sid && tg) tg.textContent = off ? " · 서버 대기" : " · waiting";
    termCompactSync(T, false);   // 대상이 없으면 압축 중일 수도 없다
    return;
  }
  T.live = !!nt.live;
  T.profiles = nt.profiles || T.profiles || [];   // 계정 프로필 (패널용)
  // 재시작 복귀 감지 (REQ-20260825-047): 모델이 바뀌었거나(요청대로) 수신
  // 대기가 다시 살아나면 진행 줄을 완료로 마감한다
  if (T.restart && nt.model){
    const now = String(nt.model), want = T.restart.want;
    const changed = now !== T.restart.from;
    const matches = want && now.replace(/^claude-/, "").startsWith(want);
    if (changed || matches || (nt.listening && Date.now() - T.restart.t0 > 8000))
      termRestartDone(T, "ok", now);
  }
  T.model = nt.model || T.model || "";
  // listening = 세션이 수신함 tail(Monitor)을 실제로 돌리는 중.
  // live인데 미가동이면 idle — 메시지는 큐잉+REQ 기록만 되고 즉답이 없다
  // (REQ-20260825-001: 유휴 세션이 live로 보여 무응답이 침묵으로 빠지던 결함)
  const listen = nt.listening !== false;
  lv.textContent = !T.live ? "stale" : (listen ? "live" : "idle");
  lv.className = (T.live && listen) ? "ccok" : "ccwarn";
  lv.title = (T.live && !listen)
    ? "세션이 유휴 상태(수신 대기 미가동) — 보낸 메시지는 요청 문서로 즉시 기록되고, 세션 터미널에서 아무 입력이나 하면 밀린 메시지를 소화합니다"
    : "";
  // 모델 표시·변경 (REQ-20260825-037): 클릭 = 같은 대화를 새 설정으로 재개.
  // 모델 미상(신생 세션 — assistant 이벤트 이전)이어도 컨트롤은 항상 보인다
  // (반려 재작업: 미상 시 라벨이 아예 사라져 "실행부터 실패"로 보이던 결함)
  termCompactSync(T, !!nt.compacting);
  const mdl = nt.model ? String(nt.model).replace(/^claude-/, "") : "model?";
  if (tg) tg.innerHTML = ` · target <span class="cccyan">${esc(nt.sid)}</span> <span class="cccyan">@${esc(nt.user || "?")}</span>`
    + ` · <span class="ccmodelbtn" title="현재 모델 — 클릭하면 model/effort를 바꿔 같은 대화로 재시작한다 (유휴 시에만)" style="cursor:pointer;text-decoration:underline dotted">${esc(mdl)}</span>`;
}

function termWaitingGuide(T){
  const w = $("#cc-wait");
  if (!w) return;
  // 실행 안내는 서버가 준 힌트(이 워크스페이스의 실제 경로) 우선 — 인스턴스마다
  // 루트가 다르다 (REQ-20260824-062 인접 결함: ~/section9 하드코딩)
  const cmd = esc((T.hint || "").match(/`([^`]+)`/)?.[1] || "cd ~/section9 && bin/s9 code");
  w.insertAdjacentHTML("beforebegin",
    ccLine("✻", "var(--cc-dim)",
      '<span style="color:var(--cc-dim)">Waiting for a live Claude session…</span>') +
    ccLine("⎿", null, `라이브 클로드 세션이 없습니다.
  <button class="ccwake" id="cc-wake">▶ 여기서 세션 깨우기</button>  새 터미널 창이 열리고 세션이 시작됩니다.
  수동으로 하려면: <span class="cccode">${cmd}</span>`, "sub"));
  const wb = $("#cc-wake");
  if (wb) wb.addEventListener("click", () => termWake(T));
  const ta = $("#chat-in");
  ta.disabled = true;
  ta.placeholder = "no live session";
  termStatus(T, null);
}

/* 대상 세션 부착/교체 — 타임라인·상태 스트립만 만진다. 입력줄 DOM 불변(L0). */
async function termAttach(T, nt){
  const sid = nt.sid;
  T.sid = sid; T.offset = 0; T.evCount = 0; T.chatCount = 0;
  T.buf = []; T.agents = []; T.lastRole = null; T.lastToolName = "";
  T.pollFails = 0; T.conn = "init"; termConnSet(T, null);   // 이전 세션 단절 표시 소거
  termCloseSSE(T);
  termClearOut(T);
  termStatus(T, nt);
  termAgentsRender(T);
  const src = $("#cc-src"); if (src) src.textContent = `${sid} transcript`;
  const ta = $("#chat-in");
  ta.disabled = false;
  ta.placeholder = "메시지 — Enter 전송 · Shift+Enter·Ctrl+Enter 줄바꿈 · / 명령 · 이미지 붙여넣기/드래그";
  if (tab === "terminal" && !document.hidden) ta.focus();
  termMeta(T);
  // 초기 로드: 수신함 로그 + transcript 병합(동초는 chat 먼저 — 안정 정렬)
  const retry = async url => {   // 간헐 연결 reset — 1회 재시도
    const v = await ccFetch(url);
    if (v) return v;
    await new Promise(r => setTimeout(r, 400));
    return ccFetch(url);
  };
  const [logR, evR] = await Promise.all([
    retry("/api/chat/log?sid=" + encodeURIComponent(sid)),
    retry("/api/stream?session=" + encodeURIComponent(sid)),
  ]);
  if (TERM !== T || T.sid !== sid) return;
  const log = logR || {lines: []}, ev = evR || {events: [], offset: 0};
  T.chatCount = (log.lines || []).length;
  T.offset = ev.offset || 0;
  T.evCount = (ev.events || []).length;
  const merged = [
    ...(log.lines || []).map(l => ({...l, __chat: true})),
    ...(ev.events || []),
  ].sort((a, b) => {
    const ka = ccTsKey(a), kb = ccTsKey(b);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  const html = ccRenderBatch(T, merged);
  const w = $("#cc-wait");
  if (w) w.insertAdjacentHTML("beforebegin", html ||
    ccLine("✻", "var(--cc-dim)",
      '<span style="color:var(--cc-dim)">empty transcript — 첫 메시지를 보내보세요</span>'));
  const out = $("#ccout");
  if (out) out.scrollTop = out.scrollHeight;
  termMeta(T); termSpinnerEval(T); termAgentsRender(T);
  termConnectSSE(T);
}

function termClearOut(T){
  const out = $("#ccout"), w = $("#cc-wait"), c = $("#cc-compact");
  if (!out) return;
  // 붙박이 줄(응답 대기·압축 중)은 지우지 않는다 — 타임라인만 비운다.
  // 압축 줄까지 쓸어 버리면 세션을 다시 붙일 때마다 압축 표시가 사라져,
  // 압축이 도는 내내 화면이 다시 침묵한다 (REQ-20260827-065).
  [...out.children].forEach(n => { if (n !== w && n !== c) n.remove(); });
  T.waitOn = false;
  if (w) w.hidden = true;
}

/* ---- SSE 수신 (L1): 증분 push → rAF 배칭 append. 서버는 5분마다 정상 종료 —
   onerror에서 마지막 offset으로 재접속. 연속 실패 시 폴링 폴백. ---- */
function termCloseSSE(T){
  if (T.es){ try{ T.es.close(); }catch(e){} T.es = null; }
  if (T.esRetryT){ clearTimeout(T.esRetryT); T.esRetryT = null; }
}
function termConnectSSE(T){
  termCloseSSE(T);
  if (!T.sid) return;
  // ?nosse: 진단·헤드리스 캡처용 — SSE 상시 연결이 virtual-time 스크린샷을
  // 막아 터미널 탭이 자가 검증 불가였다 (REQ-20260825-037 반려 재작업)
  if (!window.EventSource || /[?&]nosse/.test(location.search)){
    termPollFallback(T); return;
  }
  const es = new EventSource(`/api/stream/sse?session=${encodeURIComponent(T.sid)}&after=${T.offset}`);
  T.es = es; T.poll = false;
  termMeta(T);
  es.onopen = () => {
    if (TERM !== T || T.es !== es) return;
    T.esFails = 0; termConnSet(T, "sse");
  };
  es.onmessage = m => {
    if (TERM !== T || T.es !== es){ try{ es.close(); }catch(e){} return; }
    T.esFails = 0; termConnSet(T, "sse");
    let d = null; try{ d = JSON.parse(m.data); }catch(e){}
    if (!d) return;
    if (typeof d.offset === "number") T.offset = d.offset;
    if (d.events && d.events.length){
      T.buf.push(...d.events);
      termScheduleFlush(T);
    }
  };
  es.onerror = () => {
    try{ es.close(); }catch(e){}
    if (TERM !== T || T.es !== es) return;
    T.es = null; T.esFails++;
    termConnSet(T, "retry");
    if (T.esFails >= 4){ termPollFallback(T); return; }
    T.esRetryT = setTimeout(() => {
      if (TERM === T && !document.hidden) termConnectSSE(T);
    }, Math.min(500 * Math.pow(2, T.esFails - 1), 5000));
  };
}
function termPollFallback(T){
  T.poll = true;
  T.pollFails = 0;
  termConnSet(T, "poll");
  termMeta(T);
  if (T.pollT) return;   // 폴백 인터벌은 1개만 — SSE 복귀 후 재폴백에도 재사용
  let n = 0;
  T.pollT = setInterval(async () => {
    if (document.hidden || tab !== "terminal" || !T.sid || T.es) return;
    if (++n % 12 === 0 && window.EventSource){ termConnectSSE(T); return; }
    const nd = await ccFetch(`/api/stream?session=${encodeURIComponent(T.sid)}&after=${T.offset}`, 6000);
    if (TERM !== T || T.es) return;
    // 폴백마저 연속 실패 = 서버 불통(재기동 등) — 경고로 승격 (REQ-032)
    if (!nd){
      if (++T.pollFails >= 2) termConnSet(T, "down");
      return;
    }
    T.pollFails = 0;
    termConnSet(T, "poll");
    T.offset = nd.offset;
    if (nd.events && nd.events.length){
      T.buf.push(...nd.events);
      termScheduleFlush(T);
    }
  }, 2500);
  T.timers.push(T.pollT);
}
function termScheduleFlush(T){
  if (T.raf) return;
  T.raf = requestAnimationFrame(() => {
    T.raf = 0;
    if (TERM !== T) return;
    const evs = T.buf; T.buf = [];
    if (evs.length) termAppendBatch(T, evs);
  });
}
/* ------- 바닥으로 내려가는 손잡이 (REQ-20260827-061) -------
   자동 따라가기는 "바닥 근처(140px)일 때만" 돈다 — 위로 올려 읽는 중에 화면이
   끌려가면 읽던 줄을 잃기 때문이다. 그런데 그 규칙이 조용히 도는 바람에,
   위로 올려 둔 사람에게는 **새 출력이 와도 아무 일도 안 일어나는 것처럼**
   보인다. 손잡이는 그 규칙을 눈에 보이게 만든다: 뜬다 = 지금은 안 따라간다.
   경계값을 자동 따라가기와 **같은 140** 으로 두는 것이 핵심이다 — 다르면
   "버튼은 없는데 안 따라가는" 구간이 생겨 규칙이 다시 안 보이게 된다. */
const TERM_FOLLOW_GAP = 140;
const termAtBottom = el =>
  !el || el.scrollHeight - el.scrollTop - el.clientHeight < TERM_FOLLOW_GAP;
// 지금 보이는 판 — 에이전트 타임라인을 열면 main 판은 숨는다
function termPane(){
  const av = $("#cc-agview");
  return (av && !av.hidden) ? av : $("#ccout");
}
function termJumpSync(T){
  const btn = $("#cc-jump"), el = termPane();
  if (!btn || !el) return;
  const bottom = T.jumpForce ? false : termAtBottom(el);
  if (bottom) T.unread = 0;
  btn.hidden = bottom;
  if (bottom) return;
  const n = T.unread;
  btn.classList.toggle("unread", n > 0);
  // 안 읽은 것이 있으면 **수**를 말한다. 없으면 그냥 내려가는 손잡이다 —
  // 없는 것을 "0개"라고 적지 않는다.
  btn.innerHTML = `<span>${n ? `새 메시지 ${n}개` : "맨 아래로"} ↓</span>`
    + `<span class="jk">Ctrl+End</span>`;
  btn.setAttribute("aria-label",
    n ? `안 읽은 새 메시지 ${n}개 — 눌러서 맨 아래로` : "맨 아래로 내려가기");
}
function termJumpGo(T){
  const el = termPane();
  if (!el) return;
  el.scrollTop = el.scrollHeight;
  T.unread = 0;
  termJumpSync(T);
}
// 위로 올려 읽는 중에 온 줄만 센다. 화면에 실제로 그려진 줄 수를 세므로
// 숨김 이벤트(L10)는 세지 않는다 — 안 보이는 것을 "새 메시지"라 부르지 않는다.
const termCountLines = html => (html.match(/<div class="ln/g) || []).length;
function termJumpBind(T){
  const btn = $("#cc-jump");
  if (btn) btn.onclick = () => termJumpGo(T);
  ["#ccout", "#cc-agview"].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener("scroll", () => termJumpSync(T), {passive: true});
  });
  /* ?ccjump[=N] — 진단·헤드리스 캡처용 (?usagecard·?dlg 과 동형). 손잡이는
     위로 올려야 나오는데 헤드리스에는 손이 없다. N 을 주면 안 읽은 상태,
     안 주면 그냥 내려가는 상태로 세워 둔다. */
  const m = /[?&]ccjump(?:=(\d+))?/.exec(location.search);
  if (m){
    T.jumpForce = true;
    T.unread = m[1] ? Number(m[1]) : 0;
    setTimeout(() => {
      const el = termPane();
      if (el) el.scrollTop = Math.max(0, el.scrollHeight - el.clientHeight - 320);
      termJumpSync(T);
    }, 1600);
  }
  termJumpSync(T);
}
function termAppendBatch(T, evs){
  const out = $("#ccout"), w = $("#cc-wait");
  if (!out || !w) return;
  T.evCount += evs.length;
  const hadWait = T.waitOn, waitStart = T.waitBase;
  const html = ccRenderBatch(T, evs);   // lastRole/waitBase/agents 갱신 포함
  termMeta(T);
  if (!html){ termSpinnerEval(T); return; }   // 전부 숨김 이벤트(L10)
  // 따라갈지 말지와 손잡이가 뜰지 말지는 **같은 잣대**여야 한다 (REQ-061) —
  // 잣대가 둘이면 "버튼은 없는데 안 따라가는" 구간이 생긴다.
  const nearBottom = termAtBottom(out);
  if (hadWait) termSpinnerFinalize(T, waitStart);   // 스피너 자리 → 완료줄 확정
  w.insertAdjacentHTML("beforebegin", html);
  termTrim(T, out, nearBottom);   // DOM 무한 누적 방지 (REQ-20260824-059)
  termSpinnerEval(T);
  termAgentsRender(T);
  if (nearBottom) out.scrollTop = out.scrollHeight;  // 위로 읽는 중이면 방해 안 함
  else T.unread += termCountLines(html);             // 그 사이 쌓인 줄 (REQ-061)
  termJumpSync(T);
}

/* 타임라인 상한 (REQ-059): 브라우저 탭이 장시간 열려 있어도 메모리·레이아웃
   비용이 상수로 유지되게, 오래된 줄을 정리하고 생략 안내 한 줄만 남긴다.
   전체 이력은 Stream 탭(서버 증분)과 transcript가 원본이다. */
const TERM_MAX_LINES = 1500;
function termTrim(T, out, nearBottom){
  const lines = out.querySelectorAll(":scope > .ln:not(.cctrim)");
  if (lines.length <= TERM_MAX_LINES) return;
  const drop = lines.length - TERM_MAX_LINES;
  // 위로 스크롤해 읽는 중(append 직전 기준)이면 이번 틱은 건너뛴다 —
  // 읽던 줄이 사라지면 안 됨. follow 중일 때만 정리.
  if (!nearBottom) return;
  for (let i = 0; i < drop; i++) lines[i].remove();
  T.trimmed = (T.trimmed || 0) + drop;
  let n = out.querySelector(":scope > .cctrim");
  if (!n){
    n = document.createElement("div");
    n.className = "ln ccdim cctrim";
    out.prepend(n);
  }
  // 스트림을 끈 계정에겐 Stream 탭이 없다 (REQ-20260827-042) — 없는 자리로
  // 안내하면 생략된 줄을 찾아 헤매게 된다. 그때는 되찾을 곳을 말하지 않는다.
  n.innerHTML = `<span class="g" style="color:var(--cc-faint)">·</span>` +
    `<span class="b" style="color:var(--cc-faint)">이전 ${T.trimmed}줄 생략 — ` +
    `${streamOn() ? "전체 이력은 Stream 탭, 화면 정리는" : "화면 정리는"} Ctrl+L</span>`;
}
function termMeta(T){
  const m = $("#cc-meta");
  if (m) m.textContent =
    `${T.conn === "retry" ? "sse 재접속" : T.conn === "down" ? "수신 불통"
      : T.es ? "sse" : T.poll ? "poll 2.5s" : "…"} · ↓ ${T.evCount} events`;
}

/* ---- 수신 연결 상태 (REQ-20260825-032): 서버 재기동 등으로 수신 스트림이
   끊겨도 화면 무표시라 무응답으로 오인, 같은 질문을 재전송하던 실사고 방지 —
   단절/폴백/재접속을 상태줄에 가시화하고 복구되면 지운다. ---- */
const TERM_CONN = {
  retry: ["✗ 수신 끊김 — 재접속 중…", "ccwarn",
    "수신 스트림(SSE)이 끊겨 자동 재접속 중입니다 — 새 출력이 잠시 늦게 보일 수 있습니다"],
  down: ["✗ 서버 응답 없음 — 수신 중단", "ccwarn",
    "폴백 수신까지 실패했습니다(서버 재기동 가능성) — 자동 재시도 중이며 복구되면 이 표시가 사라집니다. 이미 보낸 메시지는 다시 보내지 않아도 됩니다"],
  poll: ["폴백 수신 (~2.5s 지연)", "ccdim",
    "SSE 대신 주기 폴링으로 수신 중 — 새 출력 표시가 조금 늦을 수 있습니다"],
};
// ?conn=retry|down|poll: 진단·헤드리스 캡처용 상태 고정 — 실단절은 실시간
// 재현이라 virtual-time 캡처(s9 shot)로 못 찍는다 (?nosse·?mpanel 선례)
const TERM_CONN_FORCE =
  (location.search.match(/[?&]conn=(retry|down|poll)/) || [])[1] || null;
function termConnSet(T, state){
  if (TERM_CONN_FORCE) state = TERM_CONN_FORCE;
  if (T.conn === state) return;
  T.conn = state;
  const el = $("#cc-conn"), m = TERM_CONN[state];
  if (el){
    el.hidden = !m;   // 정상(sse)·미지정 상태는 표시 없음 = 복구 시 소거
    if (m){
      el.textContent = m[0];
      el.className = "ccconn " + m[1];
      el.title = m[2];
    }
  }
  termMeta(T);
}

/* ---- 웨이팅 상태줄 (L6): 마지막 이벤트가 user/tool_use이고 후속이 없으면
   점멸 글리프(CSS 애니메이션, reduced-motion 존중) + 동사 + 경과초. ---- */
// CC식 웨이팅 동사 풀 (REQ-20260825-019): 대기 시작 시 무작위 선택, 9s마다 교체.
// 글리프는 REQ-017/018의 "피고 지는 별" 통일 유지 — CC의 다양성은 동사 쪽이다.
const CC_VERBS = ["Thinking","Pondering","Musing","Brewing","Percolating",
  "Simmering","Marinating","Cogitating","Ruminating","Noodling","Scheming",
  "Conjuring","Distilling","Weaving","Forging","Crunching","Untangling",
  "Polishing","Sketching","Assembling","Calibrating","Tinkering","Incubating",
  "Contemplating","Mulling","Hatching","Wrangling","Sifting","Stewing",
  "Churning","Divining","Reckoning","Whirring","Computing","Synthesizing",
  "Deciphering","Composing","Cooking","Baking","Levitating","Meandering",
  "Puzzling","Spelunking","Burrowing","Sprouting","Blooming","Orbiting",
  "Daydreaming"];
function termVerbRotate(T){
  T.verbAt = Date.now();
  T.verbIdx = ((T.verbIdx ?? -1) + 1
    + Math.floor(Math.random() * (CC_VERBS.length - 1))) % CC_VERBS.length;
  return CC_VERBS[T.verbIdx] + "…";
}
function termSpinnerEval(T){
  const w = $("#cc-wait");
  if (!w) return;
  const on = !!T.sid && (T.lastRole === "user" || T.lastRole === "tool");
  if (!on){
    T.waitOn = false; w.hidden = true;
    return;
  }
  if (!T.waitOn){
    T.waitOn = true; w.hidden = false;
    w.innerHTML = `<span class="ccspin"></span><span class="ccwv"> ${termVerbRotate(T)} </span><span class="ccwe"></span>`;
    if (!T.waitT){
      T.waitT = setInterval(() => {
        if (TERM !== T || !T.waitOn || w.hidden) return;
        const el = w.querySelector(".ccwe");
        if (el)
          el.textContent = `(${fmtElapsed(new Date(T.waitBase).toISOString())})`;
        if (Date.now() - (T.verbAt || 0) > 9000){
          const wv = w.querySelector(".ccwv");
          if (wv) wv.textContent = ` ${termVerbRotate(T)} `;
        }
      }, 1000);
      T.timers.push(T.waitT);
    }
  }
  const el = w.querySelector(".ccwe");
  if (el) el.textContent = `(${fmtElapsed(new Date(T.waitBase).toISOString())})`;
}
function termSpinnerFinalize(T, base){
  const w = $("#cc-wait");
  const since = new Date(base != null ? base : T.waitBase).toISOString();
  const secs = fmtElapsed(since);
  if (w && T.waitOn)
    w.insertAdjacentHTML("beforebegin",
      `<div class="ln ccdim"><span class="g" style="color:var(--cc-dim)">✻</span><span class="b" style="color:var(--cc-faint)">응답까지 ${secs}</span></div>`);
  T.waitOn = false;
  if (w) w.hidden = true;
}

/* ---- 활성 에이전트 스트립 (L8): Agent 스폰 = 추가, task-notification = 종결.
   상태 스트립의 작은 컨테이너만 재렌더 — 입력줄과 무관. ---- */
function termAgentSpawn(T, type, desc){
  T.agents.push({type, desc});
  if (T.agents.length > 5) T.agents.shift();
}
function termAgentDone(T){
  T.agents.shift();   // 통지엔 타입 정보가 없다 — 가장 오래된 활성분 종결로 근사
}
const fmtDur = s => s >= 3600 ? `${s/3600|0}h ${(s%3600/60)|0}m`
  : s >= 60 ? `${(s/60)|0}m ${s%60|0}s` : `${s|0}s`;
const fmtTok = n => n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n | 0);

function termAgentsRender(T){
  const box = $("#cc-agents");
  if (!box) return;
  // 서버 파싱(/api/agents — 실시간 라벨·토큰)이 있으면 그것을, 없으면
  // transcript 근사(T.agents)를 그린다 (REQ-20260824-044)
  const srv = (T.srvAgents || []).filter(a => a.active).slice(-5);
  // 지목한 대상이 목록에서 사라졌으면(종료·정지) 칩을 자동 해제한다 —
  // 죽은 에이전트를 대상으로 남겨두면 다음 전송이 통째로 반려된다
  if (T.srvAgentsOk && T.target
      && !(T.srvAgents || []).some(a => a.active && a.id === T.target.id))
    termTargetClear(T, "대상이 종료돼 지목을 해제했다");
  if (srv.length){
    const selId = T.agv ? T.agv.id : null;   // 열람 중 에이전트 = 활성 표시 (REQ-057)
    box.innerHTML = srv.map(a => {
      const sel = a.id === selId;
      const tgt = T.target && T.target.id === a.id;
      return `<div class="ag sub ccagrow${sel ? " sel" : ""}" data-agent="${esc(a.id)}" title="클릭 또는 ← 키로 이 에이전트의 작업 내용을 터미널에서 본다">` +
        `<span class="g"${sel ? ' style="color:var(--cc-green)"' : ""}>${sel ? "●" : "○"}</span> <b>${esc(a.type)}</b> ` +
        `<span style="color:var(--cc-faint)">${esc(a.label || a.desc)}</span>` +
        `<button class="agtgt${tgt ? " on" : ""}" data-target="${esc(a.id)}" title="이 에이전트를 전송 대상으로 지목 — 다음 메시지를 리드가 중계한다">→</button>` +
        `<span class="r">${sel ? "viewing · " : ""}${fmtDur(a.elapsed)} · ↓ ${fmtTok(a.tokens)} tokens</span></div>`;
    }).join("");
    termMainRow(T);
    return;
  }
  termMainRow(T);
  // 정상 경로(서버 목록)를 한 번이라도 받았으면 활성 0건 = 빈 스트립이 정답.
  if (T.srvAgentsOk){ box.innerHTML = ""; return; }
  // 구버전 serve 폴백: transcript로 추정한 목록이라 열람 대상이 아니다. 정확한
  // 상태도 알 수 없으므로 "running"이라 단언하지 않고, 열 수 없음을 행에 쓴다.
  box.innerHTML = T.agents.map(a =>
    `<div class="ag sub agapx" title="이 서버에는 에이전트 목록 기능이 없어 화면 기록으로 추정한 행입니다. 작업 내용은 열어볼 수 없습니다.">` +
    `<span class="g">○</span> ${esc(a.type)} <span style="color:var(--cc-faint)">${esc(a.desc)}</span>` +
    `<span class="r">추정 · 열람 불가</span></div>`).join("");
}

/* ---- 에이전트 뷰어 (REQ-044): 스트립 행 클릭/← 키 → 해당 에이전트 transcript
   를 타임라인 자리에서 열람. 세션 스트림 기계와 완전 분리(ccout 숨김 토글만) —
   입력줄 불변(L0). esc/←/main 클릭으로 복귀. ---- */
function termStripBind(T){
  const st = document.querySelector("#cc-root .ccstatus");
  if (st) st.addEventListener("click", ev => {
    if (TERM !== T) return;
    const tb = ev.target.closest("[data-target]");
    if (tb){ ev.stopPropagation(); termTargetSet(T, tb.dataset.target); return; }
    const row = ev.target.closest(".ccagrow");
    if (row){ termAgentOpen(T, row.dataset.agent); return; }
    if (ev.target.closest(".ccmain")) termAgentClose(T);
  });
  const tgt = $("#cc-target");
  if (tgt) tgt.addEventListener("click", ev => {
    if (TERM !== T || !ev.target.closest("#termTargetClear")) return;
    // 푸는 것은 한 동작이다 — 지금 서 있는 것이 무엇이든 이 버튼 하나가 푼다
    if (T.target) termTargetClear(T);
    else if (docTarget) docClear();
    else artToggle(false);
    const ta = $("#chat-in");
    if (ta) ta.focus();
  });
  const inp = $("#chat-in");
  if (inp) inp.addEventListener("keydown", ev => {
    if (TERM !== T || inp.value) return;
    if (ev.key === "ArrowLeft" && !T.agv && (T.srvAgents || []).some(a => a.active)){
      ev.preventDefault();
      const act = T.srvAgents.filter(a => a.active);
      termAgentOpen(T, act[act.length - 1].id);
    } else if ((ev.key === "ArrowLeft" || ev.key === "Escape") && T.agv){
      ev.preventDefault();
      termAgentClose(T);
    }
  });
}

function termAgvLine(e){
  const t = e.text || "";
  if (e.role === "thinking")
    return ccLine("✻", "var(--cc-dim)", ccFold(
      `<span style="color:var(--cc-faint)">${esc(t.slice(0, 90))}…</span>`,
      ccText(t)), "ccdim");
  if (e.role === "tool")
    return ccLine("●", "var(--cc-faint)",
      `<b>${esc(e.name || "")}</b>(` + (t.length > 110
        ? ccFold(esc(t.slice(0, 100)) + "…", ccText(t)) : esc(t)) + ")");
  if (e.role === "result")
    return ccLine("⎿", "var(--cc-faint)", t.length > 180
      ? ccFold(esc(t.slice(0, 140)) + "…", ccText(t)) : ccText(t),
      e.error ? "" : "ccdim");
  if (e.role === "user")
    return ccLine("❯", "var(--cc-dim)", ccText(t.slice(0, 3000)));
  return ccLine("●", "", ccText(t.slice(0, 6000)));
}

function termMainRow(T){
  // main 행 활성 표시: 에이전트 뷰 열람 중이면 ○/dim, 아니면 ● (REQ-057)
  const m = document.querySelector("#cc-root .ccmain");
  if (!m) return;
  const g = m.querySelector(".g");
  if (T.agv){
    m.classList.add("dim");
    if (g) g.textContent = "○";
  } else {
    m.classList.remove("dim");
    if (g) g.textContent = "●";
  }
}

/* ---- 지목 전송 (REQ-20260825-095): 스트립의 → 로 에이전트를 대상으로 걸면
   다음 메시지가 그 에이전트에게 간다(리드가 SendMessage로 중계). 열람(agv)과는
   독립 — 보면서 다른 에이전트에게 보낼 수 있다. 대상이 죽으면 자동 해제. ---- */
/* 문서 지목 (REQ-20260827-064) — 카드를 눌러 "이 문서에 이어 말한다"를 집어 둔다.
   서버는 `/api/chat` 의 `doc` 를 받으면 새 요청을 만들지 않고 그 문서 노트로
   넣는다. 화면이 집어 준 것이 본문 앞머리 표기(`>064 …`)보다 **우선**이다 —
   눌러 고른 것이 타이핑보다 확실하다.

   에이전트 지목과 **같은 자리, 같은 어휘**를 쓴다. 둘은 양립하지 않으므로
   (메시지는 에이전트에게 가거나 문서 노트로 들어간다) 하나를 집으면 다른 쪽은
   풀린다. 대상이 없을 때의 화면은 지금과 완전히 같다 — 줄 자체가 없다. */
let docTarget = null;   // {id, title, status}
/* 새 아티클로 쓰기 (REQ-20260827-073). 서버는 `/api/chat` 의 `as_type:"article"`
   을 받으면 요청이 아니라 글 한 편(ART-)으로 남긴다.

   **문서 집기와 양립하지 않는다** — 있는 문서에 이어 붙이는 것과 새 글을
   시작하는 것은 같은 메시지로 둘 다일 수 없다. 하나를 켜면 다른 쪽이 꺼진다. */
let asArticle = false;
function artToggle(on){
  asArticle = on === undefined ? !asArticle : !!on;
  if (asArticle){ docTarget = null; markPicked(); if (TERM) TERM.target = null; }
  const b = $("#cc-art");
  if (b) b.setAttribute("aria-pressed", asArticle ? "true" : "false");
  if (TERM) termTargetRender(TERM);
  const ta = $("#chat-in");
  if (ta) ta.focus();
}
function docPick(id, jump){
  const r = catFind(id);
  if (!r) return;
  const T = TERM;
  docTarget = (docTarget && docTarget.id === r.id)
    ? null : {id: r.id, title: r.title || "", status: r.status || ""};
  if (docTarget){
    if (T) T.target = null;              // 세 갈래는 서로 양립하지 않는다
    if (asArticle) artToggle(false);     // 있는 문서에 붙이기 ≠ 새 글 시작
  }
  if (T) termTargetRender(T);
  markPicked();
  // 집으면 말하러 간다 — 집어 두고 아무 데도 안 가면 어디에 쓰는지 알 수 없다.
  // (진단 캡처는 화면을 옮기지 않는다: 집힌 카드 표시를 그 자리에서 봐야 한다)
  if (docTarget && jump !== false){
    if (tab !== "terminal"){ tab = "terminal"; pushRoute(); render(); }
    const ta = $("#chat-in");
    if (ta) ta.focus();
  }
}
// 목록에서 집힌 카드를 표시한다 — 어디를 집었는지 잃지 않게
function markPicked(){
  document.querySelectorAll(".card[data-doc]").forEach(c =>
    c.classList.toggle("picked", !!docTarget && c.dataset.doc === docTarget.id));
}
function termTargetRender(T){
  const box = $("#cc-target");
  if (!box) return;
  const t = T.target;
  box.classList.toggle("doc", !!docTarget && !t);
  box.classList.toggle("art", asArticle && !t && !docTarget);
  box.hidden = !t && !docTarget && !asArticle;
  if (t){
    box.innerHTML = `<span class="arw">→</span> <b>${esc(t.type || "agent")}</b> ` +
      `<span class="aid">${esc(t.id)}</span> 에게 전송` +
      `<button id="termTargetClear" title="지목 해제 — 리드에게 보낸다">× 해제</button>`;
    return;
  }
  if (!docTarget){
    box.innerHTML = asArticle
      ? `<span class="arw">✎</span> <b>새 아티클</b>로 씁니다`
        + `<button id="termTargetClear" title="아티클 쓰기 끄기 — 다시 요청으로 남는다">× 해제</button>`
      : "";
    return;
  }
  const end = docTarget.status === "done" || docTarget.status === "cancelled";
  /* 제목을 낫표로 감싼다 — 제목 자체가 동사로 끝나면("…이어 말하기") 뒤에
     붙는 조사와 엉켜 한 문장으로 읽힌다. 따옴표 한 겹이 "이건 이름이다"를 말한다. */
  box.innerHTML = `<span class="arw">→</span> <b>${esc(shortId(docTarget.id))}</b> `
    + `<span class="dtl">「${esc(docTarget.title)}」</span> 에 남깁니다`
    // 이미 끝난 요청이면 미리 말한다 — 보내고 나서 알려 주면 되돌릴 수 없다
    + (end ? `<span class="dend">· 이미 ${esc(docTarget.status)} — 다시 열리지는 않는다</span>` : "")
    + `<button id="termTargetClear" title="집기 해제 — 새 요청으로 남는다">× 해제</button>`;
}
/* ?pick=<문서id> — 진단·헤드리스 캡처용 (?dlg·?ccjump 와 동형). 집힌 상태는
   카드를 눌러야 만들어지는데 헤드리스에는 손이 없다. */
function docPickDiag(){
  const m = /[?&]pick=([A-Za-z0-9-]+)/.exec(location.search);
  if (m) docPick(m[1], false);
  // ?art — 새 아티클로 쓰기를 켠 화면 (REQ-20260827-073 진단)
  if (/[?&]art\b/.test(location.search)) artToggle(true);
}
function docClear(){
  docTarget = null;
  markPicked();
  if (TERM) termTargetRender(TERM);
}
function termTargetSet(T, id){
  const meta = (T.srvAgents || []).find(a => a.id === id && a.active);
  if (!meta){ termErr("✗ 그 에이전트는 이미 활성 목록에 없다 — 리드에게 보내라"); return; }
  T.target = (T.target && T.target.id === id) ? null : {id, type: meta.type || ""};
  if (T.target && docTarget){ docTarget = null; markPicked(); }   // 둘은 양립하지 않는다
  termTargetRender(T);
  termAgentsRender(T);
  const ta = $("#chat-in");
  if (ta) ta.focus();
}
function termTargetClear(T, why){
  if (!T.target) return;
  T.target = null;
  termTargetRender(T);
  termAgentsRender(T);
  if (why) termErr("· " + why);
}

function termAgentOpen(T, id){
  termAgentClose(T);
  const out = $("#ccout"), av = $("#cc-agview");
  if (!out || !av || !T.sid) return;
  const meta = (T.srvAgents || []).find(a => a.id === id) || {};
  T.agv = {id, off: 0, timer: null};
  out.hidden = true;
  av.hidden = false;
  T.unread = 0; termJumpSync(T);   // 판이 바뀌면 셈도 그 판의 것으로 (REQ-061)
  av.innerHTML = ccLine("⚙", "var(--cc-green)",
    `<b>${esc(meta.type || "agent")}</b> <span style="color:var(--cc-faint)">${esc(meta.desc || "")}` +
    ` — ← 또는 esc 로 main 복귀</span>`);
  const load = async () => {
    if (TERM !== T || !T.agv || T.agv.id !== id) return;
    const d = await ccFetch(
      `/api/agentstream?session=${encodeURIComponent(T.sid)}` +
      `&agent=${encodeURIComponent(id)}&after=${T.agv.off}`, 6000);
    if (TERM !== T || !T.agv || T.agv.id !== id || !d) return;
    T.agv.off = d.offset || T.agv.off;
    if ((d.events || []).length){
      const nearBottom = termAtBottom(av);
      const h = d.events.map(termAgvLine).filter(Boolean).join("");
      av.insertAdjacentHTML("beforeend", h);
      if (nearBottom) av.scrollTop = av.scrollHeight;
      else T.unread += termCountLines(h);
      termJumpSync(T);
    }
  };
  load();
  T.agv.timer = setInterval(() => { if (!document.hidden) load(); }, 2000);
  T.timers.push(T.agv.timer);
  termAgentsRender(T);   // 스트립 활성 표시 즉시 반영 (REQ-057)
}

function termAgentClose(T){
  if (T.agv){ clearInterval(T.agv.timer); T.agv = null; }
  const out = $("#ccout"), av = $("#cc-agview");
  if (av) av.hidden = true;
  if (out) out.hidden = false;
  T.unread = 0; termJumpSync(T);
  termAgentsRender(T);   // 선택 해제 → main 활성 복귀 (REQ-057)
}

async function refreshTermChat(T){
  const d = await ccFetch("/api/chat/log?sid=" + encodeURIComponent(T.sid), 6000);
  if (TERM !== T || !d || !T.sid) return;
  const lines = d.lines || [];
  if (lines.length <= T.chatCount){ T.chatCount = lines.length; return; }
  const add = lines.slice(T.chatCount);
  T.chatCount = lines.length;
  const out = $("#ccout"), w = $("#cc-wait");
  if (!out || !w) return;
  out.querySelectorAll(".ln.pending").forEach(n => n.remove());  // 낙관 줄 → echo 대체
  const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 140;
  w.insertAdjacentHTML("beforebegin", add.map(ccChatLine).join(""));
  if (add.some(l => l.kind === "chat")){ T.lastRole = "user"; T.waitBase = Date.now(); }
  termSpinnerEval(T);
  if (nearBottom) out.scrollTop = out.scrollHeight;
}

/* ---- 긴 붙여넣기 접기 (REQ-20260827-040) — 로컬 터미널의 Claude Code 와 같이
   대량 텍스트는 `[Pasted text #N +M lines]` 한 줄로 접고, 같은 것을 한 번 더
   붙이면 그 자리를 펼친다.

   **접히는 것은 화면뿐이다. 서버로 가는 텍스트에는 늘 원문이 들어간다** —
   접힌 자리만 남고 내용이 사라지는 것이 이 기능의 최악의 실패다. 그래서
   ① 원문 보관(termPastes)은 셸 DOM 보다 오래 살고(탭 이탈·재진입에도 유지),
   ② 어떤 경로에서도 보관을 지우지 않으며,
   ③ 칩 글자가 한 글자라도 손으로 고쳐지면 매핑은 조용히 끊긴다(정확 일치
      치환) — 고쳐진 글자는 글자 그대로 나가고 원문은 새어나가지 않는다.

   접는 기준 (원본의 정확한 값은 알 수 없다 — 아래는 이 입력줄에서 정한 값):
   6줄 이상 **또는** 800자 이상. 입력줄 최대 높이는 120px, 한 줄은 12.5px×1.7
   ≈ 21px 이라 6줄째부터는 화면 밖으로 나가 보이지 않는다(overflow:hidden).
   줄 수만으로 세면 줄바꿈 없는 긴 한 줄(URL·base64·로그 한 줄)을 놓치므로
   글자 수도 함께 본다 — 1024px 창에서 약 800자가 6줄이 되는 지점이다.

   번호 #N 은 **이 탭에서 몇 번째 붙여넣기인가**이다. 전송해도 초기화하지
   않는다 — ↑ 히스토리로 옛 메시지의 칩이 되돌아오는데, 번호를 재사용하면
   그 칩이 엉뚱한 원문으로 펼쳐진다. ---- */
/* ==== paste-fold core (pure) — tests/test_paste_fold.py 가 이 블록을 그대로
   떼어 node 로 실행한다. DOM·전역 상태를 참조하지 말 것. ==== */
const PASTE_FOLD_LINES = 6;    // 입력줄 120px ÷ (12.5px×1.7) ≈ 5.6줄 → 6줄부터 잘린다
const PASTE_FOLD_CHARS = 800;  // 좁은 창(1024px)에서 6줄이 되는 대략치
function pasteFoldNeeded(s){
  if (!s) return false;
  return s.split("\n").length >= PASTE_FOLD_LINES || s.length >= PASTE_FOLD_CHARS;
}
function pasteFoldLabel(n, s){
  const ln = s.split("\n").length;
  return ln > 1 ? `[Pasted text #${n} +${ln} lines]`
                : `[Pasted text #${n} +${s.length} chars]`;
}
/* 접힌 표시 → 원문. 왼→오 **1패스**로만 치환한다: 치환해 넣은 원문을 다시
   훑으면, 원문 안에 우연히(혹은 일부러) 들어 있는 다른 칩 문자열이 펼쳐져
   사용자가 붙이지 않은 내용이 전송된다. */
function pasteFoldExpand(disp, entries){
  if (!disp || !entries || !entries.length) return disp || "";
  let out = "", cut = 0, i = 0;
  while (i < disp.length){
    i = disp.indexOf("[", i);
    if (i < 0) break;
    let hit = null;
    for (const e of entries){ if (e && e.label && disp.startsWith(e.label, i)){ hit = e; break; } }
    if (hit){ out += disp.slice(cut, i) + hit.text; i += hit.label.length; cut = i; }
    else i++;
  }
  return out + disp.slice(cut);
}
/* ==== /paste-fold core ==== */

// 원문 보관 — 셸(DOM)보다 오래 산다. 비우지 않는다(위 ②).
let termPastes = {seq: 0, list: []};
const termPasteExpandAll = disp => pasteFoldExpand(disp, termPastes.list);

function termInsertAtCursor(ta, s){
  const i = ta.selectionStart, j = ta.selectionEnd;
  ta.value = ta.value.slice(0, i) + s + ta.value.slice(j);
  ta.selectionStart = ta.selectionEnd = i + s.length;
}
function termPasteFold(ta, text){        // 선택 영역이 있으면 덮어쓰며 들어간다
  const n = ++termPastes.seq;
  const e = {n, label: pasteFoldLabel(n, text), text};
  termPastes.list.push(e);
  termInsertAtCursor(ta, e.label);
  return e;
}
function termPasteFindChip(ta, text){    // 같은 내용의 칩이 지금 입력줄에 있나
  for (let i = termPastes.list.length - 1; i >= 0; i--){
    const e = termPastes.list[i];
    if (e.text === text && ta.value.indexOf(e.label) >= 0) return e;
  }
  return null;
}
function termPasteHint(){                // 접힌 칩이 있는 동안만 안내 한 줄
  const el = $("#cc-paste"), ta = $("#chat-in");
  if (!el) return;
  const v = ta ? ta.value : "";
  // 빠른 탈출 — 이건 매 타건마다 돈다. 접두사가 아예 없으면 목록을 훑지 않는다
  // (칩을 펼쳐 놓은 긴 원문 위에서 타이핑할 때 전체 스캔 × 보관 개수가 된다).
  el.hidden = !(v.indexOf("[Pasted text #") >= 0
                && termPastes.list.some(e => v.indexOf(e.label) >= 0));
}
/* 값을 코드로 바꾼 뒤의 뒷정리 — 프로그램이 넣은 값에는 input 이벤트가 오지
   않는다. 높이·히스토리 탐색 종료·팔레트·안내줄을 한자리에서 맞춘다. */
function termInputSync(T){
  const ta = $("#chat-in");
  if (!ta) return;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  T.histIdx = null;
  termPalUpdate(T);
  termPasteHint();
}

/* ---- 입력줄 (L0/L4/L5/L7): 리스너는 셸 생성 시 1회 바인딩.
   키 처리·팔레트 필터·로컬 에코는 전부 로컬 — 네트워크와 결합 금지(L1). ---- */
function termBindInput(T){
  const ta = $("#chat-in"), root = $("#cc-root"),
        pal = $("#cc-pal"), att = $("#cc-att");
  ta.addEventListener("keydown", e => termKeydown(T, e));
  ta.addEventListener("input", () => {
    // 손으로 친 편집도 여기로 온다 — 칩 글자를 지우면 안내줄이 함께 사라진다
    termInputSync(T);          // 편집 시작 = 히스토리 탐색 종료
  });
  ta.addEventListener("paste", e => {            // L5 — 클립보드 이미지 · 긴 텍스트 접기
    const cd = e.clipboardData || {};
    const items = [...((cd.items) || [])]
      .filter(i => i.kind === "file" && /^image\//.test(i.type));
    if (items.length){                           // 이미지가 있으면 첨부가 우선
      e.preventDefault();
      items.forEach(i => { const f = i.getAsFile(); if (f) termUpload(T, f); });
      return;
    }
    let txt = "";
    try{ txt = cd.getData ? cd.getData("text/plain") : ""; }catch(_){ txt = ""; }
    if (!txt) return;                            // 읽을 텍스트가 없으면 기본 동작
    // 같은 내용을 한 번 더 붙이면 그 칩 자리가 원문으로 펼쳐진다(원본 동작).
    // 선택 영역이 잡혀 있으면 "덮어쓰기 붙여넣기"로 읽는다 — 펼치기가 아니다.
    const same = ta.selectionStart === ta.selectionEnd
      ? termPasteFindChip(ta, txt) : null;
    if (same){
      e.preventDefault();
      const at = ta.value.indexOf(same.label);
      ta.value = ta.value.slice(0, at) + same.text
               + ta.value.slice(at + same.label.length);
      ta.selectionStart = ta.selectionEnd = at + same.text.length;
      termInputSync(T);
      return;
    }
    if (!pasteFoldNeeded(txt)) return;            // 짧은 붙여넣기는 접지 않는다
    e.preventDefault();
    termPasteFold(ta, txt);
    termInputSync(T);
  });
  $("#cc-clip").addEventListener("click", () => $("#cc-file").click());
  $("#cc-file").addEventListener("change", e => {
    [...e.target.files].forEach(f => termUpload(T, f));
    e.target.value = "";
  });
  root.addEventListener("dragover", e => {       // L5 — 드래그&드롭
    const ty = e.dataTransfer ? [...e.dataTransfer.types] : [];
    if (!ty.includes("Files")) return;
    e.preventDefault(); e.stopPropagation();
    root.classList.add("dragover");
  });
  root.addEventListener("dragleave", () => root.classList.remove("dragover"));
  root.addEventListener("drop", e => {
    root.classList.remove("dragover");
    const fs = e.dataTransfer ? [...e.dataTransfer.files] : [];
    if (!fs.length) return;
    e.preventDefault(); e.stopPropagation();
    fs.forEach(f => termUpload(T, f));
  });
  root.addEventListener("click", e => {          // 모델 라벨 클릭 → 변경 플로우
    if (e.target.closest(".ccmodelbtn")) termModelChange(T);
  });
  pal.addEventListener("mousedown", e => {       // mousedown — blur 전에 선택
    const pi = e.target.closest("[data-pi]");
    if (!pi) return;
    e.preventDefault();
    T.pal.idx = +pi.dataset.pi;
    termPalPick(T);
  });
  att.addEventListener("click", e => {
    const rm = e.target.closest("[data-attrm]");
    if (!rm) return;
    T.atts.splice(+rm.dataset.attrm, 1);
    termAttRender(T);
  });
}

function termKeydown(T, e){
  const ta = e.target;
  if (T.pal.open){                               // L4 — 팔레트 내비게이션
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const n = T.pal.items.length;
      if (n) T.pal.idx = (T.pal.idx + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      termPalRender(T);
      return;
    }
    if (e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); termPalPick(T); return; }
    if (e.key === "Escape"){ e.preventDefault(); termPalClose(T); return; }
  }
  // 줄바꿈은 두 키 다 받는다 (REQ-20260827-038): Shift+Enter 는 원래 되던 것이고,
  // Ctrl+Enter 는 Claude Code 터미널의 손버릇이다. **textarea 는 Shift+Enter 에는
  // 스스로 줄바꿈을 넣지만 Ctrl+Enter 에는 아무것도 넣지 않는다** — 전송만 막으면
  // "아무 일도 안 일어나는 키"가 되어 사용자 눈에는 여전히 안 되는 것이다.
  // 그래서 커서 자리에 손으로 넣고 높이도 다시 잡는다.
  if (e.key === "Enter" && e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey){
    e.preventDefault();
    const i = ta.selectionStart, j = ta.selectionEnd;
    ta.value = ta.value.slice(0, i) + "\n" + ta.value.slice(j);
    ta.selectionStart = ta.selectionEnd = i + 1;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    return;
  }
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey){ e.preventDefault(); sendChat(); return; }
  if (e.key === "Escape"){       // L7 — 첨부 → 입력 → (비었으면) 세션 중단 요청
    e.preventDefault();
    if (T.atts.length){ T.atts = []; termAttRender(T); }
    else if (ta.value){ ta.value = ""; ta.style.height = "auto"; T.histIdx = null;
                        termPasteHint(); }
    else if (T.waitOn) termInterrupt(T);
    return;
  }
  // L7 — ↑/↓ 히스토리: 입력이 비어있거나 탐색 중일 때만. 편집 중엔 커서 이동.
  if (e.key === "ArrowUp" && T.hist.length && (ta.value === "" || T.histIdx !== null)){
    e.preventDefault();
    T.histIdx = T.histIdx === null ? T.hist.length - 1 : Math.max(0, T.histIdx - 1);
    ta.value = T.hist[T.histIdx];
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    ta.setSelectionRange(ta.value.length, ta.value.length);
    termPasteHint();          // 불러온 메시지에 접힌 칩이 있을 수 있다
    termPalClose(T);
    return;
  }
  if (e.key === "ArrowDown" && T.histIdx !== null){
    e.preventDefault();
    T.histIdx++;
    if (T.histIdx >= T.hist.length){ T.histIdx = null; ta.value = ""; }
    else ta.value = T.hist[T.histIdx];
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    termPasteHint();
    return;
  }
}

function termClearLocal(T){                      // L7 — Ctrl+L (로컬 클리어)
  termClearOut(T);
  T.lastRole = null;
  termSpinnerEval(T);
}

// 전역 단축키/포커스 리다이렉트 (L7) — 1회 등록, 터미널 탭에서만 동작
/* role="button" 로 만든 컨트롤(보드 카드)을 Enter/Space 로 누른다 (REQ-20260827-007).
   진짜 <button> 은 이걸 공짜로 준다 — 흉내 낸 자리에는 손으로 달아 줘야 한다.
   닿기만 하고 눌리지 않는 컨트롤은 포커스만 삼키므로 아예 못 닿는 것보다 나쁘다.
   결과는 클릭과 같은 한 경로(위임 핸들러)로 흘려보낸다 — 두 갈래로 갈라 두면
   한쪽만 고쳐지는 날이 온다. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (!t || !t.closest) return;
  if (t.closest("input,textarea,select,[contenteditable]")) return;
  const b = t.closest('[role="button"]');
  if (!b || b.tabIndex < 0) return;
  e.preventDefault();     // Space 가 페이지를 같이 스크롤하지 않도록
  b.click();
});
/* 목록 하나 = Tab 한 번 (REQ-20260827-013).
   행마다 Tab 을 세우면 300건짜리 문서 목록은 "닿는다"가 아니라 "빠져나올 수
   없다"가 된다 — 뷰어로 가려면 Tab 을 300번 눌러야 하는 목록은 뚫린 길이 아니라
   새 함정이다. 그래서 목록에는 Tab 으로 한 번 들어가고(입구는 열려 있는 행,
   없으면 첫 행) 안에서는 방향키로 옮긴다(roving tabindex).
   방향키는 **옮기기만 한다**: 여는 것은 Enter/Space 뿐이다 — 옮길 때마다 열면
   목록을 훑는 동안 문서를 300장 부른다. 여는 경로는 바로 위 REQ-007 의 그
   핸들러 하나로 흐른다(role="button" → .click()).
   끝에서 감싸지 않는 것도 값이다: 목록의 처음과 끝이 어디인지 손끝으로 알아야
   한다. 표시는 기존 어휘 그대로 — 실선 잉크 링 = 지금 여기. */
const ROVE_ITEM = "[data-rove-item]";
function roveSync(){
  document.querySelectorAll("[data-rove]").forEach(c => {
    const rows = [...c.querySelectorAll(ROVE_ITEM)];
    if (!rows.length) return;
    // 이미 짚어 둔 자리가 있으면 그 자리를 지킨다 — 폴링이 입구를 되돌리지 않게
    const act = rows.find(r => r.tabIndex === 0)
             || rows.find(r => r.classList.contains("sel")) || rows[0];
    rows.forEach(r => { r.tabIndex = r === act ? 0 : -1; });
  });
}
function roveMove(cur, dir){
  const c = cur.closest("[data-rove]");
  if (!c) return;
  const rows = [...c.querySelectorAll(ROVE_ITEM)];
  const i = rows.indexOf(cur);
  if (i < 0) return;
  const j = dir === "home" ? 0 : dir === "end" ? rows.length - 1
          : Math.min(rows.length - 1, Math.max(0, i + dir));
  const t = rows[j];
  if (!t || t === cur) return;
  rows.forEach(r => { r.tabIndex = r === t ? 0 : -1; });
  t.focus();
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const cur = e.target && e.target.closest && e.target.closest(ROVE_ITEM);
  if (!cur) return;
  const dir = {ArrowDown: 1, ArrowUp: -1, Home: "home", End: "end"}[e.key];
  if (dir === undefined) return;
  e.preventDefault();   // 목록과 페이지가 같이 스크롤되지 않게
  roveMove(cur, dir);
});
// 포커스가 옮겨 가면 Tab 의 입구도 따라간다 — 목록을 떠났다 돌아오면 마지막 자리
document.addEventListener("focusin", e => {
  const it = e.target && e.target.closest && e.target.closest(ROVE_ITEM);
  if (!it) return;
  const c = it.closest("[data-rove]");
  if (c) c.querySelectorAll(ROVE_ITEM).forEach(r => { r.tabIndex = r === it ? 0 : -1; });
});
document.addEventListener("keydown", e => {
  if (tab !== "terminal" || !TERM) return;
  const ta = $("#chat-in");
  if (!ta) return;
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === "l" || e.key === "L")){
    e.preventDefault(); termClearLocal(TERM); return;
  }
  /* Ctrl+End — 손잡이와 같은 일을 하는 키 (REQ-20260827-061). 로컬 Claude Code
     터미널이 쓰는 그 키다. 손잡이 라벨에 이 키를 적어 두었으니 실제로 들어야
     한다 — 적어만 두고 안 먹는 키는 없느니만 못하다. 입력줄 안에서도 받는다:
     textarea 에서 Ctrl+End 는 커서를 글 끝으로 보내는데, 한 줄짜리 입력줄에서
     그건 아무 일도 아니고 사람이 원한 것은 화면을 내리는 쪽이다. */
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === "End"){
    e.preventDefault(); termJumpGo(T); return;
  }
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (e.key === "o" || e.key === "O")){
    e.preventDefault();
    const ds = document.querySelectorAll("#ccout details");
    if (ds.length){ const d = ds[ds.length - 1]; d.open = !d.open; }
    return;
  }
  if (e.target === ta) return;
  if (e.target.closest && e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length !== 1) return;
  if (window.getSelection && String(getSelection())) return;  // 선택/복사 중 방해 금지
  ta.focus();   // preventDefault 없음 — 문자는 그대로 입력줄에 꽂힌다
});
// 백그라운드 탭은 SSE 연결 반납, 복귀 시 마지막 offset으로 재접속 (live follow 규약)
document.addEventListener("visibilitychange", () => {
  const T = TERM;
  if (!T || tab !== "terminal" || !T.sid) return;
  if (document.hidden) termCloseSSE(T);
  else {
    if (!T.es && !T.poll){ T.esFails = 0; termConnectSSE(T); }
    // 에이전트 스트립은 터미널 탭이 보일 때만 폴링한다 — 떠나 있는 동안
    // 목록이 마지막 상태로 얼어붙어, 보드는 "진행 중 없음"인데 스트립에는
    // 끝난 에이전트가 남아 있는 어긋남이 생겼다 (REQ-20260826-016).
    // 돌아온 즉시 한 번 맞춘다. 10초를 기다리게 두면 그 사이 화면이 거짓말을 한다.
    if (T.agTick) T.agTick();
  }
});

/* ---- / 팔레트 (L4): /api/chat/commands(스킬·커맨드) + CC 빌트인(CLI 전용 dim).
   스킬/커맨드 선택 = "/이름 " 완성 — 전송하면 세션이 스킬로 처리한다. ---- */
function termPalLoad(){
  if (termCmdCache) return Promise.resolve(termCmdCache);
  return ccFetch("/api/chat/commands", 5000).then(d => {
    const got = d && d.commands;
    const list = [...(got || []), ...CC_BUILTINS];
    if (got) termCmdCache = list;   // 실패는 캐시하지 않는다 — 다음 열림에 재시도
    return list;
  });
}
function termPalUpdate(T){
  const ta = $("#chat-in");
  const v = ta.value;
  if (!/^\/[A-Za-z0-9_:-]*$/.test(v)){ termPalClose(T); return; }
  termPalLoad().then(items => {
    if (TERM !== T) return;
    if ($("#chat-in").value !== v) return;       // 그 사이 입력이 변함
    const q = v.slice(1).toLowerCase();
    const list = items
      .filter(c => c.name.toLowerCase().includes(q))
      .sort((a, b) =>
        (b.name.toLowerCase().startsWith(q) ? 1 : 0) -
        (a.name.toLowerCase().startsWith(q) ? 1 : 0) ||
        a.name.localeCompare(b.name))
      .slice(0, 12);
    T.pal.items = list;
    T.pal.idx = Math.max(0, Math.min(T.pal.idx, list.length - 1));
    T.pal.open = list.length > 0;
    termPalRender(T);
  });
}
function termPalRender(T){
  const pal = $("#cc-pal");
  if (!pal) return;
  pal.hidden = !T.pal.open;
  if (!T.pal.open){ pal.innerHTML = ""; return; }
  pal.innerHTML = T.pal.items.map((c, i) =>
    `<div class="pi${i === T.pal.idx ? " sel" : ""}${c.source === "cli" ? " cli" : ""}" data-pi="${i}"><span class="pn">/${esc(c.name)}</span><span class="pd">${esc(c.desc || "")}${c.source === "cli" ? ' <span class="pcli">(CLI 전용)</span>' : ""}</span></div>`).join("");
  const sel = pal.querySelector(".pi.sel");
  if (sel) sel.scrollIntoView({block: "nearest"});
}
function termPalPick(T){
  const c = T.pal.items[T.pal.idx];
  if (!c) return;
  const ta = $("#chat-in");
  ta.value = "/" + c.name + " ";
  termPalClose(T);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
function termPalClose(T){
  T.pal.open = false; T.pal.items = []; T.pal.idx = 0;
  const pal = $("#cc-pal");
  if (pal){ pal.hidden = true; pal.innerHTML = ""; }
}

/* ---- 이미지 첨부 (L5): 붙여넣기/드래그/📎 → /api/chat/upload(base64) →
   칩 표시 → 전송 시 "[Image: <절대경로>]" 줄 추가 (CC 관례 — 세션이 Read). ---- */
function termAttRender(T){
  const box = $("#cc-att");
  if (!box) return;
  box.hidden = !T.atts.length;
  box.innerHTML = T.atts.map((a, i) =>
    `<span class="chip">[Image #${i + 1}] ${esc(a.name)}${a.up ? ' <span class="up">uploading…</span>' : ""}<button data-attrm="${i}" title="제거">×</button></span>`).join("");
}
async function termUpload(T, file){
  if (file.size > 30 * 1024 * 1024){ termErr("✗ 첨부가 너무 크다 (30MB 한도)"); return; }
  const a = {name: file.name || "pasted.png", up: true, path: null};
  T.atts.push(a);
  termAttRender(T);
  try{
    const data = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("파일 읽기 실패"));
      fr.readAsDataURL(file);
    });
    const r = await fetch("/api/chat/upload", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: a.name, data})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "업로드 실패");
    a.path = d.path; a.up = false;
    if (TERM === T){ termErrClear(); termAttRender(T); }
  }catch(ex){
    if (TERM === T){
      T.atts = T.atts.filter(x => x !== a);
      termAttRender(T);
      termErr("✗ 첨부 실패: " + (ex && ex.message ? ex.message : ex));
    }
  }
}
function termErr(msg){
  const err = $("#chat-err");
  if (err){ err.textContent = msg; err.hidden = false; }
}
function termErrClear(){
  const err = $("#chat-err");
  if (err) err.hidden = true;
}

/* 세션 깨우기 (REQ-20260825-067): 세션이 없으면 대시보드만으로는 되살릴 수
   없었다 — 서버가 새 터미널 창을 열어 s9 code를 실행한다. 창을 열 수 없는
   환경이면 실행 명령을 안내한다. */
async function termWake(T){
  const btn = $("#cc-wake");
  if (btn){ btn.disabled = true; btn.textContent = "세션 시작 중…"; }
  let d = null;
  try{
    const r = await fetch("/api/session/wake", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: "{}"});
    d = await r.json();
  }catch(ex){ d = {ok: false, reason: "서버 연결 실패"}; }
  const out = $("#ccout"), w = $("#cc-wait");
  if (out && w){
    const body = !d.ok
      ? `<span style="color:var(--cc-red)">✗ ${esc(d.reason || "실패")}</span>`
      : d.mode === "spawned"
      ? `<span style="color:var(--cc-green)">▶ 새 터미널 창에서 세션 시작 — 몇 초 뒤 자동으로 연결됩니다</span>`
      : `<span style="color:var(--cc-dim)">${esc(d.reason || "")} — 실행:</span> <span class="cccode">${esc(d.cmd || "")}</span>`;
    w.insertAdjacentHTML("beforebegin", ccLine("▶", "var(--cc-dim)", body));
    out.scrollTop = out.scrollHeight;
  }
  if (btn){ btn.disabled = false; btn.textContent = "▶ 여기서 세션 깨우기"; }
}

/* 모델/effort 변경 (REQ-20260825-037): CC는 실행 중 변경을 안 열어주므로
   같은 대화를 --resume --model --effort 로 재개 재기동한다. s9 code 신버전
   래퍼 세션이면 자동, 아니면 실행할 명령을 안내한다. */
/* ultracode 는 모델도 깊이도 아니다 — 그 메시지 하나를 여러 에이전트로 병렬
   처리하는 별개 기능이라 재시작이 필요 없다. 숨은 기능이 되지 않게
   (REQ-20260825-045) 모델 창에 두되, 목록 줄로 두면 "고르는 것"으로 읽히므로
   목록 밖에 딸린 행동으로 세운다. 진단 창도 같은 것을 써야 그림이 실제와 같다. */
const MODEL_FOOT = `<div class="dlgsub">그 밖에</div>`
  + `<button type="button" class="dlgact mpuc" data-act="ultracode">`
  + `＋ 메시지에 ultracode 넣기</button>`
  + `<p class="dlgs" style="margin-top:6px">모델·깊이와는 다른 기능입니다 —`
  + ` 그 요청 하나만 다중 에이전트로 병렬 처리합니다. 재시작하지 않습니다.</p>`;
async function termModelChange(T){      // 상태줄 모델 라벨 클릭 → 고르는 창
  if (!T.sid) return;
  /* 계정 항목은 여기서 뺐다 (REQ-20260827-079). 모델은 "무엇으로 생각할까"고
     계정은 "누구로 로그인할까"다 — 서로 다른 두 결정을 한 자리에 얹어 두었던
     것이고, 계정은 상단의 계정 칩(그 계정이 보이는 자리)으로 옮겼다.

     줄이 곧 버튼이다: 모델 줄을 누르면 그 모델로 바로 다시 시작한다. 깊이는
     같은 결정의 곁가지라 위쪽 칩으로 두고, 고른 값이 그 다음 누름에 실려 간다
     — 그래야 둘을 함께 바꿔도 재시작은 한 번이다. 지금 쓰는 모델 줄을 누르면
     "모델은 그대로, 깊이만" 이 된다. */
  const cur = (T.model || "").replace(/^claude-/, "").replace(/\[.*$/, "");
  const MODELS = [
    ["opus", "가장 깊게 생각한다 — 어려운 일에"],
    ["sonnet", "빠르고 균형 잡혔다 — 대부분의 일에"],
    ["haiku", "가장 빠르다 — 가볍고 반복되는 일에"],
    ["fable", "실험용"],
  ];
  const picked = await s9dlg({kind: "choose", cap: "모델",
    title: "이 세션이 무엇으로 생각할지 고릅니다",
    desc: "고른 순간 같은 대화가 새 설정으로 다시 시작됩니다. 유휴 상태에서만 됩니다.",
    chips: {label: "생각의 깊이", cur: "",
      opts: [["", "유지"], ["low", "낮게"], ["medium", "보통"], ["high", "높게"],
             ["xhigh", "아주 높게"], ["max", "최대"]]},
    sub: "모델",
    items: MODELS.map(([k, note]) => ({key: k, label: k,
      note: k === cur ? "지금 이것" : note, cur: k === cur})),
    /* ultracode 는 모델도 깊이도 아니다 — 그 메시지 하나를 여러 에이전트로
       병렬 처리하는 별개 기능이라 재시작이 필요 없다. 숨은 기능이 되지 않게
       (REQ-20260825-045) 이 창에 두되, 목록 줄로 두면 "고르는 것"으로 읽히므로
       목록 밖에 딸린 행동으로 세운다. */
    foot: MODEL_FOOT,
    cancel: "그만두기"});
  if (!picked) return;
  if (picked.act === "ultracode"){        // 키워드만 입력줄에 넣는다 — 재시작 없음
    const ta = $("#chat-in");
    if (ta && !/\bultracode\b/.test(ta.value)){
      ta.value = (ta.value ? ta.value.replace(/\s*$/, " ") : "") + "ultracode ";
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    }
    if (ta) ta.focus();
    return;
  }
  // 지금 것과 같은 모델을 골랐고 깊이도 안 바꿨으면 재시작할 이유가 없다 —
  // 아무것도 안 바뀌는데 대화를 끊는 것은 손해만 남는다.
  const model = picked.key === cur ? "" : picked.key;
  if (!model && !picked.chip) return;
  termModelApply(T, model, picked.chip, "");
}

/* 클로드 계정 바꾸기 (REQ-20260827-079) — 상단의 **계정이 보이는 그 자리**에서.
   사용자: "계정 변경은 모델 변경하는 곳에서 제공하지 말고, 대시보드 상단에 있는
   클로드 계정을 사용하는게 훨씬 직관적이지 않나?" 맞는 말이다: 계정에 관한 일은
   계정이 적혀 있는 곳에서 되는 것이 맞고, 모델 자리에 얹혀 있으면 찾을 수 없다.

   프로필 목록과 지금 계정은 `/api/chat/target` 이 준다(모델 창이 쓰던 그 값).
   여기서는 그때그때 받는다 — 칩은 60초마다 다시 그려지고, 계정은 그 사이에도
   바뀔 수 있다. */
async function claudeAccountSwitch(){
  const nt = await ccFetch("/api/chat/target", 5000);
  const profs = (nt && nt.profiles) || [];
  const live = !!(nt && nt.sid);
  /* 어느 프로필로 로그인해 있는지는 서버가 알려 주지 않는다(프로필 목록만 준다).
     그래서 목록에 "지금 이것"을 찍지 않는다 — 모르는 것을 아는 척 찍으면 엉뚱한
     줄을 짚는다. 대신 **지금 로그인한 메일**을 창머리에 적는다. 그 값은 상단
     칩이 이미 보여 주는 그것이고, 사람이 "내가 누구로 붙어 있나"에 답하는 값이다. */
  const nowMail = (usageLast && usageLast.email) || "";
  const picked = await s9dlg({kind: "choose", cap: "계정",
    title: "클로드 로그인 계정을 바꿉니다",
    desc: (nowMail ? `지금 로그인: ${nowMail}. ` : "")
      + (live
        ? "고른 순간 같은 대화가 그 계정으로 다시 시작됩니다. 유휴 상태에서만 됩니다."
        : "지금은 붙어 있는 세션이 없습니다 — 세션을 깨운 뒤 다시 시도해 주세요."),
    sub: "계정 프로필",
    items: live ? profs.map(name => ({key: name, label: name})) : [],
    // 빈 것은 고장이 아니다 — 프로필을 아직 만들지 않았을 뿐이라, 만드는 법을 말한다.
    empty: profs.length
      ? "세션이 없어 지금은 바꿀 수 없습니다."
      : "전환할 계정 프로필이 없습니다. 터미널에서 CLAUDE_CONFIG_DIR=~/.claude-profiles/<이름> claude 로 한 번 로그인하면 여기에 나옵니다.",
    cancel: "닫기"});
  if (picked && TERM) termModelApply(TERM, "", "", picked.key);
}

async function termModelApply(T, model, effort, account){
  const out = $("#ccout"), w = $("#cc-wait");
  let d = null;
  try{
    const r = await fetch("/api/session/restart", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({sid: T.sid, model, effort, account: account || ""})});
    // 404 = serve가 이 API 이전 버전 — bin/s9 갱신 후 serve 프로세스가 남아
    // 구 핸들러를 서빙하는 상태 (반려 재작업: "서버 연결 실패" 오진 방지)
    d = r.status === 404
      ? {ok: false, reason: "대시보드 서버가 구버전(재시작 API 없음) — 세션 터미널에서 serve 재시작 후 재시도"}
      : await r.json();
  }catch(ex){ d = {ok: false, reason: "서버 연결 실패"}; }
  if (TERM !== T || !out || !w) return;
  const body = !d.ok
    ? `<span style="color:var(--cc-red)">✗ 재시작 거부 — ${esc(d.reason || "")}</span>`
    : d.mode === "wrapper"
    ? `<span class="ccspin"></span><span style="color:var(--cc-yellow)"> 세션 재시작 중 — 같은 대화가 새 설정으로 재개된다<span class="ccrse"></span></span>`
    : `<span style="color:var(--cc-dim)">이 세션은 1회 수동 재시작 필요 — 세션 터미널에서 종료(Ctrl+C 2회) 후 실행하면 이후부터는 대시보드에서 자동 재시작된다:</span> <span class="cccode">${esc(d.cmd || "")}</span>`;
  w.insertAdjacentHTML("beforebegin", ccLine("↻", "var(--cc-dim)", body));
  const ln = w.previousElementSibling;
  if (d.ok && d.mode === "wrapper" && ln){
    // 진행 감시 (REQ-20260825-047): 경과초를 돌려 "멈춘 듯" 보이지 않게 하고,
    // 새 설정으로 복귀(모델 변경 또는 재수신 대기)하면 완료 줄로 교체한다.
    ln.id = "cc-restart";
    T.restart = {t0: Date.now(), from: T.model || "", want: model || "",
                 el: ln, timer: setInterval(() => {
      if (TERM !== T || !ln.isConnected){ termRestartDone(T); return; }
      const el = ln.querySelector(".ccrse");
      const secs = Math.round((Date.now() - T.restart.t0) / 1000);
      if (el) el.textContent = ` (${secs}s)`;
      if (secs > 90) termRestartDone(T, "timeout");
    }, 1000)};
    T.timers.push(T.restart.timer);
  }
  out.scrollTop = out.scrollHeight;
}

/* 재시작 완료·실패 마감 (REQ-20260825-047) — 진행 줄을 결과로 교체 */
function termRestartDone(T, kind, model){
  const r = T && T.restart;
  if (!r) return;
  clearInterval(r.timer);
  T.restart = null;
  const secs = fmtElapsed(new Date(r.t0).toISOString());
  if (r.el && r.el.isConnected){
    const b = r.el.querySelector(".b");
    if (b) b.innerHTML = kind === "timeout"
      ? `<span style="color:var(--cc-red)">✗ 재시작 확인 실패 (${secs}) — 세션 터미널 상태를 확인하라</span>`
      : `<span style="color:var(--cc-green)">✓ 재시작 완료 (${secs}) — ${esc((model || "").replace(/^claude-/, "") || "새 설정")}으로 재개됨</span>`;
    const g = r.el.querySelector(".g");
    if (g) g.textContent = kind === "timeout" ? "✗" : "✓";
  }
}

/* Esc 중단 (REQ-20260825-001): 대시보드는 CC 프로세스에 키를 보낼 수 없다 —
   수신함에 kind=interrupt 줄을 남기면 세션이 다음 도구 경계에서 읽고 멈춘다.
   즉시 강제 중단은 세션이 떠 있는 터미널에서만 가능하다. */
async function termInterrupt(T){
  if (!T.sid || T.intBusy) return;
  T.intBusy = true;
  const out = $("#ccout"), w = $("#cc-wait");
  try{
    const r = await fetch("/api/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({kind: "interrupt", sid: T.sid})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "중단 요청 실패");
    if (TERM === T && out && w){
      // signal=sent → SIGINT 즉시 중단 (REQ-20260825-008), skipped → 협조적 폴백
      const body = d.signal === "sent"
        ? `<span style="color:var(--cc-yellow)">⚡ 인터럽트 — 진행 중 턴을 즉시 중단</span>`
        : `<span style="color:var(--cc-dim)">중단 요청 큐잉${d.reason ? ` · ${esc(d.reason)}` : ""} — 세션은 다음 도구 경계에서 멈춘다</span>`;
      w.insertAdjacentHTML("beforebegin", ccLine("⨯", "var(--cc-dim)", body));
      out.scrollTop = out.scrollHeight;
    }
  }catch(ex){
    if (TERM === T) termErr("✗ " + ((ex && ex.message) || "중단 요청 실패"));
  }finally{
    T.intBusy = false;
  }
}

async function sendChat(){
  const T = TERM, ta = $("#chat-in");
  if (!T || !T.sid || !ta || ta.disabled) return;
  // disp = 화면에 보이는 것(접힌 칩 포함) · raw = 실제로 보내는 것(원문).
  // 둘을 섞지 마라 — 칩을 그대로 보내면 사용자가 붙인 내용이 조용히 사라진다.
  const disp = ta.value.trim();
  const raw = termPasteExpandAll(disp);
  if (T.atts.some(a => a.up)){ termErr("✗ 첨부 업로드 중 — 잠시 후 전송"); return; }
  const atts = T.atts.filter(a => a.path);
  if (!raw && !atts.length) return;
  let text = raw;
  // 이미지는 [Image:], 그 외 일반 파일은 [File:] — 문서 뷰 렌더가 갈린다
  atts.forEach(a => {
    const img = /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(a.name || a.path || "");
    text += `\n[${img ? "Image" : "File"}: ${a.path}]`;
  });
  // 로컬 에코 + 입력 클리어는 즉시(동기) — 네트워크 왕복과 결합하지 않는다 (L1).
  // 성공 시 수신함 echo 도착이 .pending을 제거·대체한다. 전송 중 입력 비활성화 금지.
  const out = $("#ccout"), w = $("#cc-wait");
  let pend = null;
  const tgt = T.target;
  const dt = tgt ? null : docTarget;   // 둘은 양립하지 않는다 — 에이전트가 이긴다
  if (out && w){
    const clip = atts.length
      ? ` <span style="color:var(--cc-dim)">📎${atts.length}</span>` : "";
    const to = tgt
      ? ` <span style="color:var(--cc-green)">→ ${esc(tgt.type || tgt.id)}</span>`
      : dt ? ` <span style="color:var(--cc-cyan)">→ ${esc(shortId(dt.id))}</span>` : "";
    w.insertAdjacentHTML("beforebegin",
      `<div class="ln pending"><span class="g" style="color:var(--cc-dim)">❯</span><span class="b">${ccText(disp || "(첨부)")}${clip}${to}</span></div>`);
    pend = w.previousElementSibling;
    out.scrollTop = out.scrollHeight;
  }
  if (disp && T.hist[T.hist.length - 1] !== disp) T.hist.push(disp);
  T.histIdx = null;
  ta.value = ""; ta.style.height = "auto";
  termPasteHint();          // 입력줄이 비었으니 안내줄도 내린다
  T.atts = []; termAttRender(T);
  termPalClose(T);
  T.lastRole = "user"; T.waitBase = Date.now();
  termSpinnerEval(T);
  try{
    const r = await fetch("/api/chat", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, sid: T.sid,
                            ...(tgt ? {agent: tgt.id} : {}),
                            ...(dt ? {doc: dt.id} : {}),
                            ...(!tgt && !dt && asArticle ? {as_type: "article"} : {})})});
    const d = await r.json();
    if (TERM !== T) return;
    if (!d.ok){
      // 대상 부재(409)는 지목만 풀고 문구를 그대로 보여준다 — 사용자가
      // 같은 입력을 리드에게 바로 다시 보낼 수 있다 (아래 복원 경로)
      if (d.error === "agent-unavailable") termTargetClear(T);
      throw new Error(d.reason || d.error || "전송 실패");
    }
    termErrClear();
    // 전달 확인: 어느 에이전트에게 갔는지 즉시 한 줄로 확증 (REQ-095)
    if (d.agent && out && w){
      w.insertAdjacentHTML("beforebegin",
        ccLine("→", "var(--cc-green)",
          `<span style="color:var(--cc-dim)">${esc(d.agent_type || d.agent)} 에게 전달 — 리드가 중계한다</span>`, "sub"));
      out.scrollTop = out.scrollHeight;
    }
    // 서버측 audit가 REQ를 만들었으면 표시 — 세션 유휴여도 기록은 남았다는 확증.
    // 문서를 집어 보낸 경우엔 "만들어졌다"가 아니라 "그 문서에 붙었다"이다 —
    // 같은 줄로 뭉뚱그리면 새 요청이 하나 더 생긴 줄 안다 (REQ-20260827-064).
    if (d.req && out && w){
      const toDoc = dt && d.req === dt.id;
      const end = toDoc && (dt.status === "done" || dt.status === "cancelled");
      w.insertAdjacentHTML("beforebegin",
        ccLine("⎿", null, `<span style="color:var(--cc-dim)">${esc(d.req)} `
          + (toDoc ? "에 노트로 남았다" : "로 기록됨")
          // 끝난 요청은 노트만 남고 다시 열리지 않는다 — 한 줄로 말한다
          + (end ? ` — 이미 ${esc(dt.status)} 라 다시 열리지는 않는다`
                 + `<span style="color:var(--cc-faint)"> (열려면 상태를 옮겨라)</span>` : "")
          + `</span>`, "sub"));
      out.scrollTop = out.scrollHeight;
    }
    refreshTermChat(T);
  }catch(ex){
    if (TERM !== T) return;
    if (pend && pend.isConnected) pend.remove();
    termErr("✗ " + (ex && ex.message ? ex.message
      : "서버에 연결할 수 없습니다 — 잠시 후 다시 시도"));
    // 실패 시 입력 복원 — 접힌 표시 그대로 되돌린다(원문으로 펼쳐 놓으면
    // 사용자가 접어 둔 화면이 제멋대로 터진다). 매핑은 그대로 살아 있다.
    if (!ta.value){ ta.value = disp; termPasteHint(); }
    T.lastRole = null;
    termSpinnerEval(T);
  }
  ta.focus();
}
