<!doctype html>
<html lang="ko" data-theme="system" data-skin="ledger" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section9</title>
<!-- 이 파일은 껍데기다 (REQ-20260829-027). 규칙은 web/css/, 로직은 web/app/ 에 있다.
     14,792 줄 한 장이었을 때 하루에 네 팀이 붙어 서로를 덮었다 — 한 기능을 고치려고
     남의 자리를 열어야 했기 때문이다. 이제 고칠 것이 있으면 **그 조각 하나만** 연다.

     순서가 곧 계약이다. 아래 두 목록은 위에서 아래로 그대로 실행·적용된다:
       · css — 뒤에 오는 것이 앞을 덮는다. overlay 가 skins 뒤인 것은 실수가 아니다.
       · app — const → … → events(boot 호출) → diag. 새 조각은 **의미로** 자리를
         고르되, 부르는 쪽보다 먼저 놓아라 (읽는 시점에 이미 있어야 한다).
     새 규칙·새 로직을 여기 인라인으로 끼워 넣지 마라 — tests/test_web_split.py 가 막는다. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/docs.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/graph.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/density.css">
<link rel="stylesheet" href="css/calm.css">
<link rel="stylesheet" href="css/overlay.css">
</head>
<body>
<header>
  <div class="hrow1">
    <div class="brand"><span class="dot"></span>section9</div>
    <div class="tabs">
      <button data-tab="board" class="active">Board</button>
      <button data-tab="docs">Docs</button>
      <button data-tab="graph">Graph</button>
      <button data-tab="audit">Audit</button>
      <button data-tab="stream">Stream</button>
      <button data-tab="terminal">Terminal</button>
      <button data-tab="settings">Settings<span id="settings-badge" class="pbadge" hidden>⚠</span></button>
    </div>
    <!-- 서버 상태 칩 — 사람의 손을 요구하지 않는(또는 접어 둔) 서버 사실의 자리
         (REQ-20260827-017-62x6). 전용 행을 주면 아무 할 일 없는 사실 때문에 헤더가
         상시 한 줄 눌린다.
         자리는 브랜드 행의 오른쪽 끝이다. 툴바 행에 두면 필터·신원 묶음과 폭을
         다투다 좁은 화면에서 그 행을 두 줄로 밀어 — 줄이려던 높이를 도로 쓴다.
         브랜드 행은 오른쪽이 늘 비어 있고, 탭 높이에 묻혀 한 픽셀도 더하지 않는다.
         사건이 없으면 비어 있고, :empty 로 자리까지 사라진다. -->
    <span id="sv-chip" class="svchip" role="status" aria-live="polite"></span>
  </div>
  <div class="hrow2">
    <div class="fgroup">
      <input id="q" type="text" placeholder="search…">
      <label class="chk" title="문서 본문(History 포함)까지 검색 — Docs 탭에서 매치 라인 표시">
        <input type="checkbox" id="q-body"> 본문</label>
      <select id="f-user"><option value="">user: all</option></select>
      <label class="chk" id="mine-wrap">
        <input type="checkbox" id="f-mine"> 내 것만</label>
      <select id="f-project"><option value="">project: all</option></select>
      <select id="f-tag"><option value="">tag: all</option></select>
      <select id="f-type"><option value="">type: all</option>
        <option>request</option><option>article</option><option>knowledge</option><option>question</option><option>session</option><option>project</option></select>
    </div>
    <div class="pgroup idcol">
      <!-- 설명은 네이티브 title 이 아니라 이 제품의 hovercard 가 맡는다
           (REQ-20260827-056). tabindex 는 마우스 없이도 그 카드에 닿기 위한 것 —
           손잡이가 곧 포커스 지점이다. 읽어 줄 이름은 usageTitle() 이 채운다. -->
      <span id="usage-chip" class="usagechip" tabindex="0" role="button"></span>
      <span id="whoami" class="who" title="서버가 파생한 신원 — 대시보드는 127.0.0.1 전용이라 브라우저 사용자 = 서버 기동 OS 계정. 다른 계정명으로 연결하려면 터미널에서 s9 user attach"></span>
    </div>
  </div>
  <!-- 서버 코드 낡음 알림 — 낡았을 때만 채워진다 (renderOldCode). 기본은 hidden. -->
  <div class="hrow3" id="oldcode" role="status" aria-live="polite" hidden></div>
  <!-- 서버 자동 복구 알림 — 사건이 있었을 때만 채워진다 (renderGuard). 기본은 hidden.
       코드 낡음 알림 아래에 둔다: 그쪽은 지금 이 순간 잘못 돌고 있다는 사실이라
       사람의 손을 먼저 요구하고, 이쪽은 이미 지나간 일(또는 다음에 벌어질 일)이다. -->
  <div class="hrow3" id="guard" role="status" aria-live="polite" hidden></div>
  <div class="gwlog" id="guard-log" hidden></div>
</header>
<main>
  <p class="count" id="count"></p>
  <div id="my-strip" class="mystrip" hidden></div>
  <div id="proj-info" class="proj-info" hidden></div>
  <div id="view"></div>
</main>

<script src="app/const.js"></script>
<script src="app/state.js"></script>
<script src="app/refs.js"></script>
<script src="app/format.js"></script>
<script src="app/notice.js"></script>
<script src="app/boot.js"></script>
<script src="app/app.js"></script>
<script src="app/card.js"></script>
<script src="app/docs.js"></script>
<script src="app/dialog.js"></script>
<script src="app/attach.js"></script>
<script src="app/anchor.js"></script>
<script src="app/audit.js"></script>
<script src="app/usage.js"></script>
<script src="app/ccrender.js"></script>
<script src="app/terminal.js"></script>
<script src="app/target.js"></script>
<script src="app/input.js"></script>
<script src="app/session.js"></script>
<script src="app/restart.js"></script>
<script src="app/graph.js"></script>
<script src="app/settings.js"></script>
<script src="app/timezone.js"></script>
<script src="app/userform.js"></script>
<script src="app/events.js"></script>
<script src="app/diag.js"></script>
<script>
/* 조각을 못 받았을 때 (REQ-20260829-027). 화면은 이제 css/·app/ 아래 조각을
   받아 서는데, 그것을 안 내주는 서버(옛 `bin/s9`)에 붙으면 **아무 말 없는
   흰 화면**이 남는다. 이 저장소는 그 종류의 침묵을 이미 한 번 값을 치르고
   고쳤다(낡은 코드 알림). 그러니 여기서도 침묵하지 않는다 — 무엇이 없고
   무엇을 하면 되는지 한 줄로 적는다. 조각이 다 오면 이 코드는 아무것도 안 한다. */
(function(){
  var css = getComputedStyle(document.documentElement)
              .getPropertyValue("--bg").trim();
  if (css && window.__S9_APP_READY) return;
  var lack = !css && !window.__S9_APP_READY ? "모양과 동작"
           : !css ? "모양" : "동작";
  document.body.innerHTML =
    '<div style="font:14px/1.7 system-ui;padding:32px;max-width:52em">'
    + '<p style="font-weight:600;margin:0 0 8px">화면 조각을 못 받았습니다 — '
    + lack + '을 담은 파일이 오지 않았습니다.</p>'
    + '<p style="margin:0 0 8px">돌고 있는 서버가 <code>web/css/</code>·'
    + '<code>web/app/</code> 를 내주지 못하는 옛 코드입니다. '
    + '<code>bin/s9 serve --restart</code> 로 다시 띄워 주세요.</p>'
    + '<p style="margin:0">다시 띄워도 이 글이 그대로면 <code>bin/s9</code> 가 '
    + '아직 그 두 자리를 내주지 못하는 판입니다.</p></div>';
})();
</script>
</body>
</html>
